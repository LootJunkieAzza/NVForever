[package]
name = "fnv-phys"
description = "Physics for Fallout: New Vegas worlds: rapier3d bodies from collision shapes and terrain, queries and a kinematic character controller"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fnv-collide = { path = "../fnv-collide" }
fnv-world = { path = "../fnv-world" }
rapier3d = { version = "0.36", features = ["enhanced-determinism"] }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = "1"
