[workspace]
resolver = "2"
members = [
    "crates/fnv-util",
    "crates/fnv-install",
    "crates/fnv-save",
    "crates/nvf-dlss-files",
    "crates/nvf-settings-layout",
    "crates/nvf-launcher",
]

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/MrWomp/NVMM"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[profile.release]
debug = 1

# Incremental release builds, in target/release-quick, so they do not touch target/release.
[profile.release-quick]
inherits = "release"
incremental = true
