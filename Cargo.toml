[workspace]
resolver = "2"
members = ["crates/fnv-util", "crates/fnv-install", "crates/fnv-save", "crates/fnv-inflate", "crates/fnv-bsa", "crates/fnv-esm", "crates/fnv-nif", "crates/fnv-dds", "crates/fnv-spt", "crates/fnv-font", "crates/fnv-vfs", "crates/fnv-world", "crates/fnv-sim", "crates/fnv-actor", "crates/fnv-combat", "crates/fnv-collide", "crates/fnv-phys", "crates/fnv-script", "crates/fnv-game", "crates/fnv-nav", "crates/fnv-ai", "crates/fnv-voice", "crates/fnv-ui", "crates/fnvtool"]
exclude = ["viewer"]

[workspace.package]
# The release's version, the same as engine/Cargo.toml's: saves are stamped with it and
# fnvtool reports it (crates/fnv-save has the test that holds the two together).
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/LootJunkieAzza/NVForever"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[profile.release]
debug = 1
