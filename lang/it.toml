"DLSS files missing: choose Download DLSS… in this list, or put them in the dlss folder beside nvforever.exe, then restart" = "File DLSS mancanti: scegliete Scarica DLSS… in questo elenco, oppure metteteli nella cartella dlss accanto a nvforever.exe, poi riavviate"
"The dlss folder holds NVIDIA's updater (nvngx_update.exe): remove it, then restart" = "La cartella dlss contiene l'aggiornatore di NVIDIA (nvngx_update.exe): toglietelo, poi riavviate"
"A file in the dlss folder is not from the tested NVIDIA release (Streamline 2.14.16)" = "Un file nella cartella dlss non proviene dalla versione NVIDIA testata (Streamline 2.14.16)"
"DLSS did not start (the log says why)" = "DLSS non si è avviato (il registro dice perché)"
"A graphics card the game may use cannot run DLSS" = "Una scheda grafica che il gioco può usare non può eseguire DLSS"
"Not on this GPU or driver (DLSS needs an NVIDIA RTX card)" = "Non su questa GPU o driver (DLSS richiede una scheda NVIDIA RTX)"
"DLSS stopped working this session; it is tried again at the next start" = "DLSS ha smesso di funzionare in questa sessione; viene riprovato al prossimo avvio"
"FSR 3.1 cannot run on this GPU" = "FSR 3.1 non può funzionare su questa GPU"
"Controls" = "Comandi"
