"Frames made between the real ones: smoother motion, input a little later. FSR 3.1 needs FSR upscaling; DLSS an RTX 40 or newer. Not in the original." = "Fotogrammi creati tra quelli reali: movimento più fluido, comandi un po' in ritardo. FSR 3.1 richiede l'upscaling FSR; DLSS una RTX 40 o successiva. Non presente nell'originale."
"How many frames DLSS frame generation makes per real frame: 2x one, 3x two, 4x three (3x and 4x on RTX 50 series). Not in the original." = "Quanti fotogrammi crea la generazione di fotogrammi DLSS per ogni reale: 2x uno, 3x due, 4x tre (3x e 4x con la serie RTX 50). Non presente nell'originale."
