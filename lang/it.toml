# NVForever's own words in Italiano (#1948). Written for NVForever, not copied from the
# game (LEGAL.md). Choice names (Off, Auto, Last enemy, Amber …) are
# translated, and the notes name them as they are shown. How to add or fix a line:
# README.md beside this file.

name = "Italiano"

[words]
# [design, #2200; engine/nvf-play/src/pause.rs] NVForever's device selection.
"Automatic Input Switching" = "Cambio automatico del dispositivo"
"On: a controller button or a stick or trigger past its dead zone selects Controller; a key or mouse click selects Keyboard and Mouse. First release the current device's buttons and centre its sticks/triggers, then press again to switch on a later frame. Only the switching press is ignored; later holds/repeats and all releases work. Mouse motion does not switch. Off: choose Input Device manually. Saved in [Controls] of NVForever.ini." = "Attivo: un pulsante del controller, una levetta o un grilletto oltre la zona morta seleziona Controller; un tasto o un clic seleziona Tastiera e mouse. Prima rilascia i pulsanti del dispositivo attuale e riporta levette/grilletti a riposo, poi premi di nuovo in un fotogramma successivo per cambiare. Viene ignorata solo la pressione del cambio; pressioni prolungate, ripetizioni e rilasci funzionano. Muovere il mouse non cambia dispositivo. Disattivo: scegli il dispositivo manualmente. Salvato in [Controls] di NVForever.ini."
"Dialogue voice" = "Voci nei dialoghi"
"On: lines are spoken. Off: they are silent from the next line on, and still last as long as their sound. (--no-voice)" = "Attivo: le battute vengono pronunciate. Disattivo: dalla battuta successiva sono mute, ma durano quanto il loro suono. (--no-voice)"
"Gameplay" = "Gioco"
"Turn to each other in dialogue" = "Voltarsi l'uno verso l'altro nel dialogo"
"On: at the start of a conversation the actor turns to the player and the view turns to the actor. (--no-dialogue-look)" = "Attivo: all'inizio di una conversazione il personaggio si volta verso il giocatore e la visuale verso il personaggio. (--no-dialogue-look)"
"Bring the view back when choices appear" = "Riportare la visuale quando compaiono le scelte"
"On: with \"Close in on the speaker in dialogue\" off, after you look away the view returns to the speaker when choices appear. Needs \"Turn to each other in dialogue\". (--dialogue-recentre)" = "Attivo: con «Avvicinarsi a chi parla nel dialogo» disattivo, dopo aver guardato altrove la visuale torna a chi parla quando compaiono le risposte. Richiede «Voltarsi l'uno verso l'altro nel dialogo». (--dialogue-recentre)"
"Close in on the speaker in dialogue" = "Avvicinarsi a chi parla nel dialogo"
"On: in a conversation the view narrows onto the speaker, with what is behind them out of focus; from third person the camera comes to the eyes. The view stays on the speaker and the mouse moves only the cursor. Off: no close-up; you can look around. (--no-dialogue-zoom)" = "Attivo: in conversazione la visuale si stringe su chi parla, con lo sfondo sfocato; in terza persona la telecamera passa all'altezza degli occhi. La visuale resta su chi parla e il mouse muove solo il cursore. Disattivo: nessun primo piano; puoi guardarti intorno. (--no-dialogue-zoom)"
"Goodbye hint" = "Suggerimento «Goodbye»"
"On: while a conversation offers a Goodbye choice, \"[Tab] Goodbye\" stands at the left of the dialogue box. Off: the words are hidden; Tab still says goodbye." = "Attivo: finché una conversazione offre una scelta Goodbye, «[Tab] Goodbye» compare a sinistra della finestra di dialogo. Disattivo: la scritta è nascosta; Tab saluta comunque."
"Aim assist" = "Assistenza alla mira"
"Controller only, never the mouse. On: the right stick turns slower while the crosshair is on a nearby hostile, and aiming down the sights turns the view onto one near the crosshair for a moment. Off: neither." = "Solo controller, mai il mouse. Attivo: la levetta destra ruota più lentamente mentre il mirino è su un nemico vicino, e mirare con il mirino porta per un attimo la visuale su un nemico vicino al mirino. Disattivo: nessuna delle due."
"Controller" = "Controller"
"Aim slowdown" = "Rallentamento della mira"
"How much slower the right stick turns while the crosshair is on a nearby hostile (0: not at all)." = "Quanto più lentamente ruota la levetta destra mentre il mirino è su un nemico vicino (0: per niente)."
"Aim lock-on" = "Aggancio della mira"
"How hard aiming down the sights turns the view onto a nearby hostile near the crosshair (0: not at all). Push the right stick away to break it." = "Con quanta forza mirare con il mirino porta la visuale su un nemico vicino al mirino (0: per niente). Spostate la levetta destra per liberarvi."
"Use Pip-Boy" = "Indossare il Pip-Boy"
"On: the Pip-Boy and its glove are worn and the menus come up on the arm. Off: both are taken off and the menus show full screen. Without a Pip-Boy worn the menus are always full screen." = "Attivo: il Pip-Boy e il suo guanto sono indossati e i menu compaiono sul braccio. Disattivo: entrambi tolti, i menu a schermo intero. Senza Pip-Boy indossato i menu sono sempre a schermo intero."
"Kill camera" = "Telecamera dell'uccisione"
"When a VATS shot kills its last mark, a cinematic camera can show the kill. Last enemy: only when no other enemy is still fighting you. Every kill: whoever is left. Off: never." = "Quando un colpo VATS uccide il suo ultimo bersaglio, una telecamera cinematografica può mostrare l'uccisione. Ultimo nemico: solo quando nessun altro nemico vi sta ancora combattendo. Ogni uccisione: a ogni uccisione. Disattivato: mai."
"V.A.T.S. style" = "Stile del V.A.T.S."
"What the V.A.T.S. key starts. Classic: the world stops, you pick a target and its body parts from their chances to hit, then the queued attacks play. Mark and Fire: time runs very slowly while you mark targets under the crosshair." = "Che cosa avvia il tasto V.A.T.S. Classico: il mondo si ferma, scegli un bersaglio e le parti del suo corpo in base alla probabilità di colpire, poi vengono eseguiti gli attacchi in coda. Segna e spara: il tempo scorre molto lentamente mentre segni i bersagli sotto il mirino."
"V.A.T.S. time slowdown" = "Rallentamento del tempo nel V.A.T.S."
"How far the world slows while you choose targets in the Classic style: 100% stops it, 50% runs it at half speed. Enemies keep attacking at anything less than a full stop." = "Quanto rallenta il mondo mentre scegli i bersagli nello stile Classico: 100% lo ferma, 50% lo fa andare a metà velocità. Con meno di un arresto completo i nemici continuano ad attaccare."
"Slower while reloading" = "Più lenti durante la ricarica"
"On: you and the NPCs move at 75% of your speed while a reload runs. Off: reloading does not slow anyone, as in the original." = "Attivo: voi e gli NPC vi muovete al 75% della vostra velocità mentre è in corso una ricarica. Disattivo: ricaricare non rallenta nessuno, come nell'originale."
"Difficulty" = "Difficoltà"
"How hard the fights are: from Very Easy (the player's hits do double damage and the player takes half) to Very Hard (half and double); Normal as they are. (console: SetGameDifficulty 0-4)" = "Quanto sono duri gli scontri: da Molto facile (i colpi del giocatore fanno danno doppio e lui ne subisce la metà) a Molto difficile (metà e doppio); Normale così come sono. (console: SetGameDifficulty 0-4)"
"Dynamic crosshair" = "Mirino dinamico"
"On: with a gun or thrown weapon drawn the crosshair opens to show how wide your shots spread now (wider running, after shots, with crippled arms; narrower aimed or crouched); Crosshair style below picks how it looks. Off: the arrows stay together whatever is drawn." = "Attivo: con un'arma da fuoco o da lancio in pugno il mirino si apre per mostrare quanto si disperdono ora i colpi (più largo correndo, dopo i colpi, con le braccia storpiate; più stretto mirando o accovacciati); «Stile del mirino» qui sotto ne sceglie l'aspetto. Disattivo: le frecce restano unite, qualunque cosa abbiate in pugno."
"Crosshair style" = "Stile del mirino"
"With Dynamic crosshair on and a gun or thrown weapon drawn. Cross: four bars that part with the spread. Arrows: the plain crosshair's two arrows part instead." = "Con il mirino dinamico attivo e un'arma da fuoco o da lancio in pugno. Croce: quattro trattini che si aprono con la dispersione. Frecce: si aprono invece le due frecce del mirino semplice."
"Detached third-person camera" = "Telecamera libera in terza persona"
"On: in third person with your weapon away the mouse turns the camera around you, not your character, and your character turns to run whichever way you push, as the camera sees it. Drawing your weapon turns you to where the camera looks. Off: the camera stays behind you, as in the original." = "Attivo: in terza persona con l'arma riposta il mouse ruota la telecamera intorno a voi, non il personaggio, e il personaggio corre nella direzione in cui spingete, come la vede la telecamera. Estrarre l'arma vi volta verso dove guarda la telecamera. Disattivo: la telecamera resta alle vostre spalle, come nell'originale."
"Language" = "Lingua"
"The language of NVForever's own words (menus, messages). The game's own text is the install's." = "La lingua dei testi propri di NVForever (menu, messaggi). Il testo del gioco stesso è quello dell'installazione."
"Interface" = "Interfaccia"
"Reverb" = "Riverbero"
"World sounds echo as the place you are in does (a cave, a hall, a small room). Off: --no-reverb." = "I suoni del mondo riecheggiano come il luogo in cui vi trovate (una grotta, un salone, una stanzetta). Disattivo: --no-reverb."
"Voice reverb" = "Riverbero delle voci"
"What people say around you echoes in the place you are in, up to the end of each line, as Reverb does for world sounds. Conversations stay dry." = "Ciò che dicono le persone intorno a voi riecheggia nel luogo in cui vi trovate, fino alla fine di ogni battuta, come fa il riverbero per i suoni del mondo. Le conversazioni restano asciutte."
"Sound" = "Audio"
"Master" = "Volume generale"
"How loud all sound is: each volume below is a part of this one." = "Quanto è forte tutto l'audio: ogni volume qui sotto ne è una parte."
"Music" = "Musica"
"The music of the place you are in and the main menu's theme." = "La musica del luogo in cui vi trovate e il tema del menu principale."
"Footstep" = "Passi"
"Footsteps, jumps and landings, yours and everyone's." = "Passi, salti e atterraggi, vostri e di tutti."
"Voice" = "Voci"
"Spoken lines: conversations and what people say around you." = "Le battute parlate: conversazioni e ciò che dicono le persone intorno a voi."
"Effects" = "Effetti"
"Every other sound: weapons, impacts, menus, doors and the sounds of places." = "Tutti gli altri suoni: armi, impatti, menu, porte e i suoni dei luoghi."
"Radio" = "Radio"
"Radio stations, from the Pip-Boy and from radios in the world." = "Le stazioni radio, dal Pip-Boy e dalle radio nel mondo."
"Freeze the picture in dialogue and menus" = "Fermare l'immagine in dialoghi e menu"
"On: while a conversation, the inventory, a container or a message box is open, animations, wind, water and sky stand still, as in the original. Off: only game logic waits and the world lives on. This menu always holds everything. (--menu-pause original|living)" = "Attivo: mentre è aperta una conversazione, l'inventario, un contenitore o un messaggio, animazioni, vento, acqua e cielo restano fermi, come nell'originale. Disattivo: attende solo la logica di gioco e il mondo continua a vivere. Questo menu ferma sempre tutto. (--menu-pause original|living)"
"Search" = "Cerca"
"Changed" = "Modificati"
"Audio" = "Audio"
"Tweaks" = "Ritocchi"
"Game" = "Generale"
"Dialogue" = "Dialogo"
"Camera" = "Telecamera"
"Screen" = "Risoluzione"
"Performance" = "Prestazioni"
"Picture" = "Immagine"
"Distance" = "Distanza"
"Quality" = "Qualità"
"Previous heading" = "Sezione precedente"
"Next heading" = "Sezione successiva"
"Keyboard search" = "Ricerca da tastiera"
"No settings here." = "Nessuna impostazione qui."
"No results." = "Nessun risultato."
"No changed settings." = "Nessuna impostazione modificata."
"Stands for: {rows}." = "Sta per: {rows}."
"Button style" = "Stile dei pulsanti"
"Which names and pictures the controller's buttons go by in prompts, menu hints and the Controls tab. Auto: a PlayStation controller's (Cross, Circle, Square, Triangle, L1, R2, Select…) when the controller in use says it is one, else an Xbox controller's. Xbox or PlayStation: always those. The INI keeps the Xbox names either way." = "Con quali nomi e immagini sono indicati i pulsanti del controller nei suggerimenti, nei menu e nella scheda Comandi. Auto: quelli di un controller PlayStation (Cross, Circle, Square, Triangle, L1, R2, Select…) quando il controller in uso dichiara di esserlo, altrimenti quelli di un controller Xbox. Xbox o PlayStation: sempre quelli. Il file INI conserva comunque i nomi Xbox."
"Light and noise gauges while sneaking" = "Indicatori di luce e rumore in furtività"
"On: two bars under the sneak word show how lit you are and how much noise you make, as detection counts them. Not in the original." = "Attivo: due barre sotto la scritta della furtività mostrano quanto siete illuminati e quanto rumore fate, come li conta il rilevamento. Non presente nell'originale."
"Saving" = "Salvataggio"
"Autosave after travel" = "Salvataggio automatico dopo uno spostamento"
"On: the game saves to the autosave slot after each loading screen (doors, coc, a script moving the player); fast travel has its own switch." = "Attivo: il gioco salva nello slot automatico dopo ogni schermata di caricamento (porte, coc, uno script che sposta il giocatore); il viaggio rapido ha la sua opzione."
"Save on fast travel" = "Salvare al viaggio rapido"
"On: the game saves to the autosave slot when a fast travel arrives." = "Attivo: il gioco salva nello slot automatico all'arrivo di un viaggio rapido."
"Save on wait" = "Salvare dopo l'attesa"
"On: the game saves to the autosave slot when a wait ends with at least one hour passed." = "Attivo: il gioco salva nello slot automatico quando un'attesa di almeno un'ora finisce."
"Save on sleep" = "Salvare dopo il sonno"
"On: the game saves to the autosave slot when the player wakes from a sleep of at least one hour." = "Attivo: il gioco salva nello slot automatico quando il giocatore si sveglia da un sonno di almeno un'ora."
"Save when a script asks" = "Salvare quando uno script lo chiede"
"On: a script's Autosave saves to the autosave slot, as quests do at their milestones; SystemSave to the system slot; ForceSave as a new save." = "Attivo: Autosave in uno script salva nello slot automatico, come fanno le missioni nei momenti chiave; SystemSave nello slot di sistema; ForceSave come nuovo salvataggio."
"Hardcore mode" = "Modalità hardcore"
"On: you need water, food and sleep, stimpaks heal over time, ammunition has weight and crippled limbs heal only with a doctor's bag or a doctor. Off: none of that; turning it off clears your thirst, hunger and tiredness and their effects. (console: SetHardcore 1/0)" = "Attivo: servono acqua, cibo e sonno, gli stimpak curano nel tempo, le munizioni hanno un peso e gli arti storpiati guariscono solo con una borsa del medico o da un medico. Disattivo: niente di tutto ciò; disattivarla toglie sete, fame e stanchezza e i loro effetti. (console: SetHardcore 1/0)"
"HUD red" = "HUD rosso"
"HUD green" = "HUD verde"
"HUD blue" = "HUD blu"
"Pip-Boy red" = "Pip-Boy rosso"
"Pip-Boy green" = "Pip-Boy verde"
"Pip-Boy blue" = "Pip-Boy blu"
"One part of the colour above, 0 to 255; drag the meter or use Left and Right." = "Una componente del colore sopra, da 0 a 255; trascinate l'indicatore o usate Sinistra e Destra."
"On: the music of the place you are in plays. Off: it is silent and goes on unheard. (--no-music)" = "Attivo: suona la musica del luogo in cui vi trovate. Disattivo: è muta e prosegue senza essere udita. (--no-music)"
"UI scale" = "Scala dell'interfaccia"
"The size of the HUD and the menus, as a part of the original's (100%): smaller leaves more of the picture free, each HUD piece kept at its edge of the screen and each menu in the middle. Above 100% only the HUD grows: the menus stay at the original's size, so they keep on the screen. Takes effect at the next start (loading a save starts the game again). Not in the original." = "La dimensione di HUD e menu, come parte di quella dell'originale (100%): più piccola lascia libera più immagine, con ogni elemento dell'HUD al suo bordo dello schermo e ogni menu al centro. Oltre il 100% cresce solo l'HUD: i menu restano della dimensione originale, così restano nello schermo. Ha effetto al prossimo avvio (caricare un salvataggio riavvia il gioco). Non presente nell'originale."
"This terminal requires a password." = "Questo terminale richiede una password."
"You need a Science skill of {needed} to hack this terminal." = "Per hackerare questo terminale serve un'abilità Scienza di {needed}."
"Lip sync" = "Sincronia labiale"
"On: a speaker's face moves with the line. Off: a face that is moving eases back to rest. (--no-lip)" = "Attivo: il volto di chi parla si muove con la battuta. Disattivo: un volto in movimento torna dolcemente a riposo. (--no-lip)"
"Head tracking" = "Movimento della testa"
"On: actors turn their heads to the player and to others near them. Off: heads ease back to their animation. (--no-head-tracking)" = "Attivo: i personaggi girano la testa verso il giocatore e verso gli altri vicini. Disattivo: le teste tornano dolcemente alla loro animazione. (--no-head-tracking)"
"Feet follow the ground" = "Piedi aderenti al suolo"
"On: on slopes and steps actors bend their knees and set each foot on the ground under it. Off: the legs play the animation as it is. (--no-foot-ik)" = "Attivo: su pendii e gradini i personaggi piegano le ginocchia e poggiano ogni piede sul terreno sotto di esso. Disattivo: le gambe eseguono l'animazione così com'è. (--no-foot-ik)"
"Sky follows the game clock" = "Cielo che segue l'orologio di gioco"
"On: the sky shows the game's time of day as it passes. Off: the sky keeps its hour while the game's clock runs on ([ and ] still set it). (--still-sky)" = "Attivo: il cielo mostra l'ora del giorno del gioco mentre passa. Disattivo: il cielo tiene la sua ora mentre l'orologio di gioco va avanti ([ e ] la regolano ancora). (--still-sky)"
"Resolution" = "Risoluzione"
"The window's size, or in full screen the monitor's (its own size: borderless). A new one goes back after 20 seconds unless you keep it. (--size)" = "La dimensione della finestra o, a schermo intero, del monitor (la sua dimensione propria: senza bordi). Una nuova risoluzione viene annullata dopo 20 secondi se non la confermate. (--size)"
"Full screen" = "Schermo intero"
"On: the game fills the monitor it is on, without a frame, at the resolution chosen above for full screen. Off: a window of the resolution chosen for a window. (--window borderless)" = "Attivo: il gioco riempie il suo monitor, senza cornice, alla risoluzione scelta sopra per lo schermo intero. Disattivo: una finestra alla risoluzione scelta per la finestra. (--window borderless)"
"Monitor" = "Monitor"
"The display the game opens on in full screen (the first display until you pick one). (--window borderless)" = "Lo schermo su cui il gioco si apre a schermo intero (il primo, finché non ne scegliete uno). (--window borderless)"
"Body in first person" = "Corpo in prima persona"
"On: in first person you see your own body and legs when you look down. Off: only the arms and the weapon are drawn, as in the original. (--first-person-body)" = "Attivo: in prima persona, guardando in basso, vedete il vostro corpo e le gambe. Disattivo: si disegnano solo braccia e arma, come nell'originale. (--first-person-body)"
"Weapon sway" = "Oscillazione dell'arma"
"On: in first person the arms and weapon lag behind a turn and bob as you walk and run. Off: they stay still in the view. (--no-weapon-sway)" = "Attivo: in prima persona braccia e arma seguono in ritardo le rotazioni e ondeggiano camminando e correndo. Disattivo: restano ferme nella visuale. (--no-weapon-sway)"
"Head bob" = "Oscillazione della testa"
"On: in first person the view dips with each step as you walk and run. Off: it stays level. (--no-head-bob)" = "Attivo: in prima persona la visuale si abbassa a ogni passo camminando e correndo. Disattivo: resta in piano. (--no-head-bob)"
"Lower weapon near walls" = "Abbassare l'arma vicino ai muri"
"On: in first person a drawn weapon is lowered when a wall or a friendly person is right in front of you, and comes straight back up when you aim or fire. Off: it stays up and can poke through them, as in the original. Lower Weapon (H) lowers or raises it by hand either way. (--no-weapon-lower)" = "Attivo: in prima persona un'arma estratta si abbassa quando un muro o una persona amica è proprio davanti a voi, e torna subito su quando mirate o sparate. Disattivo: resta alzata e può attraversarli, come nell'originale. Abbassa arma (H) la abbassa o la alza a mano in ogni caso. (--no-weapon-lower)"
"True iron sights" = "Mire metalliche vere"
"On: aiming a gun lines its sights up with your eye. The crosshair is hidden while you aim down them. Off: the gun is held low with the crosshair, as in the original. Guns with no sights to look down (laser rifle, minigun) aim as the original either way. (--no-true-iron-sights)" = "Attivo: mirare con un'arma allinea le sue mire all'occhio. Il mirino è nascosto mentre mirate. Disattivo: l'arma è tenuta bassa con il mirino, come nell'originale. Le armi senza mire da traguardare (fucile laser, minigun) mirano in ogni caso come nell'originale. (--no-true-iron-sights)"
"3D scopes (test)" = "Ottiche 3D (prova)"
"On: aiming a scoped gun keeps the gun on screen and shows the zoomed view in its scope's lens, with the reticle; the view around it zooms only a little. Off: the full-screen scope picture with its black border, as in the original. Guns whose scope lens is not known yet keep the picture. (--scope-3d)" = "Attivo: mirare con un'arma con ottica tiene l'arma sullo schermo e mostra la vista ingrandita nella lente, con il reticolo; la vista intorno si avvicina solo un poco. Disattivo: l'immagine dell'ottica a schermo intero con il bordo nero, come nell'originale. Le armi la cui lente non è ancora nota mantengono l'immagine. (--scope-3d)"
"Sun shadows" = "Ombre del sole"
"The sun's shadows, out to --shadow-distance: Off; Performance (the shadow maps drawn every other frame in two cascades, trees casting shadows only near you, the first-person arms taking the world's shadows: saves frame time outdoors, shadows of moving things update at half the frame rate); or Quality (three cascades, the farther ones drawn less often). The original casts none from the world. Quality by default in the game. (--sun-shadows, --sun-shadows=performance, --no-sun-shadows)" = "Le ombre del sole, fino a --shadow-distance: Spento; Prestazioni (le mappe d'ombra disegnate un fotogramma sì e uno no in due cascate, gli alberi proiettano ombre solo vicino a te, le braccia in prima persona ricevono le ombre del mondo: risparmia tempo di fotogramma all'aperto, le ombre delle cose in movimento si aggiornano a metà della frequenza dei fotogrammi); oppure Qualità (tre cascate, le più lontane disegnate meno spesso). L'originale non ne proietta dal mondo. Qualità per impostazione predefinita nel gioco. (--sun-shadows, --sun-shadows=performance, --no-sun-shadows)"
"Grass" = "Erba"
"On: grass grows on the landscape; the cells around you get theirs over the next frames. Off: it is hidden and none grows on new cells. (--no-grass)" = "Attivo: sul paesaggio cresce l'erba; le celle intorno a voi ricevono la loro nei fotogrammi successivi. Disattivo: è nascosta e non cresce sulle nuove celle. (--no-grass)"
"Distant terrain and objects" = "Terreno e oggetti lontani"
"On: distant land, buildings and trees are drawn beyond the loaded cells (outdoors). Off: the world ends at the loaded cells. (--no-lod)" = "Attivo: terra, edifici e alberi lontani sono disegnati oltre le celle caricate (all'aperto). Disattivo: il mondo finisce alle celle caricate. (--no-lod)"
"Colour grade" = "Correzione del colore"
"On: the picture is graded by the worldspace's, the weather's and the cell's image space. Off: the picture as lit, for comparisons. (--no-grade)" = "Attivo: l'immagine è corretta secondo lo spazio immagine dello spazio mondo, del meteo e della cella. Disattivo: l'immagine così come è illuminata, per i confronti. (--no-grade)"
"Text overlay" = "Testo in sovrimpressione"
"On: the position, loading counts and key help are written over the picture. Off by default in the game. (--overlay, --no-overlay)" = "Attivo: la posizione, i contatori di caricamento e l'aiuto dei tasti sono scritti sopra l'immagine. Disattivo per impostazione predefinita nel gioco. (--overlay, --no-overlay)"
"Shot markers" = "Indicatori dei colpi"
"On: a cross is drawn at each impact and a line from the muzzle along each hitscan shot. (--hit-markers)" = "Attivo: una croce è disegnata a ogni impatto e una linea dalla volata lungo ogni colpo istantaneo. (--hit-markers)"
"God mode" = "Modalità dio"
"On: the player takes no damage from hits and cannot be killed by them. (--god)" = "Attivo: il giocatore non subisce danni dai colpi e non può esserne ucciso. (--god)"
"Draw the navmesh" = "Mostrare la navmesh"
"On: the navmesh near the camera and the walking NPCs' paths are drawn. (--show-navmesh)" = "Attivo: si disegnano la navmesh vicino alla telecamera e i percorsi degli NPC che camminano. (--show-navmesh)"
"Frame rate counter" = "Contatore dei fotogrammi"
"On: a small panel of performance readings at the top right of the screen, the Counter rows below choosing what it shows; with only its frame rate row on it is a frame rate counter. Not in the original. (--fps)" = "Attivo: un piccolo pannello di letture delle prestazioni in alto a destra dello schermo; le righe Counter qui sotto scelgono cosa mostra. Con attiva solo la sua riga dei fotogrammi al secondo, è un contatore dei fotogrammi. Non presente nell'originale. (--fps)"
"Display sync" = "Sincronizzazione dello schermo"
"Vertical sync: each frame waits for the display's refresh (no tearing). Variable refresh: for a G-Sync or FreeSync screen, vertical sync with the frame rate held a few frames under the screen's refresh rate, so frames are shown as soon as they are drawn without tearing. Off: frames are shown as soon as they are drawn (may tear)." = "Sincronia verticale: ogni fotogramma attende l'aggiornamento dello schermo (niente strappi). Aggiornamento variabile: per uno schermo G-Sync o FreeSync, sincronizzazione verticale con la frequenza dei fotogrammi tenuta qualche fotogramma sotto quella dello schermo, così i fotogrammi si vedono appena disegnati senza strappi. Disattivato: i fotogrammi si vedono appena disegnati (possibili strappi)."
"Upscaler" = "Upscaler"
"Upscaling mode" = "Modalità upscaling"
"Reconstruct the world at display resolution with FSR 3.1 or NVIDIA DLSS, at the Upscaling mode below. Disables MSAA, FXAA, SMAA and TAA while active. Menus stay sharp. Requires Vulkan; unsupported devices keep native rendering. DLSS needs an NVIDIA RTX graphics card and NVIDIA's DLSS files in the dlss folder beside nvforever.exe (NVForever ships none). With the files there when the game starts, every choice takes effect at once; files put there later are found at the next start, so DLSS chosen until then reads DLSS (restart) (loading a save starts the game again). Sharpening controls FSR sharpening. Frame generation needs FSR. (--upscaler, --upscaler-quality, --fsr)" = "Ricostruisce il mondo alla risoluzione dello schermo con FSR 3.1 o NVIDIA DLSS, nella modalità upscaling della riga sotto. Disattiva MSAA, FXAA, SMAA e TAA mentre è attivo. I menu restano nitidi. Richiede Vulkan; i dispositivi non supportati mantengono il rendering nativo. DLSS richiede una scheda grafica NVIDIA RTX e i file DLSS di NVIDIA nella cartella dlss accanto a nvforever.exe (NVForever non ne fornisce). Con i file presenti all'avvio del gioco, ogni scelta ha effetto subito; i file aggiunti dopo vengono trovati al prossimo avvio, e fino ad allora DLSS scelto appare come «DLSS (riavvio)» (caricare un salvataggio riavvia il gioco). «Nitidezza» regola la nitidezza di FSR. La generazione di fotogrammi richiede FSR. (--upscaler, --upscaler-quality, --fsr)"
"The share of the screen's width and height the world is drawn at; the upscaler rebuilds the rest. Native AA: full resolution, anti-aliasing only (DLSS: DLAA). Quality: the sharpest upscaled look, for 1440p and 4K. Balanced: more speed with little visible loss. Performance: the highest frame rate, for 4K or heavy scenes. Ultra Performance: for very high resolutions only. Takes effect at once. With Upscaler Off there is nothing to set. (--upscaler-quality, --upscaler, --fsr)" = "La quota di larghezza e altezza dello schermo a cui viene disegnato il mondo; l'upscaler ricostruisce il resto. AA nativo: risoluzione piena, solo anti-aliasing (DLSS: DLAA). Qualità: l'immagine ricostruita più nitida, per 1440p e 4K. Bilanciato: più velocità con una perdita appena visibile. Prestazioni: la frequenza di fotogrammi più alta, per 4K o scene pesanti. Prestazioni ultra: solo per risoluzioni molto alte. Ha effetto subito. Con l'upscaler disattivato non c'è nulla da impostare. (--upscaler-quality, --upscaler, --fsr)"
"DLSS model" = "Modello DLSS"
"Which of NVIDIA's DLSS models rebuilds the picture (NVIDIA calls them presets). Default (recommended): NVIDIA picks per mode: K for Native AA, Quality and Balanced, M for Performance, L for Ultra Performance. K: transformer model, best detail, costs more. L: sharper and steadier, less ghosting, costs the most. M: close to L in looks, closer to K in speed. J: like K with a little less ghosting and more flicker. Takes effect at once. Only while DLSS draws. (--dlss-model)" = "Quale dei modelli DLSS di NVIDIA ricostruisce l'immagine (NVIDIA li chiama preset). Predefinito (consigliato): NVIDIA sceglie in base alla modalità: K per AA nativo, Qualità e Bilanciato, M per Prestazioni, L per Prestazioni ultra. K: modello transformer, il massimo dettaglio, costa di più. L: più nitido e stabile, meno scie, il più costoso. M: vicino a L nell'aspetto, più vicino a K nella velocità. J: come K, con un po' meno scie e più sfarfallio. Ha effetto subito. Solo mentre disegna DLSS. (--dlss-model)"
"Default" = "Predefinito"
"DLSS only" = "Solo con DLSS"
"World" = "Mondo"
"Display" = "Schermo"
"Debug" = "Debug"
"Graphics" = "Grafica"
"Field of view" = "Campo visivo"
"The game's field of view in degrees across a 4:3 picture (75 as the original's default); wider screens see more at the sides. (--fov)" = "Il campo visivo del gioco in gradi su un'immagine 4:3 (75 come il valore predefinito dell'originale); gli schermi più larghi vedono di più ai lati. (--fov)"
"Frame rate limit" = "Limite dei fotogrammi"
"At most this many frames a second (Off: as many as the computer draws, or the display's refresh with vertical sync; with variable refresh the lower of this and its own limit). A lower limit keeps the computer cooler and quieter." = "Al massimo questi fotogrammi al secondo (Disattivato: quanti ne disegna il computer, o l'aggiornamento dello schermo con la sincronizzazione verticale; con frequenza variabile il minore tra questo e il suo limite). Un limite più basso tiene il computer più fresco e silenzioso."
"Object distance" = "Distanza degli oggetti"
"How far from you objects (buildings, rocks, furniture, clutter) of the loaded cells are drawn, as a part of the farthest those cells reach. Lower draws fewer and runs faster." = "Fin dove intorno a voi sono disegnati gli oggetti delle celle caricate (edifici, rocce, mobili, cianfrusaglie), come parte della portata massima di quelle celle. Meno ne disegna meno e va più veloce."
"Actor distance" = "Distanza dei personaggi"
"How far from you people and creatures are drawn, as a part of the farthest the loaded cells reach." = "Fin dove intorno a voi sono disegnate persone e creature, come parte della portata massima delle celle caricate."
"Item distance" = "Distanza degli oggetti a terra"
"How far from you items lying in the world (weapons, ammo, aid, notes, caps, clutter you can take) are drawn, as a part of the farthest the loaded cells reach." = "Fin dove intorno a voi sono disegnati gli oggetti posati nel mondo (armi, munizioni, cure, note, tappi, cianfrusaglie da raccogliere), come parte della portata massima delle celle caricate."
"Shadow distance" = "Distanza delle ombre"
"How far from you the sun casts shadows (with Sun shadows on), as a part of --shadow-distance." = "Fin dove intorno a voi il sole proietta ombre (con le ombre del sole attive), come parte di --shadow-distance."
"Grass distance" = "Distanza dell'erba"
"How far from you grass is drawn, as a part of --grass-distance and its fade range." = "Fin dove intorno a voi è disegnata l'erba, come parte di --grass-distance e della sua zona di dissolvenza."
"Anti-aliasing" = "Antialiasing"
"How edges are smoothed: multisampling Off, 2x, 4x or 8x (--msaa; the cut-out edges of plants too), or the picture smoothed afterwards: FXAA (cheapest, softest), SMAA (sharper, a little dearer) or TAA (over the frames; plants too, soft while moving; --graphics-only fxaa, smaa or taa). Multisampling is the dearest, more at each step: at 1920x1080 on an RTX 4070, 2x added about 0.8 ms a frame, 4x about 1.3 ms and 8x about 2.3 ms (Goodsprings and Novac at noon); FXAA, SMAA and TAA cost less than 4x. Where the processor sets the pace (the Strip at night) the choice costs next to nothing. While an upscaler (FSR 3.1 or DLSS) is on it does the anti-aliasing itself, so this row reads Off (upscaling active); your choice comes back when Upscaler is Off." = "Come si smussano i bordi: multicampionamento Disattivato, 2x, 4x o 8x (--msaa; anche i bordi ritagliati delle piante), oppure l'immagine smussata dopo: FXAA (il più economico, il più morbido), SMAA (più nitido, un po' più caro) o TAA (su più fotogrammi; anche le piante, morbido in movimento; --graphics-only fxaa, smaa o taa). Il multicampionamento è il più caro, di più a ogni passo: a 1920x1080 su una RTX 4070, 2x aggiungeva circa 0,8 ms a fotogramma, 4x circa 1,3 ms e 8x circa 2,3 ms (Goodsprings e Novac a mezzogiorno); FXAA, SMAA e TAA costano meno di 4x. Dove il ritmo lo detta il processore (lo Strip di notte) la scelta non costa quasi nulla. Mentre l'upscaling (FSR 3.1 o DLSS) è attivo fa da sé l'antialiasing, quindi questa riga indica «Disattivo (upscaling attivo)»; la vostra scelta torna quando l'upscaling è disattivo."
"Shadow filtering" = "Filtraggio delle ombre"
"How the edges of the sun's shadows are softened: Fast (hardware 2x2, harder edges, cheapest), Smooth (as vanilla) or Temporal (soft but grainy unless Anti-aliasing is TAA)." = "Come si ammorbidiscono i bordi delle ombre del sole: Veloce (hardware 2x2, bordi più netti, il più economico), Morbido (come l'originale) o Temporale (morbido ma granuloso, a meno che l'antialiasing sia TAA)."
"Ambient occlusion" = "Occlusione ambientale"
"On: creases, corners and the ground under things are darkened by how enclosed they are (screen-space, from the depth). Not in the original. (--graphics)" = "Attivo: pieghe, angoli e il terreno sotto le cose si scuriscono quanto più sono racchiusi (nello spazio dello schermo, dalla profondità). Non presente nell'originale. (--graphics)"
"Longer sun shadows" = "Ombre del sole più lunghe"
"On: the sun's shadows reach half as far again as --shadow-distance. Costs a little frame rate. (--graphics)" = "Attivo: le ombre del sole arrivano una volta e mezza più lontano di --shadow-distance. Costa qualche fotogramma. (--graphics)"
"Bloom" = "Bloom"
"On: light brighter than a sunlit white wall (the sun, lamps, windows) glows into its surroundings, on top of the game's own image space. (--graphics)" = "Attivo: la luce più intensa di un muro bianco al sole (il sole, le lampade, le finestre) si irradia intorno, sopra lo spazio immagine proprio del gioco. (--graphics)"
"Light glow (HDR)" = "Bagliore della luce (HDR)"
"On: neon, lamps, glowing beams and fire glow softly into their surroundings, as the original's HDR glow does; how much follows the place's image space (the Strip's neon at night most). Bloom, when on, adds to it. (--graphics-only no-glow turns it off)" = "Attivo: neon, lampade, raggi luminosi e fuoco si irradiano dolcemente intorno, come il bagliore HDR dell'originale; quanto, lo decide lo spazio immagine del luogo (soprattutto il neon dello Strip di notte). Il bloom, se attivo, vi si aggiunge. (--graphics-only no-glow lo disattiva)"
"Eye adaptation" = "Adattamento dell'occhio"
"On: dark views brighten after a moment, as the eye gets used to the dark, by the place's image space. Needs the light glow. (--graphics-only no-eye-adaptation turns it off)" = "Attivo: le viste buie si schiariscono dopo un momento, come l'occhio si abitua al buio, secondo lo spazio immagine del luogo. Richiede il bagliore della luce. (--graphics-only no-eye-adaptation lo disattiva)"
"Neon glow" = "Bagliore del neon"
"On: where the place's image space asks for a strong glow (the Strip at night) neon tubes and signs burn with a wide halo, as in the original. Needs the light glow. (--graphics-only no-neon-glow turns it off)" = "Attivo: dove lo spazio immagine del luogo chiede un bagliore forte (lo Strip di notte) tubi e insegne al neon ardono con un ampio alone, come nell'originale. Richiede il bagliore della luce. (--graphics-only no-neon-glow lo disattiva)"
"Sharpening" = "Nitidezza"
"On: the final picture is sharpened where it has little contrast (contrast-adaptive sharpening). (--graphics)" = "Attivo: l'immagine finale è resa più nitida dove ha poco contrasto (nitidezza adattiva al contrasto). (--graphics)"
"Anisotropic filtering 16x" = "Filtro anisotropico 16x"
"On: textures seen at a slant stay sharp further (16x instead of 8x). For textures loaded from now on (the cells loaded next). (--graphics)" = "Attivo: le texture viste di sbieco restano nitide più lontano (16x invece di 8x). Per le texture caricate da ora (le prossime celle caricate). (--graphics)"
"Sun shafts" = "Raggi di sole"
"On: sunlight streams past what stands in front of the sun, stronger the hazier the weather's fog. Not in the original. (--graphics)" = "Attivo: la luce del sole filtra oltre ciò che sta davanti al sole, tanto più quanto più è densa la foschia del meteo. Non presente nell'originale. (--graphics)"
"Screen-space water reflections" = "Riflessi dell'acqua su schermo"
"On: water the mirrored reflection does not reach (another height, interiors) reflects what is on the screen instead of only the sky. (--graphics)" = "Attivo: l'acqua che il riflesso a specchio non raggiunge (altra altezza, interni) riflette ciò che è sullo schermo invece del solo cielo. (--graphics)"
"Mirrored water reflections" = "Riflessi a specchio dell'acqua"
"On: water mirrors the world above it, as in the original; the scene is drawn a second time for it while water is on screen. Off: water reflects the sky, and what is on the screen with screen-space reflections. (--graphics-only no-water-mirror turns it off)" = "Attivo: l'acqua riflette il mondo sopra di essa, come nell'originale; la scena viene disegnata una seconda volta finché c'è acqua sullo schermo. Disattivo: l'acqua riflette il cielo e, con i riflessi nello spazio schermo, ciò che è sullo schermo. (--graphics-only no-water-mirror li disattiva)"
"Quality preset" = "Preimpostazione di qualità"
"Sets the rows the original's quality presets cover to the values of the game folder's low.ini, medium.ini, high.ini or VeryHigh.ini: Sun shadows, Shadow filtering, Light glow, Mirrored water reflections and the object, actor, item, shadow and grass distances. Custom: those rows match none of them. A preset whose file is missing is not offered. The enhanced effects, anti-aliasing and FSR keep their own rows." = "Imposta le righe coperte dalle preimpostazioni di qualità dell'originale sui valori di low.ini, medium.ini, high.ini o VeryHigh.ini della cartella del gioco: ombre del sole, filtraggio delle ombre, bagliore della luce, riflessi a specchio dell'acqua e le distanze di oggetti, personaggi, articoli, ombre ed erba. Personalizzato: quelle righe non corrispondono a nessuna. Una preimpostazione il cui file manca non viene offerta. Gli effetti migliorati, l'antialiasing e FSR mantengono le proprie righe."
"Enhanced effects" = "Effetti migliorati"
"On: every effect of the enhanced look (ambient occlusion, longer sun shadows, bloom, sharpening, anisotropic filtering 16x, sun shafts, screen-space water reflections). Off: none of them, the original's picture. Custom: some on, some off. Each effect keeps its own row and its own saved state; this row only sets them all at once." = "Attivato: tutti gli effetti dell'aspetto migliorato (occlusione ambientale, ombre del sole più lunghe, bloom, nitidezza, filtro anisotropico 16x, raggi di sole, riflessi dell'acqua su schermo). Disattivato: nessuno, l'immagine dell'originale. Personalizzato: alcuni attivi, altri no. Ogni effetto mantiene la propria riga e il proprio stato salvato; questa riga li imposta solo tutti insieme."
"Off (upscaling active)" = "Disattivo (upscaling attivo)"
