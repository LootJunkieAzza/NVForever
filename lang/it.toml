"Not available" = "Non disponibile"
"game {percent}%" = "gioco {percent}%"
"Machine and game CPU use, read once a second while shown. Windows uses performance counters; Linux uses /proc. Missing machine readings say Not available. Game use is cores kept busy: 1.0 is one full core." = "Uso della CPU del computer e del gioco, letto ogni secondo mentre è visibile. Windows usa i contatori delle prestazioni; Linux usa /proc. Le letture mancanti del computer indicano Non disponibile. Il gioco conta i core occupati: 1.0 è un core completo."
"GPU use, read once a second while shown. Windows: busiest engine across programs. Linux: NVIDIA NVML, then amdgpu, then DRM client time. DRM reads game use and says game; the other Linux sources read whole-device use. Missing readings say Not available." = "Uso della GPU, letto ogni secondo mentre è visibile. Windows: motore più occupato tra tutti i programmi. Linux: NVIDIA NVML, poi amdgpu, poi tempo del client DRM. DRM misura il gioco e indica gioco; le altre fonti Linux misurano tutto il dispositivo. Le letture mancanti indicano Non disponibile."

# [design, #2242] The upscaling row (perf_overlay/readings.rs, settings.rs).
"model {model}" = "modello {model}"
"The upscaler that draws now: its name and mode, the size the world is drawn at and the size it is rebuilt to (with FSR 3.1 from its mode, with DLSS the size DLSS chose), and with DLSS the model asked for. Reads Off and the window's size while nothing upscales, also when the upscaler asked for cannot run on this computer. Follows a change within a frame or two, showing the upscaler without sizes until then." = "L'upscaler che disegna ora: nome e modalità, la dimensione a cui è disegnato il mondo e quella a cui viene ricostruito (con FSR 3.1 dalla modalità, con DLSS la dimensione scelta da DLSS) e, con DLSS, il modello richiesto. Mostra Disattivato e la dimensione della finestra quando nulla viene scalato, anche quando l'upscaler richiesto non può funzionare su questo computer. Segue una modifica entro uno o due fotogrammi, mostrando fino ad allora l'upscaler senza dimensioni."
