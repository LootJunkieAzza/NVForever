"The colour of the HUD and the menus: Amber (the default) or another; the sliders below set it to any colour." = "Il colore dell'HUD e dei menu: Ambra (predefinito) o un altro; i cursori qui sotto lo impostano su qualsiasi colore."
"Pip-Boy colour" = "Colore del Pip-Boy"
"The colour of the Pip-Boy's screens (items, stats, data): Amber (the default) or another; the sliders below set it to any colour." = "Il colore degli schermi del Pip-Boy (oggetti, statistiche, dati): Ambra (predefinito) o un altro; i cursori qui sotto lo impostano su qualsiasi colore."
