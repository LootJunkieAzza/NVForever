"Needs an NVIDIA RTX 40 series or newer" = "Richiede una NVIDIA RTX serie 40 o successiva"
"Needs hardware-accelerated GPU scheduling" = "Richiede la pianificazione GPU con accelerazione hardware"
"Needs a newer NVIDIA driver" = "Richiede un driver NVIDIA più recente"
"Files missing: Download DLSS… on the Upscaler row" = "File mancanti: Scarica DLSS… nella riga Upscaler"
"Restart to use DLSS Frame Generation" = "Riavvia per usare DLSS Frame Generation"
