"Previous heading" = "Sezione precedente"
"Next heading" = "Sezione successiva"
"Keyboard search" = "Ricerca da tastiera"
"No settings here." = "Nessuna impostazione qui."
"No results." = "Nessun risultato."
"No changed settings." = "Nessuna impostazione modificata."
"Stands for: {rows}." = "Sta per: {rows}."
"Button style" = "Stile dei pulsanti"
"Which names and pictures the controller's buttons go by in prompts, menu hints and the Controls tab. Auto: a PlayStation controller's (Cross, Circle, Square, Triangle, L1, R2, Select…) when the controller in use says it is one, else an Xbox controller's. Xbox or PlayStation: always those. The INI keeps the Xbox names either way." = "Con quali nomi e immagini sono indicati i pulsanti del controller nei suggerimenti, nei menu e nella scheda Comandi. Auto: quelli di un controller PlayStation (Cross, Circle, Square, Triangle, L1, R2, Select…) quando il controller in uso dichiara di esserlo, altrimenti quelli di un controller Xbox. Xbox o PlayStation: sempre quelli. Il file INI conserva comunque i nomi Xbox."
"Light and noise gauges while sneaking" = "Indicatori di luce e rumore in furtività"
"On: two bars under the sneak word show how lit you are and how much noise you make, as detection counts them. Not in the original." = "Attivo: due barre sotto la scritta della furtività mostrano quanto siete illuminati e quanto rumore fate, come li conta il rilevamento. Non presente nell'originale."
"Saving" = "Salvataggio"
"Autosave after travel" = "Salvataggio automatico dopo uno spostamento"
"On: the game saves to the autosave slot after each loading screen (doors, coc, a script moving the player); fast travel has its own switch." = "Attivo: il gioco salva nello slot automatico dopo ogni schermata di caricamento (porte, coc, uno script che sposta il giocatore); il viaggio rapido ha la sua opzione."
"Save on fast travel" = "Salvare al viaggio rapido"
"On: the game saves to the autosave slot when a fast travel arrives." = "Attivo: il gioco salva nello slot automatico all'arrivo di un viaggio rapido."
"Save on wait" = "Salvare dopo l'attesa"
"On: the game saves to the autosave slot when a wait ends with at least one hour passed." = "Attivo: il gioco salva nello slot automatico quando un'attesa di almeno un'ora finisce."
"Save on sleep" = "Salvare dopo il sonno"
"On: the game saves to the autosave slot when the player wakes from a sleep of at least one hour." = "Attivo: il gioco salva nello slot automatico quando il giocatore si sveglia da un sonno di almeno un'ora."
"Save when a script asks" = "Salvare quando uno script lo chiede"
"On: a script's Autosave saves to the autosave slot, as quests do at their milestones; SystemSave to the system slot; ForceSave as a new save." = "Attivo: Autosave in uno script salva nello slot automatico, come fanno le missioni nei momenti chiave; SystemSave nello slot di sistema; ForceSave come nuovo salvataggio."
"Hardcore mode" = "Modalità hardcore"
"On: you need water, food and sleep, stimpaks heal over time, ammunition has weight and crippled limbs heal only with a doctor's bag or a doctor. Off: none of that; turning it off clears your thirst, hunger and tiredness and their effects. (console: SetHardcore 1/0)" = "Attivo: servono acqua, cibo e sonno, gli stimpak curano nel tempo, le munizioni hanno un peso e gli arti storpiati guariscono solo con una borsa del medico o da un medico. Disattivo: niente di tutto ciò; disattivarla toglie sete, fame e stanchezza e i loro effetti. (console: SetHardcore 1/0)"
"HUD red" = "HUD rosso"
"HUD green" = "HUD verde"
"HUD blue" = "HUD blu"
"Pip-Boy red" = "Pip-Boy rosso"
"Pip-Boy green" = "Pip-Boy verde"
"Pip-Boy blue" = "Pip-Boy blu"
"One part of the colour above, 0 to 255; drag the meter or use Left and Right." = "Una componente del colore sopra, da 0 a 255; trascinate l'indicatore o usate Sinistra e Destra."
"On: the music of the place you are in plays. Off: it is silent and goes on unheard. (--no-music)" = "Attivo: suona la musica del luogo in cui vi trovate. Disattivo: è muta e prosegue senza essere udita. (--no-music)"
"UI scale" = "Scala dell'interfaccia"
"The size of the HUD and the menus, as a part of the original's (100%): smaller leaves more of the picture free, each HUD piece kept at its edge of the screen and each menu in the middle. Above 100% only the HUD grows: the menus stay at the original's size, so they keep on the screen. Takes effect at the next start (loading a save starts the game again). Not in the original." = "La dimensione di HUD e menu, come parte di quella dell'originale (100%): più piccola lascia libera più immagine, con ogni elemento dell'HUD al suo bordo dello schermo e ogni menu al centro. Oltre il 100% cresce solo l'HUD: i menu restano della dimensione originale, così restano nello schermo. Ha effetto al prossimo avvio (caricare un salvataggio riavvia il gioco). Non presente nell'originale."
"This terminal requires a password." = "Questo terminale richiede una password."
"You need a Science skill of {needed} to hack this terminal." = "Per hackerare questo terminale serve un'abilità Scienza di {needed}."
"Lip sync" = "Sincronia labiale"
"On: a speaker's face moves with the line. Off: a face that is moving eases back to rest. (--no-lip)" = "Attivo: il volto di chi parla si muove con la battuta. Disattivo: un volto in movimento torna dolcemente a riposo. (--no-lip)"
"Head tracking" = "Movimento della testa"
"On: actors turn their heads to the player and to others near them. Off: heads ease back to their animation. (--no-head-tracking)" = "Attivo: i personaggi girano la testa verso il giocatore e verso gli altri vicini. Disattivo: le teste tornano dolcemente alla loro animazione. (--no-head-tracking)"
"Feet follow the ground" = "Piedi aderenti al suolo"
"On: on slopes and steps actors bend their knees and set each foot on the ground under it. Off: the legs play the animation as it is. (--no-foot-ik)" = "Attivo: su pendii e gradini i personaggi piegano le ginocchia e poggiano ogni piede sul terreno sotto di esso. Disattivo: le gambe eseguono l'animazione così com'è. (--no-foot-ik)"
"Sky follows the game clock" = "Cielo che segue l'orologio di gioco"
"On: the sky shows the game's time of day as it passes. Off: the sky keeps its hour while the game's clock runs on ([ and ] still set it). (--still-sky)" = "Attivo: il cielo mostra l'ora del giorno del gioco mentre passa. Disattivo: il cielo tiene la sua ora mentre l'orologio di gioco va avanti ([ e ] la regolano ancora). (--still-sky)"
"Resolution" = "Risoluzione"
"The window's size, or in full screen the monitor's (its own size: borderless). A new one goes back after 20 seconds unless you keep it. (--size)" = "La dimensione della finestra o, a schermo intero, del monitor (la sua dimensione propria: senza bordi). Una nuova risoluzione viene annullata dopo 20 secondi se non la confermate. (--size)"
"Full screen" = "Schermo intero"
"On: the game fills the monitor it is on, without a frame, at the resolution chosen above for full screen. Off: a window of the resolution chosen for a window. (--window borderless)" = "Attivo: il gioco riempie il suo monitor, senza cornice, alla risoluzione scelta sopra per lo schermo intero. Disattivo: una finestra alla risoluzione scelta per la finestra. (--window borderless)"
"Monitor" = "Monitor"
"The display the game opens on in full screen (the first display until you pick one). (--window borderless)" = "Lo schermo su cui il gioco si apre a schermo intero (il primo, finché non ne scegliete uno). (--window borderless)"
"Body in first person" = "Corpo in prima persona"
"On: in first person you see your own body and legs when you look down. Off: only the arms and the weapon are drawn, as in the original. (--first-person-body)" = "Attivo: in prima persona, guardando in basso, vedete il vostro corpo e le gambe. Disattivo: si disegnano solo braccia e arma, come nell'originale. (--first-person-body)"
"Weapon sway" = "Oscillazione dell'arma"
"On: in first person the arms and weapon lag behind a turn and bob as you walk and run. Off: they stay still in the view. (--no-weapon-sway)" = "Attivo: in prima persona braccia e arma seguono in ritardo le rotazioni e ondeggiano camminando e correndo. Disattivo: restano ferme nella visuale. (--no-weapon-sway)"
"Head bob" = "Oscillazione della testa"
"On: in first person the view dips with each step as you walk and run. Off: it stays level. (--no-head-bob)" = "Attivo: in prima persona la visuale si abbassa a ogni passo camminando e correndo. Disattivo: resta in piano. (--no-head-bob)"
"Lower weapon near walls" = "Abbassare l'arma vicino ai muri"
"On: in first person a drawn weapon is lowered when a wall or a friendly person is right in front of you, and comes straight back up when you aim or fire. Off: it stays up and can poke through them, as in the original. Lower Weapon (H) lowers or raises it by hand either way. (--no-weapon-lower)" = "Attivo: in prima persona un'arma estratta si abbassa quando un muro o una persona amica è proprio davanti a voi, e torna subito su quando mirate o sparate. Disattivo: resta alzata e può attraversarli, come nell'originale. Abbassa arma (H) la abbassa o la alza a mano in ogni caso. (--no-weapon-lower)"
"True iron sights" = "Mire metalliche vere"
"On: aiming a gun lines its sights up with your eye. The crosshair is hidden while you aim down them. Off: the gun is held low with the crosshair, as in the original. Guns with no sights to look down (laser rifle, minigun) aim as the original either way. (--no-true-iron-sights)" = "Attivo: mirare con un'arma allinea le sue mire all'occhio. Il mirino è nascosto mentre mirate. Disattivo: l'arma è tenuta bassa con il mirino, come nell'originale. Le armi senza mire da traguardare (fucile laser, minigun) mirano in ogni caso come nell'originale. (--no-true-iron-sights)"
"3D scopes (test)" = "Ottiche 3D (prova)"
"On: aiming a scoped gun keeps the gun on screen and shows the zoomed view in its scope's lens, with the reticle; the view around it zooms only a little. Off: the full-screen scope picture with its black border, as in the original. Guns whose scope lens is not known yet keep the picture. (--scope-3d)" = "Attivo: mirare con un'arma con ottica tiene l'arma sullo schermo e mostra la vista ingrandita nella lente, con il reticolo; la vista intorno si avvicina solo un poco. Disattivo: l'immagine dell'ottica a schermo intero con il bordo nero, come nell'originale. Le armi la cui lente non è ancora nota mantengono l'immagine. (--scope-3d)"
"Sun shadows" = "Ombre del sole"
"On: the sun casts shadows out to --shadow-distance. The original casts none from the world. On by default in the game. (--sun-shadows, --no-sun-shadows)" = "Attivo: il sole proietta ombre fino a --shadow-distance. L'originale non ne proietta dal mondo. Attivo per impostazione predefinita nel gioco. (--sun-shadows, --no-sun-shadows)"
"Grass" = "Erba"
"On: grass grows on the landscape; the cells around you get theirs over the next frames. Off: it is hidden and none grows on new cells. (--no-grass)" = "Attivo: sul paesaggio cresce l'erba; le celle intorno a voi ricevono la loro nei fotogrammi successivi. Disattivo: è nascosta e non cresce sulle nuove celle. (--no-grass)"
"Distant terrain and objects" = "Terreno e oggetti lontani"
"On: distant land, buildings and trees are drawn beyond the loaded cells (outdoors). Off: the world ends at the loaded cells. (--no-lod)" = "Attivo: terra, edifici e alberi lontani sono disegnati oltre le celle caricate (all'aperto). Disattivo: il mondo finisce alle celle caricate. (--no-lod)"
"Colour grade" = "Correzione del colore"
"On: the picture is graded by the worldspace's, the weather's and the cell's image space. Off: the picture as lit, for comparisons. (--no-grade)" = "Attivo: l'immagine è corretta secondo lo spazio immagine dello spazio mondo, del meteo e della cella. Disattivo: l'immagine così come è illuminata, per i confronti. (--no-grade)"
"Text overlay" = "Testo in sovrimpressione"
"On: the position, loading counts and key help are written over the picture. Off by default in the game. (--overlay, --no-overlay)" = "Attivo: la posizione, i contatori di caricamento e l'aiuto dei tasti sono scritti sopra l'immagine. Disattivo per impostazione predefinita nel gioco. (--overlay, --no-overlay)"
"Shot markers" = "Indicatori dei colpi"
"On: a cross is drawn at each impact and a line from the muzzle along each hitscan shot. (--hit-markers)" = "Attivo: una croce è disegnata a ogni impatto e una linea dalla volata lungo ogni colpo istantaneo. (--hit-markers)"
"God mode" = "Modalità dio"
"On: the player takes no damage from hits and cannot be killed by them. (--god)" = "Attivo: il giocatore non subisce danni dai colpi e non può esserne ucciso. (--god)"
"Draw the navmesh" = "Mostrare la navmesh"
"On: the navmesh near the camera and the walking NPCs' paths are drawn. (--show-navmesh)" = "Attivo: si disegnano la navmesh vicino alla telecamera e i percorsi degli NPC che camminano. (--show-navmesh)"
"Frame rate counter" = "Contatore dei fotogrammi"
"On: the frames a second, the mean frame time and the slowest frame of the last half second are shown in the top-right corner. Not in the original. (--fps)" = "Attivo: i fotogrammi al secondo, il tempo medio per fotogramma e il fotogramma più lento dell'ultimo mezzo secondo compaiono in alto a destra. Non presente nell'originale. (--fps)"
"Display sync" = "Sincronizzazione dello schermo"
"Vertical sync: each frame waits for the display's refresh (no tearing). Variable refresh: for a G-Sync or FreeSync screen, vertical sync with the frame rate held a few frames under the screen's refresh rate, so frames are shown as soon as they are drawn without tearing. Off: frames are shown as soon as they are drawn (may tear)." = "Vertical sync: ogni fotogramma attende l'aggiornamento dello schermo (niente strappi). Variable refresh: per uno schermo G-Sync o FreeSync, sincronizzazione verticale con la frequenza dei fotogrammi tenuta qualche fotogramma sotto quella dello schermo, così i fotogrammi si vedono appena disegnati senza strappi. Off: i fotogrammi si vedono appena disegnati (possibili strappi)."
"FSR 3.1 upscaling" = "Upscaling FSR 3.1"
"Reconstruct the world at display resolution; Native AA keeps full resolution. Disables MSAA, FXAA, SMAA and TAA while active. Menus stay sharp. Requires Vulkan; unsupported devices keep native rendering. Sharpening controls FSR sharpening. No frame generation. (--fsr)" = "Ricostruisce il mondo alla risoluzione dello schermo; Native AA mantiene la risoluzione piena. Disattiva MSAA, FXAA, SMAA e TAA mentre è attivo. I menu restano nitidi. Richiede Vulkan; i dispositivi non supportati mantengono il rendering nativo. «Nitidezza» regola la nitidezza di FSR. Nessuna generazione di fotogrammi. (--fsr)"
"World" = "Mondo"
"Display" = "Schermo"
"Debug" = "Debug"
"Graphics" = "Grafica"
"Field of view" = "Campo visivo"
"The game's field of view in degrees across a 4:3 picture (75 as the original's default); wider screens see more at the sides. (--fov)" = "Il campo visivo del gioco in gradi su un'immagine 4:3 (75 come il valore predefinito dell'originale); gli schermi più larghi vedono di più ai lati. (--fov)"
"Frame rate limit" = "Limite dei fotogrammi"
"At most this many frames a second (Off: as many as the computer draws, or the display's refresh with vertical sync; with variable refresh the lower of this and its own limit). A lower limit keeps the computer cooler and quieter." = "Al massimo questi fotogrammi al secondo (Off: quanti ne disegna il computer, o l'aggiornamento dello schermo con la sincronizzazione verticale; con frequenza variabile il minore tra questo e il suo limite). Un limite più basso tiene il computer più fresco e silenzioso."
"Object distance" = "Distanza degli oggetti"
"How far from you objects (buildings, rocks, furniture, clutter) of the loaded cells are drawn, as a part of the farthest those cells reach. Lower draws fewer and runs faster." = "Fin dove intorno a voi sono disegnati gli oggetti delle celle caricate (edifici, rocce, mobili, cianfrusaglie), come parte della portata massima di quelle celle. Meno ne disegna meno e va più veloce."
"Actor distance" = "Distanza dei personaggi"
"How far from you people and creatures are drawn, as a part of the farthest the loaded cells reach." = "Fin dove intorno a voi sono disegnate persone e creature, come parte della portata massima delle celle caricate."
"Item distance" = "Distanza degli oggetti a terra"
"How far from you items lying in the world (weapons, ammo, aid, notes, caps, clutter you can take) are drawn, as a part of the farthest the loaded cells reach." = "Fin dove intorno a voi sono disegnati gli oggetti posati nel mondo (armi, munizioni, cure, note, tappi, cianfrusaglie da raccogliere), come parte della portata massima delle celle caricate."
"Shadow distance" = "Distanza delle ombre"
"How far from you the sun casts shadows (with Sun shadows on), as a part of --shadow-distance." = "Fin dove intorno a voi il sole proietta ombre (con le ombre del sole attive), come parte di --shadow-distance."
"Grass distance" = "Distanza dell'erba"
"How far from you grass is drawn, as a part of --grass-distance and its fade range." = "Fin dove intorno a voi è disegnata l'erba, come parte di --grass-distance e della sua zona di dissolvenza."
"Anti-aliasing" = "Antialiasing"
"How edges are smoothed: multisampling Off, 2x, 4x or 8x (--msaa; the cut-out edges of plants too), or the picture smoothed afterwards: FXAA (cheapest, softest), SMAA (sharper, a little dearer) or TAA (over the frames; plants too, soft while moving; --graphics-only fxaa, smaa or taa). Multisampling is the dearest, more at each step: at 1920x1080 on an RTX 4070, 2x added about 0.8 ms a frame, 4x about 1.3 ms and 8x about 2.3 ms (Goodsprings and Novac at noon); FXAA, SMAA and TAA cost less than 4x. Where the processor sets the pace (the Strip at night) the choice costs next to nothing. While FSR 3.1 upscaling is on it does the anti-aliasing itself, so this row reads Off (FSR active); your choice comes back when FSR is Off." = "Come si smussano i bordi: multicampionamento Off, 2x, 4x o 8x (--msaa; anche i bordi ritagliati delle piante), oppure l'immagine smussata dopo: FXAA (il più economico, il più morbido), SMAA (più nitido, un po' più caro) o TAA (su più fotogrammi; anche le piante, morbido in movimento; --graphics-only fxaa, smaa o taa). Il multicampionamento è il più caro, di più a ogni passo: a 1920x1080 su una RTX 4070, 2x aggiungeva circa 0,8 ms a fotogramma, 4x circa 1,3 ms e 8x circa 2,3 ms (Goodsprings e Novac a mezzogiorno); FXAA, SMAA e TAA costano meno di 4x. Dove il ritmo lo detta il processore (lo Strip di notte) la scelta non costa quasi nulla. Mentre l'upscaling FSR 3.1 è attivo fa da sé l'antialiasing, quindi questa riga indica «Disattivo (FSR attivo)»; la vostra scelta torna quando FSR è disattivo."
"Shadow filtering" = "Filtraggio delle ombre"
"How the edges of the sun's shadows are softened: Fast (hardware 2x2, harder edges, cheapest), Smooth (as vanilla) or Temporal (soft but grainy unless Anti-aliasing is TAA)." = "Come si ammorbidiscono i bordi delle ombre del sole: Fast (hardware 2x2, bordi più netti, il più economico), Smooth (come l'originale) o Temporal (morbido ma granuloso, a meno che l'antialiasing sia TAA)."
"Ambient occlusion" = "Occlusione ambientale"
"On: creases, corners and the ground under things are darkened by how enclosed they are (screen-space, from the depth). Not in the original. (--graphics)" = "Attivo: pieghe, angoli e il terreno sotto le cose si scuriscono quanto più sono racchiusi (nello spazio dello schermo, dalla profondità). Non presente nell'originale. (--graphics)"
"Longer sun shadows" = "Ombre del sole più lunghe"
"On: the sun's shadows reach half as far again as --shadow-distance. Costs a little frame rate. (--graphics)" = "Attivo: le ombre del sole arrivano una volta e mezza più lontano di --shadow-distance. Costa qualche fotogramma. (--graphics)"
"Bloom" = "Bloom"
"On: light brighter than a sunlit white wall (the sun, lamps, windows) glows into its surroundings, on top of the game's own image space. (--graphics)" = "Attivo: la luce più intensa di un muro bianco al sole (il sole, le lampade, le finestre) si irradia intorno, sopra lo spazio immagine proprio del gioco. (--graphics)"
"Light glow (HDR)" = "Bagliore della luce (HDR)"
"On: neon, lamps, glowing beams and fire glow softly into their surroundings, as the original's HDR glow does; how much follows the place's image space (the Strip's neon at night most). Bloom, when on, adds to it. (--graphics-only no-glow turns it off)" = "Attivo: neon, lampade, raggi luminosi e fuoco si irradiano dolcemente intorno, come il bagliore HDR dell'originale; quanto, lo decide lo spazio immagine del luogo (soprattutto il neon dello Strip di notte). Il bloom, se attivo, vi si aggiunge. (--graphics-only no-glow lo disattiva)"
"Eye adaptation" = "Adattamento dell'occhio"
"On: dark views brighten after a moment, as the eye gets used to the dark, by the place's image space. Needs the light glow. (--graphics-only no-eye-adaptation turns it off)" = "Attivo: le viste buie si schiariscono dopo un momento, come l'occhio si abitua al buio, secondo lo spazio immagine del luogo. Richiede il bagliore della luce. (--graphics-only no-eye-adaptation lo disattiva)"
"Neon glow" = "Bagliore del neon"
"On: where the place's image space asks for a strong glow (the Strip at night) neon tubes and signs burn with a wide halo, as in the original. Needs the light glow. (--graphics-only no-neon-glow turns it off)" = "Attivo: dove lo spazio immagine del luogo chiede un bagliore forte (lo Strip di notte) tubi e insegne al neon ardono con un ampio alone, come nell'originale. Richiede il bagliore della luce. (--graphics-only no-neon-glow lo disattiva)"
"Sharpening" = "Nitidezza"
"On: the final picture is sharpened where it has little contrast (contrast-adaptive sharpening). (--graphics)" = "Attivo: l'immagine finale è resa più nitida dove ha poco contrasto (nitidezza adattiva al contrasto). (--graphics)"
"Anisotropic filtering 16x" = "Filtro anisotropico 16x"
"On: textures seen at a slant stay sharp further (16x instead of 8x). For textures loaded from now on (the cells loaded next). (--graphics)" = "Attivo: le texture viste di sbieco restano nitide più lontano (16x invece di 8x). Per le texture caricate da ora (le prossime celle caricate). (--graphics)"
"Sun shafts" = "Raggi di sole"
"On: sunlight streams past what stands in front of the sun, stronger the hazier the weather's fog. Not in the original. (--graphics)" = "Attivo: la luce del sole filtra oltre ciò che sta davanti al sole, tanto più quanto più è densa la foschia del meteo. Non presente nell'originale. (--graphics)"
"Screen-space water reflections" = "Riflessi dell'acqua su schermo"
"On: water the mirrored reflection does not reach (another height, interiors) reflects what is on the screen instead of only the sky. (--graphics)" = "Attivo: l'acqua che il riflesso a specchio non raggiunge (altra altezza, interni) riflette ciò che è sullo schermo invece del solo cielo. (--graphics)"
"Mirrored water reflections" = "Riflessi a specchio dell'acqua"
"On: water mirrors the world above it, as in the original; the scene is drawn a second time for it while water is on screen. Off: water reflects the sky, and what is on the screen with screen-space reflections. (--graphics-only no-water-mirror turns it off)" = "Attivo: l'acqua riflette il mondo sopra di essa, come nell'originale; la scena viene disegnata una seconda volta finché c'è acqua sullo schermo. Disattivo: l'acqua riflette il cielo e, con i riflessi nello spazio schermo, ciò che è sullo schermo. (--graphics-only no-water-mirror li disattiva)"
"Off (FSR active)" = "Disattivo (FSR attivo)"
"Controls" = "Comandi"
"HUD colour" = "Colore dell'HUD"
"The colour of the HUD and the menus: Amber (the default) or another; the sliders below set it to any colour." = "Il colore dell'HUD e dei menu: Amber (predefinito) o un altro; i cursori qui sotto lo impostano su qualsiasi colore."
"Pip-Boy colour" = "Colore del Pip-Boy"
"The colour of the Pip-Boy's screens (items, stats, data): Amber (the default) or another; the sliders below set it to any colour." = "Il colore degli schermi del Pip-Boy (oggetti, statistiche, dati): Amber (predefinito) o un altro; i cursori qui sotto lo impostano su qualsiasi colore."
"Accepted." = "Accettata."
"Opening the terminal..." = "Apertura del terminale..."
"Not accepted" = "Rifiutata"
"Tries restored." = "Tentativi rinnovati."
"Dud removed." = "Esca rimossa."
"Error" = "Errore"
"{n} of {len} right" = "{n} su {len} giuste"
"ON" = "SÌ"
"OFF" = "NO"
