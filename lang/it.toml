# NVForever's own words in Italiano (#1948). Written for NVForever, not copied from the
# game (LEGAL.md). Choice names (Off, Auto, Last enemy, Amber …) are
# translated, and the notes name them as they are shown. How to add or fix a line:
# README.md beside this file.

name = "Italiano"

[words]
# [design, #2200; engine/nvf-play/src/pause.rs] NVForever's device selection.
"Automatic Input Switching" = "Cambio automatico del dispositivo"
"On: a controller button, stick or trigger selects Controller; a key or mouse click selects Keyboard and Mouse (mouse motion does not). Off: choose Input Device yourself." = "Attivo: un pulsante, una levetta o un grilletto sceglie Controller; un tasto o un clic, Tastiera e mouse (muovere il mouse no). Disattivo: scegli tu il dispositivo."
"Dialogue voice" = "Voci nei dialoghi"
"On: lines are spoken. Off: they are silent from the next line on, and still last as long as their sound." = "Attivo: le battute vengono pronunciate. Disattivo: dalla battuta successiva sono mute, ma durano quanto il loro suono."
"Gameplay" = "Gioco"
"Turn to each other in dialogue" = "Voltarsi l'uno verso l'altro nel dialogo"
"On: at the start of a conversation the actor turns to the player and the view turns to the actor." = "Attivo: all'inizio di una conversazione il personaggio si volta verso il giocatore e la visuale verso il personaggio."
"Bring the view back when choices appear" = "Riportare la visuale quando compaiono le scelte"
"On: when choices appear the view returns to the speaker (with the close-up off). Needs \"Turn to each other in dialogue\"." = "Attivo: quando compaiono le risposte la visuale torna a chi parla (con il primo piano disattivo). Richiede «Voltarsi l'uno verso l'altro nel dialogo»."
"Close in on the speaker in dialogue" = "Avvicinarsi a chi parla nel dialogo"
"On: in a conversation the view closes in on the speaker, the background out of focus; the mouse moves only the cursor. Off: you can look around." = "Attivo: in conversazione la visuale si avvicina a chi parla, con lo sfondo sfocato; il mouse muove solo il cursore. Disattivo: puoi guardarti intorno."
"Goodbye hint" = "Suggerimento «Goodbye»"
"On: \"[Tab] Goodbye\" stands at the left of the dialogue box while a Goodbye choice is offered. Off: hidden; Tab still says goodbye." = "Attivo: «[Tab] Goodbye» compare a sinistra della finestra di dialogo finché è offerta una scelta Goodbye. Disattivo: nascosto; Tab saluta comunque."
"Aim assist" = "Assistenza alla mira"
"Controller only. On: the right stick turns slower over a nearby hostile, and aiming down the sights pulls the view onto one near the crosshair." = "Solo controller. Attivo: la levetta destra ruota più lentamente su un nemico vicino, e mirare con il mirino porta la visuale su uno vicino al mirino."
"Controller" = "Controller"
"Aim slowdown" = "Rallentamento della mira"
"How much slower the right stick turns while the crosshair is on a nearby hostile (0: not at all)." = "Quanto più lentamente ruota la levetta destra mentre il mirino è su un nemico vicino (0: per niente)."
"Aim lock-on" = "Aggancio della mira"
"How hard aiming down the sights turns the view onto a hostile near the crosshair (0: not at all). Push the right stick away to break it." = "Con quanta forza mirare con il mirino porta la visuale su un nemico vicino al mirino (0: per niente). Spostate la levetta destra per liberarvi."
"Use Pip-Boy" = "Indossare il Pip-Boy"
"On: the Pip-Boy is worn and the menus come up on the arm. Off: it is taken off and the menus show full screen, as always without a Pip-Boy." = "Attivo: il Pip-Boy è indossato e i menu compaiono sul braccio. Disattivo: viene tolto e i menu sono a schermo intero, come sempre senza Pip-Boy."
"Kill camera" = "Telecamera dell'uccisione"
"When a VATS shot kills its last mark, a camera shows the kill. Last enemy: only when no other enemy still fights you. Every kill: always. Off: never." = "Quando un colpo VATS uccide il suo ultimo bersaglio, una telecamera mostra l'uccisione. Ultimo nemico: solo se nessun altro vi combatte. Ogni uccisione: sempre. Disattivato: mai."
"V.A.T.S. style" = "Stile del V.A.T.S."
"What the V.A.T.S. key starts. Classic: the world stops and you pick body parts to hit. Mark and Fire: time runs very slowly while you mark targets." = "Che cosa avvia il tasto V.A.T.S. Classico: il mondo si ferma e scegli le parti del corpo da colpire. Segna e spara: il tempo scorre molto lentamente mentre segni i bersagli."
"V.A.T.S. time slowdown" = "Rallentamento del tempo nel V.A.T.S."
"How far the world slows while you choose targets in Classic: 100% stops it, 50% runs at half speed. Enemies attack at anything less than a stop." = "Quanto rallenta il mondo mentre scegli i bersagli in Classico: 100% lo ferma, 50% va a metà velocità. Con meno di un arresto i nemici attaccano."
"Slower while reloading" = "Più lenti durante la ricarica"
"On: you and the NPCs move at 75% of your speed while a reload runs. Off: reloading does not slow anyone, as in the original." = "Attivo: voi e gli NPC vi muovete al 75% della vostra velocità mentre è in corso una ricarica. Disattivo: ricaricare non rallenta nessuno, come nell'originale."
"Difficulty" = "Difficoltà"
"How hard the fights are: from Very Easy (your hits do double damage, you take half) to Very Hard (half and double); Normal as they are." = "Quanto sono duri gli scontri: da Molto facile (i tuoi colpi fanno danno doppio, ne subisci la metà) a Molto difficile (metà e doppio); Normale così come sono."
"Dynamic crosshair" = "Mirino dinamico"
"On: with a gun or thrown weapon drawn the crosshair opens with how wide your shots spread now. Off: the arrows stay together." = "Attivo: con un'arma da fuoco o da lancio in pugno il mirino si apre con la dispersione attuale dei colpi. Disattivo: le frecce restano unite."
"Crosshair style" = "Stile del mirino"
"With Dynamic crosshair on. Cross: four bars that part with the spread. Arrows: the plain crosshair's two arrows part instead." = "Con il mirino dinamico attivo. Croce: quattro trattini che si aprono con la dispersione. Frecce: si aprono invece le due frecce del mirino semplice."
"Detached third-person camera" = "Telecamera libera in terza persona"
"On: in third person with your weapon away the mouse turns the camera around you and you run whichever way you push. Off: the camera stays behind you." = "Attivo: in terza persona con l'arma riposta il mouse ruota la telecamera intorno a voi e correte nella direzione in cui spingete. Disattivo: la telecamera resta alle vostre spalle."
"Language" = "Lingua"
"The language of NVForever's own words (menus, messages). The game's own text is the install's." = "La lingua dei testi propri di NVForever (menu, messaggi). Il testo del gioco stesso è quello dell'installazione."
"Interface" = "Interfaccia"
"Reverb" = "Riverbero"
"World sounds echo as the place you are in does (a cave, a hall, a small room). Off: they do not." = "I suoni del mondo riecheggiano come il luogo in cui vi trovate (una grotta, un salone, una stanzetta). Disattivo: non riecheggiano."
"Voice reverb" = "Riverbero delle voci"
"What people say around you echoes in the place you are in, as Reverb does for world sounds. Conversations stay dry." = "Ciò che dicono le persone intorno a voi riecheggia nel luogo in cui vi trovate, come fa Riverbero per i suoni del mondo. Le conversazioni restano asciutte."
"Sound" = "Audio"
"Master" = "Volume generale"
"How loud all sound is: each volume below is a part of this one." = "Quanto è forte tutto l'audio: ogni volume qui sotto ne è una parte."
"Music" = "Musica"
"The music of the place you are in and the main menu's theme." = "La musica del luogo in cui vi trovate e il tema del menu principale."
"Footstep" = "Passi"
"Footsteps, jumps and landings, yours and everyone's." = "Passi, salti e atterraggi, vostri e di tutti."
"Voice" = "Voci"
"Spoken lines: conversations and what people say around you." = "Le battute parlate: conversazioni e ciò che dicono le persone intorno a voi."
"Effects" = "Effetti"
"Every other sound: weapons, impacts, menus, doors and the sounds of places." = "Tutti gli altri suoni: armi, impatti, menu, porte e i suoni dei luoghi."
"Radio" = "Radio"
"Radio stations, from the Pip-Boy and from radios in the world." = "Le stazioni radio, dal Pip-Boy e dalle radio nel mondo."
"Freeze the picture in dialogue and menus" = "Fermare l'immagine in dialoghi e menu"
"On: animations, wind, water and sky stand still in conversations, the inventory and other menus, as in the original. Off: only game logic waits." = "Attivo: in conversazioni, nell'inventario e negli altri menu animazioni, vento, acqua e cielo restano fermi, come nell'originale. Disattivo: attende solo la logica di gioco."
"Search" = "Cerca"
"Changed" = "Modificati"
"Audio" = "Audio"
"Tweaks" = "Ritocchi"
"Game" = "Generale"
"Dialogue" = "Dialogo"
"Camera" = "Telecamera"
"Screen" = "Risoluzione"
"Performance" = "Prestazioni"
"Picture" = "Immagine"
"Distance" = "Distanza"
"Quality" = "Qualità"
"Previous heading" = "Sezione precedente"
"Next heading" = "Sezione successiva"
"Keyboard search" = "Ricerca da tastiera"
"No settings here." = "Nessuna impostazione qui."
"No results." = "Nessun risultato."
"No changed settings." = "Nessuna impostazione modificata."
"Stands for: {rows}." = "Sta per: {rows}."
"Stands for: {rows} and {n} more." = "Sta per: {rows} e altri {n}."
"Button style" = "Stile dei pulsanti"
"The names and pictures of the controller's buttons in prompts and hints. Auto: a PlayStation's when the controller says it is one, else an Xbox's." = "I nomi e le immagini dei pulsanti del controller nei suggerimenti e negli aiuti. Auto: quelli PlayStation quando il controller dichiara di esserlo, altrimenti quelli Xbox."
"Light and noise gauges while sneaking" = "Indicatori di luce e rumore in furtività"
"On: two bars under the sneak word show how lit you are and how much noise you make, as detection counts them. Not in the original." = "Attivo: due barre sotto la scritta della furtività mostrano quanto siete illuminati e quanto rumore fate, come li conta il rilevamento. Non presente nell'originale."
"Saving" = "Salvataggio"
"Autosave after travel" = "Salvataggio automatico dopo uno spostamento"
"On: the game saves to the autosave slot after each loading screen (doors, coc, a script moving you); fast travel has its own row." = "Attivo: il gioco salva nello slot automatico dopo ogni schermata di caricamento (porte, coc, uno script che vi sposta); il viaggio rapido ha la sua riga."
"Save on fast travel" = "Salvare al viaggio rapido"
"On: the game saves to the autosave slot when a fast travel arrives." = "Attivo: il gioco salva nello slot automatico all'arrivo di un viaggio rapido."
"Save on wait" = "Salvare dopo l'attesa"
"On: the game saves to the autosave slot when a wait ends with at least one hour passed." = "Attivo: il gioco salva nello slot automatico quando un'attesa di almeno un'ora finisce."
"Save on sleep" = "Salvare dopo il sonno"
"On: the game saves to the autosave slot when the player wakes from a sleep of at least one hour." = "Attivo: il gioco salva nello slot automatico quando il giocatore si sveglia da un sonno di almeno un'ora."
"Save when a script asks" = "Salvare quando uno script lo chiede"
"On: a script's Autosave saves to the autosave slot (quest milestones), SystemSave to the system slot, ForceSave as a new save." = "Attivo: Autosave in uno script salva nello slot automatico (tappe delle missioni), SystemSave nello slot di sistema, ForceSave come nuovo salvataggio."
"Hardcore mode" = "Modalità hardcore"
"On: you need water, food and sleep, stimpaks heal over time, ammo has weight, crippled limbs need a doctor's bag or a doctor. Off: none of that." = "Attivo: servono acqua, cibo e sonno, gli stimpak curano nel tempo, le munizioni pesano, gli arti storpiati richiedono una borsa del medico o un medico. Disattivo: niente di tutto ciò."
"HUD red" = "HUD rosso"
"HUD green" = "HUD verde"
"HUD blue" = "HUD blu"
"Pip-Boy red" = "Pip-Boy rosso"
"Pip-Boy green" = "Pip-Boy verde"
"Pip-Boy blue" = "Pip-Boy blu"
"One part of the colour above, 0 to 255; drag the meter or use Left and Right." = "Una componente del colore sopra, da 0 a 255; trascinate l'indicatore o usate Sinistra e Destra."
"On: the music of the place you are in plays. Off: it is silent and goes on unheard." = "Attivo: suona la musica del luogo in cui vi trovate. Disattivo: è muta e prosegue senza essere udita."
"UI scale" = "Scala dell'interfaccia"
"The size of the HUD and the menus, as a part of the original's. Above 100% only the HUD grows. Takes effect at the next start." = "La dimensione di HUD e menu, come parte di quella dell'originale. Oltre il 100% cresce solo l'HUD. Ha effetto al prossimo avvio."
"This terminal requires a password." = "Questo terminale richiede una password."
"You need a Science skill of {needed} to hack this terminal." = "Per hackerare questo terminale serve un'abilità Scienza di {needed}."
"Lip sync" = "Sincronia labiale"
"On: a speaker's face moves with the line. Off: a face that is moving eases back to rest." = "Attivo: il volto di chi parla si muove con la battuta. Disattivo: un volto in movimento torna dolcemente a riposo."
"Head tracking" = "Movimento della testa"
"On: actors turn their heads to the player and to others near them. Off: heads ease back to their animation." = "Attivo: i personaggi girano la testa verso il giocatore e verso gli altri vicini. Disattivo: le teste tornano dolcemente alla loro animazione."
"Feet follow the ground" = "Piedi aderenti al suolo"
"On: on slopes and steps actors bend their knees and set each foot on the ground under it. Off: the legs play the animation as it is." = "Attivo: su pendii e gradini i personaggi piegano le ginocchia e poggiano ogni piede sul terreno sotto di esso. Disattivo: le gambe eseguono l'animazione così com'è."
"Sky follows the game clock" = "Cielo che segue l'orologio di gioco"
"On: the sky shows the game's time of day as it passes. Off: the sky keeps its hour while the game's clock runs on ([ and ] still set it)." = "Attivo: il cielo mostra l'ora del giorno del gioco mentre passa. Disattivo: il cielo tiene la sua ora mentre l'orologio di gioco va avanti ([ e ] la regolano ancora)."
"Resolution" = "Risoluzione"
"The window's size, or in full screen the monitor's (its own size: borderless). A new one goes back after 20 seconds unless you keep it." = "La dimensione della finestra o, a schermo intero, del monitor (la sua dimensione propria: senza bordi). Una nuova risoluzione viene annullata dopo 20 secondi se non la confermate."
"Full screen" = "Schermo intero"
"On: the game fills its monitor without a frame, at the full screen resolution above. Off: a window of the window resolution." = "Attivo: il gioco riempie il suo monitor senza cornice, alla risoluzione a schermo intero qui sopra. Disattivo: una finestra alla risoluzione della finestra."
"Monitor" = "Monitor"
"The display the game opens on in full screen (the first display until you pick one)." = "Lo schermo su cui il gioco si apre a schermo intero (il primo, finché non ne scegliete uno)."
"Body in first person" = "Corpo in prima persona"
"On: in first person you see your own body and legs when you look down. Off: only the arms and the weapon are drawn, as in the original." = "Attivo: in prima persona, guardando in basso, vedete il vostro corpo e le gambe. Disattivo: si disegnano solo braccia e arma, come nell'originale."
"Weapon sway" = "Oscillazione dell'arma"
"On: in first person the arms and weapon lag behind a turn and bob as you walk and run. Off: they stay still in the view." = "Attivo: in prima persona braccia e arma seguono in ritardo le rotazioni e ondeggiano camminando e correndo. Disattivo: restano ferme nella visuale."
"Head bob" = "Oscillazione della testa"
"On: in first person the view dips with each step as you walk and run. Off: it stays level." = "Attivo: in prima persona la visuale si abbassa a ogni passo camminando e correndo. Disattivo: resta in piano."
"Lower weapon near walls" = "Abbassare l'arma vicino ai muri"
"On: in first person a drawn weapon lowers at a wall or a friend and comes back up when you aim or fire. Off: it stays up, as in the original." = "Attivo: in prima persona un'arma estratta si abbassa davanti a un muro o a un amico e torna su quando mirate o sparate. Disattivo: resta alzata, come nell'originale."
"True iron sights" = "Mire metalliche vere"
"On: aiming a gun lines its sights up with your eye and hides the crosshair. Off: the gun is held low with the crosshair, as in the original." = "Attivo: mirare con un'arma allinea le sue mire all'occhio e nasconde il mirino. Disattivo: l'arma è tenuta bassa con il mirino, come nell'originale."
"3D scopes (test)" = "Ottiche 3D (prova)"
"On: a scoped gun stays on screen and shows the zoomed view in its lens. Off: the full-screen scope picture, as in the original." = "Attivo: un'arma con ottica resta sullo schermo e mostra la vista ingrandita nella lente. Disattivo: l'immagine dell'ottica a schermo intero, come nell'originale."
"Sun shadows" = "Ombre del sole"
"The sun's shadows: Off, Performance (cheaper outdoors; moving shadows update at half the frame rate) or Quality. The original casts none from the world." = "Le ombre del sole: Disattivato, Prestazioni (più economico all'aperto; le ombre in movimento si aggiornano a metà frequenza) o Qualità. L'originale non ne proietta dal mondo."
"Grass" = "Erba"
"On: grass grows on the landscape; the cells around you get theirs over the next frames. Off: it is hidden and none grows on new cells." = "Attivo: sul paesaggio cresce l'erba; le celle intorno a voi ricevono la loro nei fotogrammi successivi. Disattivo: è nascosta e non cresce sulle nuove celle."
"Distant terrain and objects" = "Terreno e oggetti lontani"
"On: distant land, buildings and trees are drawn beyond the loaded cells (outdoors). Off: the world ends at the loaded cells." = "Attivo: terra, edifici e alberi lontani sono disegnati oltre le celle caricate (all'aperto). Disattivo: il mondo finisce alle celle caricate."
"Colour grade" = "Correzione del colore"
"On: the picture is graded by the worldspace's, the weather's and the cell's image space. Off: the picture as lit, for comparisons." = "Attivo: l'immagine è corretta secondo lo spazio immagine dello spazio mondo, del meteo e della cella. Disattivo: l'immagine così come è illuminata, per i confronti."
"Text overlay" = "Testo in sovrimpressione"
"On: the position, loading counts and key help are written over the picture. Off by default in the game." = "Attivo: la posizione, i contatori di caricamento e l'aiuto dei tasti sono scritti sopra l'immagine. Disattivo per impostazione predefinita nel gioco."
"Shot markers" = "Indicatori dei colpi"
"On: a cross is drawn at each impact and a line from the muzzle along each hitscan shot." = "Attivo: una croce è disegnata a ogni impatto e una linea dalla volata lungo ogni colpo istantaneo."
"God mode" = "Modalità dio"
"On: the player takes no damage from hits and cannot be killed by them." = "Attivo: il giocatore non subisce danni dai colpi e non può esserne ucciso."
"Draw the navmesh" = "Mostrare la navmesh"
"On: the navmesh near the camera and the walking NPCs' paths are drawn." = "Attivo: si disegnano la navmesh vicino alla telecamera e i percorsi degli NPC che camminano."
"Frame rate counter" = "Contatore dei fotogrammi"
"On: a panel of performance readings at the top right; the Counter rows below choose what it shows. Not in the original." = "Attivo: un pannello di letture delle prestazioni in alto a destra; le righe Counter qui sotto scelgono cosa mostra. Non presente nell'originale."
"Display sync" = "Sincronizzazione dello schermo"
"Vertical sync: frames wait for the display (no tearing). Variable refresh: for a G-Sync or FreeSync screen. Off: frames show at once (may tear)." = "Sincronia verticale: i fotogrammi attendono lo schermo (niente strappi). Aggiornamento variabile: per schermi G-Sync o FreeSync. Disattivato: subito (possibili strappi)."
"Upscaler" = "Upscaler"
"Upscaling mode" = "Modalità upscaling"
"FSR 3.1 or NVIDIA DLSS rebuilds the world at display resolution, at the mode below. DLSS needs an NVIDIA RTX card and its files in the dlss folder." = "FSR 3.1 o NVIDIA DLSS ricostruisce il mondo alla risoluzione dello schermo, nella modalità sotto. DLSS richiede una scheda NVIDIA RTX e i suoi file nella cartella dlss."
"The share of the screen the world is drawn at; the upscaler rebuilds the rest. Native AA: full size. Quality to Ultra Performance: ever faster." = "La quota dello schermo a cui viene disegnato il mondo; l'upscaler ricostruisce il resto. AA nativo: dimensione piena. Da Qualità a Prestazioni ultra: sempre più veloce."
"DLSS model" = "Modello DLSS"
"Which DLSS model rebuilds the picture (NVIDIA calls them presets). Default, recommended: NVIDIA picks per mode. Only while DLSS draws." = "Quale modello DLSS ricostruisce l'immagine (NVIDIA li chiama preset). Predefinito, consigliato: NVIDIA sceglie in base alla modalità. Solo mentre disegna DLSS."
"Default" = "Predefinito"
"DLSS only" = "Solo con DLSS"
"World" = "Mondo"
"Display" = "Schermo"
"Debug" = "Debug"
"Graphics" = "Grafica"
"Field of view" = "Campo visivo"
"The game's field of view in degrees across a 4:3 picture (75 as the original's default); wider screens see more at the sides." = "Il campo visivo del gioco in gradi su un'immagine 4:3 (75 come il valore predefinito dell'originale); gli schermi più larghi vedono di più ai lati."
"Viewmodel field of view" = "Campo visivo dell'arma"
"The angle the first-person arms and weapon are drawn with, in degrees (55 as the original's default): lower draws them bigger and closer." = "L'angolo con cui braccia e arma vengono disegnate in prima persona, in gradi (55 come l'originale): più basso le disegna più grandi e vicine."
"Frame rate limit" = "Limite dei fotogrammi"
"At most this many frames a second (Off: no limit of its own). A lower limit keeps the computer cooler and quieter." = "Al massimo questi fotogrammi al secondo (Disattivato: nessun limite proprio). Un limite più basso tiene il computer più fresco e silenzioso."
"Object distance" = "Distanza degli oggetti"
"How far from you objects of the loaded cells (buildings, rocks, furniture, clutter) are drawn. Lower draws fewer and runs faster." = "Fin dove intorno a voi sono disegnati gli oggetti delle celle caricate (edifici, rocce, mobili, cianfrusaglie). Meno ne disegna meno e va più veloce."
"Actor distance" = "Distanza dei personaggi"
"How far from you people and creatures are drawn, as a part of the farthest the loaded cells reach." = "Fin dove intorno a voi sono disegnate persone e creature, come parte della portata massima delle celle caricate."
"Item distance" = "Distanza degli oggetti a terra"
"How far from you items lying in the world are drawn, as a part of the farthest the loaded cells reach." = "Fin dove intorno a voi sono disegnati gli oggetti posati nel mondo, come parte della portata massima delle celle caricate."
"Shadow distance" = "Distanza delle ombre"
"How far from you the sun casts shadows (with Sun shadows on), as a part of the farthest shadow distance." = "Fin dove intorno a voi il sole proietta ombre (con Ombre del sole attive), come parte della distanza massima delle ombre."
"Grass distance" = "Distanza dell'erba"
"How far from you grass is drawn, as a part of the farthest grass distance and its fade range." = "Fin dove intorno a voi è disegnata l'erba, come parte della distanza massima dell'erba e della sua zona di dissolvenza."
"Anti-aliasing" = "Antialiasing"
"How edges are smoothed: multisampling 2x, 4x or 8x (dearer at each step) or FXAA, SMAA or TAA afterwards. Reads Off while an upscaler is on." = "Come si smussano i bordi: multicampionamento 2x, 4x o 8x (più caro a ogni passo) o FXAA, SMAA o TAA dopo. Indica Disattivato mentre un upscaler è attivo."
"Shadow filtering" = "Filtraggio delle ombre"
"How the sun's shadow edges are softened: Fast (harder, cheapest), Smooth (as vanilla) or Temporal (grainy unless Anti-aliasing is TAA)." = "Come si ammorbidiscono i bordi delle ombre del sole: Veloce (più netti, il più economico), Morbido (come l'originale) o Temporale (granuloso se l'antialiasing non è TAA)."
"Ambient occlusion" = "Occlusione ambientale"
"On: creases, corners and the ground under things are darkened by how enclosed they are (screen-space, from the depth). Not in the original." = "Attivo: pieghe, angoli e il terreno sotto le cose si scuriscono quanto più sono racchiusi (nello spazio dello schermo, dalla profondità). Non presente nell'originale."
"Longer sun shadows" = "Ombre del sole più lunghe"
"On: the sun's shadows reach half as far again as the shadow distance. Costs a little frame rate." = "Attivo: le ombre del sole arrivano una volta e mezza più lontano della distanza delle ombre. Costa qualche fotogramma."
"Bloom" = "Bloom"
"On: light brighter than a sunlit white wall (the sun, lamps, windows) glows into its surroundings, on top of the game's own image space." = "Attivo: la luce più intensa di un muro bianco al sole (il sole, le lampade, le finestre) si irradia intorno, sopra lo spazio immagine proprio del gioco."
"Light glow (HDR)" = "Bagliore della luce (HDR)"
"On: neon, lamps, beams and fire glow softly, as the original's HDR glow does, as much as the place's image space asks. Bloom adds to it." = "Attivo: neon, lampade, raggi e fuoco si irradiano dolcemente, come il bagliore HDR dell'originale, quanto chiede lo spazio immagine del luogo. Il bloom vi si aggiunge."
"Eye adaptation" = "Adattamento dell'occhio"
"On: dark views brighten after a moment, as the eye gets used to the dark, by the place's image space. Needs the light glow." = "Attivo: le viste buie si schiariscono dopo un momento, come l'occhio si abitua al buio, secondo lo spazio immagine del luogo. Richiede il bagliore della luce."
"Neon glow" = "Bagliore del neon"
"On: where the image space asks for a strong glow (the Strip at night) neon burns with a wide halo, as in the original. Needs the light glow." = "Attivo: dove lo spazio immagine chiede un bagliore forte (lo Strip di notte) il neon arde con un ampio alone, come nell'originale. Richiede il bagliore della luce."
"Sharpening" = "Nitidezza"
"On: the final picture is sharpened where it has little contrast (contrast-adaptive sharpening)." = "Attivo: l'immagine finale è resa più nitida dove ha poco contrasto (nitidezza adattiva al contrasto)."
"Anisotropic filtering 16x" = "Filtro anisotropico 16x"
"On: textures seen at a slant stay sharp further (16x instead of 8x). For textures loaded from now on (the cells loaded next)." = "Attivo: le texture viste di sbieco restano nitide più lontano (16x invece di 8x). Per le texture caricate da ora (le prossime celle caricate)."
"Sun shafts" = "Raggi di sole"
"On: sunlight streams past what stands in front of the sun, stronger the hazier the weather's fog. Not in the original." = "Attivo: la luce del sole filtra oltre ciò che sta davanti al sole, tanto più quanto più è densa la foschia del meteo. Non presente nell'originale."
"Screen-space water reflections" = "Riflessi dell'acqua su schermo"
"On: water the mirrored reflection does not reach (another height, interiors) reflects what is on the screen instead of only the sky." = "Attivo: l'acqua che il riflesso a specchio non raggiunge (altra altezza, interni) riflette ciò che è sullo schermo invece del solo cielo."
"Mirrored water reflections" = "Riflessi a specchio dell'acqua"
"On: water mirrors the world above it, as in the original, drawing the scene a second time. Off: it reflects the sky." = "Attivo: l'acqua riflette il mondo sopra di essa, come nell'originale, disegnando la scena una seconda volta. Disattivo: riflette il cielo."
"Quality preset" = "Preimpostazione di qualità"
"Sets the rows the original's quality presets cover to the game folder's low.ini to VeryHigh.ini. Custom: those rows match none of them." = "Imposta le righe delle preimpostazioni di qualità dell'originale sui valori da low.ini a VeryHigh.ini della cartella del gioco. Personalizzato: righe diverse da tutte."
"Enhanced effects" = "Effetti migliorati"
"Sets every effect of the enhanced look at once. On: all of them. Off: none, the original's picture. Custom: some on, some off. Each keeps its own row." = "Imposta insieme tutti gli effetti dell'aspetto migliorato. Attivato: tutti. Disattivato: nessuno, l'immagine originale. Personalizzato: alcuni sì, altri no. Ognuno ha la sua riga."
