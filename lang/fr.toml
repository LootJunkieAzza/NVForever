"Previous heading" = "Section précédente"
"Next heading" = "Section suivante"
"Keyboard search" = "Recherche au clavier"
"No settings here." = "Aucun réglage ici."
"No results." = "Aucun résultat."
"No changed settings." = "Aucun réglage modifié."
"Stands for: {rows}." = "Représente : {rows}."
"Button style" = "Style des boutons"
"Which names and pictures the controller's buttons go by in prompts, menu hints and the Controls tab. Auto: a PlayStation controller's (Cross, Circle, Square, Triangle, L1, R2, Select…) when the controller in use says it is one, else an Xbox controller's. Xbox or PlayStation: always those. The INI keeps the Xbox names either way." = "Sous quels noms et images les boutons de la manette apparaissent dans les invites, les menus et l'onglet Commandes. Auto : ceux d'une manette PlayStation (Cross, Circle, Square, Triangle, L1, R2, Select…) quand la manette utilisée se déclare telle, sinon ceux d'une manette Xbox. Xbox ou PlayStation : toujours ceux-là. Le fichier INI garde les noms Xbox dans tous les cas."
"Light and noise gauges while sneaking" = "Jauges de lumière et de bruit en discrétion"
"On: two bars under the sneak word show how lit you are and how much noise you make, as detection counts them. Not in the original." = "Activé : deux barres sous le mot de discrétion montrent à quel point vous êtes éclairé et combien de bruit vous faites, tels que la détection les compte. Absent de l'original."
"Saving" = "Sauvegarde"
"Autosave after travel" = "Sauvegarde auto après un trajet"
"On: the game saves to the autosave slot after each loading screen (doors, coc, a script moving the player); fast travel has its own switch." = "Activé : le jeu sauvegarde dans l'emplacement automatique après chaque écran de chargement (portes, coc, un script qui déplace le joueur) ; le voyage rapide a son propre réglage."
"Save on fast travel" = "Sauvegarder au voyage rapide"
"On: the game saves to the autosave slot when a fast travel arrives." = "Activé : le jeu sauvegarde dans l'emplacement automatique à l'arrivée d'un voyage rapide."
"Save on wait" = "Sauvegarder après une attente"
"On: the game saves to the autosave slot when a wait ends with at least one hour passed." = "Activé : le jeu sauvegarde dans l'emplacement automatique quand une attente d'au moins une heure se termine."
"Save on sleep" = "Sauvegarder après le sommeil"
"On: the game saves to the autosave slot when the player wakes from a sleep of at least one hour." = "Activé : le jeu sauvegarde dans l'emplacement automatique quand le joueur se réveille d'un sommeil d'au moins une heure."
"Save when a script asks" = "Sauvegarder à la demande d'un script"
"On: a script's Autosave saves to the autosave slot, as quests do at their milestones; SystemSave to the system slot; ForceSave as a new save." = "Activé : Autosave dans un script sauvegarde dans l'emplacement automatique, comme le font les quêtes à leurs étapes clés ; SystemSave dans l'emplacement système ; ForceSave comme nouvelle sauvegarde."
"Hardcore mode" = "Mode hardcore"
"On: you need water, food and sleep, stimpaks heal over time, ammunition has weight and crippled limbs heal only with a doctor's bag or a doctor. Off: none of that; turning it off clears your thirst, hunger and tiredness and their effects. (console: SetHardcore 1/0)" = "Activé : il vous faut eau, nourriture et sommeil, les stimpaks soignent progressivement, les munitions ont un poids et les membres estropiés ne guérissent qu'avec une trousse de médecin ou chez un médecin. Désactivé : rien de tout cela ; le désactiver efface soif, faim et fatigue et leurs effets. (console : SetHardcore 1/0)"
"HUD red" = "HUD rouge"
"HUD green" = "HUD vert"
"HUD blue" = "HUD bleu"
"Pip-Boy red" = "Pip-Boy rouge"
"Pip-Boy green" = "Pip-Boy vert"
"Pip-Boy blue" = "Pip-Boy bleu"
"One part of the colour above, 0 to 255; drag the meter or use Left and Right." = "Une composante de la couleur ci-dessus, de 0 à 255 ; faites glisser la jauge ou utilisez Gauche et Droite."
"On: the music of the place you are in plays. Off: it is silent and goes on unheard. (--no-music)" = "Activé : la musique du lieu où vous êtes joue. Désactivé : elle est muette et continue sans être entendue. (--no-music)"
"UI scale" = "Taille de l'interface"
"The size of the HUD and the menus, as a part of the original's (100%): smaller leaves more of the picture free, each HUD piece kept at its edge of the screen and each menu in the middle. Above 100% only the HUD grows: the menus stay at the original's size, so they keep on the screen. Takes effect at the next start (loading a save starts the game again). Not in the original." = "La taille du HUD et des menus, en part de celle de l'original (100 %) : plus petit libère davantage l'image, chaque élément du HUD restant à son bord d'écran et chaque menu au centre. Au-delà de 100 %, seul le HUD grandit : les menus gardent la taille de l'original pour tenir à l'écran. Prend effet au prochain lancement (charger une sauvegarde relance le jeu). Absent de l'original."
"This terminal requires a password." = "Ce terminal exige un mot de passe."
"You need a Science skill of {needed} to hack this terminal." = "Il vous faut une compétence Science de {needed} pour pirater ce terminal."
"Lip sync" = "Synchronisation labiale"
"On: a speaker's face moves with the line. Off: a face that is moving eases back to rest. (--no-lip)" = "Activé : le visage de l'orateur bouge avec la réplique. Désactivé : un visage en mouvement revient doucement au repos. (--no-lip)"
"Head tracking" = "Suivi de la tête"
"On: actors turn their heads to the player and to others near them. Off: heads ease back to their animation. (--no-head-tracking)" = "Activé : les personnages tournent la tête vers le joueur et vers les autres à proximité. Désactivé : les têtes reviennent doucement à leur animation. (--no-head-tracking)"
"Feet follow the ground" = "Pieds collés au sol"
"On: on slopes and steps actors bend their knees and set each foot on the ground under it. Off: the legs play the animation as it is. (--no-foot-ik)" = "Activé : sur les pentes et les marches, les personnages plient les genoux et posent chaque pied sur le sol en dessous. Désactivé : les jambes jouent l'animation telle quelle. (--no-foot-ik)"
"Sky follows the game clock" = "Ciel réglé sur l'horloge du jeu"
"On: the sky shows the game's time of day as it passes. Off: the sky keeps its hour while the game's clock runs on ([ and ] still set it). (--still-sky)" = "Activé : le ciel montre l'heure du jeu à mesure qu'elle passe. Désactivé : le ciel garde son heure pendant que l'horloge du jeu tourne ([ et ] la règlent toujours). (--still-sky)"
"Resolution" = "Résolution"
"The window's size, or in full screen the monitor's (its own size: borderless). A new one goes back after 20 seconds unless you keep it. (--size)" = "La taille de la fenêtre, ou en plein écran celle du moniteur (sa propre taille : sans bordure). Une nouvelle résolution est annulée au bout de 20 secondes si vous ne la gardez pas. (--size)"
"Full screen" = "Plein écran"
"On: the game fills the monitor it is on, without a frame, at the resolution chosen above for full screen. Off: a window of the resolution chosen for a window. (--window borderless)" = "Activé : le jeu remplit son moniteur, sans cadre, à la résolution choisie ci-dessus pour le plein écran. Désactivé : une fenêtre à la résolution choisie pour une fenêtre. (--window borderless)"
"Monitor" = "Moniteur"
"The display the game opens on in full screen (the first display until you pick one). (--window borderless)" = "L'écran où le jeu s'ouvre en plein écran (le premier écran tant que vous n'en choisissez pas un). (--window borderless)"
"Body in first person" = "Corps à la première personne"
"On: in first person you see your own body and legs when you look down. Off: only the arms and the weapon are drawn, as in the original. (--first-person-body)" = "Activé : à la première personne, vous voyez votre corps et vos jambes en baissant les yeux. Désactivé : seuls les bras et l'arme sont dessinés, comme dans l'original. (--first-person-body)"
"Weapon sway" = "Balancement de l'arme"
"On: in first person the arms and weapon lag behind a turn and bob as you walk and run. Off: they stay still in the view. (--no-weapon-sway)" = "Activé : à la première personne, les bras et l'arme suivent les rotations avec retard et oscillent quand vous marchez et courez. Désactivé : ils restent immobiles. (--no-weapon-sway)"
"Head bob" = "Balancement de la tête"
"On: in first person the view dips with each step as you walk and run. Off: it stays level. (--no-head-bob)" = "Activé : à la première personne, la vue s'abaisse à chaque pas quand vous marchez et courez. Désactivé : elle reste droite. (--no-head-bob)"
"Lower weapon near walls" = "Baisser l'arme près des murs"
"On: in first person a drawn weapon is lowered when a wall or a friendly person is right in front of you, and comes straight back up when you aim or fire. Off: it stays up and can poke through them, as in the original. Lower Weapon (H) lowers or raises it by hand either way. (--no-weapon-lower)" = "Activé : à la première personne, une arme dégainée s'abaisse quand un mur ou une personne amicale est juste devant vous, et remonte aussitôt quand vous visez ou tirez. Désactivé : elle reste levée et peut les traverser, comme dans l'original. Baisser l'arme (H) l'abaisse ou la lève à la main dans tous les cas. (--no-weapon-lower)"
"True iron sights" = "Vraies mires"
"On: aiming a gun lines its sights up with your eye. The crosshair is hidden while you aim down them. Off: the gun is held low with the crosshair, as in the original. Guns with no sights to look down (laser rifle, minigun) aim as the original either way. (--no-true-iron-sights)" = "Activé : viser avec une arme aligne ses organes de visée sur votre regard. Le réticule est masqué pendant la visée. Désactivé : l'arme est tenue basse avec le réticule, comme dans l'original. Les armes sans organes de visée (fusil laser, minigun) visent comme dans l'original dans tous les cas. (--no-true-iron-sights)"
"3D scopes (test)" = "Lunettes 3D (test)"
"On: aiming a scoped gun keeps the gun on screen and shows the zoomed view in its scope's lens, with the reticle; the view around it zooms only a little. Off: the full-screen scope picture with its black border, as in the original. Guns whose scope lens is not known yet keep the picture. (--scope-3d)" = "Activé : viser avec une arme à lunette garde l'arme à l'écran et montre la vue grossie dans la lentille, avec le réticule ; la vue autour ne zoome qu'un peu. Désactivé : l'image de lunette en plein écran avec sa bordure noire, comme dans l'original. Les armes dont la lentille n'est pas encore connue gardent l'image. (--scope-3d)"
"Sun shadows" = "Ombres du soleil"
"The sun's shadows, out to --shadow-distance: Off; Performance (the shadow maps drawn every other frame in two cascades, trees casting shadows only near you, the first-person arms taking the world's shadows: saves frame time outdoors, shadows of moving things update at half the frame rate); or Quality (three cascades, the farther ones drawn less often). The original casts none from the world. Quality by default in the game. (--sun-shadows, --sun-shadows=performance, --no-sun-shadows)" = "Les ombres du soleil, jusqu'à --shadow-distance : Désactivé ; Performance (les cartes d'ombres dessinées une image sur deux en deux cascades, les arbres ne projettent d'ombres que près de vous, les bras en vue subjective reçoivent les ombres du monde : économise du temps d'image en extérieur, les ombres des objets en mouvement se mettent à jour à la moitié de la fréquence d'images) ; ou Qualité (trois cascades, les plus lointaines dessinées moins souvent). L'original n'en projette aucune du monde. Qualité par défaut dans le jeu. (--sun-shadows, --sun-shadows=performance, --no-sun-shadows)"
"Grass" = "Herbe"
"On: grass grows on the landscape; the cells around you get theirs over the next frames. Off: it is hidden and none grows on new cells. (--no-grass)" = "Activé : l'herbe pousse sur le paysage ; les cellules autour de vous reçoivent la leur au fil des images suivantes. Désactivé : elle est masquée et n'apparaît pas sur les nouvelles cellules. (--no-grass)"
"Distant terrain and objects" = "Terrain et objets lointains"
"On: distant land, buildings and trees are drawn beyond the loaded cells (outdoors). Off: the world ends at the loaded cells. (--no-lod)" = "Activé : la terre, les bâtiments et les arbres lointains sont dessinés au-delà des cellules chargées (à l'extérieur). Désactivé : le monde s'arrête aux cellules chargées. (--no-lod)"
"Colour grade" = "Étalonnage des couleurs"
"On: the picture is graded by the worldspace's, the weather's and the cell's image space. Off: the picture as lit, for comparisons. (--no-grade)" = "Activé : l'image est étalonnée selon l'espace image de l'espace monde, de la météo et de la cellule. Désactivé : l'image telle qu'éclairée, pour comparer. (--no-grade)"
"Text overlay" = "Texte en surimpression"
"On: the position, loading counts and key help are written over the picture. Off by default in the game. (--overlay, --no-overlay)" = "Activé : la position, les compteurs de chargement et l'aide des touches s'affichent sur l'image. Désactivé par défaut dans le jeu. (--overlay, --no-overlay)"
"Shot markers" = "Marqueurs de tir"
"On: a cross is drawn at each impact and a line from the muzzle along each hitscan shot. (--hit-markers)" = "Activé : une croix est dessinée à chaque impact et une ligne part du canon le long de chaque tir instantané. (--hit-markers)"
"God mode" = "Mode dieu"
"On: the player takes no damage from hits and cannot be killed by them. (--god)" = "Activé : le joueur ne subit aucun dégât des coups et ne peut pas être tué par eux. (--god)"
"Draw the navmesh" = "Afficher le navmesh"
"On: the navmesh near the camera and the walking NPCs' paths are drawn. (--show-navmesh)" = "Activé : le navmesh près de la caméra et les chemins des PNJ en marche sont dessinés. (--show-navmesh)"
"Frame rate counter" = "Compteur d'images"
"On: a small panel of performance readings at the top right of the screen, the Counter rows below choosing what it shows; with only its frame rate row on it is a frame rate counter. Not in the original. (--fps)" = "Activé : un petit panneau de mesures de performances en haut à droite de l'écran ; les lignes Counter en dessous choisissent ce qu'il affiche. Avec seulement sa ligne d'images par seconde activée, c'est un compteur d'images. Absent de l'original. (--fps)"
"Display sync" = "Synchronisation de l'affichage"
"Vertical sync: each frame waits for the display's refresh (no tearing). Variable refresh: for a G-Sync or FreeSync screen, vertical sync with the frame rate held a few frames under the screen's refresh rate, so frames are shown as soon as they are drawn without tearing. Off: frames are shown as soon as they are drawn (may tear)." = "Synchro verticale : chaque image attend le rafraîchissement de l'écran (sans déchirement). Rafraîchissement variable : pour un écran G-Sync ou FreeSync, synchronisation verticale avec la fréquence d'images maintenue quelques images sous celle de l'écran, pour que les images s'affichent dès qu'elles sont dessinées, sans déchirement. Désactivé : les images s'affichent dès qu'elles sont dessinées (déchirement possible)."
"Upscaler" = "Mise à l'échelle"
"Upscaling mode" = "Mode de mise à l'échelle"
"Reconstruct the world at display resolution with FSR 3.1 or NVIDIA DLSS, at the Upscaling mode below. Disables MSAA, FXAA, SMAA and TAA while active. Menus stay sharp. Requires Vulkan; unsupported devices keep native rendering. DLSS needs an NVIDIA RTX graphics card and NVIDIA's DLSS files in the dlss folder beside nvforever.exe (NVForever ships none). With the files there when the game starts, every choice takes effect at once; files put there later are found at the next start, so DLSS chosen until then reads DLSS (restart) (loading a save starts the game again). Sharpening controls FSR sharpening. Frame generation needs FSR. (--upscaler, --upscaler-quality, --fsr)" = "Reconstruit le monde à la résolution de l'écran avec FSR 3.1 ou NVIDIA DLSS, dans le mode de mise à l'échelle en dessous. Désactive MSAA, FXAA, SMAA et TAA tant qu'elle est active. Les menus restent nets. Nécessite Vulkan ; les appareils non pris en charge gardent le rendu natif. DLSS nécessite une carte graphique NVIDIA RTX et les fichiers DLSS de NVIDIA dans le dossier dlss à côté de nvforever.exe (NVForever n'en fournit aucun). Avec les fichiers présents au lancement du jeu, chaque choix prend effet aussitôt ; des fichiers ajoutés ensuite sont trouvés au prochain démarrage, et d'ici là DLSS choisi s'affiche « DLSS (redémarrer) » (charger une sauvegarde redémarre le jeu). « Netteté » règle la netteté de FSR. La génération d'images nécessite FSR. (--upscaler, --upscaler-quality, --fsr)"
"The share of the screen's width and height the world is drawn at; the upscaler rebuilds the rest. Native AA: full resolution, anti-aliasing only (DLSS: DLAA). Quality: the sharpest upscaled look, for 1440p and 4K. Balanced: more speed with little visible loss. Performance: the highest frame rate, for 4K or heavy scenes. Ultra Performance: for very high resolutions only. Takes effect at once. With Upscaler Off there is nothing to set. (--upscaler-quality, --upscaler, --fsr)" = "La part de la largeur et de la hauteur de l'écran à laquelle le monde est dessiné ; la mise à l'échelle reconstruit le reste. AA natif : pleine résolution, anticrénelage seulement (DLSS : DLAA). Qualité : le rendu mis à l'échelle le plus net, pour le 1440p et la 4K. Équilibré : plus de vitesse pour une perte à peine visible. Performances : la fréquence d'images la plus haute, pour la 4K ou les scènes lourdes. Ultra performance : seulement pour les très hautes résolutions. Prend effet aussitôt. Mise à l'échelle désactivée, il n'y a rien à régler. (--upscaler-quality, --upscaler, --fsr)"
"DLSS model" = "Modèle DLSS"
"Which of NVIDIA's DLSS models rebuilds the picture (NVIDIA calls them presets). Default (recommended): NVIDIA picks per mode: K for Native AA, Quality and Balanced, M for Performance, L for Ultra Performance. K: transformer model, best detail, costs more. L: sharper and steadier, less ghosting, costs the most. M: close to L in looks, closer to K in speed. J: like K with a little less ghosting and more flicker. Takes effect at once. Only while DLSS draws. (--dlss-model)" = "Lequel des modèles DLSS de NVIDIA reconstruit l'image (NVIDIA les appelle presets). Par défaut (recommandé) : NVIDIA choisit selon le mode : K pour AA natif, Qualité et Équilibré, M pour Performances, L pour Ultra performance. K : modèle transformer, le plus de détails, coûte plus. L : plus net et plus stable, moins de traînées, le plus coûteux. M : proche de L à l'œil, plus proche de K en vitesse. J : comme K, avec un peu moins de traînées et plus de scintillement. Prend effet tout de suite. Seulement quand DLSS dessine. (--dlss-model)"
"Default" = "Par défaut"
"DLSS only" = "DLSS seulement"
"World" = "Monde"
"Display" = "Affichage"
"Debug" = "Débogage"
"Graphics" = "Graphismes"
"Field of view" = "Champ de vision"
"The game's field of view in degrees across a 4:3 picture (75 as the original's default); wider screens see more at the sides. (--fov)" = "Le champ de vision du jeu en degrés sur une image 4:3 (75 comme la valeur par défaut de l'original) ; les écrans plus larges voient davantage sur les côtés. (--fov)"
"Frame rate limit" = "Limite d'images"
"At most this many frames a second (Off: as many as the computer draws, or the display's refresh with vertical sync; with variable refresh the lower of this and its own limit). A lower limit keeps the computer cooler and quieter." = "Au plus autant d'images par seconde (Désactivé : autant que l'ordinateur en dessine, ou le rafraîchissement de l'écran avec la synchronisation verticale ; en fréquence variable, la plus basse de cette limite et de la sienne). Une limite plus basse garde l'ordinateur plus frais et plus silencieux."
"Object distance" = "Distance des objets"
"How far from you objects (buildings, rocks, furniture, clutter) of the loaded cells are drawn, as a part of the farthest those cells reach. Lower draws fewer and runs faster." = "Jusqu'où autour de vous les objets des cellules chargées (bâtiments, rochers, meubles, bric-à-brac) sont dessinés, en part de la plus grande portée de ces cellules. Moins en dessine moins et tourne plus vite."
"Actor distance" = "Distance des personnages"
"How far from you people and creatures are drawn, as a part of the farthest the loaded cells reach." = "Jusqu'où autour de vous les gens et les créatures sont dessinés, en part de la plus grande portée des cellules chargées."
"Item distance" = "Distance des objets au sol"
"How far from you items lying in the world (weapons, ammo, aid, notes, caps, clutter you can take) are drawn, as a part of the farthest the loaded cells reach." = "Jusqu'où autour de vous les objets posés dans le monde (armes, munitions, soins, notes, capsules, bric-à-brac à ramasser) sont dessinés, en part de la plus grande portée des cellules chargées."
"Shadow distance" = "Distance des ombres"
"How far from you the sun casts shadows (with Sun shadows on), as a part of --shadow-distance." = "Jusqu'où autour de vous le soleil projette des ombres (ombres du soleil activées), en part de --shadow-distance."
"Grass distance" = "Distance de l'herbe"
"How far from you grass is drawn, as a part of --grass-distance and its fade range." = "Jusqu'où autour de vous l'herbe est dessinée, en part de --grass-distance et de sa zone de fondu."
"Anti-aliasing" = "Anticrénelage"
"How edges are smoothed: multisampling Off, 2x, 4x or 8x (--msaa; the cut-out edges of plants too), or the picture smoothed afterwards: FXAA (cheapest, softest), SMAA (sharper, a little dearer) or TAA (over the frames; plants too, soft while moving; --graphics-only fxaa, smaa or taa). Multisampling is the dearest, more at each step: at 1920x1080 on an RTX 4070, 2x added about 0.8 ms a frame, 4x about 1.3 ms and 8x about 2.3 ms (Goodsprings and Novac at noon); FXAA, SMAA and TAA cost less than 4x. Where the processor sets the pace (the Strip at night) the choice costs next to nothing. While an upscaler (FSR 3.1 or DLSS) is on it does the anti-aliasing itself, so this row reads Off (upscaling active); your choice comes back when Upscaler is Off." = "Comment les bords sont lissés : multiéchantillonnage Désactivé, 2x, 4x ou 8x (--msaa ; les bords découpés des plantes aussi), ou l'image lissée ensuite : FXAA (le moins cher, le plus doux), SMAA (plus net, un peu plus cher) ou TAA (sur plusieurs images ; plantes aussi, doux en mouvement ; --graphics-only fxaa, smaa ou taa). Le multiéchantillonnage est le plus cher, davantage à chaque palier : en 1920x1080 sur une RTX 4070, 2x ajoutait environ 0,8 ms par image, 4x environ 1,3 ms et 8x environ 2,3 ms (Goodsprings et Novac à midi) ; FXAA, SMAA et TAA coûtent moins que 4x. Là où le processeur impose le rythme (le Strip la nuit), le choix ne coûte presque rien. Tant que la mise à l'échelle (FSR 3.1 ou DLSS) est active, elle lisse elle-même, donc cette ligne indique « Désactivé (mise à l'échelle active) » ; votre choix revient quand la mise à l'échelle est désactivée."
"Shadow filtering" = "Filtrage des ombres"
"How the edges of the sun's shadows are softened: Fast (hardware 2x2, harder edges, cheapest), Smooth (as vanilla) or Temporal (soft but grainy unless Anti-aliasing is TAA)." = "Comment les bords des ombres du soleil sont adoucis : Rapide (matériel 2x2, bords plus durs, le moins cher), Doux (comme l'original) ou Temporel (doux mais granuleux sauf si l'anticrénelage est TAA)."
"Ambient occlusion" = "Occlusion ambiante"
"On: creases, corners and the ground under things are darkened by how enclosed they are (screen-space, from the depth). Not in the original. (--graphics)" = "Activé : plis, coins et sol sous les objets sont assombris selon leur enfermement (en espace écran, d'après la profondeur). Absent de l'original. (--graphics)"
"Longer sun shadows" = "Ombres du soleil plus longues"
"On: the sun's shadows reach half as far again as --shadow-distance. Costs a little frame rate. (--graphics)" = "Activé : les ombres du soleil portent moitié plus loin que --shadow-distance. Coûte un peu d'images par seconde. (--graphics)"
"Bloom" = "Bloom"
"On: light brighter than a sunlit white wall (the sun, lamps, windows) glows into its surroundings, on top of the game's own image space. (--graphics)" = "Activé : une lumière plus vive qu'un mur blanc au soleil (le soleil, les lampes, les fenêtres) rayonne sur ses alentours, par-dessus l'espace image propre au jeu. (--graphics)"
"Light glow (HDR)" = "Halo lumineux (HDR)"
"On: neon, lamps, glowing beams and fire glow softly into their surroundings, as the original's HDR glow does; how much follows the place's image space (the Strip's neon at night most). Bloom, when on, adds to it. (--graphics-only no-glow turns it off)" = "Activé : néons, lampes, rayons lumineux et feux rayonnent doucement sur leurs alentours, comme le halo HDR de l'original ; l'intensité suit l'espace image du lieu (surtout les néons du Strip la nuit). Le bloom, s'il est activé, s'y ajoute. (--graphics-only no-glow le désactive)"
"Eye adaptation" = "Adaptation à l'obscurité"
"On: dark views brighten after a moment, as the eye gets used to the dark, by the place's image space. Needs the light glow. (--graphics-only no-eye-adaptation turns it off)" = "Activé : les vues sombres s'éclaircissent au bout d'un moment, comme le regard s'habitue au noir, selon l'espace image du lieu. Nécessite le halo lumineux. (--graphics-only no-eye-adaptation la désactive)"
"Neon glow" = "Halo des néons"
"On: where the place's image space asks for a strong glow (the Strip at night) neon tubes and signs burn with a wide halo, as in the original. Needs the light glow. (--graphics-only no-neon-glow turns it off)" = "Activé : là où l'espace image du lieu demande un fort halo (le Strip la nuit), tubes et enseignes au néon brillent d'un large halo, comme dans l'original. Nécessite le halo lumineux. (--graphics-only no-neon-glow le désactive)"
"Sharpening" = "Netteté"
"On: the final picture is sharpened where it has little contrast (contrast-adaptive sharpening). (--graphics)" = "Activé : l'image finale est accentuée là où elle a peu de contraste (netteté adaptative au contraste). (--graphics)"
"Anisotropic filtering 16x" = "Filtrage anisotrope 16x"
"On: textures seen at a slant stay sharp further (16x instead of 8x). For textures loaded from now on (the cells loaded next). (--graphics)" = "Activé : les textures vues de biais restent nettes plus loin (16x au lieu de 8x). Pour les textures chargées à partir de maintenant (les prochaines cellules chargées). (--graphics)"
"Sun shafts" = "Rayons de soleil"
"On: sunlight streams past what stands in front of the sun, stronger the hazier the weather's fog. Not in the original. (--graphics)" = "Activé : la lumière du soleil passe autour de ce qui se trouve devant le soleil, d'autant plus fort que le brouillard de la météo est dense. Absent de l'original. (--graphics)"
"Screen-space water reflections" = "Reflets de l'eau en espace écran"
"On: water the mirrored reflection does not reach (another height, interiors) reflects what is on the screen instead of only the sky. (--graphics)" = "Activé : l'eau que le reflet miroir n'atteint pas (autre hauteur, intérieurs) reflète ce qui est à l'écran au lieu du seul ciel. (--graphics)"
"Mirrored water reflections" = "Reflets miroir de l'eau"
"On: water mirrors the world above it, as in the original; the scene is drawn a second time for it while water is on screen. Off: water reflects the sky, and what is on the screen with screen-space reflections. (--graphics-only no-water-mirror turns it off)" = "Activé : l'eau reflète le monde au-dessus d'elle, comme dans l'original ; la scène est dessinée une seconde fois pour cela tant que de l'eau est à l'écran. Désactivé : l'eau reflète le ciel, et ce qui est à l'écran avec les reflets en espace écran. (--graphics-only no-water-mirror les désactive)"
"Quality preset" = "Préréglage de qualité"
"Sets the rows the original's quality presets cover to the values of the game folder's low.ini, medium.ini, high.ini or VeryHigh.ini: Sun shadows, Shadow filtering, Light glow, Mirrored water reflections and the object, actor, item, shadow and grass distances. Custom: those rows match none of them. A preset whose file is missing is not offered. The enhanced effects, anti-aliasing and FSR keep their own rows." = "Règle les lignes que couvrent les préréglages de qualité de l'original sur les valeurs de low.ini, medium.ini, high.ini ou VeryHigh.ini du dossier du jeu : ombres du soleil, filtrage des ombres, halo lumineux, reflets miroir de l'eau et les distances des objets, des personnages, des articles, des ombres et de l'herbe. Personnalisé : ces lignes ne correspondent à aucun d'eux. Un préréglage dont le fichier manque n'est pas proposé. Les effets améliorés, l'anticrénelage et FSR gardent leurs propres lignes."
"Enhanced effects" = "Effets améliorés"
"On: every effect of the enhanced look (ambient occlusion, longer sun shadows, bloom, sharpening, anisotropic filtering 16x, sun shafts, screen-space water reflections). Off: none of them, the original's picture. Custom: some on, some off. Each effect keeps its own row and its own saved state; this row only sets them all at once." = "Activé : tous les effets de l'apparence améliorée (occlusion ambiante, ombres du soleil plus longues, bloom, netteté, filtrage anisotrope 16x, rayons de soleil, reflets de l'eau en espace écran). Désactivé : aucun d'eux, l'image de l'original. Personnalisé : certains activés, d'autres non. Chaque effet garde sa propre ligne et son propre état enregistré ; cette ligne les règle seulement tous à la fois."
