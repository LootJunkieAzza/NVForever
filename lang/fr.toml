# NVForever's own words in Français (#1948). Written for NVForever, not copied from the
# game (LEGAL.md). Choice names (Off, Auto, Last enemy, Amber …) are
# translated, and the notes name them as they are shown. How to add or fix a line:
# README.md beside this file.

name = "Français"

[words]
"Dialogue voice" = "Voix des dialogues"
"On: lines are spoken. Off: they are silent from the next line on, and still last as long as their sound. (--no-voice)" = "Activé : les répliques sont dites. Désactivé : dès la réplique suivante, elles sont muettes et durent toujours autant que leur son. (--no-voice)"
"Gameplay" = "Jeu"
"Turn to each other in dialogue" = "Se tourner l'un vers l'autre en dialogue"
"On: at the start of a conversation the actor turns to the player and the view turns to the actor. (--no-dialogue-look)" = "Activé : au début d'une conversation, le personnage se tourne vers le joueur et la vue vers le personnage. (--no-dialogue-look)"
"Bring the view back when choices appear" = "Ramener la vue quand les choix apparaissent"
"On: after you look away, return to the speaker when choices appear. Needs dialogue turning. (--dialogue-recentre)" = "Oui : après avoir regardé ailleurs, revenir au personnage quand les réponses apparaissent. Nécessite la rotation de dialogue. (--dialogue-recentre)"
"Close in on the speaker in dialogue" = "Rapprocher la vue de l'orateur"
"On: in a conversation the view narrows onto the speaker, with what is behind them out of focus; from third person the camera comes to the eyes. Off: the view stays as it is. (--no-dialogue-zoom)" = "Activé : en conversation, la vue se resserre sur l'orateur, l'arrière-plan devient flou ; à la troisième personne, la caméra vient à hauteur des yeux. Désactivé : la vue reste telle quelle. (--no-dialogue-zoom)"
"Goodbye hint" = "Indication « Goodbye »"
"On: while a conversation offers a Goodbye choice, \"[Tab] Goodbye\" stands at the left of the dialogue box. Off: the words are hidden; Tab still says goodbye." = "Activé : tant qu'une conversation propose un choix Goodbye, « [Tab] Goodbye » s'affiche à gauche de la fenêtre de dialogue. Désactivé : l'indication est masquée ; Tab prend toujours congé."
"Aim assist" = "Aide à la visée"
"Controller only, never the mouse. On: the right stick turns slower while the crosshair is on a nearby hostile, and aiming down the sights turns the view onto one near the crosshair for a moment. Off: neither." = "Manette uniquement, jamais la souris. Activé : le stick droit tourne plus lentement tant que le réticule est sur un ennemi proche, et viser avec le viseur oriente un instant la vue vers un ennemi proche du réticule. Désactivé : ni l'un ni l'autre."
"Controller" = "Manette"
"Aim slowdown" = "Ralentissement de visée"
"How much slower the right stick turns while the crosshair is on a nearby hostile (0: not at all)." = "De combien le stick droit tourne plus lentement tant que le réticule est sur un ennemi proche (0 : pas du tout)."
"Aim lock-on" = "Verrouillage de visée"
"How hard aiming down the sights turns the view onto a nearby hostile near the crosshair (0: not at all). Push the right stick away to break it." = "Avec quelle force viser avec le viseur oriente la vue vers un ennemi proche du réticule (0 : pas du tout). Écartez le stick droit pour vous en libérer."
"Use Pip-Boy" = "Porter le Pip-Boy"
"On: the Pip-Boy and its glove are worn and the menus come up on the arm. Off: both are taken off and the menus show full screen. Without a Pip-Boy worn the menus are always full screen." = "Activé : le Pip-Boy et son gant sont portés, les menus s'affichent sur le bras. Désactivé : les deux sont retirés, les menus en plein écran. Sans Pip-Boy porté, les menus sont toujours en plein écran."
"Kill camera" = "Caméra de mise à mort"
"When a VATS shot kills its last mark, a cinematic camera can show the kill. Last enemy: only when no other enemy is still fighting you. Every kill: whoever is left. Off: never." = "Quand un tir VATS tue sa dernière cible, une caméra cinématique peut montrer la mise à mort. Dernier ennemi : seulement quand plus aucun ennemi ne vous combat. Chaque mise à mort : à chaque mise à mort. Désactivé : jamais."
"V.A.T.S. style" = "Style du V.A.T.S."
"What the V.A.T.S. key starts. Classic: the world stops, you pick a target and its body parts from their chances to hit, then the queued attacks play. Mark and Fire: time runs very slowly while you mark targets under the crosshair." = "Ce que lance la touche V.A.T.S. Classique : le monde s'arrête, vous choisissez une cible et ses parties du corps d'après leurs chances de toucher, puis les attaques en file sont jouées. Marquer et tirer : le temps s'écoule très lentement pendant que vous marquez les cibles sous le réticule."
"V.A.T.S. time slowdown" = "Ralentissement du temps en V.A.T.S."
"How far the world slows while you choose targets in the Classic style: 100% stops it, 50% runs it at half speed. Enemies keep attacking at anything less than a full stop." = "À quel point le monde ralentit pendant que vous choisissez des cibles dans le style Classique : 100% l'arrête, 50% le fait tourner à mi-vitesse. En dessous d'un arrêt complet, les ennemis continuent d'attaquer."
"Slower while reloading" = "Plus lent en rechargeant"
"On: you and the NPCs move at 75% of your speed while a reload runs. Off: reloading does not slow anyone, as in the original." = "Activé : vous et les PNJ avancez à 75 % de votre vitesse pendant un rechargement. Désactivé : recharger ne ralentit personne, comme dans l'original."
"Difficulty" = "Difficulté"
"How hard the fights are: from Very Easy (the player's hits do double damage and the player takes half) to Very Hard (half and double); Normal as they are. (console: SetGameDifficulty 0-4)" = "La dureté des combats : de Très facile (les coups du joueur font le double de dégâts et il en reçoit la moitié) à Très difficile (moitié et double) ; Normal tels quels. (console : SetGameDifficulty 0-4)"
"Dynamic crosshair" = "Réticule dynamique"
"On: with a gun or thrown weapon drawn the crosshair opens to show how wide your shots spread now (wider running, after shots, with crippled arms; narrower aimed or crouched); Crosshair style below picks how it looks. Off: the arrows stay together whatever is drawn." = "Activé : avec une arme à feu ou de jet en main, le réticule s'ouvre pour montrer la dispersion actuelle de vos tirs (plus large en courant, après des tirs, bras estropiés ; plus serrée en visant ou accroupi) ; « Style du réticule » ci-dessous choisit son aspect. Désactivé : les flèches restent groupées, quoi que vous teniez."
"Crosshair style" = "Style du réticule"
"With Dynamic crosshair on and a gun or thrown weapon drawn. Cross: four bars that part with the spread. Arrows: the plain crosshair's two arrows part instead." = "Avec le réticule dynamique activé et une arme à feu ou de jet en main. Croix : quatre traits qui s'écartent avec la dispersion. Flèches : ce sont les deux flèches du réticule simple qui s'écartent."
"Detached third-person camera" = "Caméra libre à la troisième personne"
"On: in third person with your weapon away the mouse turns the camera around you, not your character, and your character turns to run whichever way you push, as the camera sees it. Drawing your weapon turns you to where the camera looks. Off: the camera stays behind you, as in the original." = "Activé : à la troisième personne, arme rangée, la souris fait tourner la caméra autour de vous, pas votre personnage, et celui-ci court dans la direction où vous poussez, vue depuis la caméra. Dégainer vous tourne vers là où regarde la caméra. Désactivé : la caméra reste derrière vous, comme dans l'original."
"Language" = "Langue"
"The language of NVForever's own words (menus, messages). The game's own text is the install's." = "La langue des textes propres à NVForever (menus, messages). Le texte du jeu lui-même est celui de l'installation."
"Interface" = "Interface"
"Reverb" = "Réverbération"
"World sounds echo as the place you are in does (a cave, a hall, a small room). Off: --no-reverb." = "Les sons du monde résonnent comme le lieu où vous êtes (une grotte, une salle, une petite pièce). Désactivé : --no-reverb."
"Voice reverb" = "Réverbération des voix"
"What people say around you echoes in the place you are in, up to the end of each line, as Reverb does for world sounds. Conversations stay dry." = "Ce que disent les gens autour de vous résonne dans le lieu où vous êtes, jusqu'à la fin de chaque réplique, comme la réverbération le fait pour les sons du monde. Les conversations restent sèches."
"Sound" = "Son"
"Master" = "Volume général"
"How loud all sound is: each volume below is a part of this one." = "Le volume de tout le son : chaque volume ci-dessous en est une part."
"Music" = "Musique"
"The music of the place you are in and the main menu's theme." = "La musique du lieu où vous êtes et le thème du menu principal."
"Footstep" = "Pas"
"Footsteps, jumps and landings, yours and everyone's." = "Les pas, sauts et atterrissages, les vôtres et ceux de tous."
"Voice" = "Voix"
"Spoken lines: conversations and what people say around you." = "Les paroles : conversations et ce que disent les gens autour de vous."
"Effects" = "Effets"
"Every other sound: weapons, impacts, menus, doors and the sounds of places." = "Tous les autres sons : armes, impacts, menus, portes et sons des lieux."
"Radio" = "Radio"
"Radio stations, from the Pip-Boy and from radios in the world." = "Les stations de radio, du Pip-Boy et des postes dans le monde."
"Freeze the picture in dialogue and menus" = "Figer l'image en dialogue et dans les menus"
"On: while a conversation, the inventory, a container or a message box is open, animations, wind, water and sky stand still, as in the original. Off: only game logic waits and the world lives on. This menu always holds everything. (--menu-pause original|living)" = "Activé : tant qu'une conversation, l'inventaire, un conteneur ou une boîte de message est ouvert, animations, vent, eau et ciel s'immobilisent, comme dans l'original. Désactivé : seule la logique du jeu attend et le monde continue de vivre. Ce menu-ci fige toujours tout. (--menu-pause original|living)"
