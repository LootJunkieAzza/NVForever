# NVForever's own words in Français (#1948). Written for NVForever, not copied from the
# game (LEGAL.md). Choice names (Off, Auto, Last enemy, Amber …) are
# translated, and the notes name them as they are shown. How to add or fix a line:
# README.md beside this file.

name = "Français"

[words]
# [design, #2200; engine/nvf-play/src/pause.rs] NVForever's device selection.
"Automatic Input Switching" = "Changement automatique de périphérique"
"On: a controller button, stick or trigger selects Controller; a key or mouse click selects Keyboard and Mouse (mouse motion does not). Off: choose Input Device yourself." = "Activé : un bouton, stick ou gâchette choisit la manette ; une touche ou un clic, clavier et souris (bouger la souris, non). Désactivé : périphérique choisi à la main."
"Dialogue voice" = "Voix des dialogues"
"On: lines are spoken. Off: they are silent from the next line on, and still last as long as their sound." = "Activé : les répliques sont dites. Désactivé : dès la réplique suivante, elles sont muettes et durent toujours autant que leur son."
"Gameplay" = "Jeu"
"Turn to each other in dialogue" = "Se tourner l'un vers l'autre en dialogue"
"On: at the start of a conversation the actor turns to the player and the view turns to the actor." = "Activé : au début d'une conversation, le personnage se tourne vers le joueur et la vue vers le personnage."
"Bring the view back when choices appear" = "Ramener la vue quand les choix apparaissent"
"On: when choices appear the view returns to the speaker (with the close-up off). Needs \"Turn to each other in dialogue\"." = "Activé : quand les réponses apparaissent, la vue revient à l'orateur (gros plan désactivé). Nécessite « Se tourner l'un vers l'autre en dialogue »."
"Close in on the speaker in dialogue" = "Rapprocher la vue de l'orateur"
"On: in a conversation the view closes in on the speaker, the background out of focus; the mouse moves only the cursor. Off: you can look around." = "Activé : en conversation, la vue se rapproche de l'orateur, l'arrière-plan flou ; la souris ne déplace que le curseur. Désactivé : vous pouvez regarder autour de vous."
"Goodbye hint" = "Indication « Goodbye »"
"On: \"[Tab] Goodbye\" stands at the left of the dialogue box while a Goodbye choice is offered. Off: hidden; Tab still says goodbye." = "Activé : « [Tab] Goodbye » s'affiche à gauche de la fenêtre de dialogue tant qu'un choix Goodbye est proposé. Désactivé : masqué ; Tab prend toujours congé."
"Aim assist" = "Aide à la visée"
"Controller only. On: the right stick turns slower over a nearby hostile, and aiming down the sights pulls the view onto one near the crosshair." = "Manette uniquement. Activé : le stick droit tourne plus lentement sur un ennemi proche, et viser avec le viseur attire la vue vers un ennemi proche du réticule."
"Controller" = "Manette"
"Aim slowdown" = "Ralentissement de visée"
"How much slower the right stick turns while the crosshair is on a nearby hostile (0: not at all)." = "De combien le stick droit tourne plus lentement tant que le réticule est sur un ennemi proche (0 : pas du tout)."
"Aim lock-on" = "Verrouillage de visée"
"How hard aiming down the sights turns the view onto a hostile near the crosshair (0: not at all). Push the right stick away to break it." = "Avec quelle force viser avec le viseur oriente la vue vers un ennemi près du réticule (0 : pas du tout). Écartez le stick droit pour vous en libérer."
"Use Pip-Boy" = "Porter le Pip-Boy"
"On: the Pip-Boy is worn and the menus come up on the arm. Off: it is taken off and the menus show full screen, as always without a Pip-Boy." = "Activé : le Pip-Boy est porté, les menus s'affichent sur le bras. Désactivé : il est retiré, les menus en plein écran, comme toujours sans Pip-Boy."
"Kill camera" = "Caméra de mise à mort"
"When a VATS shot kills its last mark, a camera shows the kill. Last enemy: only when no other enemy still fights you. Every kill: always. Off: never." = "Quand un tir VATS tue sa dernière cible, une caméra montre la mise à mort. Dernier ennemi : si plus personne ne vous combat. Chaque mise à mort : toujours. Désactivé : jamais."
"V.A.T.S. style" = "Style du V.A.T.S."
"What the V.A.T.S. key starts. Classic: the world stops and you pick body parts to hit. Mark and Fire: time runs very slowly while you mark targets." = "Ce que lance la touche V.A.T.S. Classique : le monde s'arrête et vous choisissez les parties du corps visées. Marquer et tirer : le temps ralentit fortement pendant que vous marquez."
"V.A.T.S. time slowdown" = "Ralentissement du temps en V.A.T.S."
"How far the world slows while you choose targets in Classic: 100% stops it, 50% runs at half speed. Enemies attack at anything less than a stop." = "À quel point le monde ralentit pendant que vous choisissez des cibles en Classique : 100% l'arrête, 50% tourne à mi-vitesse. En dessous d'un arrêt, les ennemis attaquent."
"Slower while reloading" = "Plus lent en rechargeant"
"On: you and the NPCs move at 75% of your speed while a reload runs. Off: reloading does not slow anyone, as in the original." = "Activé : vous et les PNJ avancez à 75 % de votre vitesse pendant un rechargement. Désactivé : recharger ne ralentit personne, comme dans l'original."
"Difficulty" = "Difficulté"
"How hard the fights are: from Very Easy (your hits do double damage, you take half) to Very Hard (half and double); Normal as they are." = "La dureté des combats : de Très facile (vos coups font le double de dégâts, vous en recevez la moitié) à Très difficile (moitié et double) ; Normal tels quels."
"Dynamic crosshair" = "Réticule dynamique"
"On: with a gun or thrown weapon drawn the crosshair opens with how wide your shots spread now. Off: the arrows stay together." = "Activé : avec une arme à feu ou de jet en main, le réticule s'ouvre selon la dispersion actuelle de vos tirs. Désactivé : les flèches restent groupées."
"Crosshair style" = "Style du réticule"
"With Dynamic crosshair on. Cross: four bars that part with the spread. Arrows: the plain crosshair's two arrows part instead." = "Avec le réticule dynamique activé. Croix : quatre traits qui s'écartent avec la dispersion. Flèches : ce sont les deux flèches du réticule simple qui s'écartent."
"Detached third-person camera" = "Caméra libre à la troisième personne"
"On: in third person with your weapon away the mouse turns the camera around you and you run whichever way you push. Off: the camera stays behind you." = "Activé : à la troisième personne, arme rangée, la souris fait tourner la caméra autour de vous et vous courez dans la direction poussée. Désactivé : la caméra reste derrière vous."
"Language" = "Langue"
"The language of NVForever's own words (menus, messages). The game's own text is the install's." = "La langue des textes propres à NVForever (menus, messages). Le texte du jeu lui-même est celui de l'installation."
"Interface" = "Interface"
"Reverb" = "Réverbération"
"World sounds echo as the place you are in does (a cave, a hall, a small room). Off: they do not." = "Les sons du monde résonnent comme le lieu où vous êtes (une grotte, une salle, une petite pièce). Désactivé : ils ne résonnent pas."
"Voice reverb" = "Réverbération des voix"
"What people say around you echoes in the place you are in, as Reverb does for world sounds. Conversations stay dry." = "Ce que disent les gens autour de vous résonne dans le lieu où vous êtes, comme Réverbération le fait pour les sons du monde. Les conversations restent sèches."
"Sound" = "Son"
"Master" = "Volume général"
"How loud all sound is: each volume below is a part of this one." = "Le volume de tout le son : chaque volume ci-dessous en est une part."
"Music" = "Musique"
"The music of the place you are in and the main menu's theme." = "La musique du lieu où vous êtes et le thème du menu principal."
"Footstep" = "Pas"
"Footsteps, jumps and landings, yours and everyone's." = "Les pas, sauts et atterrissages, les vôtres et ceux de tous."
"Voice" = "Voix"
"Spoken lines: conversations and what people say around you." = "Les paroles : conversations et ce que disent les gens autour de vous."
"Effects" = "Effets"
"Every other sound: weapons, impacts, menus, doors and the sounds of places." = "Tous les autres sons : armes, impacts, menus, portes et sons des lieux."
"Radio" = "Radio"
"Radio stations, from the Pip-Boy and from radios in the world." = "Les stations de radio, du Pip-Boy et des postes dans le monde."
"Freeze the picture in dialogue and menus" = "Figer l'image en dialogue et dans les menus"
"On: animations, wind, water and sky stand still in conversations, the inventory and other menus, as in the original. Off: only game logic waits." = "Activé : en conversation, dans l'inventaire et les autres menus, animations, vent, eau et ciel s'immobilisent, comme dans l'original. Désactivé : seule la logique du jeu attend."
"Search" = "Rechercher"
"Changed" = "Modifiés"
"Audio" = "Audio"
"Tweaks" = "Ajustements"
"Game" = "Général"
"Dialogue" = "Dialogue"
"Camera" = "Caméra"
"Screen" = "Écran"
"Performance" = "Performances"
"Picture" = "Image"
"Distance" = "Distance"
"Quality" = "Qualité"
"Previous heading" = "Section précédente"
"Next heading" = "Section suivante"
"Keyboard search" = "Recherche au clavier"
"No settings here." = "Aucun réglage ici."
"No results." = "Aucun résultat."
"No changed settings." = "Aucun réglage modifié."
"Stands for: {rows}." = "Représente : {rows}."
"Stands for: {rows} and {n} more." = "Représente : {rows} et {n} autres."
"Button style" = "Style des boutons"
"The names and pictures of the controller's buttons in prompts and hints. Auto: a PlayStation's when the controller says it is one, else an Xbox's." = "Les noms et images des boutons de la manette dans les invites et les aides. Auto : ceux d'une PlayStation quand la manette se déclare telle, sinon ceux d'une Xbox."
"Light and noise gauges while sneaking" = "Jauges de lumière et de bruit en discrétion"
"On: two bars under the sneak word show how lit you are and how much noise you make, as detection counts them. Not in the original." = "Activé : deux barres sous le mot de discrétion montrent à quel point vous êtes éclairé et combien de bruit vous faites, tels que la détection les compte. Absent de l'original."
"Saving" = "Sauvegarde"
"Autosave after travel" = "Sauvegarde auto après un trajet"
"On: the game saves to the autosave slot after each loading screen (doors, coc, a script moving you); fast travel has its own row." = "Activé : le jeu sauvegarde dans l'emplacement automatique après chaque écran de chargement (portes, coc, un script qui vous déplace) ; le voyage rapide a sa propre ligne."
"Save on fast travel" = "Sauvegarder au voyage rapide"
"On: the game saves to the autosave slot when a fast travel arrives." = "Activé : le jeu sauvegarde dans l'emplacement automatique à l'arrivée d'un voyage rapide."
"Save on wait" = "Sauvegarder après une attente"
"On: the game saves to the autosave slot when a wait ends with at least one hour passed." = "Activé : le jeu sauvegarde dans l'emplacement automatique quand une attente d'au moins une heure se termine."
"Save on sleep" = "Sauvegarder après le sommeil"
"On: the game saves to the autosave slot when the player wakes from a sleep of at least one hour." = "Activé : le jeu sauvegarde dans l'emplacement automatique quand le joueur se réveille d'un sommeil d'au moins une heure."
"Save when a script asks" = "Sauvegarder à la demande d'un script"
"On: a script's Autosave saves to the autosave slot (quest milestones), SystemSave to the system slot, ForceSave as a new save." = "Activé : Autosave dans un script sauvegarde dans l'emplacement automatique (étapes des quêtes), SystemSave dans l'emplacement système, ForceSave comme nouvelle sauvegarde."
"Hardcore mode" = "Mode hardcore"
"On: you need water, food and sleep, stimpaks heal over time, ammo has weight, crippled limbs need a doctor's bag or a doctor. Off: none of that." = "Activé : il faut boire, manger et dormir, les stimpaks soignent avec le temps, les munitions pèsent, les membres estropiés exigent une trousse de médecin ou un médecin. Désactivé : rien de cela."
"HUD red" = "HUD rouge"
"HUD green" = "HUD vert"
"HUD blue" = "HUD bleu"
"Pip-Boy red" = "Pip-Boy rouge"
"Pip-Boy green" = "Pip-Boy vert"
"Pip-Boy blue" = "Pip-Boy bleu"
"One part of the colour above, 0 to 255; drag the meter or use Left and Right." = "Une composante de la couleur ci-dessus, de 0 à 255 ; faites glisser la jauge ou utilisez Gauche et Droite."
"On: the music of the place you are in plays. Off: it is silent and goes on unheard." = "Activé : la musique du lieu où vous êtes joue. Désactivé : elle est muette et continue sans être entendue."
"HUD scale" = "Taille du HUD"
"Size of the in-game HUD, independent of menu scale. Takes effect at the next start." = "Taille du HUD en jeu, indépendante de celle des menus. Prend effet au prochain démarrage."
"Menu scale" = "Taille des menus"
"Size of the main, pause and other menus, independent of HUD scale. Takes effect at the next start." = "Taille du menu principal, du menu de pause et des autres menus, indépendante du HUD. Prend effet au prochain démarrage."
"This terminal requires a password." = "Ce terminal exige un mot de passe."
"You need a Science skill of {needed} to hack this terminal." = "Il vous faut une compétence Science de {needed} pour pirater ce terminal."
"Lip sync" = "Synchronisation labiale"
"On: a speaker's face moves with the line. Off: a face that is moving eases back to rest." = "Activé : le visage de l'orateur bouge avec la réplique. Désactivé : un visage en mouvement revient doucement au repos."
"Head tracking" = "Suivi de la tête"
"On: actors turn their heads to the player and to others near them. Off: heads ease back to their animation." = "Activé : les personnages tournent la tête vers le joueur et vers les autres à proximité. Désactivé : les têtes reviennent doucement à leur animation."
"Feet follow the ground" = "Pieds collés au sol"
"On: on slopes and steps actors bend their knees and set each foot on the ground under it. Off: the legs play the animation as it is." = "Activé : sur les pentes et les marches, les personnages plient les genoux et posent chaque pied sur le sol en dessous. Désactivé : les jambes jouent l'animation telle quelle."
"Sky follows the game clock" = "Ciel réglé sur l'horloge du jeu"
"On: the sky shows the game's time of day as it passes. Off: the sky keeps its hour while the game's clock runs on ([ and ] still set it)." = "Activé : le ciel montre l'heure du jeu à mesure qu'elle passe. Désactivé : le ciel garde son heure pendant que l'horloge du jeu tourne ([ et ] la règlent toujours)."
"Resolution" = "Résolution"
"The window's size, or in full screen the monitor's (its own size: borderless). A new one goes back after 20 seconds unless you keep it." = "La taille de la fenêtre, ou en plein écran celle du moniteur (sa propre taille : sans bordure). Une nouvelle résolution est annulée au bout de 20 secondes si vous ne la gardez pas."
"Full screen" = "Plein écran"
"On: the game fills its monitor without a frame, at the full screen resolution above. Off: a window of the window resolution." = "Activé : le jeu remplit son moniteur sans cadre, à la résolution plein écran ci-dessus. Désactivé : une fenêtre à la résolution fenêtrée."
"Monitor" = "Moniteur"
"The display the game opens on in full screen (the first display until you pick one)." = "L'écran où le jeu s'ouvre en plein écran (le premier écran tant que vous n'en choisissez pas un)."
"Body in first person" = "Corps à la première personne"
"On: in first person you see your own body and legs when you look down. Off: only the arms and the weapon are drawn, as in the original." = "Activé : à la première personne, vous voyez votre corps et vos jambes en baissant les yeux. Désactivé : seuls les bras et l'arme sont dessinés, comme dans l'original."
"Weapon sway" = "Balancement de l'arme"
"On: in first person the arms and weapon lag behind a turn and bob as you walk and run. Off: they stay still in the view." = "Activé : à la première personne, les bras et l'arme suivent les rotations avec retard et oscillent quand vous marchez et courez. Désactivé : ils restent immobiles."
"Head bob" = "Balancement de la tête"
"On: in first person the view dips with each step as you walk and run. Off: it stays level." = "Activé : à la première personne, la vue s'abaisse à chaque pas quand vous marchez et courez. Désactivé : elle reste droite."
"Lower weapon near walls" = "Baisser l'arme près des murs"
"On: in first person a drawn weapon lowers at a wall or a friend and comes back up when you aim or fire. Off: it stays up, as in the original." = "Activé : à la première personne, une arme dégainée s'abaisse devant un mur ou un ami et remonte quand vous visez ou tirez. Désactivé : elle reste levée, comme dans l'original."
"True iron sights" = "Vraies mires"
"On: aiming a gun lines its sights up with your eye and hides the crosshair. Off: the gun is held low with the crosshair, as in the original." = "Activé : viser avec une arme aligne ses organes de visée sur votre regard et masque le réticule. Désactivé : l'arme est tenue basse avec le réticule, comme dans l'original."
"3D scopes (test)" = "Lunettes 3D (test)"
"On: a scoped gun stays on screen and shows the zoomed view in its lens. Off: the full-screen scope picture, as in the original." = "Activé : une arme à lunette reste à l'écran et montre la vue grossie dans sa lentille. Désactivé : l'image de lunette en plein écran, comme dans l'original."
"Sun shadows" = "Ombres du soleil"
"The sun's shadows: Off, Performance (cheaper outdoors; moving shadows update at half the frame rate) or Quality. The original casts none from the world." = "Les ombres du soleil : Désactivé, Performances (moins coûteux en extérieur ; ombres mobiles mises à jour à mi-fréquence) ou Qualité. L'original n'en projette aucune du monde."
"Grass" = "Herbe"
"On: grass grows on the landscape; the cells around you get theirs over the next frames. Off: it is hidden and none grows on new cells." = "Activé : l'herbe pousse sur le paysage ; les cellules autour de vous reçoivent la leur au fil des images suivantes. Désactivé : elle est masquée et n'apparaît pas sur les nouvelles cellules."
"Distant terrain and objects" = "Terrain et objets lointains"
"On: distant land, buildings and trees are drawn beyond the loaded cells (outdoors). Off: the world ends at the loaded cells." = "Activé : la terre, les bâtiments et les arbres lointains sont dessinés au-delà des cellules chargées (à l'extérieur). Désactivé : le monde s'arrête aux cellules chargées."
"Colour grade" = "Étalonnage des couleurs"
"On: the picture is graded by the worldspace's, the weather's and the cell's image space. Off: the picture as lit, for comparisons." = "Activé : l'image est étalonnée selon l'espace image de l'espace monde, de la météo et de la cellule. Désactivé : l'image telle qu'éclairée, pour comparer."
"Text overlay" = "Texte en surimpression"
"On: the position, loading counts and key help are written over the picture. Off by default in the game." = "Activé : la position, les compteurs de chargement et l'aide des touches s'affichent sur l'image. Désactivé par défaut dans le jeu."
"Shot markers" = "Marqueurs de tir"
"On: a cross is drawn at each impact and a line from the muzzle along each hitscan shot." = "Activé : une croix est dessinée à chaque impact et une ligne part du canon le long de chaque tir instantané."
"God mode" = "Mode dieu"
"On: the player takes no damage from hits and cannot be killed by them." = "Activé : le joueur ne subit aucun dégât des coups et ne peut pas être tué par eux."
"Draw the navmesh" = "Afficher le navmesh"
"On: the navmesh near the camera and the walking NPCs' paths are drawn." = "Activé : le navmesh près de la caméra et les chemins des PNJ en marche sont dessinés."
"Frame rate counter" = "Compteur d'images"
"On: a panel of performance readings at the top right; the Counter rows below choose what it shows. Not in the original." = "Activé : un panneau de mesures de performances en haut à droite ; les lignes Counter en dessous choisissent ce qu'il affiche. Absent de l'original."
"Display sync" = "Synchronisation de l'affichage"
"Vertical sync: frames wait for the display (no tearing). Variable refresh: for a G-Sync or FreeSync screen. Off: frames show at once (may tear)." = "Synchro verticale : les images attendent l'écran (sans déchirement). Rafraîchissement variable : écran G-Sync ou FreeSync. Désactivé : affichage immédiat (déchirement possible)."
"Upscaler" = "Mise à l'échelle"
"Upscaling mode" = "Mode de mise à l'échelle"
"FSR 3.1 or NVIDIA DLSS rebuilds the world at display resolution, at the mode below. DLSS needs an NVIDIA RTX card and its files in the dlss folder." = "FSR 3.1 ou NVIDIA DLSS reconstruit le monde à la résolution de l'écran, dans le mode en dessous. DLSS nécessite une carte NVIDIA RTX et ses fichiers dans le dossier dlss."
"The share of the screen the world is drawn at; the upscaler rebuilds the rest. Native AA: full size. Quality to Ultra Performance: ever faster." = "La part de l'écran à laquelle le monde est dessiné ; la mise à l'échelle reconstruit le reste. AA natif : pleine taille. De Qualité à Ultra performance : de plus en plus rapide."
"DLSS model" = "Modèle DLSS"
"Which DLSS model rebuilds the picture (NVIDIA calls them presets). Default, recommended: NVIDIA picks per mode. Only while DLSS draws." = "Quel modèle DLSS reconstruit l'image (NVIDIA les appelle presets). Par défaut, recommandé : NVIDIA choisit selon le mode. Seulement quand DLSS dessine."
"Default" = "Par défaut"
"DLSS only" = "DLSS seulement"
"World" = "Monde"
"Display" = "Affichage"
"Debug" = "Débogage"
"Graphics" = "Graphismes"
"Field of view" = "Champ de vision"
"The game's field of view in degrees across a 4:3 picture (75 as the original's default); wider screens see more at the sides." = "Le champ de vision du jeu en degrés sur une image 4:3 (75 comme la valeur par défaut de l'original) ; les écrans plus larges voient davantage sur les côtés."
"Frame rate limit" = "Limite d'images"
"At most this many frames a second (Off: no limit of its own). A lower limit keeps the computer cooler and quieter." = "Au plus autant d'images par seconde (Désactivé : pas de limite propre). Une limite plus basse garde l'ordinateur plus frais et plus silencieux."
"Object distance" = "Distance des objets"
"How far from you objects of the loaded cells (buildings, rocks, furniture, clutter) are drawn. Lower draws fewer and runs faster." = "Jusqu'où autour de vous les objets des cellules chargées (bâtiments, rochers, meubles, bric-à-brac) sont dessinés. Moins en dessine moins et tourne plus vite."
"Actor distance" = "Distance des personnages"
"How far from you people and creatures are drawn, as a part of the farthest the loaded cells reach." = "Jusqu'où autour de vous les gens et les créatures sont dessinés, en part de la plus grande portée des cellules chargées."
"Item distance" = "Distance des objets au sol"
"How far from you items lying in the world are drawn, as a part of the farthest the loaded cells reach." = "Jusqu'où autour de vous les objets posés dans le monde sont dessinés, en part de la plus grande portée des cellules chargées."
"Shadow distance" = "Distance des ombres"
"How far from you the sun casts shadows (with Sun shadows on), as a part of the farthest shadow distance." = "Jusqu'où autour de vous le soleil projette des ombres (Ombres du soleil activées), en part de la plus grande distance d'ombres."
"Grass distance" = "Distance de l'herbe"
"How far from you grass is drawn, as a part of the farthest grass distance and its fade range." = "Jusqu'où autour de vous l'herbe est dessinée, en part de la plus grande distance d'herbe et de sa zone de fondu."
"Anti-aliasing" = "Anticrénelage"
"How edges are smoothed: multisampling 2x, 4x or 8x (dearer at each step) or FXAA, SMAA or TAA afterwards. Reads Off while an upscaler is on." = "Comment les bords sont lissés : multiéchantillonnage 2x, 4x ou 8x (plus cher à chaque palier) ou FXAA, SMAA ou TAA ensuite. Indique Désactivé avec une mise à l'échelle active."
"Shadow filtering" = "Filtrage des ombres"
"How the sun's shadow edges are softened: Fast (harder, cheapest), Smooth (as vanilla) or Temporal (grainy unless Anti-aliasing is TAA)." = "Comment les bords des ombres du soleil sont adoucis : Rapide (plus durs, le moins cher), Doux (comme l'original) ou Temporel (granuleux sauf si l'anticrénelage est TAA)."
"Ambient occlusion" = "Occlusion ambiante"
"On: creases, corners and the ground under things are darkened by how enclosed they are (screen-space, from the depth). Not in the original." = "Activé : plis, coins et sol sous les objets sont assombris selon leur enfermement (en espace écran, d'après la profondeur). Absent de l'original."
"Longer sun shadows" = "Ombres du soleil plus longues"
"On: the sun's shadows reach half as far again as the shadow distance. Costs a little frame rate." = "Activé : les ombres du soleil portent moitié plus loin que la distance d'ombres. Coûte un peu d'images par seconde."
"Bloom" = "Bloom"
"On: light brighter than a sunlit white wall (the sun, lamps, windows) glows into its surroundings, on top of the game's own image space." = "Activé : une lumière plus vive qu'un mur blanc au soleil (le soleil, les lampes, les fenêtres) rayonne sur ses alentours, par-dessus l'espace image propre au jeu."
"Light glow (HDR)" = "Halo lumineux (HDR)"
"On: neon, lamps, beams and fire glow softly, as the original's HDR glow does, as much as the place's image space asks. Bloom adds to it." = "Activé : néons, lampes, rayons et feux rayonnent doucement, comme le halo HDR de l'original, autant que le demande l'espace image du lieu. Le bloom s'y ajoute."
"Eye adaptation" = "Adaptation à l'obscurité"
"On: dark views brighten after a moment, as the eye gets used to the dark, by the place's image space. Needs the light glow." = "Activé : les vues sombres s'éclaircissent au bout d'un moment, comme le regard s'habitue au noir, selon l'espace image du lieu. Nécessite le halo lumineux."
"Neon glow" = "Halo des néons"
"On: where the image space asks for a strong glow (the Strip at night) neon burns with a wide halo, as in the original. Needs the light glow." = "Activé : là où l'espace image demande un fort halo (le Strip la nuit), le néon brille d'un large halo, comme dans l'original. Nécessite le halo lumineux."
"Sharpening" = "Netteté"
"On: the final picture is sharpened where it has little contrast (contrast-adaptive sharpening)." = "Activé : l'image finale est accentuée là où elle a peu de contraste (netteté adaptative au contraste)."
"Anisotropic filtering 16x" = "Filtrage anisotrope 16x"
"On: textures seen at a slant stay sharp further (16x instead of 8x). For textures loaded from now on (the cells loaded next)." = "Activé : les textures vues de biais restent nettes plus loin (16x au lieu de 8x). Pour les textures chargées à partir de maintenant (les prochaines cellules chargées)."
"Sun shafts" = "Rayons de soleil"
"On: sunlight streams past what stands in front of the sun, stronger the hazier the weather's fog. Not in the original." = "Activé : la lumière du soleil passe autour de ce qui se trouve devant le soleil, d'autant plus fort que le brouillard de la météo est dense. Absent de l'original."
"Screen-space water reflections" = "Reflets de l'eau en espace écran"
"On: water the mirrored reflection does not reach (another height, interiors) reflects what is on the screen instead of only the sky." = "Activé : l'eau que le reflet miroir n'atteint pas (autre hauteur, intérieurs) reflète ce qui est à l'écran au lieu du seul ciel."
"Mirrored water reflections" = "Reflets miroir de l'eau"
"On: water mirrors the world above it, as in the original, drawing the scene a second time. Off: it reflects the sky." = "Activé : l'eau reflète le monde au-dessus d'elle, comme dans l'original, en dessinant la scène une seconde fois. Désactivé : elle reflète le ciel."
"Quality preset" = "Préréglage de qualité"
"Sets the rows the original's quality presets cover to the game folder's low.ini to VeryHigh.ini. Custom: those rows match none of them." = "Règle les lignes des préréglages de qualité de l'original sur les valeurs de low.ini à VeryHigh.ini du dossier du jeu. Personnalisé : elles ne correspondent à aucun."
"Enhanced effects" = "Effets améliorés"
"Sets every effect of the enhanced look at once. On: all of them. Off: none, the original's picture. Custom: some on, some off. Each keeps its own row." = "Règle à la fois tous les effets de l'apparence améliorée. Activé : tous. Désactivé : aucun, l'image de l'original. Personnalisé : certains oui, d'autres non. Chacun garde sa ligne."
"Off (upscaling active)" = "Désactivé (mise à l'échelle active)"
"DLSS (restart)" = "DLSS (redémarrer)"
"Needs an upscaler" = "Nécessite une mise à l'échelle"
"Not with DLSS" = "Pas avec DLSS"
"DLSS needs Windows" = "DLSS nécessite Windows"
"DLSS needs the Vulkan renderer" = "DLSS nécessite le rendu Vulkan"
"DLSS files missing: choose Download DLSS… in this list, or put them in the dlss folder beside nvforever.exe, then restart" = "Fichiers DLSS manquants : choisissez Télécharger DLSS… dans cette liste, ou placez-les dans le dossier dlss à côté de nvforever.exe, puis redémarrez"
"The dlss folder holds NVIDIA's updater (nvngx_update.exe): remove it, then restart" = "Le dossier dlss contient le programme de mise à jour de NVIDIA (nvngx_update.exe) : retirez-le, puis redémarrez"
"A file in the dlss folder is not from the tested NVIDIA release (Streamline 2.14.16)" = "Un fichier du dossier dlss ne vient pas de la version NVIDIA testée (Streamline 2.14.16)"
"DLSS did not start (the log says why)" = "DLSS n'a pas démarré (le journal dit pourquoi)"
"A graphics card the game may use cannot run DLSS" = "Une carte graphique que le jeu peut utiliser ne peut pas exécuter DLSS"
"Not on this GPU or driver (DLSS needs an NVIDIA RTX card)" = "Pas sur ce GPU ou ce pilote (DLSS nécessite une carte NVIDIA RTX)"
"DLSS stopped working this session; it is tried again at the next start" = "DLSS a cessé de fonctionner pendant cette session ; il sera réessayé au prochain démarrage"
"FSR 3.1 cannot run on this GPU" = "FSR 3.1 ne peut pas fonctionner sur ce GPU"
"Frame generation" = "Génération d'images"
"Generated frames" = "Images générées"
"Needs an NVIDIA RTX 40 series or newer" = "Nécessite une NVIDIA RTX série 40 ou plus récente"
"Needs hardware-accelerated GPU scheduling" = "Nécessite la planification GPU à accélération matérielle"
"Needs a newer NVIDIA driver" = "Nécessite un pilote NVIDIA plus récent"
"The DLSS Frame Generation files are missing" = "Les fichiers de DLSS Frame Generation manquent"
"Needs vsync off" = "Nécessite la synchronisation verticale désactivée"
"Needs DLSS frame generation" = "Nécessite la génération d'images DLSS"
"Frames made between the real ones: smoother motion, input a little later. FSR 3.1 needs FSR upscaling; DLSS an RTX 40 or newer. Not in the original." = "Images créées entre les vraies : mouvement plus fluide, commandes un peu en retard. FSR 3.1 exige la mise à l'échelle FSR ; DLSS, une RTX 40 ou plus récente. Absent de l'original."
"How many frames DLSS frame generation makes per real frame: 2x one, 3x two, 4x three (3x and 4x on RTX 50 series). Not in the original." = "Combien d'images la génération d'images DLSS crée par vraie image : 2x une, 3x deux, 4x trois (3x et 4x avec la série RTX 50). Absent de l'original."
"Controls" = "Commandes"
"HUD colour" = "Couleur du HUD"
"The colour of the HUD and the menus: Amber (the default) or another; the sliders below set it to any colour." = "La couleur du HUD et des menus : Ambre (par défaut) ou une autre ; les curseurs ci-dessous la règlent sur n'importe quelle couleur."
"Pip-Boy colour" = "Couleur du Pip-Boy"
"The colour of the Pip-Boy's screens (items, stats, data): Amber (the default) or another; the sliders below set it to any colour." = "La couleur des écrans du Pip-Boy (objets, statistiques, données) : Ambre (par défaut) ou une autre ; les curseurs ci-dessous la règlent sur n'importe quelle couleur."
