# NVForever's own words in Russian (#1948). Written for NVForever, not copied from the
# game (LEGAL.md). Choice names (Off, Auto, Last enemy, Amber …) are
# translated, and the notes name them as they are shown. How to add or fix a line:
# README.md beside this file.

name = "Русский"

[words]
"Dialogue voice" = "Голос в диалогах"
"On: lines are spoken. Off: they are silent from the next line on, and still last as long as their sound. (--no-voice)" = "Вкл.: реплики звучат. Выкл.: со следующей реплики они беззвучны, но длятся столько же, сколько их звук. (--no-voice)"
"Gameplay" = "Игра"
"Turn to each other in dialogue" = "Поворот друг к другу в диалоге"
"On: at the start of a conversation the actor turns to the player and the view turns to the actor. (--no-dialogue-look)" = "Вкл.: в начале разговора собеседник поворачивается к игроку, а взгляд — к собеседнику. (--no-dialogue-look)"
"Bring the view back when choices appear" = "Возвращать взгляд при выборе ответа"
"On: each time the choices come up the view returns to the actor. Off: only the opening turn; the view is yours for the rest of the conversation. Needs the turn above. (--dialogue-recentre)" = "Вкл.: каждый раз, когда появляются ответы, взгляд возвращается к собеседнику. Выкл.: только первый поворот, дальше взгляд в вашей власти. Нужен поворот выше. (--dialogue-recentre)"
"Close in on the speaker in dialogue" = "Приближение к говорящему"
"On: in a conversation the view narrows onto the speaker, with what is behind them out of focus; from third person the camera comes to the eyes. Off: the view stays as it is. (--no-dialogue-zoom)" = "Вкл.: в разговоре взгляд сужается на говорящем, а то, что за ним, размыто; от третьего лица камера переходит к глазам. Выкл.: взгляд остаётся как есть. (--no-dialogue-zoom)"
"Goodbye hint" = "Подсказка «Goodbye»"
"On: while a conversation offers a Goodbye choice, \"[Tab] Goodbye\" stands at the left of the dialogue box. Off: the words are hidden; Tab still says goodbye." = "Вкл.: пока в разговоре можно попрощаться, слева от окна диалога стоит «[Tab] Goodbye». Выкл.: надпись скрыта; Tab всё равно прощается."
"Aim assist" = "Помощь в прицеливании"
"Controller only, never the mouse. On: the right stick turns slower while the crosshair is on a nearby hostile, and aiming down the sights turns the view onto one near the crosshair for a moment. Off: neither." = "Только для геймпада, не для мыши. Вкл.: правый стик поворачивает медленнее, пока прицел на ближнем враге, а прицеливание через прицел на миг наводит взгляд на врага рядом с перекрестием. Выкл.: ни того, ни другого."
"Controller" = "Геймпад"
"Aim slowdown" = "Замедление прицела"
"How much slower the right stick turns while the crosshair is on a nearby hostile (0: not at all)." = "Насколько медленнее поворачивает правый стик, пока прицел на ближнем враге (0: не замедляет)."
"Aim lock-on" = "Доводка прицела"
"How hard aiming down the sights turns the view onto a nearby hostile near the crosshair (0: not at all). Push the right stick away to break it." = "Насколько сильно прицеливание наводит взгляд на ближнего врага рядом с перекрестием (0: не наводит). Чтобы сорваться, отведите правый стик в сторону."
"Use Pip-Boy" = "Носить Pip-Boy"
"On: the Pip-Boy and its glove are worn and the menus come up on the arm. Off: both are taken off and the menus show full screen. Without a Pip-Boy worn the menus are always full screen." = "Вкл.: Pip-Boy и перчатка надеты, меню открываются на руке. Выкл.: оба сняты, меню во весь экран. Без надетого Pip-Boy меню всегда во весь экран."
"Kill camera" = "Камера убийства"
"When a VATS shot kills its last mark, a cinematic camera can show the kill. Last enemy: only when no other enemy is still fighting you. Every kill: whoever is left. Off: never." = "Когда выстрел в VATS убивает последнюю цель, кинокамера может показать убийство. Последний враг: только когда с вами больше никто не сражается. Каждое убийство: при любом убийстве. Выкл.: никогда."
"V.A.T.S. style" = "Стиль V.A.T.S."
"What the V.A.T.S. key starts. Classic: the world stops, you pick a target and its body parts from their chances to hit, then the queued attacks play. Mark and Fire: time runs very slowly while you mark targets under the crosshair." = "Что запускает клавиша V.A.T.S. Классический: мир останавливается, вы выбираете цель и части её тела по шансу попадания, затем выполняются атаки из очереди. Отметить и стрелять: время идёт очень медленно, пока вы отмечаете цели под прицелом."
"V.A.T.S. time slowdown" = "Замедление времени в V.A.T.S."
"How far the world slows while you choose targets in the Classic style: 100% stops it, 50% runs it at half speed. Enemies keep attacking at anything less than a full stop." = "Насколько замедляется мир, пока вы выбираете цели в классическом стиле: 100% останавливает его, 50% оставляет половину скорости. При неполной остановке враги продолжают атаковать."
"Slower while reloading" = "Медленнее при перезарядке"
"On: you and the NPCs move at 75% of your speed while a reload runs. Off: reloading does not slow anyone, as in the original." = "Вкл.: пока идёт перезарядка, вы и NPC двигаетесь на 75% скорости. Выкл.: перезарядка никого не замедляет, как в оригинале."
"Difficulty" = "Сложность"
"How hard the fights are: from Very Easy (the player's hits do double damage and the player takes half) to Very Hard (half and double); Normal as they are. (console: SetGameDifficulty 0-4)" = "Насколько тяжелы бои: от Очень легко (удары игрока наносят двойной урон, а сам он получает половину) до Очень тяжело (половину и двойной); на Нормально урон как есть. (консоль: SetGameDifficulty 0-4)"
"Dynamic crosshair" = "Динамический прицел"
"On: with a gun or thrown weapon drawn the crosshair opens to show how wide your shots spread now (wider running, after shots, with crippled arms; narrower aimed or crouched); Crosshair style below picks how it looks. Off: the arrows stay together whatever is drawn." = "Вкл.: с огнестрельным или метательным оружием в руках прицел раскрывается и показывает текущий разброс (шире на бегу, после выстрелов, с покалеченными руками; уже при прицеливании и в приседе); вид выбирается ниже, в «Вид прицела». Выкл.: стрелки не расходятся, что бы ни было в руках."
"Crosshair style" = "Вид прицела"
"With Dynamic crosshair on and a gun or thrown weapon drawn. Cross: four bars that part with the spread. Arrows: the plain crosshair's two arrows part instead." = "При включённом динамическом прицеле и оружии в руках. Крест: четыре черты, расходящиеся с разбросом. Стрелки: расходятся две стрелки обычного прицела."
"Detached third-person camera" = "Свободная камера от третьего лица"
"On: in third person with your weapon away the mouse turns the camera around you, not your character, and your character turns to run whichever way you push, as the camera sees it. Drawing your weapon turns you to where the camera looks. Off: the camera stays behind you, as in the original." = "Вкл.: от третьего лица с убранным оружием мышь вращает камеру вокруг вас, а не персонажа, и персонаж бежит туда, куда вы толкаете, как видит камера. Достав оружие, вы поворачиваетесь туда, куда смотрит камера. Выкл.: камера остаётся за спиной, как в оригинале."
"Language" = "Язык"
"The language of NVForever's own words (menus, messages). The game's own text is the install's." = "Язык собственных слов NVForever (меню, сообщения). Текст самой игры берётся из установленной игры."
"Interface" = "Интерфейс"
"Reverb" = "Реверберация"
"World sounds echo as the place you are in does (a cave, a hall, a small room). Off: --no-reverb." = "Звуки мира отражаются так, как в месте, где вы находитесь (пещера, зал, маленькая комната). Выкл.: --no-reverb."
"Voice reverb" = "Реверберация голосов"
"What people say around you echoes in the place you are in, up to the end of each line, as Reverb does for world sounds. Conversations stay dry." = "То, что говорят вокруг вас, отражается в месте, где вы находитесь, до конца каждой реплики, как реверберация делает со звуками мира. Разговоры остаются сухими."
"Sound" = "Звук"
"Master" = "Общая громкость"
"How loud all sound is: each volume below is a part of this one." = "Насколько громок весь звук: каждая громкость ниже — доля этой."
"Music" = "Музыка"
"The music of the place you are in and the main menu's theme." = "Музыка места, где вы находитесь, и тема главного меню."
"Footstep" = "Шаги"
"Footsteps, jumps and landings, yours and everyone's." = "Шаги, прыжки и приземления — ваши и чужие."
"Voice" = "Голоса"
"Spoken lines: conversations and what people say around you." = "Речь: разговоры и то, что говорят вокруг вас."
"Effects" = "Эффекты"
"Every other sound: weapons, impacts, menus, doors and the sounds of places." = "Все прочие звуки: оружие, удары, меню, двери и звуки мест."
"Radio" = "Радио"
"Radio stations, from the Pip-Boy and from radios in the world." = "Радиостанции — из Pip-Boy и из приёмников в мире."
"Freeze the picture in dialogue and menus" = "Замирание в диалогах и меню"
"On: while a conversation, the inventory, a container or a message box is open, animations, wind, water and sky stand still, as in the original. Off: only game logic waits and the world lives on. This menu always holds everything. (--menu-pause original|living)" = "Вкл.: пока открыт разговор, инвентарь, контейнер или окно сообщения, анимации, ветер, вода и небо замирают, как в оригинале. Выкл.: ждёт только игровая логика, а мир живёт дальше. Это меню всегда останавливает всё. (--menu-pause original|living)"
"Search" = "Поиск"
"Changed" = "Изменённые"
"Audio" = "Звук"
"Tweaks" = "Твики"
"Game" = "Общие"
"Dialogue" = "Диалог"
"Camera" = "Камера"
"Screen" = "Разрешение"
"Performance" = "Производительность"
"Picture" = "Изображение"
"Distance" = "Дальность"
"Quality" = "Качество"
"Previous heading" = "Предыдущий раздел"
"Next heading" = "Следующий раздел"
"Keyboard search" = "Поиск с клавиатуры"
"No settings here." = "Здесь нет настроек."
"No results." = "Ничего не найдено."
"No changed settings." = "Нет изменённых настроек."
"Stands for: {rows}." = "Обозначает: {rows}."
"Button style" = "Вид кнопок"
"Which names and pictures the controller's buttons go by in prompts, menu hints and the Controls tab. Auto: a PlayStation controller's (Cross, Circle, Square, Triangle, L1, R2, Select…) when the controller in use says it is one, else an Xbox controller's. Xbox or PlayStation: always those. The INI keeps the Xbox names either way." = "Какими названиями и значками обозначаются кнопки геймпада в подсказках, меню и на вкладке управления. Авто: как у PlayStation (Cross, Circle, Square, Triangle, L1, R2, Select…), когда геймпад сообщает, что он такой, иначе как у Xbox. Xbox или PlayStation: всегда эти. В INI в любом случае хранятся названия Xbox."
"Light and noise gauges while sneaking" = "Шкалы света и шума в скрытности"
"On: two bars under the sneak word show how lit you are and how much noise you make, as detection counts them. Not in the original." = "Вкл.: две полоски под словом скрытности показывают, насколько вы освещены и сколько шумите, как их учитывает обнаружение. Нет в оригинале."
"Saving" = "Сохранение"
"Autosave after travel" = "Автосохранение после перехода"
"On: the game saves to the autosave slot after each loading screen (doors, coc, a script moving the player); fast travel has its own switch." = "Вкл.: игра сохраняется в ячейку автосохранения после каждого экрана загрузки (двери, coc, скрипт, переносящий игрока); у быстрого перемещения свой переключатель."
"Save on fast travel" = "Сохранять при быстром перемещении"
"On: the game saves to the autosave slot when a fast travel arrives." = "Вкл.: игра сохраняется в ячейку автосохранения по прибытии быстрым перемещением."
"Save on wait" = "Сохранять после ожидания"
"On: the game saves to the autosave slot when a wait ends with at least one hour passed." = "Вкл.: игра сохраняется в ячейку автосохранения, когда ожидание длилось хотя бы час."
"Save on sleep" = "Сохранять после сна"
"On: the game saves to the autosave slot when the player wakes from a sleep of at least one hour." = "Вкл.: игра сохраняется в ячейку автосохранения, когда игрок просыпается после сна длиной хотя бы в час."
"Save when a script asks" = "Сохранять по запросу скрипта"
"On: a script's Autosave saves to the autosave slot, as quests do at their milestones; SystemSave to the system slot; ForceSave as a new save." = "Вкл.: Autosave из скрипта сохраняет в ячейку автосохранения, как делают задания на важных этапах; SystemSave — в системную ячейку; ForceSave — как новое сохранение."
"Hardcore mode" = "Режим хардкор"
"On: you need water, food and sleep, stimpaks heal over time, ammunition has weight and crippled limbs heal only with a doctor's bag or a doctor. Off: none of that; turning it off clears your thirst, hunger and tiredness and their effects. (console: SetHardcore 1/0)" = "Вкл.: нужны вода, еда и сон, стимуляторы лечат постепенно, патроны имеют вес, а покалеченные конечности лечатся только докторской сумкой или у доктора. Выкл.: ничего этого нет; выключение снимает жажду, голод и усталость и их эффекты. (консоль: SetHardcore 1/0)"
"HUD red" = "HUD: красный"
"HUD green" = "HUD: зелёный"
"HUD blue" = "HUD: синий"
"Pip-Boy red" = "Pip-Boy: красный"
"Pip-Boy green" = "Pip-Boy: зелёный"
"Pip-Boy blue" = "Pip-Boy: синий"
"One part of the colour above, 0 to 255; drag the meter or use Left and Right." = "Одна составляющая цвета выше, от 0 до 255; тяните шкалу или жмите влево и вправо."
"On: the music of the place you are in plays. Off: it is silent and goes on unheard. (--no-music)" = "Вкл.: играет музыка места, где вы находитесь. Выкл.: она не звучит, но идёт дальше неслышно. (--no-music)"
"UI scale" = "Масштаб интерфейса"
"The size of the HUD and the menus, as a part of the original's (100%): smaller leaves more of the picture free, each HUD piece kept at its edge of the screen and each menu in the middle. Above 100% only the HUD grows: the menus stay at the original's size, so they keep on the screen. Takes effect at the next start (loading a save starts the game again). Not in the original." = "Размер HUD и меню как доля оригинального (100%): меньше — больше свободной картинки, каждый элемент HUD остаётся у своего края экрана, каждое меню — посередине. Выше 100% растёт только HUD: меню остаются оригинального размера, чтобы помещаться на экране. Действует со следующего запуска (загрузка сохранения запускает игру заново). Нет в оригинале."
"This terminal requires a password." = "Этот терминал требует пароль."
"You need a Science skill of {needed} to hack this terminal." = "Чтобы взломать этот терминал, нужен навык «Наука» не ниже {needed}."
"Lip sync" = "Движение губ"
"On: a speaker's face moves with the line. Off: a face that is moving eases back to rest. (--no-lip)" = "Вкл.: лицо говорящего движется вместе с репликой. Выкл.: движущееся лицо плавно возвращается в покой. (--no-lip)"
"Head tracking" = "Слежение головой"
"On: actors turn their heads to the player and to others near them. Off: heads ease back to their animation. (--no-head-tracking)" = "Вкл.: персонажи поворачивают головы к игроку и к другим рядом. Выкл.: головы плавно возвращаются к анимации. (--no-head-tracking)"
"Feet follow the ground" = "Ноги по земле"
"On: on slopes and steps actors bend their knees and set each foot on the ground under it. Off: the legs play the animation as it is. (--no-foot-ik)" = "Вкл.: на склонах и ступенях персонажи сгибают колени и ставят каждую ногу на землю под ней. Выкл.: ноги играют анимацию как есть. (--no-foot-ik)"
"Sky follows the game clock" = "Небо по игровым часам"
"On: the sky shows the game's time of day as it passes. Off: the sky keeps its hour while the game's clock runs on ([ and ] still set it). (--still-sky)" = "Вкл.: небо показывает игровое время суток по мере его хода. Выкл.: небо держит свой час, а игровые часы идут дальше ([ и ] по-прежнему его меняют). (--still-sky)"
"Resolution" = "Разрешение"
"The window's size, or in full screen the monitor's (its own size: borderless). A new one goes back after 20 seconds unless you keep it. (--size)" = "Размер окна, а в полноэкранном режиме — монитора (его собственный размер: без рамки). Новое разрешение откатывается через 20 секунд, если его не сохранить. (--size)"
"Full screen" = "Полный экран"
"On: the game fills the monitor it is on, without a frame, at the resolution chosen above for full screen. Off: a window of the resolution chosen for a window. (--window borderless)" = "Вкл.: игра заполняет свой монитор, без рамки, в разрешении, выбранном выше для полного экрана. Выкл.: окно в разрешении, выбранном для окна. (--window borderless)"
"Monitor" = "Монитор"
"The display the game opens on in full screen (the first display until you pick one). (--window borderless)" = "Экран, на котором игра открывается в полноэкранном режиме (первый экран, пока вы не выберете другой). (--window borderless)"
"Body in first person" = "Тело от первого лица"
"On: in first person you see your own body and legs when you look down. Off: only the arms and the weapon are drawn, as in the original. (--first-person-body)" = "Вкл.: от первого лица, глядя вниз, вы видите своё тело и ноги. Выкл.: рисуются только руки и оружие, как в оригинале. (--first-person-body)"
"Weapon sway" = "Покачивание оружия"
"On: in first person the arms and weapon lag behind a turn and bob as you walk and run. Off: they stay still in the view. (--no-weapon-sway)" = "Вкл.: от первого лица руки и оружие отстают при повороте и покачиваются при ходьбе и беге. Выкл.: они неподвижны. (--no-weapon-sway)"
"Head bob" = "Покачивание головы"
"On: in first person the view dips with each step as you walk and run. Off: it stays level. (--no-head-bob)" = "Вкл.: от первого лица взгляд опускается с каждым шагом при ходьбе и беге. Выкл.: он остаётся ровным. (--no-head-bob)"
"Lower weapon near walls" = "Опускать оружие у стен"
"On: in first person a drawn weapon is lowered when a wall or a friendly person is right in front of you, and comes straight back up when you aim or fire. Off: it stays up and can poke through them, as in the original. Lower Weapon (H) lowers or raises it by hand either way. (--no-weapon-lower)" = "Вкл.: от первого лица оружие опускается, когда прямо перед вами стена или дружелюбный человек, и сразу поднимается, когда вы целитесь или стреляете. Выкл.: оно остаётся поднятым и может проходить сквозь них, как в оригинале. Клавиша опускания оружия (H) в любом случае опускает и поднимает его вручную. (--no-weapon-lower)"
"True iron sights" = "Настоящие мушки"
"On: aiming a gun lines its sights up with your eye. The crosshair is hidden while you aim down them. Off: the gun is held low with the crosshair, as in the original. Guns with no sights to look down (laser rifle, minigun) aim as the original either way. (--no-true-iron-sights)" = "Вкл.: при прицеливании прицельные приспособления совмещаются с глазом. Перекрестие в это время скрыто. Выкл.: оружие держится низко, с перекрестием, как в оригинале. Оружие без прицельных приспособлений (лазерная винтовка, миниган) в любом случае целится как в оригинале. (--no-true-iron-sights)"
"3D scopes (test)" = "Объёмные прицелы (тест)"
"On: aiming a scoped gun keeps the gun on screen and shows the zoomed view in its scope's lens, with the reticle; the view around it zooms only a little. Off: the full-screen scope picture with its black border, as in the original. Guns whose scope lens is not known yet keep the picture. (--scope-3d)" = "Вкл.: при прицеливании оружие с оптикой остаётся на экране, а увеличенный вид с сеткой показан в линзе прицела; вид вокруг приближается лишь немного. Выкл.: полноэкранная картинка прицела с чёрной рамкой, как в оригинале. Оружие, у которого линза прицела ещё неизвестна, оставляет картинку. (--scope-3d)"
"Sun shadows" = "Солнечные тени"
"On: the sun casts shadows out to --shadow-distance. The original casts none from the world. On by default in the game. (--sun-shadows, --no-sun-shadows)" = "Вкл.: солнце отбрасывает тени до --shadow-distance. В оригинале мир теней от солнца не отбрасывает. В игре включено по умолчанию. (--sun-shadows, --no-sun-shadows)"
"Grass" = "Трава"
"On: grass grows on the landscape; the cells around you get theirs over the next frames. Off: it is hidden and none grows on new cells. (--no-grass)" = "Вкл.: на земле растёт трава; ячейки вокруг вас получают её за следующие кадры. Выкл.: трава скрыта и на новых ячейках не растёт. (--no-grass)"
"Distant terrain and objects" = "Дальняя земля и объекты"
"On: distant land, buildings and trees are drawn beyond the loaded cells (outdoors). Off: the world ends at the loaded cells. (--no-lod)" = "Вкл.: дальняя земля, здания и деревья рисуются за загруженными ячейками (снаружи). Выкл.: мир кончается на загруженных ячейках. (--no-lod)"
"Colour grade" = "Цветокоррекция"
"On: the picture is graded by the worldspace's, the weather's and the cell's image space. Off: the picture as lit, for comparisons. (--no-grade)" = "Вкл.: картинка окрашена по пространству изображения мира, погоды и ячейки. Выкл.: картинка как освещена, для сравнения. (--no-grade)"
"Text overlay" = "Текст поверх картинки"
"On: the position, loading counts and key help are written over the picture. Off by default in the game. (--overlay, --no-overlay)" = "Вкл.: поверх картинки пишутся положение, счётчики загрузки и подсказки клавиш. В игре по умолчанию выключено. (--overlay, --no-overlay)"
"Shot markers" = "Метки попаданий"
"On: a cross is drawn at each impact and a line from the muzzle along each hitscan shot. (--hit-markers)" = "Вкл.: в каждой точке попадания рисуется крестик, а от дула вдоль каждого мгновенного выстрела — линия. (--hit-markers)"
"God mode" = "Режим бога"
"On: the player takes no damage from hits and cannot be killed by them. (--god)" = "Вкл.: игрок не получает урона от попаданий и не может от них погибнуть. (--god)"
"Draw the navmesh" = "Показывать навигационную сетку"
"On: the navmesh near the camera and the walking NPCs' paths are drawn. (--show-navmesh)" = "Вкл.: рисуется навигационная сетка рядом с камерой и пути идущих NPC. (--show-navmesh)"
"Frame rate counter" = "Счётчик кадров"
"On: a small panel of performance readings at the top right of the screen, the Counter rows below choosing what it shows; with only its frame rate row on it is a frame rate counter. Not in the original. (--fps)" = "Вкл.: небольшая панель показателей производительности в правом верхнем углу экрана; строки Counter ниже выбирают, что она показывает. Если включена только её строка частоты кадров, это счётчик кадров. Нет в оригинале. (--fps)"
"Display sync" = "Синхронизация"
"Vertical sync: each frame waits for the display's refresh (no tearing). Variable refresh: for a G-Sync or FreeSync screen, vertical sync with the frame rate held a few frames under the screen's refresh rate, so frames are shown as soon as they are drawn without tearing. Off: frames are shown as soon as they are drawn (may tear)." = "Вертикальная синхронизация: каждый кадр ждёт обновления экрана (без разрывов). Переменная частота: для экрана с G-Sync или FreeSync — вертикальная синхронизация, а частота кадров держится на несколько кадров ниже частоты экрана, так что кадры показываются сразу, как нарисованы, без разрывов. Выкл.: кадры показываются сразу, как нарисованы (возможны разрывы)."
"Upscaler" = "Масштабирование"
"Upscaling mode" = "Режим масштабирования"
"Reconstruct the world at display resolution with FSR 3.1 or NVIDIA DLSS, at the Upscaling mode below. Disables MSAA, FXAA, SMAA and TAA while active. Menus stay sharp. Requires Vulkan; unsupported devices keep native rendering. DLSS needs an NVIDIA RTX graphics card and NVIDIA's DLSS files in the dlss folder beside nvforever.exe (NVForever ships none). With the files there when the game starts, every choice takes effect at once; files put there later are found at the next start, so DLSS chosen until then reads DLSS (restart) (loading a save starts the game again). Sharpening controls FSR sharpening. Frame generation needs FSR. (--upscaler, --upscaler-quality, --fsr)" = "Восстанавливает мир в разрешении экрана с помощью FSR 3.1 или NVIDIA DLSS, в режиме масштабирования из строки ниже. Пока включено, отключает MSAA, FXAA, SMAA и TAA. Меню остаются чёткими. Нужен Vulkan; на неподдерживаемых устройствах остаётся обычная отрисовка. Для DLSS нужны видеокарта NVIDIA RTX и файлы DLSS от NVIDIA в папке dlss рядом с nvforever.exe (NVForever их не поставляет). Если файлы там при запуске игры, любой выбор действует сразу; файлы, положенные туда позже, находятся при следующем запуске, а до тех пор выбранный DLSS показан как «DLSS (перезапуск)» (загрузка сохранения перезапускает игру). Резкость FSR задаёт пункт «Резкость». Генерации кадров нужен FSR. (--upscaler, --upscaler-quality, --fsr)"
"The share of the screen's width and height the world is drawn at; the upscaler rebuilds the rest. Native AA: full resolution, anti-aliasing only (DLSS: DLAA). Quality: the sharpest upscaled look, for 1440p and 4K. Balanced: more speed with little visible loss. Performance: the highest frame rate, for 4K or heavy scenes. Ultra Performance: for very high resolutions only. Takes effect at once. With Upscaler Off there is nothing to set. (--upscaler-quality, --upscaler, --fsr)" = "Доля ширины и высоты экрана, в которой рисуется мир; масштабирование восстанавливает остальное. Нативное AA: полное разрешение, только сглаживание (DLSS: DLAA). Качество: самая чёткая масштабированная картинка, для 1440p и 4K. Баланс: больше скорости при едва заметной потере. Производительность: самая высокая частота кадров, для 4K или тяжёлых сцен. Макс. производительность: только для очень высоких разрешений. Действует сразу. При выключенном масштабировании настраивать нечего. (--upscaler-quality, --upscaler, --fsr)"
"DLSS model" = "Модель DLSS"
"Which of NVIDIA's DLSS models rebuilds the picture (NVIDIA calls them presets). Default (recommended): NVIDIA picks per mode: K for Native AA, Quality and Balanced, M for Performance, L for Ultra Performance. K: transformer model, best detail, costs more. L: sharper and steadier, less ghosting, costs the most. M: close to L in looks, closer to K in speed. J: like K with a little less ghosting and more flicker. Takes effect at once. Only while DLSS draws. (--dlss-model)" = "Какая из моделей DLSS от NVIDIA восстанавливает картинку (NVIDIA называет их пресетами). По умолчанию (рекомендуется): NVIDIA выбирает по режиму: K для «Нативное AA», «Качество» и «Баланс», M для «Производительность», L для «Макс. производительность». K: трансформерная модель, больше всего деталей, дороже. L: резче и стабильнее, меньше шлейфов, дороже всех. M: по виду близка к L, по скорости ближе к K. J: как K, чуть меньше шлейфов, но больше мерцания. Действует сразу. Только пока рисует DLSS. (--dlss-model)"
"Default" = "По умолчанию"
"DLSS only" = "Только с DLSS"
"World" = "Мир"
"Display" = "Экран"
"Debug" = "Отладка"
"Graphics" = "Графика"
"Field of view" = "Поле зрения"
"The game's field of view in degrees across a 4:3 picture (75 as the original's default); wider screens see more at the sides. (--fov)" = "Поле зрения игры в градусах по ширине картинки 4:3 (75 — значение оригинала по умолчанию); на широких экранах видно больше по бокам. (--fov)"
"Frame rate limit" = "Предел кадров"
"At most this many frames a second (Off: as many as the computer draws, or the display's refresh with vertical sync; with variable refresh the lower of this and its own limit). A lower limit keeps the computer cooler and quieter." = "Не больше стольких кадров в секунду (Выкл.: сколько успевает компьютер или частота экрана при вертикальной синхронизации; при переменной частоте — меньшее из этого предела и её собственного). Чем ниже предел, тем холоднее и тише компьютер."
"Object distance" = "Дальность объектов"
"How far from you objects (buildings, rocks, furniture, clutter) of the loaded cells are drawn, as a part of the farthest those cells reach. Lower draws fewer and runs faster." = "Как далеко от вас рисуются объекты загруженных ячеек (здания, скалы, мебель, мелочи), как доля самой большой дальности этих ячеек. Меньше — рисуется меньше и работает быстрее."
"Actor distance" = "Дальность персонажей"
"How far from you people and creatures are drawn, as a part of the farthest the loaded cells reach." = "Как далеко от вас рисуются люди и существа, как доля самой большой дальности загруженных ячеек."
"Item distance" = "Дальность предметов"
"How far from you items lying in the world (weapons, ammo, aid, notes, caps, clutter you can take) are drawn, as a part of the farthest the loaded cells reach." = "Как далеко от вас рисуются предметы, лежащие в мире (оружие, патроны, медикаменты, записки, крышки, мелочи, которые можно взять), как доля самой большой дальности загруженных ячеек."
"Shadow distance" = "Дальность теней"
"How far from you the sun casts shadows (with Sun shadows on), as a part of --shadow-distance." = "Как далеко от вас солнце отбрасывает тени (при включённых солнечных тенях), как доля --shadow-distance."
"Grass distance" = "Дальность травы"
"How far from you grass is drawn, as a part of --grass-distance and its fade range." = "Как далеко от вас рисуется трава, как доля --grass-distance и её зоны угасания."
"Anti-aliasing" = "Сглаживание"
"How edges are smoothed: multisampling Off, 2x, 4x or 8x (--msaa; the cut-out edges of plants too), or the picture smoothed afterwards: FXAA (cheapest, softest), SMAA (sharper, a little dearer) or TAA (over the frames; plants too, soft while moving; --graphics-only fxaa, smaa or taa). Multisampling is the dearest, more at each step: at 1920x1080 on an RTX 4070, 2x added about 0.8 ms a frame, 4x about 1.3 ms and 8x about 2.3 ms (Goodsprings and Novac at noon); FXAA, SMAA and TAA cost less than 4x. Where the processor sets the pace (the Strip at night) the choice costs next to nothing. While an upscaler (FSR 3.1 or DLSS) is on it does the anti-aliasing itself, so this row reads Off (upscaling active); your choice comes back when Upscaler is Off." = "Как сглаживаются края: мультисэмплинг Выкл., 2x, 4x или 8x (--msaa; и вырезанные края растений), или сглаживание готовой картинки: FXAA (дешевле всего, мягче всего), SMAA (чётче, чуть дороже) или TAA (по нескольким кадрам; и растения, мягко в движении; --graphics-only fxaa, smaa или taa). Мультисэмплинг дороже всего, и с каждым шагом дороже: в 1920x1080 на RTX 4070 2x добавлял около 0,8 мс на кадр, 4x около 1,3 мс, 8x около 2,3 мс (Goodsprings и Novac в полдень); FXAA, SMAA и TAA стоят меньше 4x. Где темп задаёт процессор (Strip ночью), выбор почти ничего не стоит. Пока включено масштабирование (FSR 3.1 или DLSS), оно само сглаживает, поэтому здесь написано «Выкл. (работает масштабирование)»; ваш выбор вернётся, когда масштабирование выключат."
"Shadow filtering" = "Фильтрация теней"
"How the edges of the sun's shadows are softened: Fast (hardware 2x2, harder edges, cheapest), Smooth (as vanilla) or Temporal (soft but grainy unless Anti-aliasing is TAA)." = "Как смягчаются края солнечных теней: Быстрая (аппаратная 2x2, резче края, дешевле всего), Мягкая (как в оригинале) или Временная (мягко, но зернисто, если сглаживание не TAA)."
"Ambient occlusion" = "Затенение окружения"
"On: creases, corners and the ground under things are darkened by how enclosed they are (screen-space, from the depth). Not in the original. (--graphics)" = "Вкл.: складки, углы и земля под предметами затемняются тем сильнее, чем они закрытее (в экранном пространстве, по глубине). Нет в оригинале. (--graphics)"
"Longer sun shadows" = "Длинные солнечные тени"
"On: the sun's shadows reach half as far again as --shadow-distance. Costs a little frame rate. (--graphics)" = "Вкл.: солнечные тени тянутся в полтора раза дальше --shadow-distance. Немного снижает частоту кадров. (--graphics)"
"Bloom" = "Свечение (bloom)"
"On: light brighter than a sunlit white wall (the sun, lamps, windows) glows into its surroundings, on top of the game's own image space. (--graphics)" = "Вкл.: свет ярче освещённой солнцем белой стены (солнце, лампы, окна) растекается свечением вокруг, поверх собственного пространства изображения игры. (--graphics)"
"Light glow (HDR)" = "Сияние света (HDR)"
"On: neon, lamps, glowing beams and fire glow softly into their surroundings, as the original's HDR glow does; how much follows the place's image space (the Strip's neon at night most). Bloom, when on, adds to it. (--graphics-only no-glow turns it off)" = "Вкл.: неон, лампы, светящиеся лучи и огонь мягко сияют вокруг, как HDR-сияние оригинала; насколько — следует пространству изображения места (сильнее всего неон Strip ночью). Свечение (bloom), если включено, добавляется к нему. (--graphics-only no-glow выключает)"
"Eye adaptation" = "Привыкание глаз"
"On: dark views brighten after a moment, as the eye gets used to the dark, by the place's image space. Needs the light glow. (--graphics-only no-eye-adaptation turns it off)" = "Вкл.: тёмные виды через миг светлеют, как глаз привыкает к темноте, по пространству изображения места. Нужно сияние света. (--graphics-only no-eye-adaptation выключает)"
"Neon glow" = "Неоновый ореол"
"On: where the place's image space asks for a strong glow (the Strip at night) neon tubes and signs burn with a wide halo, as in the original. Needs the light glow. (--graphics-only no-neon-glow turns it off)" = "Вкл.: где пространство изображения места просит сильного сияния (Strip ночью), неоновые трубки и вывески горят с широким ореолом, как в оригинале. Нужно сияние света. (--graphics-only no-neon-glow выключает)"
"Sharpening" = "Резкость"
"On: the final picture is sharpened where it has little contrast (contrast-adaptive sharpening). (--graphics)" = "Вкл.: итоговая картинка повышает резкость там, где у неё мало контраста (адаптивная к контрасту резкость). (--graphics)"
"Anisotropic filtering 16x" = "Анизотропная фильтрация 16x"
"On: textures seen at a slant stay sharp further (16x instead of 8x). For textures loaded from now on (the cells loaded next). (--graphics)" = "Вкл.: текстуры под наклоном остаются чёткими дальше (16x вместо 8x). Для текстур, загруженных с этого момента (следующие загруженные ячейки). (--graphics)"
"Sun shafts" = "Солнечные лучи"
"On: sunlight streams past what stands in front of the sun, stronger the hazier the weather's fog. Not in the original. (--graphics)" = "Вкл.: солнечный свет пробивается мимо того, что стоит перед солнцем, тем сильнее, чем туманнее погода. Нет в оригинале. (--graphics)"
"Screen-space water reflections" = "Экранные отражения в воде"
"On: water the mirrored reflection does not reach (another height, interiors) reflects what is on the screen instead of only the sky. (--graphics)" = "Вкл.: вода, до которой не достаёт зеркальное отражение (другая высота, интерьеры), отражает то, что на экране, а не только небо. (--graphics)"
"Mirrored water reflections" = "Зеркальные отражения в воде"
"On: water mirrors the world above it, as in the original; the scene is drawn a second time for it while water is on screen. Off: water reflects the sky, and what is on the screen with screen-space reflections. (--graphics-only no-water-mirror turns it off)" = "Вкл.: вода отражает мир над собой, как в оригинале; пока вода на экране, сцена рисуется для этого второй раз. Выкл.: вода отражает небо и, с экранными отражениями, то, что на экране. (--graphics-only no-water-mirror выключает)"
"Quality preset" = "Набор качества"
"Sets the rows the original's quality presets cover to the values of the game folder's low.ini, medium.ini, high.ini or VeryHigh.ini: Sun shadows, Shadow filtering, Light glow, Mirrored water reflections and the object, actor, item, shadow and grass distances. Custom: those rows match none of them. A preset whose file is missing is not offered. The enhanced effects, anti-aliasing and FSR keep their own rows." = "Задаёт строкам, которые охватывают наборы качества оригинала, значения из low.ini, medium.ini, high.ini или VeryHigh.ini в папке игры: солнечные тени, фильтрация теней, сияние света, зеркальные отражения в воде и дальность объектов, персонажей, предметов, теней и травы. Свой: эти строки не совпадают ни с одним набором. Набор, файла которого нет, не предлагается. Улучшенные эффекты, сглаживание и FSR остаются в своих строках."
"Enhanced effects" = "Улучшенные эффекты"
"On: every effect of the enhanced look (ambient occlusion, longer sun shadows, bloom, sharpening, anisotropic filtering 16x, sun shafts, screen-space water reflections). Off: none of them, the original's picture. Custom: some on, some off. Each effect keeps its own row and its own saved state; this row only sets them all at once." = "Вкл.: все эффекты улучшенного вида (затенение окружения, длинные солнечные тени, свечение, резкость, анизотропная фильтрация 16x, солнечные лучи, экранные отражения в воде). Выкл.: ни одного, изображение оригинала. Свой: часть включена, часть нет. У каждого эффекта остаётся своя строка и своё сохранённое состояние; эта строка лишь задаёт их все сразу."
"Off (upscaling active)" = "Выкл. (работает масштабирование)"
"DLSS (restart)" = "DLSS (перезапуск)"
"Needs an upscaler" = "Нужно масштабирование"
"Not with DLSS" = "Не с DLSS"
"DLSS needs Windows" = "DLSS работает только в Windows"
"DLSS needs the Vulkan renderer" = "Для DLSS нужна отрисовка через Vulkan"
"DLSS files missing: put them in the dlss folder beside nvforever.exe, then restart" = "Нет файлов DLSS: положите их в папку dlss рядом с nvforever.exe и перезапустите"
"The dlss folder holds NVIDIA's updater (nvngx_update.exe): remove it, then restart" = "В папке dlss лежит программа обновления NVIDIA (nvngx_update.exe): удалите её и перезапустите"
"A file in the dlss folder is not from the tested NVIDIA release (Streamline 2.14.16)" = "Файл в папке dlss не из проверенного выпуска NVIDIA (Streamline 2.14.16)"
"DLSS did not start (the log says why)" = "DLSS не запустился (причина в журнале)"
"A graphics card the game may use cannot run DLSS" = "Видеокарта, которую может выбрать игра, не поддерживает DLSS"
"Not on this GPU or driver (DLSS needs an NVIDIA RTX card)" = "Не на этой видеокарте или драйвере (для DLSS нужна карта NVIDIA RTX)"
"DLSS stopped working this session; it is tried again at the next start" = "DLSS перестал работать в этом сеансе; при следующем запуске будет новая попытка"
"FSR 3.1 cannot run on this GPU" = "FSR 3.1 не работает на этой видеокарте"
"Controls" = "Управление"
"HUD colour" = "Цвет HUD"
"The colour of the HUD and the menus: Amber (the default) or another; the sliders below set it to any colour." = "Цвет HUD и меню: Янтарный (по умолчанию) или другой; ползунки ниже задают любой цвет."
"Pip-Boy colour" = "Цвет Pip-Boy"
"The colour of the Pip-Boy's screens (items, stats, data): Amber (the default) or another; the sliders below set it to any colour." = "Цвет экранов Pip-Boy (вещи, характеристики, данные): Янтарный (по умолчанию) или другой; ползунки ниже задают любой цвет."
"Accepted." = "Принято."
"Opening the terminal..." = "Открываю терминал..."
"Not accepted" = "Не принято"
"Tries restored." = "Попытки обновлены."
"Dud removed." = "Пустышка удалена."
"Error" = "Ошибка"
"{n} of {len} right" = "Верно {n} из {len}"
"ON" = "ВКЛ"
"OFF" = "ВЫКЛ"

# The main and pause menus, the quit and keep questions (#2095).
"Continue" = "Продолжить"
"New Game" = "Новая игра"
"Load Game" = "Загрузить игру"
"Settings" = "Настройки"
"Quit" = "Выход"
"Save" = "Сохранить"
"Load" = "Загрузить"
"Mods" = "Моды"
"Back" = "Назад"
"Defaults" = "По умолчанию"
