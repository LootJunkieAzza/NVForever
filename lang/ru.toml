# NVForever's own words in Russian (#1948). Written for NVForever, not copied from the
# game (LEGAL.md). Choice names (Off, Auto, Last enemy, Amber …) are
# translated, and the notes name them as they are shown. How to add or fix a line:
# README.md beside this file.

name = "Русский"

[words]
# [design, #2200; engine/nvf-play/src/pause.rs] NVForever's device selection.
"Automatic Input Switching" = "Автоматическая смена устройства ввода"
"On: a controller button, stick or trigger selects Controller; a key or mouse click selects Keyboard and Mouse (mouse motion does not). Off: choose Input Device yourself." = "Вкл.: кнопка, стик или курок геймпада выбирает геймпад; клавиша или щелчок мыши — клавиатуру и мышь (движение мыши — нет). Выкл.: выбирайте устройство сами."
"Dialogue voice" = "Голос в диалогах"
"On: lines are spoken. Off: they are silent from the next line on, and still last as long as their sound." = "Вкл.: реплики звучат. Выкл.: со следующей реплики они беззвучны, но длятся столько же, сколько их звук."
"Gameplay" = "Игра"
"Turn to each other in dialogue" = "Поворот друг к другу в диалоге"
"On: at the start of a conversation the actor turns to the player and the view turns to the actor." = "Вкл.: в начале разговора собеседник поворачивается к игроку, а взгляд — к собеседнику."
"Bring the view back when choices appear" = "Возвращать взгляд при выборе ответа"
"On: when choices appear the view returns to the speaker (with the close-up off). Needs \"Turn to each other in dialogue\"." = "Вкл.: при появлении ответов взгляд возвращается к говорящему (при выключенном приближении). Нужен «Поворот друг к другу в диалоге»."
"Close in on the speaker in dialogue" = "Приближение к говорящему"
"On: in a conversation the view closes in on the speaker, the background out of focus; the mouse moves only the cursor. Off: you can look around." = "Вкл.: в разговоре взгляд приближается к говорящему, фон размыт; мышь двигает только курсор. Выкл.: можно осматриваться."
"Goodbye hint" = "Подсказка «Goodbye»"
"On: \"[Tab] Goodbye\" stands at the left of the dialogue box while a Goodbye choice is offered. Off: hidden; Tab still says goodbye." = "Вкл.: слева от окна диалога стоит «[Tab] Goodbye», пока можно попрощаться. Выкл.: скрыто; Tab всё равно прощается."
"Aim assist" = "Помощь в прицеливании"
"Controller only. On: the right stick turns slower over a nearby hostile, and aiming down the sights pulls the view onto one near the crosshair." = "Только для геймпада. Вкл.: правый стик поворачивает медленнее над ближним врагом, а прицеливание наводит взгляд на врага рядом с перекрестием."
"Controller" = "Геймпад"
"Aim slowdown" = "Замедление прицела"
"How much slower the right stick turns while the crosshair is on a nearby hostile (0: not at all)." = "Насколько медленнее поворачивает правый стик, пока прицел на ближнем враге (0: не замедляет)."
"Aim lock-on" = "Доводка прицела"
"How hard aiming down the sights turns the view onto a hostile near the crosshair (0: not at all). Push the right stick away to break it." = "Насколько сильно прицеливание наводит взгляд на врага рядом с перекрестием (0: не наводит). Чтобы сорваться, отведите правый стик в сторону."
"Use Pip-Boy" = "Носить Pip-Boy"
"On: the Pip-Boy is worn and the menus come up on the arm. Off: it is taken off and the menus show full screen, as always without a Pip-Boy." = "Вкл.: Pip-Boy надет, меню открываются на руке. Выкл.: он снят, меню во весь экран, как всегда без Pip-Boy."
"Kill camera" = "Камера убийства"
"When a VATS shot kills its last mark, a camera shows the kill. Last enemy: only when no other enemy still fights you. Every kill: always. Off: never." = "Когда выстрел в VATS убивает последнюю цель, камера показывает убийство. Последний враг: только когда с вами больше никто не сражается. Каждое убийство: всегда. Выкл.: никогда."
"V.A.T.S. style" = "Стиль V.A.T.S."
"What the V.A.T.S. key starts. Classic: the world stops and you pick body parts to hit. Mark and Fire: time runs very slowly while you mark targets." = "Что запускает клавиша V.A.T.S. Классический: мир останавливается, и вы выбираете, в какие части тела попасть. Отметить и стрелять: время идёт очень медленно, пока вы отмечаете цели."
"V.A.T.S. time slowdown" = "Замедление времени в V.A.T.S."
"How far the world slows while you choose targets in Classic: 100% stops it, 50% runs at half speed. Enemies attack at anything less than a stop." = "Насколько замедляется мир, пока вы выбираете цели в классическом стиле: 100% останавливает его, 50% — половина скорости. Без полной остановки враги атакуют."
"Slower while reloading" = "Медленнее при перезарядке"
"On: you and the NPCs move at 75% of your speed while a reload runs. Off: reloading does not slow anyone, as in the original." = "Вкл.: пока идёт перезарядка, вы и NPC двигаетесь на 75% скорости. Выкл.: перезарядка никого не замедляет, как в оригинале."
"Difficulty" = "Сложность"
"How hard the fights are: from Very Easy (your hits do double damage, you take half) to Very Hard (half and double); Normal as they are." = "Насколько тяжелы бои: от Очень легко (ваши удары наносят двойной урон, вы получаете половину) до Очень тяжело (половину и двойной); на Нормально урон как есть."
"Dynamic crosshair" = "Динамический прицел"
"On: with a gun or thrown weapon drawn the crosshair opens with how wide your shots spread now. Off: the arrows stay together." = "Вкл.: с огнестрельным или метательным оружием в руках прицел раскрывается по текущему разбросу выстрелов. Выкл.: стрелки не расходятся."
"Crosshair style" = "Вид прицела"
"With Dynamic crosshair on. Cross: four bars that part with the spread. Arrows: the plain crosshair's two arrows part instead." = "При включённом динамическом прицеле. Крест: четыре черты, расходящиеся с разбросом. Стрелки: расходятся две стрелки обычного прицела."
"Detached third-person camera" = "Свободная камера от третьего лица"
"On: in third person with your weapon away the mouse turns the camera around you and you run whichever way you push. Off: the camera stays behind you." = "Вкл.: от третьего лица с убранным оружием мышь вращает камеру вокруг вас, а вы бежите туда, куда толкаете. Выкл.: камера остаётся за спиной."
"Language" = "Язык"
"The language of NVForever's own words (menus, messages). The game's own text is the install's." = "Язык собственных слов NVForever (меню, сообщения). Текст самой игры берётся из установленной игры."
"Interface" = "Интерфейс"
"Reverb" = "Реверберация"
"World sounds echo as the place you are in does (a cave, a hall, a small room). Off: they do not." = "Звуки мира отражаются так, как в месте, где вы находитесь (пещера, зал, маленькая комната). Выкл.: без отражений."
"Voice reverb" = "Реверберация голосов"
"What people say around you echoes in the place you are in, as Reverb does for world sounds. Conversations stay dry." = "То, что говорят вокруг вас, отражается в месте, где вы находитесь, как «Реверберация» делает со звуками мира. Разговоры остаются сухими."
"Sound" = "Звук"
"Master" = "Общая громкость"
"How loud all sound is: each volume below is a part of this one." = "Насколько громок весь звук: каждая громкость ниже — доля этой."
"Music" = "Музыка"
"The music of the place you are in and the main menu's theme." = "Музыка места, где вы находитесь, и тема главного меню."
"Footstep" = "Шаги"
"Footsteps, jumps and landings, yours and everyone's." = "Шаги, прыжки и приземления — ваши и чужие."
"Voice" = "Голоса"
"Spoken lines: conversations and what people say around you." = "Речь: разговоры и то, что говорят вокруг вас."
"Effects" = "Эффекты"
"Every other sound: weapons, impacts, menus, doors and the sounds of places." = "Все прочие звуки: оружие, удары, меню, двери и звуки мест."
"Radio" = "Радио"
"Radio stations, from the Pip-Boy and from radios in the world." = "Радиостанции — из Pip-Boy и из приёмников в мире."
"Freeze the picture in dialogue and menus" = "Замирание в диалогах и меню"
"On: animations, wind, water and sky stand still in conversations, the inventory and other menus, as in the original. Off: only game logic waits." = "Вкл.: в разговорах, инвентаре и других меню анимации, ветер, вода и небо замирают, как в оригинале. Выкл.: ждёт только игровая логика."
"Search" = "Поиск"
"Changed" = "Изменённые"
"Audio" = "Звук"
"Tweaks" = "Твики"
"Game" = "Общие"
"Dialogue" = "Диалог"
"Camera" = "Камера"
"Screen" = "Разрешение"
"Performance" = "Производительность"
"Picture" = "Изображение"
"Distance" = "Дальность"
"Quality" = "Качество"
"Previous heading" = "Предыдущий раздел"
"Next heading" = "Следующий раздел"
"Keyboard search" = "Поиск с клавиатуры"
"No settings here." = "Здесь нет настроек."
"No results." = "Ничего не найдено."
"No changed settings." = "Нет изменённых настроек."
"Stands for: {rows}." = "Обозначает: {rows}."
"Stands for: {rows} and {n} more." = "Обозначает: {rows} и ещё {n}."
"Button style" = "Вид кнопок"
"The names and pictures of the controller's buttons in prompts and hints. Auto: a PlayStation's when the controller says it is one, else an Xbox's." = "Названия и значки кнопок геймпада в подсказках. Авто: как у PlayStation, когда геймпад сообщает, что он такой, иначе как у Xbox."
"Light and noise gauges while sneaking" = "Шкалы света и шума в скрытности"
"On: two bars under the sneak word show how lit you are and how much noise you make, as detection counts them. Not in the original." = "Вкл.: две полоски под словом скрытности показывают, насколько вы освещены и сколько шумите, как их учитывает обнаружение. Нет в оригинале."
"Saving" = "Сохранение"
"Autosave after travel" = "Автосохранение после перехода"
"On: the game saves to the autosave slot after each loading screen (doors, coc, a script moving you); fast travel has its own row." = "Вкл.: игра сохраняется в ячейку автосохранения после каждого экрана загрузки (двери, coc, скрипт, переносящий вас); у быстрого перемещения своя строка."
"Save on fast travel" = "Сохранять при быстром перемещении"
"On: the game saves to the autosave slot when a fast travel arrives." = "Вкл.: игра сохраняется в ячейку автосохранения по прибытии быстрым перемещением."
"Save on wait" = "Сохранять после ожидания"
"On: the game saves to the autosave slot when a wait ends with at least one hour passed." = "Вкл.: игра сохраняется в ячейку автосохранения, когда ожидание длилось хотя бы час."
"Save on sleep" = "Сохранять после сна"
"On: the game saves to the autosave slot when the player wakes from a sleep of at least one hour." = "Вкл.: игра сохраняется в ячейку автосохранения, когда игрок просыпается после сна длиной хотя бы в час."
"Save when a script asks" = "Сохранять по запросу скрипта"
"On: a script's Autosave saves to the autosave slot (quest milestones), SystemSave to the system slot, ForceSave as a new save." = "Вкл.: Autosave из скрипта сохраняет в ячейку автосохранения (этапы заданий), SystemSave — в системную ячейку, ForceSave — как новое сохранение."
"Hardcore mode" = "Режим хардкор"
"On: you need water, food and sleep, stimpaks heal over time, ammo has weight, crippled limbs need a doctor's bag or a doctor. Off: none of that." = "Вкл.: нужны вода, еда и сон, стимуляторы лечат постепенно, патроны имеют вес, покалеченным конечностям нужна докторская сумка или доктор. Выкл.: ничего этого нет."
"HUD red" = "HUD: красный"
"HUD green" = "HUD: зелёный"
"HUD blue" = "HUD: синий"
"Pip-Boy red" = "Pip-Boy: красный"
"Pip-Boy green" = "Pip-Boy: зелёный"
"Pip-Boy blue" = "Pip-Boy: синий"
"One part of the colour above, 0 to 255; drag the meter or use Left and Right." = "Одна составляющая цвета выше, от 0 до 255; тяните шкалу или жмите влево и вправо."
"On: the music of the place you are in plays. Off: it is silent and goes on unheard." = "Вкл.: играет музыка места, где вы находитесь. Выкл.: она не звучит, но идёт дальше неслышно."
"HUD scale" = "Масштаб HUD"
"Size of the in-game HUD, independent of menu scale. Takes effect at the next start." = "Размер HUD в игре, не зависящий от масштаба меню. Вступает в силу при следующем запуске."
"Menu scale" = "Масштаб меню"
"Size of the main, pause and other menus, independent of HUD scale. Takes effect at the next start." = "Размер главного меню, меню паузы и других меню, не зависящий от HUD. Вступает в силу при следующем запуске."
"This terminal requires a password." = "Этот терминал требует пароль."
"You need a Science skill of {needed} to hack this terminal." = "Чтобы взломать этот терминал, нужен навык «Наука» не ниже {needed}."
"Lip sync" = "Движение губ"
"On: a speaker's face moves with the line. Off: a face that is moving eases back to rest." = "Вкл.: лицо говорящего движется вместе с репликой. Выкл.: движущееся лицо плавно возвращается в покой."
"Head tracking" = "Слежение головой"
"On: actors turn their heads to the player and to others near them. Off: heads ease back to their animation." = "Вкл.: персонажи поворачивают головы к игроку и к другим рядом. Выкл.: головы плавно возвращаются к анимации."
"Feet follow the ground" = "Ноги по земле"
"On: on slopes and steps actors bend their knees and set each foot on the ground under it. Off: the legs play the animation as it is." = "Вкл.: на склонах и ступенях персонажи сгибают колени и ставят каждую ногу на землю под ней. Выкл.: ноги играют анимацию как есть."
"Sky follows the game clock" = "Небо по игровым часам"
"On: the sky shows the game's time of day as it passes. Off: the sky keeps its hour while the game's clock runs on ([ and ] still set it)." = "Вкл.: небо показывает игровое время суток по мере его хода. Выкл.: небо держит свой час, а игровые часы идут дальше ([ и ] по-прежнему его меняют)."
"Resolution" = "Разрешение"
"The window's size, or in full screen the monitor's (its own size: borderless). A new one goes back after 20 seconds unless you keep it." = "Размер окна, а в полноэкранном режиме — монитора (его собственный размер: без рамки). Новое разрешение откатывается через 20 секунд, если его не сохранить."
"Full screen" = "Полный экран"
"On: the game fills its monitor without a frame, at the full screen resolution above. Off: a window of the window resolution." = "Вкл.: игра заполняет свой монитор без рамки, в полноэкранном разрешении выше. Выкл.: окно в оконном разрешении."
"Monitor" = "Монитор"
"The display the game opens on in full screen (the first display until you pick one)." = "Экран, на котором игра открывается в полноэкранном режиме (первый экран, пока вы не выберете другой)."
"Body in first person" = "Тело от первого лица"
"On: in first person you see your own body and legs when you look down. Off: only the arms and the weapon are drawn, as in the original." = "Вкл.: от первого лица, глядя вниз, вы видите своё тело и ноги. Выкл.: рисуются только руки и оружие, как в оригинале."
"Weapon sway" = "Покачивание оружия"
"On: in first person the arms and weapon lag behind a turn and bob as you walk and run. Off: they stay still in the view." = "Вкл.: от первого лица руки и оружие отстают при повороте и покачиваются при ходьбе и беге. Выкл.: они неподвижны."
"Head bob" = "Покачивание головы"
"On: in first person the view dips with each step as you walk and run. Off: it stays level." = "Вкл.: от первого лица взгляд опускается с каждым шагом при ходьбе и беге. Выкл.: он остаётся ровным."
"Lower weapon near walls" = "Опускать оружие у стен"
"On: in first person a drawn weapon lowers at a wall or a friend and comes back up when you aim or fire. Off: it stays up, as in the original." = "Вкл.: от первого лица оружие опускается перед стеной или другом и поднимается, когда вы целитесь или стреляете. Выкл.: оно остаётся поднятым, как в оригинале."
"True iron sights" = "Настоящие мушки"
"On: aiming a gun lines its sights up with your eye and hides the crosshair. Off: the gun is held low with the crosshair, as in the original." = "Вкл.: при прицеливании прицельные приспособления совмещаются с глазом, а перекрестие скрыто. Выкл.: оружие держится низко, с перекрестием, как в оригинале."
"3D scopes (test)" = "Объёмные прицелы (тест)"
"On: a scoped gun stays on screen and shows the zoomed view in its lens. Off: the full-screen scope picture, as in the original." = "Вкл.: оружие с оптикой остаётся на экране, а увеличенный вид показан в линзе прицела. Выкл.: полноэкранная картинка прицела, как в оригинале."
"Sun shadows" = "Солнечные тени"
"The sun's shadows: Off, Performance (cheaper outdoors; moving shadows update at half the frame rate) or Quality. The original casts none from the world." = "Тени от солнца: Выкл., Производительность (дешевле снаружи; движущиеся тени обновляются вдвое реже) или Качество. В оригинале мир теней от солнца не отбрасывает."
"Grass" = "Трава"
"On: grass grows on the landscape; the cells around you get theirs over the next frames. Off: it is hidden and none grows on new cells." = "Вкл.: на земле растёт трава; ячейки вокруг вас получают её за следующие кадры. Выкл.: трава скрыта и на новых ячейках не растёт."
"Distant terrain and objects" = "Дальняя земля и объекты"
"On: distant land, buildings and trees are drawn beyond the loaded cells (outdoors). Off: the world ends at the loaded cells." = "Вкл.: дальняя земля, здания и деревья рисуются за загруженными ячейками (снаружи). Выкл.: мир кончается на загруженных ячейках."
"Colour grade" = "Цветокоррекция"
"On: the picture is graded by the worldspace's, the weather's and the cell's image space. Off: the picture as lit, for comparisons." = "Вкл.: картинка окрашена по пространству изображения мира, погоды и ячейки. Выкл.: картинка как освещена, для сравнения."
"Text overlay" = "Текст поверх картинки"
"On: the position, loading counts and key help are written over the picture. Off by default in the game." = "Вкл.: поверх картинки пишутся положение, счётчики загрузки и подсказки клавиш. В игре по умолчанию выключено."
"Shot markers" = "Метки попаданий"
"On: a cross is drawn at each impact and a line from the muzzle along each hitscan shot." = "Вкл.: в каждой точке попадания рисуется крестик, а от дула вдоль каждого мгновенного выстрела — линия."
"God mode" = "Режим бога"
"On: the player takes no damage from hits and cannot be killed by them." = "Вкл.: игрок не получает урона от попаданий и не может от них погибнуть."
"Draw the navmesh" = "Показывать навигационную сетку"
"On: the navmesh near the camera and the walking NPCs' paths are drawn." = "Вкл.: рисуется навигационная сетка рядом с камерой и пути идущих NPC."
"Frame rate counter" = "Счётчик кадров"
"On: a panel of performance readings at the top right; the Counter rows below choose what it shows. Not in the original." = "Вкл.: панель показателей производительности в правом верхнем углу; строки Counter ниже выбирают, что она показывает. Нет в оригинале."
"Display sync" = "Синхронизация"
"Vertical sync: frames wait for the display (no tearing). Variable refresh: for a G-Sync or FreeSync screen. Off: frames show at once (may tear)." = "Вертикальная синхронизация: кадры ждут экран (без разрывов). Переменная частота: для экрана с G-Sync или FreeSync. Выкл.: кадры показываются сразу (возможны разрывы)."
"Upscaler" = "Масштабирование"
"Upscaling mode" = "Режим масштабирования"
"FSR 3.1 or NVIDIA DLSS rebuilds the world at display resolution, at the mode below. DLSS needs an NVIDIA RTX card and its files in the dlss folder." = "FSR 3.1 или NVIDIA DLSS восстанавливает мир в разрешении экрана, в режиме ниже. Для DLSS нужны видеокарта NVIDIA RTX и его файлы в папке dlss."
"The share of the screen the world is drawn at; the upscaler rebuilds the rest. Native AA: full size. Quality to Ultra Performance: ever faster." = "Доля экрана, в которой рисуется мир; масштабирование восстанавливает остальное. Нативное AA: полный размер. От «Качество» до «Макс. производительность»: всё быстрее."
"DLSS model" = "Модель DLSS"
"Which DLSS model rebuilds the picture (NVIDIA calls them presets). Default, recommended: NVIDIA picks per mode. Only while DLSS draws." = "Какая модель DLSS восстанавливает картинку (NVIDIA называет их пресетами). По умолчанию, рекомендуется: NVIDIA выбирает по режиму. Только пока рисует DLSS."
"Default" = "По умолчанию"
"DLSS only" = "Только с DLSS"
"World" = "Мир"
"Display" = "Экран"
"Debug" = "Отладка"
"Graphics" = "Графика"
"Field of view" = "Поле зрения"
"The game's field of view in degrees across a 4:3 picture (75 as the original's default); wider screens see more at the sides." = "Поле зрения игры в градусах по ширине картинки 4:3 (75 — значение оригинала по умолчанию); на широких экранах видно больше по бокам."
"Frame rate limit" = "Предел кадров"
"At most this many frames a second (Off: no limit of its own). A lower limit keeps the computer cooler and quieter." = "Не больше стольких кадров в секунду (Выкл.: без собственного предела). Чем ниже предел, тем холоднее и тише компьютер."
"Object distance" = "Дальность объектов"
"How far from you objects of the loaded cells (buildings, rocks, furniture, clutter) are drawn. Lower draws fewer and runs faster." = "Как далеко от вас рисуются объекты загруженных ячеек (здания, скалы, мебель, мелочи). Меньше — рисуется меньше и работает быстрее."
"Actor distance" = "Дальность персонажей"
"How far from you people and creatures are drawn, as a part of the farthest the loaded cells reach." = "Как далеко от вас рисуются люди и существа, как доля самой большой дальности загруженных ячеек."
"Item distance" = "Дальность предметов"
"How far from you items lying in the world are drawn, as a part of the farthest the loaded cells reach." = "Как далеко от вас рисуются предметы, лежащие в мире, как доля самой большой дальности загруженных ячеек."
"Shadow distance" = "Дальность теней"
"How far from you the sun casts shadows (with Sun shadows on), as a part of the farthest shadow distance." = "Как далеко от вас солнце отбрасывает тени (при включённых солнечных тенях), как доля наибольшей дальности теней."
"Grass distance" = "Дальность травы"
"How far from you grass is drawn, as a part of the farthest grass distance and its fade range." = "Как далеко от вас рисуется трава, как доля наибольшей дальности травы и её зоны угасания."
"Anti-aliasing" = "Сглаживание"
"How edges are smoothed: multisampling 2x, 4x or 8x (dearer at each step) or FXAA, SMAA or TAA afterwards. Reads Off while an upscaler is on." = "Как сглаживаются края: мультисэмплинг 2x, 4x или 8x (дороже с каждым шагом) или FXAA, SMAA или TAA после. Пока включено масштабирование, показывает Выкл."
"Shadow filtering" = "Фильтрация теней"
"How the sun's shadow edges are softened: Fast (harder, cheapest), Smooth (as vanilla) or Temporal (grainy unless Anti-aliasing is TAA)." = "Как смягчаются края солнечных теней: Быстрая (резче, дешевле всего), Мягкая (как в оригинале) или Временная (зернисто, если сглаживание не TAA)."
"Ambient occlusion" = "Затенение окружения"
"On: creases, corners and the ground under things are darkened by how enclosed they are (screen-space, from the depth). Not in the original." = "Вкл.: складки, углы и земля под предметами затемняются тем сильнее, чем они закрытее (в экранном пространстве, по глубине). Нет в оригинале."
"Longer sun shadows" = "Длинные солнечные тени"
"On: the sun's shadows reach half as far again as the shadow distance. Costs a little frame rate." = "Вкл.: солнечные тени тянутся в полтора раза дальше дальности теней. Немного снижает частоту кадров."
"Bloom" = "Свечение (bloom)"
"On: light brighter than a sunlit white wall (the sun, lamps, windows) glows into its surroundings, on top of the game's own image space." = "Вкл.: свет ярче освещённой солнцем белой стены (солнце, лампы, окна) растекается свечением вокруг, поверх собственного пространства изображения игры."
"Light glow (HDR)" = "Сияние света (HDR)"
"On: neon, lamps, beams and fire glow softly, as the original's HDR glow does, as much as the place's image space asks. Bloom adds to it." = "Вкл.: неон, лампы, лучи и огонь мягко сияют, как HDR-сияние оригинала, насколько просит пространство изображения места. Свечение (bloom) добавляется к нему."
"Eye adaptation" = "Привыкание глаз"
"On: dark views brighten after a moment, as the eye gets used to the dark, by the place's image space. Needs the light glow." = "Вкл.: тёмные виды через миг светлеют, как глаз привыкает к темноте, по пространству изображения места. Нужно сияние света."
"Neon glow" = "Неоновый ореол"
"On: where the image space asks for a strong glow (the Strip at night) neon burns with a wide halo, as in the original. Needs the light glow." = "Вкл.: где пространство изображения просит сильного сияния (Strip ночью), неон горит с широким ореолом, как в оригинале. Нужно сияние света."
"Sharpening" = "Резкость"
"On: the final picture is sharpened where it has little contrast (contrast-adaptive sharpening)." = "Вкл.: итоговая картинка повышает резкость там, где у неё мало контраста (адаптивная к контрасту резкость)."
"Anisotropic filtering 16x" = "Анизотропная фильтрация 16x"
"On: textures seen at a slant stay sharp further (16x instead of 8x). For textures loaded from now on (the cells loaded next)." = "Вкл.: текстуры под наклоном остаются чёткими дальше (16x вместо 8x). Для текстур, загруженных с этого момента (следующие загруженные ячейки)."
"Sun shafts" = "Солнечные лучи"
"On: sunlight streams past what stands in front of the sun, stronger the hazier the weather's fog. Not in the original." = "Вкл.: солнечный свет пробивается мимо того, что стоит перед солнцем, тем сильнее, чем туманнее погода. Нет в оригинале."
"Screen-space water reflections" = "Экранные отражения в воде"
"On: water the mirrored reflection does not reach (another height, interiors) reflects what is on the screen instead of only the sky." = "Вкл.: вода, до которой не достаёт зеркальное отражение (другая высота, интерьеры), отражает то, что на экране, а не только небо."
"Mirrored water reflections" = "Зеркальные отражения в воде"
"On: water mirrors the world above it, as in the original, drawing the scene a second time. Off: it reflects the sky." = "Вкл.: вода отражает мир над собой, как в оригинале, рисуя сцену второй раз. Выкл.: она отражает небо."
"Quality preset" = "Набор качества"
"Sets the rows the original's quality presets cover to the game folder's low.ini to VeryHigh.ini. Custom: those rows match none of them." = "Задаёт строкам, которые охватывают наборы качества оригинала, значения от low.ini до VeryHigh.ini из папки игры. Свой: эти строки не совпадают ни с одним набором."
"Enhanced effects" = "Улучшенные эффекты"
"Sets every effect of the enhanced look at once. On: all of them. Off: none, the original's picture. Custom: some on, some off. Each keeps its own row." = "Задаёт сразу все эффекты улучшенного вида. Вкл.: все. Выкл.: ни одного, изображение оригинала. Свой: часть включена, часть нет. У каждого остаётся своя строка."
"Off (upscaling active)" = "Выкл. (работает масштабирование)"
"DLSS (restart)" = "DLSS (перезапуск)"
"Needs an upscaler" = "Нужно масштабирование"
"Not with DLSS" = "Не с DLSS"
"DLSS needs Windows" = "DLSS работает только в Windows"
"DLSS needs the Vulkan renderer" = "Для DLSS нужна отрисовка через Vulkan"
"DLSS files missing: choose Download DLSS… in this list, or put them in the dlss folder beside nvforever.exe, then restart" = "Нет файлов DLSS: выберите «Скачать DLSS…» в этом списке или положите их в папку dlss рядом с nvforever.exe и перезапустите"
"The dlss folder holds NVIDIA's updater (nvngx_update.exe): remove it, then restart" = "В папке dlss лежит программа обновления NVIDIA (nvngx_update.exe): удалите её и перезапустите"
"A file in the dlss folder is not from the tested NVIDIA release (Streamline 2.14.16)" = "Файл в папке dlss не из проверенного выпуска NVIDIA (Streamline 2.14.16)"
"DLSS did not start (the log says why)" = "DLSS не запустился (причина в журнале)"
"A graphics card the game may use cannot run DLSS" = "Видеокарта, которую может выбрать игра, не поддерживает DLSS"
"Not on this GPU or driver (DLSS needs an NVIDIA RTX card)" = "Не на этой видеокарте или драйвере (для DLSS нужна карта NVIDIA RTX)"
"DLSS stopped working this session; it is tried again at the next start" = "DLSS перестал работать в этом сеансе; при следующем запуске будет новая попытка"
"FSR 3.1 cannot run on this GPU" = "FSR 3.1 не работает на этой видеокарте"
"Frame generation" = "Генерация кадров"
"Generated frames" = "Сгенерированные кадры"
"Needs an NVIDIA RTX 40 series or newer" = "Нужна NVIDIA RTX серии 40 или новее"
"Needs hardware-accelerated GPU scheduling" = "Нужно аппаратное планирование GPU"
"Needs a newer NVIDIA driver" = "Нужен более новый драйвер NVIDIA"
"The DLSS Frame Generation files are missing" = "Нет файлов DLSS Frame Generation"
"Needs vsync off" = "Нужна выключенная вертикальная синхронизация"
"Needs DLSS frame generation" = "Нужна генерация кадров DLSS"
"Frames made between the real ones: smoother motion, input a little later. FSR 3.1 needs FSR upscaling; DLSS an RTX 40 or newer. Not in the original." = "Кадры между настоящими: движение плавнее, отклик чуть позже. FSR 3.1 нужно масштабирование FSR, DLSS — RTX 40 или новее. Нет в оригинале."
"How many frames DLSS frame generation makes per real frame: 2x one, 3x two, 4x three (3x and 4x on RTX 50 series). Not in the original." = "Сколько кадров генерация кадров DLSS создаёт на каждый настоящий: 2x один, 3x два, 4x три (3x и 4x на серии RTX 50). Нет в оригинале."
"Controls" = "Управление"
