# NVForever's own words in Español (#1948). Written for NVForever, not copied from the
# game (LEGAL.md). Choice names (Off, Auto, Last enemy, Amber …) are
# translated, and the notes name them as they are shown. How to add or fix a line:
# README.md beside this file.

name = "Español"

[words]
# [design, #2200; engine/nvf-play/src/pause.rs] NVForever's device selection.
"Automatic Input Switching" = "Cambio automático de dispositivo"
"On: a controller button, stick or trigger selects Controller; a key or mouse click selects Keyboard and Mouse (mouse motion does not). Off: choose Input Device yourself." = "Activado: un botón, palanca o gatillo del mando selecciona Mando; una tecla o un clic selecciona Teclado y ratón (mover el ratón no). Desactivado: elige tú el dispositivo."
"Dialogue voice" = "Voces en los diálogos"
"On: lines are spoken. Off: they are silent from the next line on, and still last as long as their sound." = "Activado: las frases se oyen. Desactivado: desde la siguiente frase se callan, aunque duran lo mismo que su sonido."
"Gameplay" = "Juego"
"Turn to each other in dialogue" = "Mirarse en el diálogo"
"On: at the start of a conversation the actor turns to the player and the view turns to the actor." = "Activado: al empezar una conversación el personaje se gira hacia el jugador y la vista hacia el personaje."
"Bring the view back when choices appear" = "Recentrar la vista al aparecer las respuestas"
"On: when choices appear the view returns to the speaker (with the close-up off). Needs \"Turn to each other in dialogue\"." = "Activado: al aparecer las respuestas la vista vuelve a quien habla (con el acercamiento desactivado). Requiere «Mirarse en el diálogo»."
"Close in on the speaker in dialogue" = "Acercarse a quien habla en el diálogo"
"On: in a conversation the view closes in on the speaker, the background out of focus; the mouse moves only the cursor. Off: you can look around." = "Activado: en una conversación la vista se acerca a quien habla, con el fondo desenfocado; el ratón solo mueve el cursor. Desactivado: puedes mirar a tu alrededor."
"Goodbye hint" = "Aviso «Goodbye»"
"On: \"[Tab] Goodbye\" stands at the left of the dialogue box while a Goodbye choice is offered. Off: hidden; Tab still says goodbye." = "Activado: «[Tab] Goodbye» aparece a la izquierda del cuadro de diálogo mientras se ofrece una respuesta Goodbye. Desactivado: oculto; Tab sigue despidiéndose."
"Aim assist" = "Ayuda al apuntar"
"Controller only. On: the right stick turns slower over a nearby hostile, and aiming down the sights pulls the view onto one near the crosshair." = "Solo mando. Activado: el stick derecho gira más despacio sobre un enemigo cercano, y apuntar con el arma lleva la vista a uno cerca de la mira."
"Controller" = "Mando"
"Aim slowdown" = "Frenado de la mira"
"How much slower the right stick turns while the crosshair is on a nearby hostile (0: not at all)." = "Cuánto más despacio gira el stick derecho mientras la mira está sobre un enemigo cercano (0: nada)."
"Aim lock-on" = "Fijado de la mira"
"How hard aiming down the sights turns the view onto a hostile near the crosshair (0: not at all). Push the right stick away to break it." = "Con qué fuerza apuntar con el arma lleva la vista a un enemigo cerca de la mira (0: nada). Mueve el stick derecho hacia fuera para soltarte."
"Use Pip-Boy" = "Llevar el Pip-Boy"
"On: the Pip-Boy is worn and the menus come up on the arm. Off: it is taken off and the menus show full screen, as always without a Pip-Boy." = "Activado: el Pip-Boy se lleva puesto y los menús aparecen en el brazo. Desactivado: se quita y los menús ocupan la pantalla, como siempre sin Pip-Boy."
"Kill camera" = "Cámara de muerte"
"When a VATS shot kills its last mark, a camera shows the kill. Last enemy: only when no other enemy still fights you. Every kill: always. Off: never." = "Cuando un disparo de VATS mata a su último objetivo, una cámara muestra la muerte. Último enemigo: solo si nadie más lucha contigo. Cada muerte: siempre. Desactivado: nunca."
"V.A.T.S. style" = "Estilo de V.A.T.S."
"What the V.A.T.S. key starts. Classic: the world stops and you pick body parts to hit. Mark and Fire: time runs very slowly while you mark targets." = "Lo que inicia la tecla de V.A.T.S. Clásico: el mundo se detiene y eliges a qué partes del cuerpo disparar. Marcar y disparar: el tiempo va muy despacio mientras marcas objetivos."
"V.A.T.S. time slowdown" = "Ralentización del tiempo en V.A.T.S."
"How far the world slows while you choose targets in Classic: 100% stops it, 50% runs at half speed. Enemies attack at anything less than a stop." = "Cuánto se ralentiza el mundo mientras eliges objetivos en Clásico: 100% lo detiene, 50% va a media velocidad. Con menos de una parada, los enemigos atacan."
"Slower while reloading" = "Más lento al recargar"
"On: you and the NPCs move at 75% of your speed while a reload runs. Off: reloading does not slow anyone, as in the original." = "Activado: tú y los PNJ os movéis al 75% de vuestra velocidad mientras dura una recarga. Desactivado: recargar no frena a nadie, como en el original."
"Difficulty" = "Dificultad"
"How hard the fights are: from Very Easy (your hits do double damage, you take half) to Very Hard (half and double); Normal as they are." = "Lo duros que son los combates: de Muy fácil (tus golpes hacen el doble de daño y recibes la mitad) a Muy difícil (mitad y doble); Normal tal cual."
"Dynamic crosshair" = "Mira dinámica"
"On: with a gun or thrown weapon drawn the crosshair opens with how wide your shots spread now. Off: the arrows stay together." = "Activado: con un arma de fuego o arrojadiza en la mano la mira se abre según cuánto se dispersan ahora tus disparos. Desactivado: las flechas no se separan."
"Crosshair style" = "Estilo de mira"
"With Dynamic crosshair on. Cross: four bars that part with the spread. Arrows: the plain crosshair's two arrows part instead." = "Con la mira dinámica activada. Cruz: cuatro trazos que se separan con la dispersión. Flechas: se separan en su lugar las dos flechas de la mira simple."
"Detached third-person camera" = "Cámara libre en tercera persona"
"On: in third person with your weapon away the mouse turns the camera around you and you run whichever way you push. Off: the camera stays behind you." = "Activado: en tercera persona con el arma guardada el ratón gira la cámara a tu alrededor y corres hacia donde empujes. Desactivado: la cámara se queda detrás de ti."
"Language" = "Idioma"
"The language of NVForever's own words (menus, messages). The game's own text is the install's." = "El idioma de los textos propios de NVForever (menús, mensajes). El texto del propio juego es el de la instalación."
"Interface" = "Interfaz"
"Reverb" = "Reverberación"
"World sounds echo as the place you are in does (a cave, a hall, a small room). Off: they do not." = "Los sonidos del mundo resuenan como el lugar donde estás (una cueva, una sala, un cuarto pequeño). Desactivado: no resuenan."
"Voice reverb" = "Reverberación de voces"
"What people say around you echoes in the place you are in, as Reverb does for world sounds. Conversations stay dry." = "Lo que dice la gente a tu alrededor resuena en el lugar donde estás, como hace Reverberación con los sonidos del mundo. Las conversaciones se quedan secas."
"Sound" = "Sonido"
"Master" = "Volumen general"
"How loud all sound is: each volume below is a part of this one." = "Lo alto que suena todo: cada volumen de abajo es una parte de este."
"Music" = "Música"
"The music of the place you are in and the main menu's theme." = "La música del lugar donde estás y el tema del menú principal."
"Footstep" = "Pasos"
"Footsteps, jumps and landings, yours and everyone's." = "Pasos, saltos y aterrizajes, tuyos y de todos."
"Voice" = "Voces"
"Spoken lines: conversations and what people say around you." = "Frases habladas: conversaciones y lo que dice la gente a tu alrededor."
"Effects" = "Efectos"
"Every other sound: weapons, impacts, menus, doors and the sounds of places." = "Todos los demás sonidos: armas, impactos, menús, puertas y los sonidos de los lugares."
"Radio" = "Radio"
"Radio stations, from the Pip-Boy and from radios in the world." = "Las emisoras de radio, del Pip-Boy y de las radios del mundo."
"Freeze the picture in dialogue and menus" = "Congelar la imagen en diálogos y menús"
"On: animations, wind, water and sky stand still in conversations, the inventory and other menus, as in the original. Off: only game logic waits." = "Activado: en conversaciones, el inventario y otros menús se detienen animaciones, viento, agua y cielo, como en el original. Desactivado: solo espera la lógica del juego."
"Search" = "Buscar"
"Changed" = "Cambiados"
"Audio" = "Audio"
"Tweaks" = "Retoques"
"Game" = "General"
"Dialogue" = "Diálogo"
"Camera" = "Cámara"
"Screen" = "Resolución"
"Performance" = "Rendimiento"
"Picture" = "Imagen"
"Distance" = "Distancia"
"Quality" = "Calidad"
"Previous heading" = "Sección anterior"
"Next heading" = "Sección siguiente"
"Keyboard search" = "Búsqueda con teclado"
"No settings here." = "Aquí no hay ajustes."
"No results." = "Sin resultados."
"No changed settings." = "No hay ajustes cambiados."
"Stands for: {rows}." = "Representa: {rows}."
"Stands for: {rows} and {n} more." = "Representa: {rows} y {n} más."
"Button style" = "Estilo de botones"
"The names and pictures of the controller's buttons in prompts and hints. Auto: a PlayStation's when the controller says it is one, else an Xbox's." = "Los nombres e imágenes de los botones del mando en avisos y pistas. Auto: los de PlayStation cuando el mando dice serlo; si no, los de Xbox."
"Light and noise gauges while sneaking" = "Indicadores de luz y ruido en sigilo"
"On: two bars under the sneak word show how lit you are and how much noise you make, as detection counts them. Not in the original." = "Activado: dos barras bajo la palabra de sigilo muestran cuánta luz te da y cuánto ruido haces, tal como los cuenta la detección. No está en el original."
"Saving" = "Guardado"
"Autosave after travel" = "Autoguardado tras un viaje"
"On: the game saves to the autosave slot after each loading screen (doors, coc, a script moving you); fast travel has its own row." = "Activado: el juego guarda en la ranura de autoguardado tras cada pantalla de carga (puertas, coc, un script que te mueve); el viaje rápido tiene su propia fila."
"Save on fast travel" = "Guardar al viajar rápido"
"On: the game saves to the autosave slot when a fast travel arrives." = "Activado: el juego guarda en la ranura de autoguardado al llegar un viaje rápido."
"Save on wait" = "Guardar al esperar"
"On: the game saves to the autosave slot when a wait ends with at least one hour passed." = "Activado: el juego guarda en la ranura de autoguardado cuando termina una espera de al menos una hora."
"Save on sleep" = "Guardar al dormir"
"On: the game saves to the autosave slot when the player wakes from a sleep of at least one hour." = "Activado: el juego guarda en la ranura de autoguardado cuando el jugador despierta de un sueño de al menos una hora."
"Save when a script asks" = "Guardar cuando lo pide un script"
"On: a script's Autosave saves to the autosave slot (quest milestones), SystemSave to the system slot, ForceSave as a new save." = "Activado: Autosave en un script guarda en la ranura de autoguardado (hitos de misiones), SystemSave en la ranura del sistema, ForceSave como partida nueva."
"Hardcore mode" = "Modo hardcore"
"On: you need water, food and sleep, stimpaks heal over time, ammo has weight, crippled limbs need a doctor's bag or a doctor. Off: none of that." = "Activado: necesitas agua, comida y sueño, los estimulantes curan con el tiempo, la munición pesa, las extremidades tullidas piden maletín de médico o médico. Desactivado: nada de eso."
"HUD red" = "HUD rojo"
"HUD green" = "HUD verde"
"HUD blue" = "HUD azul"
"Pip-Boy red" = "Pip-Boy rojo"
"Pip-Boy green" = "Pip-Boy verde"
"Pip-Boy blue" = "Pip-Boy azul"
"One part of the colour above, 0 to 255; drag the meter or use Left and Right." = "Una parte del color de arriba, de 0 a 255; arrastra el indicador o usa Izquierda y Derecha."
"On: the music of the place you are in plays. Off: it is silent and goes on unheard." = "Activado: suena la música del lugar donde estás. Desactivado: se calla y sigue sin oírse."
"UI scale" = "Escala de la interfaz"
"The size of the HUD and the menus, as a part of the original's. Above 100% only the HUD grows. Takes effect at the next start." = "El tamaño del HUD y los menús, como parte del del original. Por encima del 100% solo crece el HUD. Se aplica en el siguiente inicio."
"This terminal requires a password." = "Este terminal necesita una contraseña."
"You need a Science skill of {needed} to hack this terminal." = "Necesitas una habilidad de Ciencia de {needed} para piratear este terminal."
"Lip sync" = "Sincronía labial"
"On: a speaker's face moves with the line. Off: a face that is moving eases back to rest." = "Activado: la cara de quien habla se mueve con la frase. Desactivado: una cara en movimiento vuelve poco a poco al reposo."
"Head tracking" = "Seguimiento con la cabeza"
"On: actors turn their heads to the player and to others near them. Off: heads ease back to their animation." = "Activado: los personajes giran la cabeza hacia el jugador y hacia otros cercanos. Desactivado: las cabezas vuelven poco a poco a su animación."
"Feet follow the ground" = "Pies sobre el suelo"
"On: on slopes and steps actors bend their knees and set each foot on the ground under it. Off: the legs play the animation as it is." = "Activado: en pendientes y escalones los personajes doblan las rodillas y apoyan cada pie en el suelo bajo él. Desactivado: las piernas siguen la animación tal cual."
"Sky follows the game clock" = "Cielo según el reloj del juego"
"On: the sky shows the game's time of day as it passes. Off: the sky keeps its hour while the game's clock runs on ([ and ] still set it)." = "Activado: el cielo muestra la hora del juego según pasa. Desactivado: el cielo mantiene su hora mientras el reloj del juego sigue ([ y ] aún la cambian)."
"Resolution" = "Resolución"
"The window's size, or in full screen the monitor's (its own size: borderless). A new one goes back after 20 seconds unless you keep it." = "El tamaño de la ventana o, a pantalla completa, el del monitor (su propio tamaño: sin bordes). Una nueva se deshace a los 20 segundos si no la conservas."
"Full screen" = "Pantalla completa"
"On: the game fills its monitor without a frame, at the full screen resolution above. Off: a window of the window resolution." = "Activado: el juego llena su monitor sin marco, a la resolución de pantalla completa de arriba. Desactivado: una ventana a la resolución de ventana."
"Monitor" = "Monitor"
"The display the game opens on in full screen (the first display until you pick one)." = "La pantalla en la que se abre el juego a pantalla completa (la primera hasta que elijas otra)."
"Body in first person" = "Cuerpo en primera persona"
"On: in first person you see your own body and legs when you look down. Off: only the arms and the weapon are drawn, as in the original." = "Activado: en primera persona ves tu cuerpo y tus piernas al mirar abajo. Desactivado: solo se dibujan los brazos y el arma, como en el original."
"Weapon sway" = "Balanceo del arma"
"On: in first person the arms and weapon lag behind a turn and bob as you walk and run. Off: they stay still in the view." = "Activado: en primera persona los brazos y el arma se retrasan al girar y se mecen al andar y correr. Desactivado: se quedan quietos en la vista."
"Head bob" = "Balanceo de la cabeza"
"On: in first person the view dips with each step as you walk and run. Off: it stays level." = "Activado: en primera persona la vista baja con cada paso al andar y correr. Desactivado: se mantiene nivelada."
"Lower weapon near walls" = "Bajar el arma junto a paredes"
"On: in first person a drawn weapon lowers at a wall or a friend and comes back up when you aim or fire. Off: it stays up, as in the original." = "Activado: en primera persona un arma desenfundada baja ante una pared o un amigo y vuelve a subir al apuntar o disparar. Desactivado: se queda arriba, como en el original."
"True iron sights" = "Miras de hierro reales"
"On: aiming a gun lines its sights up with your eye and hides the crosshair. Off: the gun is held low with the crosshair, as in the original." = "Activado: al apuntar, las miras del arma se alinean con tu ojo y la mira en pantalla se oculta. Desactivado: el arma se lleva baja con la mira en pantalla, como en el original."
"3D scopes (test)" = "Miras telescópicas 3D (prueba)"
"On: a scoped gun stays on screen and shows the zoomed view in its lens. Off: the full-screen scope picture, as in the original." = "Activado: un arma con mira telescópica sigue en pantalla y muestra la vista ampliada en su lente. Desactivado: la imagen de mira a pantalla completa, como en el original."
"Sun shadows" = "Sombras del sol"
"The sun's shadows: Off, Performance (cheaper outdoors; moving shadows update at half the frame rate) or Quality. The original casts none from the world." = "Las sombras del sol: Desactivado, Rendimiento (más barato al aire libre; las sombras móviles a media tasa de fotogramas) o Calidad. El original no proyecta ninguna del mundo."
"Grass" = "Hierba"
"On: grass grows on the landscape; the cells around you get theirs over the next frames. Off: it is hidden and none grows on new cells." = "Activado: la hierba crece en el paisaje; las celdas a tu alrededor reciben la suya en los siguientes fotogramas. Desactivado: se oculta y no crece en celdas nuevas."
"Distant terrain and objects" = "Terreno y objetos lejanos"
"On: distant land, buildings and trees are drawn beyond the loaded cells (outdoors). Off: the world ends at the loaded cells." = "Activado: la tierra, los edificios y los árboles lejanos se dibujan más allá de las celdas cargadas (en exteriores). Desactivado: el mundo acaba en las celdas cargadas."
"Colour grade" = "Etalonaje de color"
"On: the picture is graded by the worldspace's, the weather's and the cell's image space. Off: the picture as lit, for comparisons." = "Activado: la imagen se tiñe según el espacio de imagen del espacio de mundo, del clima y de la celda. Desactivado: la imagen tal como está iluminada, para comparar."
"Text overlay" = "Texto superpuesto"
"On: the position, loading counts and key help are written over the picture. Off by default in the game." = "Activado: la posición, los contadores de carga y la ayuda de teclas se escriben sobre la imagen. Desactivado de serie en el juego."
"Shot markers" = "Marcas de impacto"
"On: a cross is drawn at each impact and a line from the muzzle along each hitscan shot." = "Activado: se dibuja una cruz en cada impacto y una línea desde la boca del arma a lo largo de cada disparo instantáneo."
"God mode" = "Modo dios"
"On: the player takes no damage from hits and cannot be killed by them." = "Activado: el jugador no recibe daño de los golpes y no puede morir por ellos."
"Draw the navmesh" = "Dibujar la navmesh"
"On: the navmesh near the camera and the walking NPCs' paths are drawn." = "Activado: se dibujan la navmesh cerca de la cámara y los caminos de los PNJ que andan."
"Frame rate counter" = "Contador de fotogramas"
"On: a panel of performance readings at the top right; the Counter rows below choose what it shows. Not in the original." = "Activado: un panel de lecturas de rendimiento arriba a la derecha; las filas Counter de abajo eligen lo que muestra. No está en el original."
"Display sync" = "Sincronización de pantalla"
"Vertical sync: frames wait for the display (no tearing). Variable refresh: for a G-Sync or FreeSync screen. Off: frames show at once (may tear)." = "Sincronización vertical: los fotogramas esperan a la pantalla (sin cortes). Frecuencia variable: para pantallas G-Sync o FreeSync. Desactivado: al momento (puede cortar)."
"Upscaler" = "Escalador"
"Upscaling mode" = "Modo de escalado"
"FSR 3.1 or NVIDIA DLSS rebuilds the world at display resolution, at the mode below. DLSS needs an NVIDIA RTX card and its files in the dlss folder." = "FSR 3.1 o NVIDIA DLSS reconstruye el mundo a la resolución de la pantalla, con el modo de abajo. DLSS necesita una tarjeta NVIDIA RTX y sus archivos en la carpeta dlss."
"The share of the screen the world is drawn at; the upscaler rebuilds the rest. Native AA: full size. Quality to Ultra Performance: ever faster." = "La parte de la pantalla a la que se dibuja el mundo; el escalador reconstruye el resto. AA nativo: tamaño completo. De Calidad a Rendimiento ultra: cada vez más rápido."
"DLSS model" = "Modelo de DLSS"
"Which DLSS model rebuilds the picture (NVIDIA calls them presets). Default, recommended: NVIDIA picks per mode. Only while DLSS draws." = "Qué modelo DLSS reconstruye la imagen (NVIDIA los llama presets). Predeterminado, recomendado: NVIDIA elige según el modo. Solo mientras dibuja DLSS."
"Default" = "Predeterminado"
"DLSS only" = "Solo con DLSS"
"World" = "Mundo"
"Display" = "Pantalla"
"Debug" = "Depuración"
"Graphics" = "Gráficos"
"Field of view" = "Campo de visión"
"The game's field of view in degrees across a 4:3 picture (75 as the original's default); wider screens see more at the sides." = "El campo de visión del juego en grados sobre una imagen 4:3 (75 como el valor por defecto del original); las pantallas más anchas ven más por los lados."
"Frame rate limit" = "Límite de fotogramas"
"At most this many frames a second (Off: no limit of its own). A lower limit keeps the computer cooler and quieter." = "Como mucho estos fotogramas por segundo (Desactivado: sin límite propio). Un límite más bajo mantiene el ordenador más fresco y silencioso."
"Object distance" = "Distancia de objetos"
"How far from you objects of the loaded cells (buildings, rocks, furniture, clutter) are drawn. Lower draws fewer and runs faster." = "Hasta dónde se dibujan los objetos de las celdas cargadas (edificios, rocas, muebles, trastos). Menos dibuja menos y va más rápido."
"Actor distance" = "Distancia de personajes"
"How far from you people and creatures are drawn, as a part of the farthest the loaded cells reach." = "Hasta dónde se dibujan las personas y las criaturas, como parte del alcance máximo de las celdas cargadas."
"Item distance" = "Distancia de los objetos sueltos"
"How far from you items lying in the world are drawn, as a part of the farthest the loaded cells reach." = "Hasta dónde se dibujan los objetos sueltos por el mundo, como parte del alcance máximo de las celdas cargadas."
"Shadow distance" = "Distancia de sombras"
"How far from you the sun casts shadows (with Sun shadows on), as a part of the farthest shadow distance." = "Hasta dónde proyecta sombras el sol (con Sombras del sol activadas), como parte de la distancia de sombras máxima."
"Grass distance" = "Distancia de la hierba"
"How far from you grass is drawn, as a part of the farthest grass distance and its fade range." = "Hasta dónde se dibuja la hierba, como parte de la distancia máxima de la hierba y de su zona de fundido."
"Anti-aliasing" = "Suavizado de bordes"
"How edges are smoothed: multisampling 2x, 4x or 8x (dearer at each step) or FXAA, SMAA or TAA afterwards. Reads Off while an upscaler is on." = "Cómo se suavizan los bordes: multimuestreo 2x, 4x u 8x (más caro en cada paso) o FXAA, SMAA o TAA después. Indica Desactivado mientras hay un escalador activado."
"Shadow filtering" = "Filtrado de sombras"
"How the sun's shadow edges are softened: Fast (harder, cheapest), Smooth (as vanilla) or Temporal (grainy unless Anti-aliasing is TAA)." = "Cómo se suavizan los bordes de las sombras del sol: Rápido (más duros, el más barato), Suave (como el original) o Temporal (granulado salvo con Suavizado de bordes TAA)."
"Ambient occlusion" = "Oclusión ambiental"
"On: creases, corners and the ground under things are darkened by how enclosed they are (screen-space, from the depth). Not in the original." = "Activado: pliegues, rincones y el suelo bajo las cosas se oscurecen según lo encerrados que están (en espacio de pantalla, por la profundidad). No está en el original."
"Longer sun shadows" = "Sombras del sol más largas"
"On: the sun's shadows reach half as far again as the shadow distance. Costs a little frame rate." = "Activado: las sombras del sol llegan la mitad más lejos que la distancia de sombras. Cuesta algunos fotogramas."
"Bloom" = "Bloom"
"On: light brighter than a sunlit white wall (the sun, lamps, windows) glows into its surroundings, on top of the game's own image space." = "Activado: la luz más intensa que una pared blanca al sol (el sol, las lámparas, las ventanas) se derrama sobre su entorno, por encima del espacio de imagen propio del juego."
"Light glow (HDR)" = "Resplandor de luz (HDR)"
"On: neon, lamps, beams and fire glow softly, as the original's HDR glow does, as much as the place's image space asks. Bloom adds to it." = "Activado: neón, lámparas, rayos y fuego resplandecen suavemente, como el resplandor HDR del original, tanto como pide el espacio de imagen del lugar. El bloom se suma."
"Eye adaptation" = "Adaptación ocular"
"On: dark views brighten after a moment, as the eye gets used to the dark, by the place's image space. Needs the light glow." = "Activado: las vistas oscuras se aclaran tras un momento, como el ojo se acostumbra a la oscuridad, según el espacio de imagen del lugar. Necesita el resplandor de luz."
"Neon glow" = "Resplandor de neón"
"On: where the image space asks for a strong glow (the Strip at night) neon burns with a wide halo, as in the original. Needs the light glow." = "Activado: donde el espacio de imagen pide un resplandor fuerte (el Strip de noche) el neón arde con un halo amplio, como en el original. Necesita el resplandor de luz."
"Sharpening" = "Nitidez"
"On: the final picture is sharpened where it has little contrast (contrast-adaptive sharpening)." = "Activado: la imagen final se enfoca donde tiene poco contraste (nitidez adaptativa al contraste)."
"Anisotropic filtering 16x" = "Filtrado anisotrópico 16x"
"On: textures seen at a slant stay sharp further (16x instead of 8x). For textures loaded from now on (the cells loaded next)." = "Activado: las texturas vistas en ángulo siguen nítidas a más distancia (16x en vez de 8x). Para las texturas cargadas a partir de ahora (las próximas celdas cargadas)."
"Sun shafts" = "Rayos de sol"
"On: sunlight streams past what stands in front of the sun, stronger the hazier the weather's fog. Not in the original." = "Activado: la luz del sol pasa alrededor de lo que hay delante del sol, con más fuerza cuanto más brumosa esté la niebla del clima. No está en el original."
"Screen-space water reflections" = "Reflejos del agua en pantalla"
"On: water the mirrored reflection does not reach (another height, interiors) reflects what is on the screen instead of only the sky." = "Activado: el agua a la que no llega el reflejo especular (otra altura, interiores) refleja lo que hay en pantalla en lugar de solo el cielo."
"Mirrored water reflections" = "Reflejos especulares del agua"
"On: water mirrors the world above it, as in the original, drawing the scene a second time. Off: it reflects the sky." = "Activado: el agua refleja el mundo sobre ella, como en el original, dibujando la escena una segunda vez. Desactivado: refleja el cielo."
"Quality preset" = "Preajuste de calidad"
"Sets the rows the original's quality presets cover to the game folder's low.ini to VeryHigh.ini. Custom: those rows match none of them." = "Pone las filas de los preajustes de calidad del original en los valores de low.ini a VeryHigh.ini de la carpeta del juego. Personalizado: no coinciden con ninguno."
"Enhanced effects" = "Efectos mejorados"
"Sets every effect of the enhanced look at once. On: all of them. Off: none, the original's picture. Custom: some on, some off. Each keeps its own row." = "Cambia a la vez todos los efectos del aspecto mejorado. Activado: todos. Desactivado: ninguno, la imagen del original. Personalizado: unos sí y otros no. Cada uno conserva su fila."
