"How many frames DLSS frame generation makes per real frame: 2x one, 3x two, 4x three (3x and 4x on RTX 50 series). Not in the original." = "Cuántos fotogramas crea la generación de fotogramas DLSS por cada real: 2x uno, 3x dos, 4x tres (3x y 4x con la serie RTX 50). No está en el original."
