# NVForever's own words in Español (#1948). Written for NVForever, not copied from the
# game (LEGAL.md). Choice names (Off, Auto, Last enemy, Amber …) are
# translated, and the notes name them as they are shown. How to add or fix a line:
# README.md beside this file.

name = "Español"

[words]
"Dialogue voice" = "Voces en los diálogos"
"On: lines are spoken. Off: they are silent from the next line on, and still last as long as their sound. (--no-voice)" = "Activado: las frases se oyen. Desactivado: desde la siguiente frase se callan, aunque duran lo mismo que su sonido. (--no-voice)"
"Gameplay" = "Juego"
"Turn to each other in dialogue" = "Mirarse en el diálogo"
"On: at the start of a conversation the actor turns to the player and the view turns to the actor. (--no-dialogue-look)" = "Activado: al empezar una conversación el personaje se gira hacia el jugador y la vista hacia el personaje. (--no-dialogue-look)"
"Bring the view back when choices appear" = "Recentrar la vista al aparecer las respuestas"
"On: each time the choices come up the view returns to the actor. Off: only the opening turn; the view is yours for the rest of the conversation. Needs the turn above. (--dialogue-recentre)" = "Activado: cada vez que aparecen las respuestas la vista vuelve al personaje. Desactivado: solo el giro inicial; el resto de la conversación la vista es tuya. Necesita el giro de arriba. (--dialogue-recentre)"
"Close in on the speaker in dialogue" = "Acercarse a quien habla en el diálogo"
"On: in a conversation the view narrows onto the speaker, with what is behind them out of focus; from third person the camera comes to the eyes. Off: the view stays as it is. (--no-dialogue-zoom)" = "Activado: en una conversación la vista se cierra sobre quien habla, con el fondo desenfocado; en tercera persona la cámara pasa a la altura de los ojos. Desactivado: la vista se queda como está. (--no-dialogue-zoom)"
"Goodbye hint" = "Aviso «Goodbye»"
"On: while a conversation offers a Goodbye choice, \"[Tab] Goodbye\" stands at the left of the dialogue box. Off: the words are hidden; Tab still says goodbye." = "Activado: mientras una conversación ofrece una respuesta Goodbye, «[Tab] Goodbye» aparece a la izquierda del cuadro de diálogo. Desactivado: el texto se oculta; Tab sigue despidiéndose."
"Aim assist" = "Ayuda al apuntar"
"Controller only, never the mouse. On: the right stick turns slower while the crosshair is on a nearby hostile, and aiming down the sights turns the view onto one near the crosshair for a moment. Off: neither." = "Solo mando, nunca el ratón. Activado: el stick derecho gira más despacio mientras la mira está sobre un enemigo cercano, y apuntar con el arma lleva la vista un momento a un enemigo cerca de la mira. Desactivado: ninguna de las dos."
"Controller" = "Mando"
"Aim slowdown" = "Frenado de la mira"
"How much slower the right stick turns while the crosshair is on a nearby hostile (0: not at all)." = "Cuánto más despacio gira el stick derecho mientras la mira está sobre un enemigo cercano (0: nada)."
"Aim lock-on" = "Fijado de la mira"
"How hard aiming down the sights turns the view onto a nearby hostile near the crosshair (0: not at all). Push the right stick away to break it." = "Con qué fuerza apuntar con el arma lleva la vista a un enemigo cercano a la mira (0: nada). Mueve el stick derecho hacia fuera para soltarte."
"Use Pip-Boy" = "Llevar el Pip-Boy"
"On: the Pip-Boy and its glove are worn and the menus come up on the arm. Off: both are taken off and the menus show full screen. Without a Pip-Boy worn the menus are always full screen." = "Activado: el Pip-Boy y su guante se llevan puestos y los menús aparecen en el brazo. Desactivado: ambos se quitan y los menús ocupan la pantalla. Sin Pip-Boy puesto los menús ocupan siempre la pantalla."
"Kill camera" = "Cámara de muerte"
"When a VATS shot kills its last mark, a cinematic camera can show the kill. Last enemy: only when no other enemy is still fighting you. Every kill: whoever is left. Off: never." = "Cuando un disparo de VATS mata a su último objetivo, una cámara cinematográfica puede mostrar la muerte. Último enemigo: solo cuando ningún otro enemigo sigue luchando contigo. Cada muerte: en cada muerte. Desactivado: nunca."
"V.A.T.S. style" = "Estilo de V.A.T.S."
"What the V.A.T.S. key starts. Classic: the world stops, you pick a target and its body parts from their chances to hit, then the queued attacks play. Mark and Fire: time runs very slowly while you mark targets under the crosshair." = "Lo que inicia la tecla de V.A.T.S. Clásico: el mundo se detiene, eliges un objetivo y sus partes del cuerpo según su probabilidad de acierto, y luego se ejecutan los ataques en cola. Marcar y disparar: el tiempo corre muy despacio mientras marcas objetivos bajo la mira."
"V.A.T.S. time slowdown" = "Ralentización del tiempo en V.A.T.S."
"How far the world slows while you choose targets in the Classic style: 100% stops it, 50% runs it at half speed. Enemies keep attacking at anything less than a full stop." = "Cuánto se ralentiza el mundo mientras eliges objetivos en el estilo Clásico: 100% lo detiene, 50% lo deja a media velocidad. Con menos de una parada total, los enemigos siguen atacando."
"Slower while reloading" = "Más lento al recargar"
"On: you and the NPCs move at 75% of your speed while a reload runs. Off: reloading does not slow anyone, as in the original." = "Activado: tú y los PNJ os movéis al 75% de vuestra velocidad mientras dura una recarga. Desactivado: recargar no frena a nadie, como en el original."
"Difficulty" = "Dificultad"
"How hard the fights are: from Very Easy (the player's hits do double damage and the player takes half) to Very Hard (half and double); Normal as they are. (console: SetGameDifficulty 0-4)" = "Lo duros que son los combates: de Muy fácil (los golpes del jugador hacen el doble de daño y él recibe la mitad) a Muy difícil (mitad y doble); Normal tal cual. (consola: SetGameDifficulty 0-4)"
"Dynamic crosshair" = "Mira dinámica"
"On: with a gun or thrown weapon drawn the crosshair opens to show how wide your shots spread now (wider running, after shots, with crippled arms; narrower aimed or crouched); Crosshair style below picks how it looks. Off: the arrows stay together whatever is drawn." = "Activado: con un arma de fuego o arrojadiza en la mano la mira se abre para mostrar cuánto se dispersan ahora tus disparos (más al correr, tras disparar, con los brazos tullidos; menos al apuntar o agachado); «Estilo de mira» debajo elige su aspecto. Desactivado: las flechas no se separan, lleves lo que lleves."
"Crosshair style" = "Estilo de mira"
"With Dynamic crosshair on and a gun or thrown weapon drawn. Cross: four bars that part with the spread. Arrows: the plain crosshair's two arrows part instead." = "Con la mira dinámica activada y un arma de fuego o arrojadiza en la mano. Cruz: cuatro trazos que se separan con la dispersión. Flechas: se separan en su lugar las dos flechas de la mira simple."
"Detached third-person camera" = "Cámara libre en tercera persona"
"On: in third person with your weapon away the mouse turns the camera around you, not your character, and your character turns to run whichever way you push, as the camera sees it. Drawing your weapon turns you to where the camera looks. Off: the camera stays behind you, as in the original." = "Activado: en tercera persona con el arma guardada el ratón gira la cámara a tu alrededor, no al personaje, y el personaje corre hacia donde empujes, tal como lo ve la cámara. Al desenfundar te giras hacia donde mira la cámara. Desactivado: la cámara se queda detrás de ti, como en el original."
"Language" = "Idioma"
"The language of NVForever's own words (menus, messages). The game's own text is the install's." = "El idioma de los textos propios de NVForever (menús, mensajes). El texto del propio juego es el de la instalación."
"Interface" = "Interfaz"
"Reverb" = "Reverberación"
"World sounds echo as the place you are in does (a cave, a hall, a small room). Off: --no-reverb." = "Los sonidos del mundo resuenan como el lugar donde estás (una cueva, una sala, un cuarto pequeño). Desactivado: --no-reverb."
"Voice reverb" = "Reverberación de voces"
"What people say around you echoes in the place you are in, up to the end of each line, as Reverb does for world sounds. Conversations stay dry." = "Lo que dice la gente a tu alrededor resuena en el lugar donde estás, hasta el final de cada frase, como hace la reverberación con los sonidos del mundo. Las conversaciones se quedan secas."
"Sound" = "Sonido"
"Master" = "Volumen general"
"How loud all sound is: each volume below is a part of this one." = "Lo alto que suena todo: cada volumen de abajo es una parte de este."
"Music" = "Música"
"The music of the place you are in and the main menu's theme." = "La música del lugar donde estás y el tema del menú principal."
"Footstep" = "Pasos"
"Footsteps, jumps and landings, yours and everyone's." = "Pasos, saltos y aterrizajes, tuyos y de todos."
"Voice" = "Voces"
"Spoken lines: conversations and what people say around you." = "Frases habladas: conversaciones y lo que dice la gente a tu alrededor."
"Effects" = "Efectos"
"Every other sound: weapons, impacts, menus, doors and the sounds of places." = "Todos los demás sonidos: armas, impactos, menús, puertas y los sonidos de los lugares."
"Radio" = "Radio"
"Radio stations, from the Pip-Boy and from radios in the world." = "Las emisoras de radio, del Pip-Boy y de las radios del mundo."
"Freeze the picture in dialogue and menus" = "Congelar la imagen en diálogos y menús"
"On: while a conversation, the inventory, a container or a message box is open, animations, wind, water and sky stand still, as in the original. Off: only game logic waits and the world lives on. This menu always holds everything. (--menu-pause original|living)" = "Activado: mientras hay abierta una conversación, el inventario, un contenedor o un mensaje, las animaciones, el viento, el agua y el cielo se detienen, como en el original. Desactivado: solo espera la lógica del juego y el mundo sigue vivo. Este menú siempre lo detiene todo. (--menu-pause original|living)"
"Search" = "Buscar"
"Changed" = "Cambiados"
"Audio" = "Audio"
"Tweaks" = "Retoques"
"Game" = "General"
"Dialogue" = "Diálogo"
"Camera" = "Cámara"
"Screen" = "Resolución"
"Performance" = "Rendimiento"
"Picture" = "Imagen"
"Distance" = "Distancia"
"Quality" = "Calidad"
"Previous heading" = "Sección anterior"
"Next heading" = "Sección siguiente"
"Keyboard search" = "Búsqueda con teclado"
"No settings here." = "Aquí no hay ajustes."
"No results." = "Sin resultados."
"No changed settings." = "No hay ajustes cambiados."
"Stands for: {rows}." = "Representa: {rows}."
"Button style" = "Estilo de botones"
"Which names and pictures the controller's buttons go by in prompts, menu hints and the Controls tab. Auto: a PlayStation controller's (Cross, Circle, Square, Triangle, L1, R2, Select…) when the controller in use says it is one, else an Xbox controller's. Xbox or PlayStation: always those. The INI keeps the Xbox names either way." = "Con qué nombres e imágenes aparecen los botones del mando en avisos, menús y la pestaña Controles. Auto: los de un mando de PlayStation (Cross, Circle, Square, Triangle, L1, R2, Select…) cuando el mando en uso dice serlo, si no los de un mando de Xbox. Xbox o PlayStation: siempre esos. El INI guarda los nombres de Xbox en cualquier caso."
"Light and noise gauges while sneaking" = "Indicadores de luz y ruido en sigilo"
"On: two bars under the sneak word show how lit you are and how much noise you make, as detection counts them. Not in the original." = "Activado: dos barras bajo la palabra de sigilo muestran cuánta luz te da y cuánto ruido haces, tal como los cuenta la detección. No está en el original."
"Saving" = "Guardado"
"Autosave after travel" = "Autoguardado tras un viaje"
"On: the game saves to the autosave slot after each loading screen (doors, coc, a script moving the player); fast travel has its own switch." = "Activado: el juego guarda en la ranura de autoguardado tras cada pantalla de carga (puertas, coc, un script que mueve al jugador); el viaje rápido tiene su propio interruptor."
"Save on fast travel" = "Guardar al viajar rápido"
"On: the game saves to the autosave slot when a fast travel arrives." = "Activado: el juego guarda en la ranura de autoguardado al llegar un viaje rápido."
"Save on wait" = "Guardar al esperar"
"On: the game saves to the autosave slot when a wait ends with at least one hour passed." = "Activado: el juego guarda en la ranura de autoguardado cuando termina una espera de al menos una hora."
"Save on sleep" = "Guardar al dormir"
"On: the game saves to the autosave slot when the player wakes from a sleep of at least one hour." = "Activado: el juego guarda en la ranura de autoguardado cuando el jugador despierta de un sueño de al menos una hora."
"Save when a script asks" = "Guardar cuando lo pide un script"
"On: a script's Autosave saves to the autosave slot, as quests do at their milestones; SystemSave to the system slot; ForceSave as a new save." = "Activado: Autosave en un script guarda en la ranura de autoguardado, como hacen las misiones en sus hitos; SystemSave en la ranura del sistema; ForceSave como partida nueva."
"Hardcore mode" = "Modo hardcore"
"On: you need water, food and sleep, stimpaks heal over time, ammunition has weight and crippled limbs heal only with a doctor's bag or a doctor. Off: none of that; turning it off clears your thirst, hunger and tiredness and their effects. (console: SetHardcore 1/0)" = "Activado: necesitas agua, comida y sueño, los estimulantes curan con el tiempo, la munición pesa y las extremidades tullidas solo sanan con un maletín de médico o con un médico. Desactivado: nada de eso; desactivarlo quita la sed, el hambre y el cansancio y sus efectos. (consola: SetHardcore 1/0)"
"HUD red" = "HUD rojo"
"HUD green" = "HUD verde"
"HUD blue" = "HUD azul"
"Pip-Boy red" = "Pip-Boy rojo"
"Pip-Boy green" = "Pip-Boy verde"
"Pip-Boy blue" = "Pip-Boy azul"
"One part of the colour above, 0 to 255; drag the meter or use Left and Right." = "Una parte del color de arriba, de 0 a 255; arrastra el indicador o usa Izquierda y Derecha."
"On: the music of the place you are in plays. Off: it is silent and goes on unheard. (--no-music)" = "Activado: suena la música del lugar donde estás. Desactivado: se calla y sigue sin oírse. (--no-music)"
"UI scale" = "Escala de la interfaz"
"The size of the HUD and the menus, as a part of the original's (100%): smaller leaves more of the picture free, each HUD piece kept at its edge of the screen and each menu in the middle. Above 100% only the HUD grows: the menus stay at the original's size, so they keep on the screen. Takes effect at the next start (loading a save starts the game again). Not in the original." = "El tamaño del HUD y los menús, como parte del del original (100%): menos deja más imagen libre, con cada pieza del HUD en su borde de la pantalla y cada menú en el centro. Por encima del 100% solo crece el HUD: los menús siguen al tamaño original para caber en la pantalla. Se aplica en el siguiente inicio (cargar una partida reinicia el juego). No está en el original."
"This terminal requires a password." = "Este terminal necesita una contraseña."
"You need a Science skill of {needed} to hack this terminal." = "Necesitas una habilidad de Ciencia de {needed} para piratear este terminal."
"Lip sync" = "Sincronía labial"
"On: a speaker's face moves with the line. Off: a face that is moving eases back to rest. (--no-lip)" = "Activado: la cara de quien habla se mueve con la frase. Desactivado: una cara en movimiento vuelve poco a poco al reposo. (--no-lip)"
"Head tracking" = "Seguimiento con la cabeza"
"On: actors turn their heads to the player and to others near them. Off: heads ease back to their animation. (--no-head-tracking)" = "Activado: los personajes giran la cabeza hacia el jugador y hacia otros cercanos. Desactivado: las cabezas vuelven poco a poco a su animación. (--no-head-tracking)"
"Feet follow the ground" = "Pies sobre el suelo"
"On: on slopes and steps actors bend their knees and set each foot on the ground under it. Off: the legs play the animation as it is. (--no-foot-ik)" = "Activado: en pendientes y escalones los personajes doblan las rodillas y apoyan cada pie en el suelo bajo él. Desactivado: las piernas siguen la animación tal cual. (--no-foot-ik)"
"Sky follows the game clock" = "Cielo según el reloj del juego"
"On: the sky shows the game's time of day as it passes. Off: the sky keeps its hour while the game's clock runs on ([ and ] still set it). (--still-sky)" = "Activado: el cielo muestra la hora del juego según pasa. Desactivado: el cielo mantiene su hora mientras el reloj del juego sigue ([ y ] aún la cambian). (--still-sky)"
"Resolution" = "Resolución"
"The window's size, or in full screen the monitor's (its own size: borderless). A new one goes back after 20 seconds unless you keep it. (--size)" = "El tamaño de la ventana o, a pantalla completa, el del monitor (su propio tamaño: sin bordes). Una nueva se deshace a los 20 segundos si no la conservas. (--size)"
"Full screen" = "Pantalla completa"
"On: the game fills the monitor it is on, without a frame, at the resolution chosen above for full screen. Off: a window of the resolution chosen for a window. (--window borderless)" = "Activado: el juego llena su monitor, sin marco, a la resolución elegida arriba para pantalla completa. Desactivado: una ventana a la resolución elegida para ventana. (--window borderless)"
"Monitor" = "Monitor"
"The display the game opens on in full screen (the first display until you pick one). (--window borderless)" = "La pantalla en la que se abre el juego a pantalla completa (la primera hasta que elijas otra). (--window borderless)"
"Body in first person" = "Cuerpo en primera persona"
"On: in first person you see your own body and legs when you look down. Off: only the arms and the weapon are drawn, as in the original. (--first-person-body)" = "Activado: en primera persona ves tu cuerpo y tus piernas al mirar abajo. Desactivado: solo se dibujan los brazos y el arma, como en el original. (--first-person-body)"
"Weapon sway" = "Balanceo del arma"
"On: in first person the arms and weapon lag behind a turn and bob as you walk and run. Off: they stay still in the view. (--no-weapon-sway)" = "Activado: en primera persona los brazos y el arma se retrasan al girar y se mecen al andar y correr. Desactivado: se quedan quietos en la vista. (--no-weapon-sway)"
"Head bob" = "Balanceo de la cabeza"
"On: in first person the view dips with each step as you walk and run. Off: it stays level. (--no-head-bob)" = "Activado: en primera persona la vista baja con cada paso al andar y correr. Desactivado: se mantiene nivelada. (--no-head-bob)"
"Lower weapon near walls" = "Bajar el arma junto a paredes"
"On: in first person a drawn weapon is lowered when a wall or a friendly person is right in front of you, and comes straight back up when you aim or fire. Off: it stays up and can poke through them, as in the original. Lower Weapon (H) lowers or raises it by hand either way. (--no-weapon-lower)" = "Activado: en primera persona un arma desenfundada baja cuando hay una pared o una persona amistosa justo delante, y vuelve a subir en cuanto apuntas o disparas. Desactivado: se queda arriba y puede atravesarlas, como en el original. Bajar arma (H) la baja o la sube a mano en cualquier caso. (--no-weapon-lower)"
"True iron sights" = "Miras de hierro reales"
"On: aiming a gun lines its sights up with your eye. The crosshair is hidden while you aim down them. Off: the gun is held low with the crosshair, as in the original. Guns with no sights to look down (laser rifle, minigun) aim as the original either way. (--no-true-iron-sights)" = "Activado: al apuntar, las miras del arma se alinean con tu ojo. La mira en pantalla se oculta mientras apuntas. Desactivado: el arma se lleva baja con la mira en pantalla, como en el original. Las armas sin miras por las que mirar (rifle láser, minigun) apuntan como en el original en cualquier caso. (--no-true-iron-sights)"
"3D scopes (test)" = "Miras telescópicas 3D (prueba)"
"On: aiming a scoped gun keeps the gun on screen and shows the zoomed view in its scope's lens, with the reticle; the view around it zooms only a little. Off: the full-screen scope picture with its black border, as in the original. Guns whose scope lens is not known yet keep the picture. (--scope-3d)" = "Activado: al apuntar con un arma con mira telescópica el arma sigue en pantalla y la vista ampliada aparece en la lente, con la retícula; la vista de alrededor se acerca solo un poco. Desactivado: la imagen de mira a pantalla completa con su borde negro, como en el original. Las armas cuya lente aún no se conoce conservan la imagen. (--scope-3d)"
"Sun shadows" = "Sombras del sol"
"The sun's shadows, out to --shadow-distance: Off; Performance (the shadow maps drawn every other frame in two cascades, trees casting shadows only near you, the first-person arms taking the world's shadows: saves frame time outdoors, shadows of moving things update at half the frame rate); or Quality (three cascades, the farther ones drawn less often). The original casts none from the world. Quality by default in the game. (--sun-shadows, --sun-shadows=performance, --no-sun-shadows)" = "Las sombras del sol, hasta --shadow-distance: Desactivado; Rendimiento (los mapas de sombras se dibujan un fotograma sí y otro no en dos cascadas, los árboles proyectan sombras solo cerca de ti, los brazos en primera persona reciben las sombras del mundo: ahorra tiempo de fotograma al aire libre, las sombras de lo que se mueve se actualizan a la mitad de la tasa de fotogramas); o Calidad (tres cascadas, las más lejanas dibujadas con menos frecuencia). El original no proyecta ninguna del mundo. Calidad de serie en el juego. (--sun-shadows, --sun-shadows=performance, --no-sun-shadows)"
"Grass" = "Hierba"
"On: grass grows on the landscape; the cells around you get theirs over the next frames. Off: it is hidden and none grows on new cells. (--no-grass)" = "Activado: la hierba crece en el paisaje; las celdas a tu alrededor reciben la suya en los siguientes fotogramas. Desactivado: se oculta y no crece en celdas nuevas. (--no-grass)"
"Distant terrain and objects" = "Terreno y objetos lejanos"
"On: distant land, buildings and trees are drawn beyond the loaded cells (outdoors). Off: the world ends at the loaded cells. (--no-lod)" = "Activado: la tierra, los edificios y los árboles lejanos se dibujan más allá de las celdas cargadas (en exteriores). Desactivado: el mundo acaba en las celdas cargadas. (--no-lod)"
"Colour grade" = "Etalonaje de color"
"On: the picture is graded by the worldspace's, the weather's and the cell's image space. Off: the picture as lit, for comparisons. (--no-grade)" = "Activado: la imagen se tiñe según el espacio de imagen del espacio de mundo, del clima y de la celda. Desactivado: la imagen tal como está iluminada, para comparar. (--no-grade)"
"Text overlay" = "Texto superpuesto"
"On: the position, loading counts and key help are written over the picture. Off by default in the game. (--overlay, --no-overlay)" = "Activado: la posición, los contadores de carga y la ayuda de teclas se escriben sobre la imagen. Desactivado de serie en el juego. (--overlay, --no-overlay)"
"Shot markers" = "Marcas de impacto"
"On: a cross is drawn at each impact and a line from the muzzle along each hitscan shot. (--hit-markers)" = "Activado: se dibuja una cruz en cada impacto y una línea desde la boca del arma a lo largo de cada disparo instantáneo. (--hit-markers)"
"God mode" = "Modo dios"
"On: the player takes no damage from hits and cannot be killed by them. (--god)" = "Activado: el jugador no recibe daño de los golpes y no puede morir por ellos. (--god)"
"Draw the navmesh" = "Dibujar la navmesh"
"On: the navmesh near the camera and the walking NPCs' paths are drawn. (--show-navmesh)" = "Activado: se dibujan la navmesh cerca de la cámara y los caminos de los PNJ que andan. (--show-navmesh)"
"Frame rate counter" = "Contador de fotogramas"
"On: a small panel of performance readings at the top right of the screen, the Counter rows below choosing what it shows; with only its frame rate row on it is a frame rate counter. Not in the original. (--fps)" = "Activado: un pequeño panel de lecturas de rendimiento arriba a la derecha de la pantalla; las filas Counter de abajo eligen lo que muestra. Con solo su fila de fotogramas por segundo activada, es un contador de fotogramas. No está en el original. (--fps)"
"Display sync" = "Sincronización de pantalla"
"Vertical sync: each frame waits for the display's refresh (no tearing). Variable refresh: for a G-Sync or FreeSync screen, vertical sync with the frame rate held a few frames under the screen's refresh rate, so frames are shown as soon as they are drawn without tearing. Off: frames are shown as soon as they are drawn (may tear)." = "Sincronización vertical: cada fotograma espera al refresco de la pantalla (sin cortes). Frecuencia variable: para una pantalla G-Sync o FreeSync, sincronización vertical con la tasa de fotogramas unos fotogramas por debajo del refresco de la pantalla, para que los fotogramas se vean en cuanto se dibujan, sin cortes. Desactivado: los fotogramas se ven en cuanto se dibujan (puede haber cortes)."
"FSR 3.1 upscaling" = "Escalado FSR 3.1"
"Reconstruct the world at display resolution; Native AA keeps full resolution. Disables MSAA, FXAA, SMAA and TAA while active. Menus stay sharp. Requires Vulkan; unsupported devices keep native rendering. Sharpening controls FSR sharpening. Frame generation is the row below. (--fsr)" = "Reconstruye el mundo a la resolución de la pantalla; AA nativo mantiene la resolución completa. Desactiva MSAA, FXAA, SMAA y TAA mientras está activo. Los menús siguen nítidos. Necesita Vulkan; los dispositivos no compatibles mantienen el dibujado nativo. «Nitidez» regula la nitidez de FSR. La generación de fotogramas está en la fila de abajo. (--fsr)"
"World" = "Mundo"
"Display" = "Pantalla"
"Debug" = "Depuración"
"Graphics" = "Gráficos"
"Field of view" = "Campo de visión"
"The game's field of view in degrees across a 4:3 picture (75 as the original's default); wider screens see more at the sides. (--fov)" = "El campo de visión del juego en grados sobre una imagen 4:3 (75 como el valor por defecto del original); las pantallas más anchas ven más por los lados. (--fov)"
"Frame rate limit" = "Límite de fotogramas"
"At most this many frames a second (Off: as many as the computer draws, or the display's refresh with vertical sync; with variable refresh the lower of this and its own limit). A lower limit keeps the computer cooler and quieter." = "Como mucho estos fotogramas por segundo (Desactivado: los que dibuje el ordenador, o el refresco de la pantalla con sincronización vertical; con refresco variable, el menor entre este y su propio límite). Un límite más bajo mantiene el ordenador más fresco y silencioso."
"Object distance" = "Distancia de objetos"
"How far from you objects (buildings, rocks, furniture, clutter) of the loaded cells are drawn, as a part of the farthest those cells reach. Lower draws fewer and runs faster." = "Hasta dónde se dibujan los objetos de las celdas cargadas (edificios, rocas, muebles, trastos), como parte del alcance máximo de esas celdas. Menos dibuja menos y va más rápido."
"Actor distance" = "Distancia de personajes"
"How far from you people and creatures are drawn, as a part of the farthest the loaded cells reach." = "Hasta dónde se dibujan las personas y las criaturas, como parte del alcance máximo de las celdas cargadas."
"Item distance" = "Distancia de los objetos sueltos"
"How far from you items lying in the world (weapons, ammo, aid, notes, caps, clutter you can take) are drawn, as a part of the farthest the loaded cells reach." = "Hasta dónde se dibujan los objetos sueltos por el mundo (armas, munición, curación, notas, chapas, trastos que se pueden coger), como parte del alcance máximo de las celdas cargadas."
"Shadow distance" = "Distancia de sombras"
"How far from you the sun casts shadows (with Sun shadows on), as a part of --shadow-distance." = "Hasta dónde proyecta sombras el sol (con las sombras del sol activadas), como parte de --shadow-distance."
"Grass distance" = "Distancia de la hierba"
"How far from you grass is drawn, as a part of --grass-distance and its fade range." = "Hasta dónde se dibuja la hierba, como parte de --grass-distance y de su zona de fundido."
"Anti-aliasing" = "Suavizado de bordes"
"How edges are smoothed: multisampling Off, 2x, 4x or 8x (--msaa; the cut-out edges of plants too), or the picture smoothed afterwards: FXAA (cheapest, softest), SMAA (sharper, a little dearer) or TAA (over the frames; plants too, soft while moving; --graphics-only fxaa, smaa or taa). Multisampling is the dearest, more at each step: at 1920x1080 on an RTX 4070, 2x added about 0.8 ms a frame, 4x about 1.3 ms and 8x about 2.3 ms (Goodsprings and Novac at noon); FXAA, SMAA and TAA cost less than 4x. Where the processor sets the pace (the Strip at night) the choice costs next to nothing. While FSR 3.1 upscaling is on it does the anti-aliasing itself, so this row reads Off (FSR active); your choice comes back when FSR is Off." = "Cómo se suavizan los bordes: multimuestreo Desactivado, 2x, 4x u 8x (--msaa; también los bordes recortados de las plantas), o la imagen suavizada después: FXAA (el más barato, el más suave), SMAA (más nítido, algo más caro) o TAA (a lo largo de los fotogramas; también las plantas, suave en movimiento; --graphics-only fxaa, smaa o taa). El multimuestreo es el más caro, más en cada paso: a 1920x1080 en una RTX 4070, 2x añadía unos 0,8 ms por fotograma, 4x unos 1,3 ms y 8x unos 2,3 ms (Goodsprings y Novac a mediodía); FXAA, SMAA y TAA cuestan menos que 4x. Donde el procesador marca el ritmo (el Strip de noche) la elección no cuesta casi nada. Mientras el escalado FSR 3.1 está activado suaviza él mismo, así que esta fila indica «Desactivado (FSR activo)»; tu elección vuelve cuando FSR se desactiva."
"Shadow filtering" = "Filtrado de sombras"
"How the edges of the sun's shadows are softened: Fast (hardware 2x2, harder edges, cheapest), Smooth (as vanilla) or Temporal (soft but grainy unless Anti-aliasing is TAA)." = "Cómo se suavizan los bordes de las sombras del sol: Rápido (hardware 2x2, bordes más duros, el más barato), Suave (como el original) o Temporal (suave pero granulado, salvo que el suavizado de bordes sea TAA)."
"Global illumination" = "Iluminación global"
"On: light bounces from lit surfaces onto those around them, the ambient light comes from the sky above and the ground below (so shapes and their normal maps read in the shade) and is shut out of corners, smooth surfaces reflect the sky, and sun-shadow edges are softer. From what is on the screen. About 1.1 ms a frame at 1920x1080 on an RTX 4070. Not in the original. (--graphics remaster)" = "Activado: la luz rebota de las superficies iluminadas a las que las rodean, la luz ambiental viene del cielo por arriba y del suelo por abajo (formas y normal maps se aprecian también a la sombra) y no entra en los rincones, las superficies lisas reflejan el cielo y los bordes de las sombras del sol son más suaves. A partir de lo que hay en pantalla. Unos 1,1 ms por fotograma a 1920x1080 en una RTX 4070. No está en el original. (--graphics remaster)"
"Volumetric fog" = "Niebla volumétrica"
"On: a thin haze near the ground, lit by the sun through the shadows of buildings, rocks and trees (shafts at dawn and dusk) and by the sky; outdoors only. Needs the light glow. About 0.4 ms a frame at 1920x1080 on an RTX 4070. Not in the original. (--graphics remaster)" = "Activado: una bruma fina cerca del suelo, iluminada por el sol a través de las sombras de edificios, rocas y árboles (rayos al amanecer y al atardecer) y por el cielo; solo en exteriores. Necesita el resplandor. Unos 0,4 ms por fotograma a 1920x1080 en una RTX 4070. No está en el original. (--graphics remaster)"
"Film grade" = "Aspecto de película"
"On: a gentle film-like curve (deeper shade, held highlights), shade a touch cooler and light a touch warmer, and a little more colour where there is little; after the game's own image space. Not in the original. (--graphics remaster)" = "Activado: una curva suave de tipo película (sombras más profundas, luces contenidas), sombra algo más fría y luz algo más cálida, y algo más de color donde hay poco; tras el espacio de imagen del juego. No está en el original. (--graphics remaster)"
"Ambient occlusion" = "Oclusión ambiental"
"On: creases, corners and the ground under things are darkened by how enclosed they are (screen-space, from the depth). Not in the original. (--graphics)" = "Activado: pliegues, rincones y el suelo bajo las cosas se oscurecen según lo encerrados que están (en espacio de pantalla, por la profundidad). No está en el original. (--graphics)"
"Longer sun shadows" = "Sombras del sol más largas"
"On: the sun's shadows reach half as far again as --shadow-distance. Costs a little frame rate. (--graphics)" = "Activado: las sombras del sol llegan la mitad más lejos que --shadow-distance. Cuesta algunos fotogramas. (--graphics)"
"Bloom" = "Bloom"
"On: light brighter than a sunlit white wall (the sun, lamps, windows) glows into its surroundings, on top of the game's own image space. (--graphics)" = "Activado: la luz más intensa que una pared blanca al sol (el sol, las lámparas, las ventanas) se derrama sobre su entorno, por encima del espacio de imagen propio del juego. (--graphics)"
"Light glow (HDR)" = "Resplandor de luz (HDR)"
"On: neon, lamps, glowing beams and fire glow softly into their surroundings, as the original's HDR glow does; how much follows the place's image space (the Strip's neon at night most). Bloom, when on, adds to it. (--graphics-only no-glow turns it off)" = "Activado: el neón, las lámparas, los rayos luminosos y el fuego resplandecen suavemente sobre su entorno, como el resplandor HDR del original; cuánto, lo marca el espacio de imagen del lugar (sobre todo el neón del Strip de noche). El bloom, si está activado, se suma. (--graphics-only no-glow lo desactiva)"
"Eye adaptation" = "Adaptación ocular"
"On: dark views brighten after a moment, as the eye gets used to the dark, by the place's image space. Needs the light glow. (--graphics-only no-eye-adaptation turns it off)" = "Activado: las vistas oscuras se aclaran tras un momento, como el ojo se acostumbra a la oscuridad, según el espacio de imagen del lugar. Necesita el resplandor de luz. (--graphics-only no-eye-adaptation la desactiva)"
"Neon glow" = "Resplandor de neón"
"On: where the place's image space asks for a strong glow (the Strip at night) neon tubes and signs burn with a wide halo, as in the original. Needs the light glow. (--graphics-only no-neon-glow turns it off)" = "Activado: donde el espacio de imagen del lugar pide un resplandor fuerte (el Strip de noche) los tubos y letreros de neón arden con un halo amplio, como en el original. Necesita el resplandor de luz. (--graphics-only no-neon-glow lo desactiva)"
"Sharpening" = "Nitidez"
"On: the final picture is sharpened where it has little contrast (contrast-adaptive sharpening). (--graphics)" = "Activado: la imagen final se enfoca donde tiene poco contraste (nitidez adaptativa al contraste). (--graphics)"
"Anisotropic filtering 16x" = "Filtrado anisotrópico 16x"
"On: textures seen at a slant stay sharp further (16x instead of 8x). For textures loaded from now on (the cells loaded next). (--graphics)" = "Activado: las texturas vistas en ángulo siguen nítidas a más distancia (16x en vez de 8x). Para las texturas cargadas a partir de ahora (las próximas celdas cargadas). (--graphics)"
"Sun shafts" = "Rayos de sol"
"On: sunlight streams past what stands in front of the sun, stronger the hazier the weather's fog. Not in the original. (--graphics)" = "Activado: la luz del sol pasa alrededor de lo que hay delante del sol, con más fuerza cuanto más brumosa esté la niebla del clima. No está en el original. (--graphics)"
"Screen-space water reflections" = "Reflejos del agua en pantalla"
"On: water the mirrored reflection does not reach (another height, interiors) reflects what is on the screen instead of only the sky. (--graphics)" = "Activado: el agua a la que no llega el reflejo especular (otra altura, interiores) refleja lo que hay en pantalla en lugar de solo el cielo. (--graphics)"
"Mirrored water reflections" = "Reflejos especulares del agua"
"On: water mirrors the world above it, as in the original; the scene is drawn a second time for it while water is on screen. Off: water reflects the sky, and what is on the screen with screen-space reflections. (--graphics-only no-water-mirror turns it off)" = "Activado: el agua refleja el mundo sobre ella, como en el original; la escena se dibuja una segunda vez para ello mientras hay agua en pantalla. Desactivado: el agua refleja el cielo y, con los reflejos en pantalla, lo que hay en ella. (--graphics-only no-water-mirror los desactiva)"
"Quality preset" = "Preajuste de calidad"
"Sets the rows the original's quality presets cover to the values of the game folder's low.ini, medium.ini, high.ini or VeryHigh.ini: Sun shadows, Shadow filtering, Light glow, Mirrored water reflections and the object, actor, item, shadow and grass distances. Custom: those rows match none of them. A preset whose file is missing is not offered. The enhanced effects, anti-aliasing and FSR keep their own rows." = "Pone las filas que cubren los preajustes de calidad del original en los valores de low.ini, medium.ini, high.ini o VeryHigh.ini de la carpeta del juego: sombras del sol, filtrado de sombras, resplandor de luz, reflejos especulares del agua y las distancias de objetos, personajes, artículos, sombras y hierba. Personalizado: esas filas no coinciden con ninguno. Un preajuste cuyo archivo falta no se ofrece. Los efectos mejorados, el suavizado de bordes y FSR conservan sus propias filas."
"Enhanced effects" = "Efectos mejorados"
"On: every effect of the enhanced look (ambient occlusion, longer sun shadows, bloom, sharpening, anisotropic filtering 16x, sun shafts, screen-space water reflections). Off: none of them, the original's picture. Custom: some on, some off. Each effect keeps its own row and its own saved state; this row only sets them all at once." = "Activado: todos los efectos del aspecto mejorado (oclusión ambiental, sombras del sol más largas, bloom, nitidez, filtrado anisotrópico 16x, rayos de sol, reflejos del agua en pantalla). Desactivado: ninguno, la imagen del original. Personalizado: unos activados y otros no. Cada efecto conserva su propia fila y su propio estado guardado; esta fila solo los cambia todos a la vez."
"Off (FSR active)" = "Desactivado (FSR activo)"
"Controls" = "Controles"
"HUD colour" = "Color del HUD"
"The colour of the HUD and the menus: Amber (the default) or another; the sliders below set it to any colour." = "El color del HUD y los menús: Ámbar (por defecto) u otro; los deslizadores de abajo lo ajustan a cualquier color."
"Pip-Boy colour" = "Color del Pip-Boy"
"The colour of the Pip-Boy's screens (items, stats, data): Amber (the default) or another; the sliders below set it to any colour." = "El color de las pantallas del Pip-Boy (objetos, estadísticas, datos): Ámbar (por defecto) u otro; los deslizadores de abajo lo ajustan a cualquier color."
"Accepted." = "Aceptada."
"Opening the terminal..." = "Abriendo el terminal..."
"Not accepted" = "Rechazada"
"Tries restored." = "Intentos repuestos."
"Dud removed." = "Señuelo quitado."
"Error" = "Error"
"{n} of {len} right" = "{n} de {len} bien"
"ON" = "SÍ"
