# NVForever's own words in Deutsch (#1948). Written for NVForever, not copied from the
# game (LEGAL.md). Choice names (Off, Auto, Last enemy, Amber …) are
# translated, and the notes name them as they are shown. How to add or fix a line:
# README.md beside this file.

name = "Deutsch"

[words]
# [design, #2200; engine/nvf-play/src/pause.rs] NVForever's device selection.
"Automatic Input Switching" = "Automatischer Eingabegerätewechsel"
"On: a controller button, stick or trigger selects Controller; a key or mouse click selects Keyboard and Mouse (mouse motion does not). Off: choose Input Device yourself." = "An: Eine Controllertaste, ein Stick oder Trigger wählt den Controller; eine Taste oder ein Mausklick wählt Tastatur und Maus (Mausbewegung nicht). Aus: Eingabegerät selbst wählen."
"Dialogue voice" = "Stimmen im Dialog"
"On: lines are spoken. Off: they are silent from the next line on, and still last as long as their sound." = "An: Zeilen werden gesprochen. Aus: ab der nächsten Zeile stumm, sie dauern aber so lange wie ihr Ton."
"Gameplay" = "Spiel"
"Turn to each other in dialogue" = "Im Dialog einander zuwenden"
"On: at the start of a conversation the actor turns to the player and the view turns to the actor." = "An: Zu Beginn eines Gesprächs dreht sich die Figur zum Spieler und der Blick zur Figur."
"Bring the view back when choices appear" = "Blick bei Antworten zurückholen"
"On: when choices appear the view returns to the speaker (with the close-up off). Needs \"Turn to each other in dialogue\"." = "An: Erscheinen Antworten, kehrt der Blick zum Sprecher zurück (bei ausgeschalteter Nahsicht). Benötigt „Im Dialog einander zuwenden“."
"Close in on the speaker in dialogue" = "Im Dialog an den Sprecher heran"
"On: in a conversation the view closes in on the speaker, the background out of focus; the mouse moves only the cursor. Off: you can look around." = "An: Im Gespräch rückt der Blick an den Sprecher heran, der Hintergrund wird unscharf; die Maus bewegt nur den Mauszeiger. Aus: Sie können sich umsehen."
"Goodbye hint" = "Hinweis „Goodbye“"
"On: \"[Tab] Goodbye\" stands at the left of the dialogue box while a Goodbye choice is offered. Off: hidden; Tab still says goodbye." = "An: „[Tab] Goodbye“ steht links neben dem Dialogfenster, solange eine Goodbye-Antwort angeboten wird. Aus: ausgeblendet; Tab verabschiedet trotzdem."
"Aim assist" = "Zielhilfe"
"Controller only. On: the right stick turns slower over a nearby hostile, and aiming down the sights pulls the view onto one near the crosshair." = "Nur Controller. An: Der rechte Stick dreht über einem nahen Feind langsamer, und Zielen über Kimme und Korn zieht den Blick auf einen Feind nahe dem Fadenkreuz."
"Controller" = "Controller"
"Aim slowdown" = "Zielverlangsamung"
"How much slower the right stick turns while the crosshair is on a nearby hostile (0: not at all)." = "Wie viel langsamer der rechte Stick dreht, solange das Fadenkreuz auf einem nahen Feind liegt (0: gar nicht)."
"Aim lock-on" = "Zielerfassung"
"How hard aiming down the sights turns the view onto a hostile near the crosshair (0: not at all). Push the right stick away to break it." = "Wie stark Zielen über Kimme und Korn den Blick auf einen Feind am Fadenkreuz richtet (0: gar nicht). Den rechten Stick wegdrücken, um sich zu lösen."
"Use Pip-Boy" = "Pip-Boy tragen"
"On: the Pip-Boy is worn and the menus come up on the arm. Off: it is taken off and the menus show full screen, as always without a Pip-Boy." = "An: Der Pip-Boy wird getragen, die Menüs erscheinen am Arm. Aus: Er wird abgelegt, die Menüs bildschirmfüllend, wie immer ohne Pip-Boy."
"Kill camera" = "Todeskamera"
"When a VATS shot kills its last mark, a camera shows the kill. Last enemy: only when no other enemy still fights you. Every kill: always. Off: never." = "Wenn ein VATS-Schuss sein letztes Ziel tötet, zeigt eine Kamera den Treffer. Letzter Feind: nur, wenn kein anderer Feind mehr gegen Sie kämpft. Jeder Abschuss: immer. Aus: nie."
"V.A.T.S. style" = "V.A.T.S.-Stil"
"What the V.A.T.S. key starts. Classic: the world stops and you pick body parts to hit. Mark and Fire: time runs very slowly while you mark targets." = "Was die V.A.T.S.-Taste startet. Klassisch: Die Welt hält an und du wählst Körperteile als Ziel. Markieren und Feuern: Die Zeit läuft sehr langsam, während du Ziele markierst."
"V.A.T.S. time slowdown" = "V.A.T.S.-Zeitverlangsamung"
"How far the world slows while you choose targets in Classic: 100% stops it, 50% runs at half speed. Enemies attack at anything less than a stop." = "Wie stark die Welt in Klassisch verlangsamt wird, während du Ziele wählst: 100% hält sie an, 50% läuft mit halber Geschwindigkeit. Unter einem Stopp greifen Gegner an."
"Slower while reloading" = "Langsamer beim Nachladen"
"On: you and the NPCs move at 75% of your speed while a reload runs. Off: reloading does not slow anyone, as in the original." = "An: Sie und die NPCs bewegen sich mit 75 % Ihres Tempos, solange nachgeladen wird. Aus: Nachladen bremst niemanden, wie im Original."
"Difficulty" = "Schwierigkeit"
"How hard the fights are: from Very Easy (your hits do double damage, you take half) to Very Hard (half and double); Normal as they are." = "Wie hart die Kämpfe sind: von Sehr leicht (Ihre Treffer machen doppelten Schaden, Sie nehmen die Hälfte) bis Sehr schwer (Hälfte und doppelt); Normal wie sie sind."
"Dynamic crosshair" = "Dynamisches Fadenkreuz"
"On: with a gun or thrown weapon drawn the crosshair opens with how wide your shots spread now. Off: the arrows stay together." = "An: Mit gezogener Schuss- oder Wurfwaffe öffnet sich das Fadenkreuz mit der aktuellen Streuung Ihrer Schüsse. Aus: die Pfeile bleiben zusammen."
"Crosshair style" = "Fadenkreuz-Stil"
"With Dynamic crosshair on. Cross: four bars that part with the spread. Arrows: the plain crosshair's two arrows part instead." = "Bei dynamischem Fadenkreuz. Kreuz: vier Striche, die mit der Streuung auseinandergehen. Pfeile: stattdessen gehen die zwei Pfeile des einfachen Fadenkreuzes auseinander."
"Detached third-person camera" = "Freie Kamera in der dritten Person"
"On: in third person with your weapon away the mouse turns the camera around you and you run whichever way you push. Off: the camera stays behind you." = "An: In der dritten Person mit weggesteckter Waffe dreht die Maus die Kamera um Sie herum, und Sie laufen in die Richtung, in die Sie drücken. Aus: die Kamera bleibt hinter Ihnen."
"Language" = "Sprache"
"The language of NVForever's own words (menus, messages). The game's own text is the install's." = "Die Sprache der eigenen Texte von NVForever (Menüs, Meldungen). Der Text des Spiels selbst kommt aus der Installation."
"Interface" = "Oberfläche"
"Reverb" = "Hall"
"World sounds echo as the place you are in does (a cave, a hall, a small room). Off: they do not." = "Geräusche der Welt hallen so, wie der Ort es tut, an dem Sie sind (eine Höhle, eine Halle, ein kleiner Raum). Aus: kein Hall."
"Voice reverb" = "Hall auf Stimmen"
"What people say around you echoes in the place you are in, as Reverb does for world sounds. Conversations stay dry." = "Was Leute um Sie herum sagen, hallt am Ort, wie Hall es für die Geräusche der Welt tut. Gespräche bleiben trocken."
"Sound" = "Ton"
"Master" = "Gesamtlautstärke"
"How loud all sound is: each volume below is a part of this one." = "Wie laut aller Ton ist: jede Lautstärke darunter ist ein Teil davon."
"Music" = "Musik"
"The music of the place you are in and the main menu's theme." = "Die Musik des Ortes, an dem Sie sind, und das Thema des Hauptmenüs."
"Footstep" = "Schritte"
"Footsteps, jumps and landings, yours and everyone's." = "Schritte, Sprünge und Landungen, Ihre und die aller anderen."
"Voice" = "Stimmen"
"Spoken lines: conversations and what people say around you." = "Gesprochene Zeilen: Gespräche und was Leute um Sie herum sagen."
"Effects" = "Effekte"
"Every other sound: weapons, impacts, menus, doors and the sounds of places." = "Alle anderen Geräusche: Waffen, Einschläge, Menüs, Türen und die Geräusche der Orte."
"Radio" = "Radio"
"Radio stations, from the Pip-Boy and from radios in the world." = "Radiosender, aus dem Pip-Boy und aus Radios in der Welt."
"Freeze the picture in dialogue and menus" = "Bild in Dialog und Menüs anhalten"
"On: animations, wind, water and sky stand still in conversations, the inventory and other menus, as in the original. Off: only game logic waits." = "An: In Gesprächen, im Inventar und in anderen Menüs stehen Animationen, Wind, Wasser und Himmel still, wie im Original. Aus: nur die Spiellogik wartet."
"Search" = "Suchen"
"Changed" = "Geändert"
"Audio" = "Audio"
"Tweaks" = "Anpassungen"
"Game" = "Allgemein"
"Dialogue" = "Dialog"
"Camera" = "Kamera"
"Screen" = "Bildschirm"
"Performance" = "Leistung"
"Picture" = "Bild"
"Distance" = "Sichtweite"
"Quality" = "Qualität"
"Previous heading" = "Vorheriger Abschnitt"
"Next heading" = "Nächster Abschnitt"
"Keyboard search" = "Suche per Tastatur"
"No settings here." = "Hier gibt es keine Einstellungen."
"No results." = "Keine Treffer."
"No changed settings." = "Keine geänderten Einstellungen."
"Stands for: {rows}." = "Steht für: {rows}."
"Stands for: {rows} and {n} more." = "Steht für: {rows} und {n} weitere."
"Button style" = "Tastenstil"
"The names and pictures of the controller's buttons in prompts and hints. Auto: a PlayStation's when the controller says it is one, else an Xbox's." = "Namen und Bilder der Controller-Tasten in Aufforderungen und Hinweisen. Auto: die einer PlayStation, wenn der Controller sich so meldet, sonst die einer Xbox."
"Light and noise gauges while sneaking" = "Licht- und Geräuschanzeige beim Schleichen"
"On: two bars under the sneak word show how lit you are and how much noise you make, as detection counts them. Not in the original." = "An: Zwei Balken unter dem Schleichen-Wort zeigen, wie hell Sie beleuchtet sind und wie viel Lärm Sie machen, so wie die Entdeckung sie zählt. Nicht im Original."
"Saving" = "Speichern"
"Autosave after travel" = "Automatisch speichern nach Reisen"
"On: the game saves to the autosave slot after each loading screen (doors, coc, a script moving you); fast travel has its own row." = "An: Das Spiel speichert nach jedem Ladebildschirm in den Autospeicherplatz (Türen, coc, ein Skript, das Sie versetzt); die Schnellreise hat ihre eigene Zeile."
"Save on fast travel" = "Bei Schnellreise speichern"
"On: the game saves to the autosave slot when a fast travel arrives." = "An: Das Spiel speichert in den Autospeicherplatz, wenn eine Schnellreise ankommt."
"Save on wait" = "Beim Warten speichern"
"On: the game saves to the autosave slot when a wait ends with at least one hour passed." = "An: Das Spiel speichert in den Autospeicherplatz, wenn ein Warten nach mindestens einer Stunde endet."
"Save on sleep" = "Beim Schlafen speichern"
"On: the game saves to the autosave slot when the player wakes from a sleep of at least one hour." = "An: Das Spiel speichert in den Autospeicherplatz, wenn der Spieler aus einem Schlaf von mindestens einer Stunde erwacht."
"Save when a script asks" = "Speichern, wenn ein Skript es verlangt"
"On: a script's Autosave saves to the autosave slot (quest milestones), SystemSave to the system slot, ForceSave as a new save." = "An: Autosave aus einem Skript speichert in den Autospeicherplatz (Quest-Meilensteine), SystemSave in den Systemplatz, ForceSave als neuen Spielstand."
"Hardcore mode" = "Hardcore-Modus"
"On: you need water, food and sleep, stimpaks heal over time, ammo has weight, crippled limbs need a doctor's bag or a doctor. Off: none of that." = "An: Sie brauchen Wasser, Essen und Schlaf, Stimpaks heilen mit der Zeit, Munition hat Gewicht, verkrüppelte Gliedmaßen brauchen eine Arzttasche oder einen Arzt. Aus: nichts davon."
"HUD red" = "HUD rot"
"HUD green" = "HUD grün"
"HUD blue" = "HUD blau"
"Pip-Boy red" = "Pip-Boy rot"
"Pip-Boy green" = "Pip-Boy grün"
"Pip-Boy blue" = "Pip-Boy blau"
"One part of the colour above, 0 to 255; drag the meter or use Left and Right." = "Ein Anteil der Farbe darüber, 0 bis 255; die Anzeige ziehen oder Links und Rechts benutzen."
"On: the music of the place you are in plays. Off: it is silent and goes on unheard." = "An: Die Musik des Ortes, an dem Sie sind, spielt. Aus: sie ist stumm und läuft ungehört weiter."
"UI scale" = "Oberflächengröße"
"The size of the HUD and the menus, as a part of the original's. Above 100% only the HUD grows. Takes effect at the next start." = "Die Größe von HUD und Menüs als Anteil der des Originals. Über 100 % wächst nur das HUD. Wirkt ab dem nächsten Start."
"This terminal requires a password." = "Dieses Terminal verlangt ein Passwort."
"You need a Science skill of {needed} to hack this terminal." = "Sie brauchen eine Wissenschaft-Fertigkeit von {needed}, um dieses Terminal zu hacken."
"Lip sync" = "Lippensynchronität"
"On: a speaker's face moves with the line. Off: a face that is moving eases back to rest." = "An: Das Gesicht eines Sprechers bewegt sich mit der Zeile. Aus: ein bewegtes Gesicht kehrt sanft in Ruhe zurück."
"Head tracking" = "Kopfbewegung"
"On: actors turn their heads to the player and to others near them. Off: heads ease back to their animation." = "An: Figuren drehen die Köpfe zum Spieler und zu anderen in der Nähe. Aus: die Köpfe kehren sanft zu ihrer Animation zurück."
"Feet follow the ground" = "Füße folgen dem Boden"
"On: on slopes and steps actors bend their knees and set each foot on the ground under it. Off: the legs play the animation as it is." = "An: Auf Hängen und Stufen beugen Figuren die Knie und setzen jeden Fuß auf den Boden darunter. Aus: die Beine spielen die Animation, wie sie ist."
"Sky follows the game clock" = "Himmel folgt der Spieluhr"
"On: the sky shows the game's time of day as it passes. Off: the sky keeps its hour while the game's clock runs on ([ and ] still set it)." = "An: Der Himmel zeigt die Tageszeit des Spiels, wie sie vergeht. Aus: der Himmel behält seine Stunde, während die Spieluhr weiterläuft ([ und ] stellen sie weiterhin)."
"Resolution" = "Auflösung"
"The window's size, or in full screen the monitor's (its own size: borderless). A new one goes back after 20 seconds unless you keep it." = "Die Größe des Fensters oder im Vollbild die des Monitors (seine eigene Größe: rahmenlos). Eine neue wird nach 20 Sekunden zurückgenommen, wenn Sie sie nicht behalten."
"Full screen" = "Vollbild"
"On: the game fills its monitor without a frame, at the full screen resolution above. Off: a window of the window resolution." = "An: Das Spiel füllt seinen Monitor ohne Rahmen, in der Vollbildauflösung oben. Aus: ein Fenster in der Fensterauflösung."
"Monitor" = "Monitor"
"The display the game opens on in full screen (the first display until you pick one)." = "Der Bildschirm, auf dem das Spiel im Vollbild öffnet (der erste, bis Sie einen wählen)."
"Body in first person" = "Körper in der ersten Person"
"On: in first person you see your own body and legs when you look down. Off: only the arms and the weapon are drawn, as in the original." = "An: In der ersten Person sehen Sie beim Blick nach unten Ihren Körper und Ihre Beine. Aus: nur Arme und Waffe werden gezeichnet, wie im Original."
"Weapon sway" = "Waffenschwanken"
"On: in first person the arms and weapon lag behind a turn and bob as you walk and run. Off: they stay still in the view." = "An: In der ersten Person hängen Arme und Waffe bei einer Drehung nach und wippen beim Gehen und Laufen. Aus: sie bleiben ruhig im Bild."
"Head bob" = "Kopfwippen"
"On: in first person the view dips with each step as you walk and run. Off: it stays level." = "An: In der ersten Person senkt sich der Blick bei jedem Schritt im Gehen und Laufen. Aus: er bleibt waagerecht."
"Lower weapon near walls" = "Waffe an Wänden senken"
"On: in first person a drawn weapon lowers at a wall or a friend and comes back up when you aim or fire. Off: it stays up, as in the original." = "An: In der ersten Person senkt sich eine gezogene Waffe vor einer Wand oder einem Freund und kommt beim Zielen oder Feuern wieder hoch. Aus: sie bleibt oben, wie im Original."
"True iron sights" = "Echte Kimme und Korn"
"On: aiming a gun lines its sights up with your eye and hides the crosshair. Off: the gun is held low with the crosshair, as in the original." = "An: Beim Zielen liegt die Visierung der Waffe vor dem Auge, das Fadenkreuz ist ausgeblendet. Aus: die Waffe wird tief gehalten, mit Fadenkreuz, wie im Original."
"3D scopes (test)" = "3D-Zielfernrohre (Test)"
"On: a scoped gun stays on screen and shows the zoomed view in its lens. Off: the full-screen scope picture, as in the original." = "An: Eine Waffe mit Zielfernrohr bleibt sichtbar und zeigt die vergrößerte Sicht in der Linse. Aus: das bildschirmfüllende Zielfernrohr-Bild, wie im Original."
"Sun shadows" = "Sonnenschatten"
"The sun's shadows: Off, Performance (cheaper outdoors; moving shadows update at half the frame rate) or Quality. The original casts none from the world." = "Die Schatten der Sonne: Aus, Leistung (draußen günstiger; bewegte Schatten mit halber Bildrate aktualisiert) oder Qualität. Das Original wirft keine von der Welt."
"Grass" = "Gras"
"On: grass grows on the landscape; the cells around you get theirs over the next frames. Off: it is hidden and none grows on new cells." = "An: Auf der Landschaft wächst Gras; die Zellen um Sie herum bekommen ihres in den nächsten Bildern. Aus: es ist ausgeblendet und auf neuen Zellen wächst keins."
"Distant terrain and objects" = "Fernes Gelände und Objekte"
"On: distant land, buildings and trees are drawn beyond the loaded cells (outdoors). Off: the world ends at the loaded cells." = "An: Fernes Land, Gebäude und Bäume werden jenseits der geladenen Zellen gezeichnet (im Freien). Aus: die Welt endet an den geladenen Zellen."
"Colour grade" = "Farbkorrektur"
"On: the picture is graded by the worldspace's, the weather's and the cell's image space. Off: the picture as lit, for comparisons." = "An: Das Bild wird nach dem Bildraum von Weltraum, Wetter und Zelle eingefärbt. Aus: das Bild, wie es beleuchtet ist, zum Vergleichen."
"Text overlay" = "Textüberlagerung"
"On: the position, loading counts and key help are written over the picture. Off by default in the game." = "An: Position, Ladezähler und Tastenhilfe werden über das Bild geschrieben. Im Spiel standardmäßig aus."
"Shot markers" = "Treffermarken"
"On: a cross is drawn at each impact and a line from the muzzle along each hitscan shot." = "An: An jedem Einschlag wird ein Kreuz gezeichnet und eine Linie von der Mündung entlang jedes Sofortschusses."
"God mode" = "Gottmodus"
"On: the player takes no damage from hits and cannot be killed by them." = "An: Der Spieler nimmt keinen Schaden durch Treffer und kann durch sie nicht getötet werden."
"Draw the navmesh" = "Navmesh zeichnen"
"On: the navmesh near the camera and the walking NPCs' paths are drawn." = "An: Das Navmesh nahe der Kamera und die Wege gehender NPCs werden gezeichnet."
"Frame rate counter" = "Bildratenanzeige"
"On: a panel of performance readings at the top right; the Counter rows below choose what it shows. Not in the original." = "An: eine Tafel mit Leistungswerten oben rechts; die Counter-Zeilen darunter wählen, was sie zeigt. Nicht im Original."
"Display sync" = "Bildsynchronisation"
"Vertical sync: frames wait for the display (no tearing). Variable refresh: for a G-Sync or FreeSync screen. Off: frames show at once (may tear)." = "Vertikale Synchronisation: Bilder warten auf den Bildschirm (kein Zerreißen). Variable Bildrate: für G-Sync- oder FreeSync-Bildschirme. Aus: Bilder sofort (kann zerreißen)."
"Upscaler" = "Hochskalierung"
"Upscaling mode" = "Hochskalierungsmodus"
"FSR 3.1 or NVIDIA DLSS rebuilds the world at display resolution, at the mode below. DLSS needs an NVIDIA RTX card and its files in the dlss folder." = "FSR 3.1 oder NVIDIA DLSS baut die Welt in Bildschirmauflösung wieder auf, im Modus darunter. DLSS braucht eine NVIDIA-RTX-Karte und seine Dateien im Ordner dlss."
"The share of the screen the world is drawn at; the upscaler rebuilds the rest. Native AA: full size. Quality to Ultra Performance: ever faster." = "Der Anteil des Bildschirms, in dem die Welt gezeichnet wird; die Hochskalierung baut den Rest wieder auf. Natives AA: volle Größe. Qualität bis Ultra-Leistung: immer schneller."
"DLSS model" = "DLSS-Modell"
"Which DLSS model rebuilds the picture (NVIDIA calls them presets). Default, recommended: NVIDIA picks per mode. Only while DLSS draws." = "Welches DLSS-Modell das Bild wieder aufbaut (NVIDIA nennt sie Presets). Standard, empfohlen: NVIDIA wählt je Modus. Nur solange DLSS zeichnet."
"Default" = "Standard"
"DLSS only" = "Nur mit DLSS"
"World" = "Welt"
"Display" = "Anzeige"
"Debug" = "Debug"
"Graphics" = "Grafik"
"Field of view" = "Sichtfeld"
"The game's field of view in degrees across a 4:3 picture (75 as the original's default); wider screens see more at the sides." = "Das Sichtfeld des Spiels in Grad über ein 4:3-Bild (75 wie der Standard des Originals); breitere Bildschirme sehen mehr an den Seiten."
"Viewmodel field of view" = "Sichtfeld der Waffenansicht"
"The angle the first-person arms and weapon are drawn with, in degrees (55 as the original's default): lower draws them bigger and closer." = "Der Winkel, mit dem Arme und Waffe in der Ich-Perspektive gezeichnet werden, in Grad (55 wie im Original): niedriger zeichnet sie größer und näher."
"Frame rate limit" = "Bildratenbegrenzung"
"At most this many frames a second (Off: no limit of its own). A lower limit keeps the computer cooler and quieter." = "Höchstens so viele Bilder pro Sekunde (Aus: keine eigene Grenze). Eine niedrigere Grenze hält den Computer kühler und leiser."
"Object distance" = "Objektdistanz"
"How far from you objects of the loaded cells (buildings, rocks, furniture, clutter) are drawn. Lower draws fewer and runs faster." = "Wie weit von Ihnen Objekte der geladenen Zellen (Gebäude, Felsen, Möbel, Kleinkram) gezeichnet werden. Weniger zeichnet weniger und läuft schneller."
"Actor distance" = "Figurendistanz"
"How far from you people and creatures are drawn, as a part of the farthest the loaded cells reach." = "Wie weit von Ihnen Menschen und Kreaturen gezeichnet werden, als Anteil der größten Reichweite der geladenen Zellen."
"Item distance" = "Gegenstandsdistanz"
"How far from you items lying in the world are drawn, as a part of the farthest the loaded cells reach." = "Wie weit von Ihnen Gegenstände, die in der Welt liegen, gezeichnet werden, als Anteil der größten Reichweite der geladenen Zellen."
"Shadow distance" = "Schattendistanz"
"How far from you the sun casts shadows (with Sun shadows on), as a part of the farthest shadow distance." = "Wie weit von Ihnen die Sonne Schatten wirft (mit Sonnenschatten an), als Anteil der größten Schattendistanz."
"Grass distance" = "Grasdistanz"
"How far from you grass is drawn, as a part of the farthest grass distance and its fade range." = "Wie weit von Ihnen Gras gezeichnet wird, als Anteil der größten Grasdistanz und ihres Ausblendbereichs."
"Anti-aliasing" = "Kantenglättung"
"How edges are smoothed: multisampling 2x, 4x or 8x (dearer at each step) or FXAA, SMAA or TAA afterwards. Reads Off while an upscaler is on." = "Wie Kanten geglättet werden: Multisampling 2x, 4x oder 8x (mit jeder Stufe teurer) oder danach FXAA, SMAA oder TAA. Zeigt Aus, solange eine Hochskalierung an ist."
"Shadow filtering" = "Schattenfilterung"
"How the sun's shadow edges are softened: Fast (harder, cheapest), Smooth (as vanilla) or Temporal (grainy unless Anti-aliasing is TAA)." = "Wie die Ränder der Sonnenschatten weichgezeichnet werden: Schnell (härter, am billigsten), Weich (wie das Original) oder Zeitlich (körnig, außer bei Kantenglättung TAA)."
"Ambient occlusion" = "Umgebungsverdeckung"
"On: creases, corners and the ground under things are darkened by how enclosed they are (screen-space, from the depth). Not in the original." = "An: Falten, Ecken und der Boden unter Dingen werden abgedunkelt, je nachdem wie eingeschlossen sie sind (im Bildraum, aus der Tiefe). Nicht im Original."
"Longer sun shadows" = "Längere Sonnenschatten"
"On: the sun's shadows reach half as far again as the shadow distance. Costs a little frame rate." = "An: Die Sonnenschatten reichen anderthalbmal so weit wie die Schattendistanz. Kostet etwas Bildrate."
"Bloom" = "Bloom"
"On: light brighter than a sunlit white wall (the sun, lamps, windows) glows into its surroundings, on top of the game's own image space." = "An: Licht heller als eine sonnenbeschienene weiße Wand (die Sonne, Lampen, Fenster) strahlt in seine Umgebung, zusätzlich zum eigenen Bildraum des Spiels."
"Light glow (HDR)" = "Lichtschein (HDR)"
"On: neon, lamps, beams and fire glow softly, as the original's HDR glow does, as much as the place's image space asks. Bloom adds to it." = "An: Neon, Lampen, Strahlen und Feuer leuchten sanft, wie der HDR-Schein des Originals, so stark, wie der Bildraum des Ortes verlangt. Bloom kommt dazu."
"Eye adaptation" = "Augenanpassung"
"On: dark views brighten after a moment, as the eye gets used to the dark, by the place's image space. Needs the light glow." = "An: Dunkle Ansichten hellen sich nach einem Moment auf, wie sich das Auge an die Dunkelheit gewöhnt, nach dem Bildraum des Ortes. Braucht den Lichtschein."
"Neon glow" = "Neonschein"
"On: where the image space asks for a strong glow (the Strip at night) neon burns with a wide halo, as in the original. Needs the light glow." = "An: Wo der Bildraum einen starken Schein verlangt (der Strip nachts), brennt Neon mit breitem Hof, wie im Original. Braucht den Lichtschein."
"Sharpening" = "Schärfen"
"On: the final picture is sharpened where it has little contrast (contrast-adaptive sharpening)." = "An: Das fertige Bild wird dort geschärft, wo es wenig Kontrast hat (kontrastadaptives Schärfen)."
"Anisotropic filtering 16x" = "Anisotrope Filterung 16x"
"On: textures seen at a slant stay sharp further (16x instead of 8x). For textures loaded from now on (the cells loaded next)." = "An: Schräg gesehene Texturen bleiben weiter scharf (16x statt 8x). Für Texturen, die ab jetzt geladen werden (die als Nächstes geladenen Zellen)."
"Sun shafts" = "Sonnenstrahlen"
"On: sunlight streams past what stands in front of the sun, stronger the hazier the weather's fog. Not in the original." = "An: Sonnenlicht strömt an dem vorbei, was vor der Sonne steht, umso stärker, je dunstiger der Nebel des Wetters. Nicht im Original."
"Screen-space water reflections" = "Bildraum-Wasserspiegelungen"
"On: water the mirrored reflection does not reach (another height, interiors) reflects what is on the screen instead of only the sky." = "An: Wasser, das die gespiegelte Reflexion nicht erreicht (andere Höhe, Innenräume), spiegelt, was auf dem Bildschirm ist, statt nur den Himmel."
"Mirrored water reflections" = "Gespiegelte Wasserspiegelungen"
"On: water mirrors the world above it, as in the original, drawing the scene a second time. Off: it reflects the sky." = "An: Wasser spiegelt die Welt darüber, wie im Original; die Szene wird dafür ein zweites Mal gezeichnet. Aus: es spiegelt den Himmel."
"Quality preset" = "Qualitätsstufe"
"Sets the rows the original's quality presets cover to the game folder's low.ini to VeryHigh.ini. Custom: those rows match none of them." = "Setzt die Zeilen, die die Qualitätsstufen des Originals abdecken, auf die Werte aus low.ini bis VeryHigh.ini im Spielordner. Eigene: Diese Zeilen passen zu keiner Stufe."
"Enhanced effects" = "Erweiterte Effekte"
"Sets every effect of the enhanced look at once. On: all of them. Off: none, the original's picture. Custom: some on, some off. Each keeps its own row." = "Setzt alle Effekte des erweiterten Aussehens auf einmal. An: alle. Aus: keiner, das Bild des Originals. Eigene: einige an, einige aus. Jeder behält seine eigene Zeile."
