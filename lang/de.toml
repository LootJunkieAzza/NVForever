# NVForever's own words in Deutsch (#1948). Written for NVForever, not copied from the
# game (LEGAL.md). Choice names (Off, Auto, Last enemy, Amber …) are
# translated, and the notes name them as they are shown. How to add or fix a line:
# README.md beside this file.

name = "Deutsch"

[words]
# [design, #2200; engine/nvf-play/src/pause.rs] NVForever's device selection.
"Automatic Input Switching" = "Automatischer Eingabegerätewechsel"
"On: a controller button or a stick or trigger past its dead zone selects Controller; a key or mouse click selects Keyboard and Mouse. First release the current device's buttons and centre its sticks/triggers, then press again to switch on a later frame. Only the switching press is ignored; later holds/repeats and all releases work. Mouse motion does not switch. Off: choose Input Device manually. Saved in [Controls] of NVForever.ini." = "Ein: Eine Controllertaste oder ein Stick oder Trigger jenseits der Totzone wählt den Controller; eine Taste oder ein Mausklick wählt Tastatur und Maus. Zuerst die Tasten des aktuellen Geräts loslassen und Sticks/Trigger in die Ruheposition bringen, dann in einem späteren Frame erneut drücken. Nur der auslösende Tastendruck wird ignoriert; weiteres Halten, Wiederholen und jedes Loslassen funktionieren. Mausbewegungen wechseln nicht. Aus: Eingabegerät manuell wählen. Gespeichert in [Controls] der NVForever.ini."
"Dialogue voice" = "Stimmen im Dialog"
"On: lines are spoken. Off: they are silent from the next line on, and still last as long as their sound. (--no-voice)" = "An: Zeilen werden gesprochen. Aus: ab der nächsten Zeile stumm, sie dauern aber so lange wie ihr Ton. (--no-voice)"
"Gameplay" = "Spiel"
"Turn to each other in dialogue" = "Im Dialog einander zuwenden"
"On: at the start of a conversation the actor turns to the player and the view turns to the actor. (--no-dialogue-look)" = "An: Zu Beginn eines Gesprächs dreht sich die Figur zum Spieler und der Blick zur Figur. (--no-dialogue-look)"
"Bring the view back when choices appear" = "Blick bei Antworten zurückholen"
"On: with \"Close in on the speaker in dialogue\" off, after you look away the view returns to the speaker when choices appear. Needs \"Turn to each other in dialogue\". (--dialogue-recentre)" = "An: Ist „Im Dialog an den Sprecher heran“ aus, kehrt der Blick nach dem Wegschauen zum Sprecher zurück, wenn Antworten erscheinen. Benötigt „Im Dialog einander zuwenden“. (--dialogue-recentre)"
"Close in on the speaker in dialogue" = "Im Dialog an den Sprecher heran"
"On: in a conversation the view narrows onto the speaker, with what is behind them out of focus; from third person the camera comes to the eyes. The view stays on the speaker and the mouse moves only the cursor. Off: no close-up; you can look around. (--no-dialogue-zoom)" = "An: Im Gespräch verengt sich der Blick auf den Sprecher, der Hintergrund wird unscharf; aus der dritten Person rückt die Kamera auf Augenhöhe. Der Blick bleibt beim Sprecher, die Maus bewegt nur den Mauszeiger. Aus: keine Nahsicht; Sie können sich umsehen. (--no-dialogue-zoom)"
"Goodbye hint" = "Hinweis „Goodbye“"
"On: while a conversation offers a Goodbye choice, \"[Tab] Goodbye\" stands at the left of the dialogue box. Off: the words are hidden; Tab still says goodbye." = "An: Solange ein Gespräch eine Goodbye-Antwort bietet, steht „[Tab] Goodbye“ links neben dem Dialogfenster. Aus: der Hinweis ist ausgeblendet; Tab verabschiedet trotzdem."
"Aim assist" = "Zielhilfe"
"Controller only, never the mouse. On: the right stick turns slower while the crosshair is on a nearby hostile, and aiming down the sights turns the view onto one near the crosshair for a moment. Off: neither." = "Nur Controller, nie die Maus. An: Der rechte Stick dreht langsamer, solange das Fadenkreuz auf einem nahen Feind liegt, und Zielen über Kimme und Korn richtet den Blick kurz auf einen Feind nahe dem Fadenkreuz. Aus: keins von beidem."
"Controller" = "Controller"
"Aim slowdown" = "Zielverlangsamung"
"How much slower the right stick turns while the crosshair is on a nearby hostile (0: not at all)." = "Wie viel langsamer der rechte Stick dreht, solange das Fadenkreuz auf einem nahen Feind liegt (0: gar nicht)."
"Aim lock-on" = "Zielerfassung"
"How hard aiming down the sights turns the view onto a nearby hostile near the crosshair (0: not at all). Push the right stick away to break it." = "Wie stark Zielen über Kimme und Korn den Blick auf einen nahen Feind am Fadenkreuz richtet (0: gar nicht). Den rechten Stick wegdrücken, um sich zu lösen."
"Use Pip-Boy" = "Pip-Boy tragen"
"On: the Pip-Boy and its glove are worn and the menus come up on the arm. Off: both are taken off and the menus show full screen. Without a Pip-Boy worn the menus are always full screen." = "An: Pip-Boy und Handschuh werden getragen, die Menüs erscheinen am Arm. Aus: beides abgelegt, die Menüs bildschirmfüllend. Ohne getragenen Pip-Boy sind die Menüs immer bildschirmfüllend."
"Kill camera" = "Todeskamera"
"When a VATS shot kills its last mark, a cinematic camera can show the kill. Last enemy: only when no other enemy is still fighting you. Every kill: whoever is left. Off: never." = "Wenn ein VATS-Schuss sein letztes Ziel tötet, kann eine Filmkamera den Treffer zeigen. Letzter Feind: nur, wenn kein anderer Feind mehr gegen Sie kämpft. Jeder Abschuss: bei jedem Treffer. Aus: nie."
"V.A.T.S. style" = "V.A.T.S.-Stil"
"What the V.A.T.S. key starts. Classic: the world stops, you pick a target and its body parts from their chances to hit, then the queued attacks play. Mark and Fire: time runs very slowly while you mark targets under the crosshair." = "Was die V.A.T.S.-Taste startet. Klassisch: Die Welt hält an, du wählst ein Ziel und seine Körperteile nach ihrer Trefferchance, dann laufen die eingereihten Angriffe ab. Markieren und Feuern: Die Zeit läuft sehr langsam, während du Ziele unter dem Fadenkreuz markierst."
"V.A.T.S. time slowdown" = "V.A.T.S.-Zeitverlangsamung"
"How far the world slows while you choose targets in the Classic style: 100% stops it, 50% runs it at half speed. Enemies keep attacking at anything less than a full stop." = "Wie stark die Welt im Stil Klassisch verlangsamt wird, während du Ziele wählst: 100% hält sie an, bei 50% läuft sie mit halber Geschwindigkeit. Unter einem vollen Stopp greifen Gegner weiter an."
"Slower while reloading" = "Langsamer beim Nachladen"
"On: you and the NPCs move at 75% of your speed while a reload runs. Off: reloading does not slow anyone, as in the original." = "An: Sie und die NPCs bewegen sich mit 75 % Ihres Tempos, solange nachgeladen wird. Aus: Nachladen bremst niemanden, wie im Original."
"Difficulty" = "Schwierigkeit"
"How hard the fights are: from Very Easy (the player's hits do double damage and the player takes half) to Very Hard (half and double); Normal as they are. (console: SetGameDifficulty 0-4)" = "Wie hart die Kämpfe sind: von Sehr leicht (die Treffer des Spielers machen doppelten Schaden, er selbst nimmt die Hälfte) bis Sehr schwer (Hälfte und doppelt); Normal wie sie sind. (Konsole: SetGameDifficulty 0-4)"
"Dynamic crosshair" = "Dynamisches Fadenkreuz"
"On: with a gun or thrown weapon drawn the crosshair opens to show how wide your shots spread now (wider running, after shots, with crippled arms; narrower aimed or crouched); Crosshair style below picks how it looks. Off: the arrows stay together whatever is drawn." = "An: Mit gezogener Schuss- oder Wurfwaffe öffnet sich das Fadenkreuz und zeigt die aktuelle Streuung (weiter im Laufen, nach Schüssen, mit verkrüppelten Armen; enger beim Zielen oder in der Hocke); das Aussehen wählt „Fadenkreuz-Stil“ darunter. Aus: die Pfeile bleiben zusammen, was immer gezogen ist."
"Crosshair style" = "Fadenkreuz-Stil"
"With Dynamic crosshair on and a gun or thrown weapon drawn. Cross: four bars that part with the spread. Arrows: the plain crosshair's two arrows part instead." = "Bei dynamischem Fadenkreuz und gezogener Schuss- oder Wurfwaffe. Kreuz: vier Striche, die mit der Streuung auseinandergehen. Pfeile: stattdessen gehen die zwei Pfeile des einfachen Fadenkreuzes auseinander."
"Detached third-person camera" = "Freie Kamera in der dritten Person"
"On: in third person with your weapon away the mouse turns the camera around you, not your character, and your character turns to run whichever way you push, as the camera sees it. Drawing your weapon turns you to where the camera looks. Off: the camera stays behind you, as in the original." = "An: In der dritten Person mit weggesteckter Waffe dreht die Maus die Kamera um Sie herum, nicht Ihre Figur, und die Figur läuft in die Richtung, in die Sie drücken, so wie die Kamera es sieht. Ziehen Sie die Waffe, drehen Sie sich dorthin, wohin die Kamera schaut. Aus: die Kamera bleibt hinter Ihnen, wie im Original."
"Language" = "Sprache"
"The language of NVForever's own words (menus, messages). The game's own text is the install's." = "Die Sprache der eigenen Texte von NVForever (Menüs, Meldungen). Der Text des Spiels selbst kommt aus der Installation."
"Interface" = "Oberfläche"
"Reverb" = "Hall"
"World sounds echo as the place you are in does (a cave, a hall, a small room). Off: --no-reverb." = "Geräusche der Welt hallen so, wie der Ort es tut, an dem Sie sind (eine Höhle, eine Halle, ein kleiner Raum). Aus: --no-reverb."
"Voice reverb" = "Hall auf Stimmen"
"What people say around you echoes in the place you are in, up to the end of each line, as Reverb does for world sounds. Conversations stay dry." = "Was Leute um Sie herum sagen, hallt am Ort bis zum Ende jeder Zeile, wie Hall es für die Geräusche der Welt tut. Gespräche bleiben trocken."
"Sound" = "Ton"
"Master" = "Gesamtlautstärke"
"How loud all sound is: each volume below is a part of this one." = "Wie laut aller Ton ist: jede Lautstärke darunter ist ein Teil davon."
"Music" = "Musik"
"The music of the place you are in and the main menu's theme." = "Die Musik des Ortes, an dem Sie sind, und das Thema des Hauptmenüs."
"Footstep" = "Schritte"
"Footsteps, jumps and landings, yours and everyone's." = "Schritte, Sprünge und Landungen, Ihre und die aller anderen."
"Voice" = "Stimmen"
"Spoken lines: conversations and what people say around you." = "Gesprochene Zeilen: Gespräche und was Leute um Sie herum sagen."
"Effects" = "Effekte"
"Every other sound: weapons, impacts, menus, doors and the sounds of places." = "Alle anderen Geräusche: Waffen, Einschläge, Menüs, Türen und die Geräusche der Orte."
"Radio" = "Radio"
"Radio stations, from the Pip-Boy and from radios in the world." = "Radiosender, aus dem Pip-Boy und aus Radios in der Welt."
"Freeze the picture in dialogue and menus" = "Bild in Dialog und Menüs anhalten"
"On: while a conversation, the inventory, a container or a message box is open, animations, wind, water and sky stand still, as in the original. Off: only game logic waits and the world lives on. This menu always holds everything. (--menu-pause original|living)" = "An: Solange ein Gespräch, das Inventar, ein Behälter oder ein Meldungsfenster offen ist, stehen Animationen, Wind, Wasser und Himmel still, wie im Original. Aus: nur die Spiellogik wartet, die Welt lebt weiter. Dieses Menü hält immer alles an. (--menu-pause original|living)"
"Search" = "Suchen"
"Changed" = "Geändert"
"Audio" = "Audio"
"Tweaks" = "Anpassungen"
"Game" = "Allgemein"
"Dialogue" = "Dialog"
"Camera" = "Kamera"
"Screen" = "Bildschirm"
"Performance" = "Leistung"
"Picture" = "Bild"
"Distance" = "Sichtweite"
"Quality" = "Qualität"
"Previous heading" = "Vorheriger Abschnitt"
"Next heading" = "Nächster Abschnitt"
"Keyboard search" = "Suche per Tastatur"
"No settings here." = "Hier gibt es keine Einstellungen."
"No results." = "Keine Treffer."
"No changed settings." = "Keine geänderten Einstellungen."
"Stands for: {rows}." = "Steht für: {rows}."
"Button style" = "Tastenstil"
"Which names and pictures the controller's buttons go by in prompts, menu hints and the Controls tab. Auto: a PlayStation controller's (Cross, Circle, Square, Triangle, L1, R2, Select…) when the controller in use says it is one, else an Xbox controller's. Xbox or PlayStation: always those. The INI keeps the Xbox names either way." = "Mit welchen Namen und Bildern die Controller-Tasten in Hinweisen, Menüs und im Steuerungs-Reiter bezeichnet werden. Auto: die eines PlayStation-Controllers (Cross, Circle, Square, Triangle, L1, R2, Select…), wenn der benutzte Controller sich so meldet, sonst die eines Xbox-Controllers. Xbox oder PlayStation: immer diese. Die INI behält in jedem Fall die Xbox-Namen."
"Light and noise gauges while sneaking" = "Licht- und Geräuschanzeige beim Schleichen"
"On: two bars under the sneak word show how lit you are and how much noise you make, as detection counts them. Not in the original." = "An: Zwei Balken unter dem Schleichen-Wort zeigen, wie hell Sie beleuchtet sind und wie viel Lärm Sie machen, so wie die Entdeckung sie zählt. Nicht im Original."
"Saving" = "Speichern"
"Autosave after travel" = "Automatisch speichern nach Reisen"
"On: the game saves to the autosave slot after each loading screen (doors, coc, a script moving the player); fast travel has its own switch." = "An: Das Spiel speichert nach jedem Ladebildschirm in den Autospeicherplatz (Türen, coc, ein Skript, das den Spieler versetzt); die Schnellreise hat ihren eigenen Schalter."
"Save on fast travel" = "Bei Schnellreise speichern"
"On: the game saves to the autosave slot when a fast travel arrives." = "An: Das Spiel speichert in den Autospeicherplatz, wenn eine Schnellreise ankommt."
"Save on wait" = "Beim Warten speichern"
"On: the game saves to the autosave slot when a wait ends with at least one hour passed." = "An: Das Spiel speichert in den Autospeicherplatz, wenn ein Warten nach mindestens einer Stunde endet."
"Save on sleep" = "Beim Schlafen speichern"
"On: the game saves to the autosave slot when the player wakes from a sleep of at least one hour." = "An: Das Spiel speichert in den Autospeicherplatz, wenn der Spieler aus einem Schlaf von mindestens einer Stunde erwacht."
"Save when a script asks" = "Speichern, wenn ein Skript es verlangt"
"On: a script's Autosave saves to the autosave slot, as quests do at their milestones; SystemSave to the system slot; ForceSave as a new save." = "An: Autosave aus einem Skript speichert in den Autospeicherplatz, wie Quests es an ihren Meilensteinen tun; SystemSave in den Systemplatz; ForceSave als neuen Spielstand."
"Hardcore mode" = "Hardcore-Modus"
"On: you need water, food and sleep, stimpaks heal over time, ammunition has weight and crippled limbs heal only with a doctor's bag or a doctor. Off: none of that; turning it off clears your thirst, hunger and tiredness and their effects. (console: SetHardcore 1/0)" = "An: Sie brauchen Wasser, Essen und Schlaf, Stimpaks heilen mit der Zeit, Munition hat Gewicht und verkrüppelte Gliedmaßen heilen nur mit einer Arzttasche oder bei einem Arzt. Aus: nichts davon; Ausschalten beendet Durst, Hunger und Müdigkeit samt ihren Effekten. (Konsole: SetHardcore 1/0)"
"HUD red" = "HUD rot"
"HUD green" = "HUD grün"
"HUD blue" = "HUD blau"
"Pip-Boy red" = "Pip-Boy rot"
"Pip-Boy green" = "Pip-Boy grün"
"Pip-Boy blue" = "Pip-Boy blau"
"One part of the colour above, 0 to 255; drag the meter or use Left and Right." = "Ein Anteil der Farbe darüber, 0 bis 255; die Anzeige ziehen oder Links und Rechts benutzen."
"On: the music of the place you are in plays. Off: it is silent and goes on unheard. (--no-music)" = "An: Die Musik des Ortes, an dem Sie sind, spielt. Aus: sie ist stumm und läuft ungehört weiter. (--no-music)"
"UI scale" = "Oberflächengröße"
"The size of the HUD and the menus, as a part of the original's (100%): smaller leaves more of the picture free, each HUD piece kept at its edge of the screen and each menu in the middle. Above 100% only the HUD grows: the menus stay at the original's size, so they keep on the screen. Takes effect at the next start (loading a save starts the game again). Not in the original." = "Die Größe von HUD und Menüs als Anteil der des Originals (100 %): kleiner lässt mehr vom Bild frei, jedes HUD-Teil bleibt an seinem Bildschirmrand und jedes Menü in der Mitte. Über 100 % wächst nur das HUD: die Menüs bleiben in Originalgröße, damit sie auf den Bildschirm passen. Wirkt ab dem nächsten Start (Laden eines Spielstands startet das Spiel neu). Nicht im Original."
"This terminal requires a password." = "Dieses Terminal verlangt ein Passwort."
"You need a Science skill of {needed} to hack this terminal." = "Sie brauchen eine Wissenschaft-Fertigkeit von {needed}, um dieses Terminal zu hacken."
"Lip sync" = "Lippensynchronität"
"On: a speaker's face moves with the line. Off: a face that is moving eases back to rest. (--no-lip)" = "An: Das Gesicht eines Sprechers bewegt sich mit der Zeile. Aus: ein bewegtes Gesicht kehrt sanft in Ruhe zurück. (--no-lip)"
"Head tracking" = "Kopfbewegung"
"On: actors turn their heads to the player and to others near them. Off: heads ease back to their animation. (--no-head-tracking)" = "An: Figuren drehen die Köpfe zum Spieler und zu anderen in der Nähe. Aus: die Köpfe kehren sanft zu ihrer Animation zurück. (--no-head-tracking)"
"Feet follow the ground" = "Füße folgen dem Boden"
"On: on slopes and steps actors bend their knees and set each foot on the ground under it. Off: the legs play the animation as it is. (--no-foot-ik)" = "An: Auf Hängen und Stufen beugen Figuren die Knie und setzen jeden Fuß auf den Boden darunter. Aus: die Beine spielen die Animation, wie sie ist. (--no-foot-ik)"
"Sky follows the game clock" = "Himmel folgt der Spieluhr"
"On: the sky shows the game's time of day as it passes. Off: the sky keeps its hour while the game's clock runs on ([ and ] still set it). (--still-sky)" = "An: Der Himmel zeigt die Tageszeit des Spiels, wie sie vergeht. Aus: der Himmel behält seine Stunde, während die Spieluhr weiterläuft ([ und ] stellen sie weiterhin). (--still-sky)"
"Resolution" = "Auflösung"
"The window's size, or in full screen the monitor's (its own size: borderless). A new one goes back after 20 seconds unless you keep it. (--size)" = "Die Größe des Fensters oder im Vollbild die des Monitors (seine eigene Größe: rahmenlos). Eine neue wird nach 20 Sekunden zurückgenommen, wenn Sie sie nicht behalten. (--size)"
"Full screen" = "Vollbild"
"On: the game fills the monitor it is on, without a frame, at the resolution chosen above for full screen. Off: a window of the resolution chosen for a window. (--window borderless)" = "An: Das Spiel füllt seinen Monitor ohne Rahmen, in der oben für das Vollbild gewählten Auflösung. Aus: ein Fenster in der für ein Fenster gewählten Auflösung. (--window borderless)"
"Monitor" = "Monitor"
"The display the game opens on in full screen (the first display until you pick one). (--window borderless)" = "Der Bildschirm, auf dem das Spiel im Vollbild öffnet (der erste, bis Sie einen wählen). (--window borderless)"
"Body in first person" = "Körper in der ersten Person"
"On: in first person you see your own body and legs when you look down. Off: only the arms and the weapon are drawn, as in the original. (--first-person-body)" = "An: In der ersten Person sehen Sie beim Blick nach unten Ihren Körper und Ihre Beine. Aus: nur Arme und Waffe werden gezeichnet, wie im Original. (--first-person-body)"
"Weapon sway" = "Waffenschwanken"
"On: in first person the arms and weapon lag behind a turn and bob as you walk and run. Off: they stay still in the view. (--no-weapon-sway)" = "An: In der ersten Person hängen Arme und Waffe bei einer Drehung nach und wippen beim Gehen und Laufen. Aus: sie bleiben ruhig im Bild. (--no-weapon-sway)"
"Head bob" = "Kopfwippen"
"On: in first person the view dips with each step as you walk and run. Off: it stays level. (--no-head-bob)" = "An: In der ersten Person senkt sich der Blick bei jedem Schritt im Gehen und Laufen. Aus: er bleibt waagerecht. (--no-head-bob)"
"Lower weapon near walls" = "Waffe an Wänden senken"
"On: in first person a drawn weapon is lowered when a wall or a friendly person is right in front of you, and comes straight back up when you aim or fire. Off: it stays up and can poke through them, as in the original. Lower Weapon (H) lowers or raises it by hand either way. (--no-weapon-lower)" = "An: In der ersten Person wird eine gezogene Waffe gesenkt, wenn eine Wand oder eine freundliche Person direkt vor Ihnen ist, und kommt sofort hoch, wenn Sie zielen oder feuern. Aus: sie bleibt oben und kann durch sie hindurchragen, wie im Original. Waffe senken (H) senkt oder hebt sie in jedem Fall von Hand. (--no-weapon-lower)"
"True iron sights" = "Echte Kimme und Korn"
"On: aiming a gun lines its sights up with your eye. The crosshair is hidden while you aim down them. Off: the gun is held low with the crosshair, as in the original. Guns with no sights to look down (laser rifle, minigun) aim as the original either way. (--no-true-iron-sights)" = "An: Beim Zielen mit einer Waffe liegt ihre Visierung vor dem Auge. Das Fadenkreuz ist beim Zielen ausgeblendet. Aus: die Waffe wird tief gehalten, mit Fadenkreuz, wie im Original. Waffen ohne Visier zum Durchsehen (Lasergewehr, Minigun) zielen in jedem Fall wie im Original. (--no-true-iron-sights)"
"3D scopes (test)" = "3D-Zielfernrohre (Test)"
"On: aiming a scoped gun keeps the gun on screen and shows the zoomed view in its scope's lens, with the reticle; the view around it zooms only a little. Off: the full-screen scope picture with its black border, as in the original. Guns whose scope lens is not known yet keep the picture. (--scope-3d)" = "An: Beim Zielen mit einer Zielfernrohr-Waffe bleibt die Waffe sichtbar und die vergrößerte Sicht mit Absehen erscheint in der Linse; die Umgebung zoomt nur wenig. Aus: das bildschirmfüllende Zielfernrohr-Bild mit schwarzem Rand, wie im Original. Waffen, deren Linse noch nicht bekannt ist, behalten das Bild. (--scope-3d)"
"Sun shadows" = "Sonnenschatten"
"The sun's shadows, out to --shadow-distance: Off; Performance (the shadow maps drawn every other frame in two cascades, trees casting shadows only near you, the first-person arms taking the world's shadows: saves frame time outdoors, shadows of moving things update at half the frame rate); or Quality (three cascades, the farther ones drawn less often). The original casts none from the world. Quality by default in the game. (--sun-shadows, --sun-shadows=performance, --no-sun-shadows)" = "Die Schatten der Sonne, bis --shadow-distance: Aus; Leistung (die Schattenkarten jedes zweite Bild in zwei Kaskaden gezeichnet, Bäume werfen Schatten nur in deiner Nähe, die Arme in der Ich-Perspektive nehmen die Schatten der Welt an: spart draußen Bildzeit, Schatten bewegter Dinge werden mit halber Bildrate aktualisiert); oder Qualität (drei Kaskaden, die ferneren seltener gezeichnet). Das Original wirft keine von der Welt. Im Spiel standardmäßig Qualität. (--sun-shadows, --sun-shadows=performance, --no-sun-shadows)"
"Grass" = "Gras"
"On: grass grows on the landscape; the cells around you get theirs over the next frames. Off: it is hidden and none grows on new cells. (--no-grass)" = "An: Auf der Landschaft wächst Gras; die Zellen um Sie herum bekommen ihres in den nächsten Bildern. Aus: es ist ausgeblendet und auf neuen Zellen wächst keins. (--no-grass)"
"Distant terrain and objects" = "Fernes Gelände und Objekte"
"On: distant land, buildings and trees are drawn beyond the loaded cells (outdoors). Off: the world ends at the loaded cells. (--no-lod)" = "An: Fernes Land, Gebäude und Bäume werden jenseits der geladenen Zellen gezeichnet (im Freien). Aus: die Welt endet an den geladenen Zellen. (--no-lod)"
"Colour grade" = "Farbkorrektur"
"On: the picture is graded by the worldspace's, the weather's and the cell's image space. Off: the picture as lit, for comparisons. (--no-grade)" = "An: Das Bild wird nach dem Bildraum von Weltraum, Wetter und Zelle eingefärbt. Aus: das Bild, wie es beleuchtet ist, zum Vergleichen. (--no-grade)"
"Text overlay" = "Textüberlagerung"
"On: the position, loading counts and key help are written over the picture. Off by default in the game. (--overlay, --no-overlay)" = "An: Position, Ladezähler und Tastenhilfe werden über das Bild geschrieben. Im Spiel standardmäßig aus. (--overlay, --no-overlay)"
"Shot markers" = "Treffermarken"
"On: a cross is drawn at each impact and a line from the muzzle along each hitscan shot. (--hit-markers)" = "An: An jedem Einschlag wird ein Kreuz gezeichnet und eine Linie von der Mündung entlang jedes Sofortschusses. (--hit-markers)"
"God mode" = "Gottmodus"
"On: the player takes no damage from hits and cannot be killed by them. (--god)" = "An: Der Spieler nimmt keinen Schaden durch Treffer und kann durch sie nicht getötet werden. (--god)"
"Draw the navmesh" = "Navmesh zeichnen"
"On: the navmesh near the camera and the walking NPCs' paths are drawn. (--show-navmesh)" = "An: Das Navmesh nahe der Kamera und die Wege gehender NPCs werden gezeichnet. (--show-navmesh)"
"Frame rate counter" = "Bildratenanzeige"
"On: a small panel of performance readings at the top right of the screen, the Counter rows below choosing what it shows; with only its frame rate row on it is a frame rate counter. Not in the original. (--fps)" = "An: eine kleine Tafel mit Leistungswerten oben rechts im Bild; die Counter-Zeilen darunter wählen, was sie zeigt. Ist nur ihre Zeile für die Bildrate an, ist sie eine Bildratenanzeige. Nicht im Original. (--fps)"
"Display sync" = "Bildsynchronisation"
"Vertical sync: each frame waits for the display's refresh (no tearing). Variable refresh: for a G-Sync or FreeSync screen, vertical sync with the frame rate held a few frames under the screen's refresh rate, so frames are shown as soon as they are drawn without tearing. Off: frames are shown as soon as they are drawn (may tear)." = "Vertikale Synchronisation: jedes Bild wartet auf die Bildwiederholung des Bildschirms (kein Zerreißen). Variable Bildrate: für einen G-Sync- oder FreeSync-Bildschirm, vertikale Synchronisation mit der Bildrate einige Bilder unter der Wiederholrate des Bildschirms, damit Bilder ohne Zerreißen gezeigt werden, sobald sie gezeichnet sind. Aus: Bilder werden gezeigt, sobald sie gezeichnet sind (kann zerreißen)."
"Upscaler" = "Hochskalierung"
"Upscaling mode" = "Hochskalierungsmodus"
"Reconstruct the world at display resolution with FSR 3.1 or NVIDIA DLSS, at the Upscaling mode below. Disables MSAA, FXAA, SMAA and TAA while active. Menus stay sharp. Requires Vulkan; unsupported devices keep native rendering. DLSS needs an NVIDIA RTX graphics card and NVIDIA's DLSS files in the dlss folder beside nvforever.exe (NVForever ships none). With the files there when the game starts, every choice takes effect at once; files put there later are found at the next start, so DLSS chosen until then reads DLSS (restart) (loading a save starts the game again). Sharpening controls FSR sharpening. Frame generation needs an upscaler. (--upscaler, --upscaler-quality, --fsr)" = "Rekonstruiert die Welt in Bildschirmauflösung mit FSR 3.1 oder NVIDIA DLSS, im Hochskalierungsmodus darunter. Schaltet MSAA, FXAA, SMAA und TAA ab, solange aktiv. Menüs bleiben scharf. Braucht Vulkan; nicht unterstützte Geräte behalten die normale Darstellung. DLSS braucht eine NVIDIA-RTX-Grafikkarte und NVIDIAs DLSS-Dateien im Ordner dlss neben nvforever.exe (NVForever liefert keine mit). Liegen die Dateien beim Spielstart dort, wirkt jede Wahl sofort; später dort abgelegte Dateien werden beim nächsten Start gefunden, bis dahin steht gewähltes DLSS als „DLSS (Neustart)“ da (Laden eines Spielstands startet das Spiel neu). „Schärfen“ steuert das Schärfen von FSR. Die Bilderzeugung braucht eine Hochskalierung. (--upscaler, --upscaler-quality, --fsr)"
"The share of the screen's width and height the world is drawn at; the upscaler rebuilds the rest. Native AA: full resolution, anti-aliasing only (DLSS: DLAA). Quality: the sharpest upscaled look, for 1440p and 4K. Balanced: more speed with little visible loss. Performance: the highest frame rate, for 4K or heavy scenes. Ultra Performance: for very high resolutions only. Takes effect at once. With Upscaler Off there is nothing to set. (--upscaler-quality, --upscaler, --fsr)" = "Der Anteil an Breite und Höhe des Bildschirms, in dem die Welt gezeichnet wird; die Hochskalierung baut den Rest wieder auf. Natives AA: volle Auflösung, nur Kantenglättung (DLSS: DLAA). Qualität: das schärfste hochskalierte Bild, für 1440p und 4K. Ausgewogen: mehr Tempo mit kaum sichtbarem Verlust. Leistung: die höchste Bildrate, für 4K oder aufwendige Szenen. Ultra-Leistung: nur für sehr hohe Auflösungen. Wirkt sofort. Mit Hochskalierung „Aus“ gibt es nichts einzustellen. (--upscaler-quality, --upscaler, --fsr)"
"DLSS model" = "DLSS-Modell"
"Which of NVIDIA's DLSS models rebuilds the picture (NVIDIA calls them presets). Default (recommended): NVIDIA picks per mode: K for Native AA, Quality and Balanced, M for Performance, L for Ultra Performance. K: transformer model, best detail, costs more. L: sharper and steadier, less ghosting, costs the most. M: close to L in looks, closer to K in speed. J: like K with a little less ghosting and more flicker. Takes effect at once. Only while DLSS draws. (--dlss-model)" = "Welches von NVIDIAs DLSS-Modellen das Bild wieder aufbaut (NVIDIA nennt sie Presets). Standard (empfohlen): NVIDIA wählt je Modus: K für Natives AA, Qualität und Ausgewogen, M für Leistung, L für Ultra-Leistung. K: Transformer-Modell, die meisten Details, kostet mehr. L: schärfer und ruhiger, weniger Geisterbilder, kostet am meisten. M: im Aussehen nah an L, in der Geschwindigkeit näher an K. J: wie K, mit etwas weniger Geisterbildern und mehr Flimmern. Wirkt sofort. Nur solange DLSS zeichnet. (--dlss-model)"
"Default" = "Standard"
"DLSS only" = "Nur mit DLSS"
"World" = "Welt"
"Display" = "Anzeige"
"Debug" = "Debug"
"Graphics" = "Grafik"
"Field of view" = "Sichtfeld"
"The game's field of view in degrees across a 4:3 picture (75 as the original's default); wider screens see more at the sides. (--fov)" = "Das Sichtfeld des Spiels in Grad über ein 4:3-Bild (75 wie der Standard des Originals); breitere Bildschirme sehen mehr an den Seiten. (--fov)"
"Frame rate limit" = "Bildratenbegrenzung"
"At most this many frames a second (Off: as many as the computer draws, or the display's refresh with vertical sync; with variable refresh the lower of this and its own limit). A lower limit keeps the computer cooler and quieter." = "Höchstens so viele Bilder pro Sekunde (Aus: so viele, wie der Computer zeichnet, oder die Bildwiederholung mit vertikaler Synchronisation; mit variabler Wiederholrate das Kleinere von diesem und ihrer eigenen Grenze). Eine niedrigere Grenze hält den Computer kühler und leiser."
"Object distance" = "Objektdistanz"
"How far from you objects (buildings, rocks, furniture, clutter) of the loaded cells are drawn, as a part of the farthest those cells reach. Lower draws fewer and runs faster." = "Wie weit von Ihnen Objekte der geladenen Zellen (Gebäude, Felsen, Möbel, Kleinkram) gezeichnet werden, als Anteil der größten Reichweite dieser Zellen. Weniger zeichnet weniger und läuft schneller."
"Actor distance" = "Figurendistanz"
"How far from you people and creatures are drawn, as a part of the farthest the loaded cells reach." = "Wie weit von Ihnen Menschen und Kreaturen gezeichnet werden, als Anteil der größten Reichweite der geladenen Zellen."
"Item distance" = "Gegenstandsdistanz"
"How far from you items lying in the world (weapons, ammo, aid, notes, caps, clutter you can take) are drawn, as a part of the farthest the loaded cells reach." = "Wie weit von Ihnen Gegenstände, die in der Welt liegen (Waffen, Munition, Hilfsmittel, Notizen, Kronkorken, Kleinkram zum Mitnehmen), gezeichnet werden, als Anteil der größten Reichweite der geladenen Zellen."
"Shadow distance" = "Schattendistanz"
"How far from you the sun casts shadows (with Sun shadows on), as a part of --shadow-distance." = "Wie weit von Ihnen die Sonne Schatten wirft (mit Sonnenschatten an), als Anteil von --shadow-distance."
"Grass distance" = "Grasdistanz"
"How far from you grass is drawn, as a part of --grass-distance and its fade range." = "Wie weit von Ihnen Gras gezeichnet wird, als Anteil von --grass-distance und seinem Ausblendbereich."
"Anti-aliasing" = "Kantenglättung"
"How edges are smoothed: multisampling Off, 2x, 4x or 8x (--msaa; the cut-out edges of plants too), or the picture smoothed afterwards: FXAA (cheapest, softest), SMAA (sharper, a little dearer) or TAA (over the frames; plants too, soft while moving; --graphics-only fxaa, smaa or taa). Multisampling is the dearest, more at each step: at 1920x1080 on an RTX 4070, 2x added about 0.8 ms a frame, 4x about 1.3 ms and 8x about 2.3 ms (Goodsprings and Novac at noon); FXAA, SMAA and TAA cost less than 4x. Where the processor sets the pace (the Strip at night) the choice costs next to nothing. While an upscaler (FSR 3.1 or DLSS) is on it does the anti-aliasing itself, so this row reads Off (upscaling active); your choice comes back when Upscaler is Off." = "Wie Kanten geglättet werden: Multisampling Aus, 2x, 4x oder 8x (--msaa; auch die ausgeschnittenen Kanten von Pflanzen) oder das fertige Bild geglättet: FXAA (am billigsten, am weichsten), SMAA (schärfer, etwas teurer) oder TAA (über die Bilder; auch Pflanzen, weich in Bewegung; --graphics-only fxaa, smaa oder taa). Multisampling ist am teuersten, mit jeder Stufe mehr: bei 1920x1080 auf einer RTX 4070 kostete 2x etwa 0,8 ms pro Bild, 4x etwa 1,3 ms und 8x etwa 2,3 ms (Goodsprings und Novac mittags); FXAA, SMAA und TAA kosten weniger als 4x. Wo der Prozessor das Tempo bestimmt (der Strip nachts), kostet die Wahl fast nichts. Solange die Hochskalierung (FSR 3.1 oder DLSS) an ist, glättet sie selbst, daher steht hier „Aus (Hochskalierung aktiv)“; Ihre Wahl kehrt zurück, wenn die Hochskalierung aus ist."
"Shadow filtering" = "Schattenfilterung"
"How the edges of the sun's shadows are softened: Fast (hardware 2x2, harder edges, cheapest), Smooth (as vanilla) or Temporal (soft but grainy unless Anti-aliasing is TAA)." = "Wie die Ränder der Sonnenschatten weichgezeichnet werden: Schnell (Hardware 2x2, härtere Ränder, am billigsten), Weich (wie das Original) oder Zeitlich (weich, aber körnig, außer bei Kantenglättung TAA)."
"Ambient occlusion" = "Umgebungsverdeckung"
"On: creases, corners and the ground under things are darkened by how enclosed they are (screen-space, from the depth). Not in the original. (--graphics)" = "An: Falten, Ecken und der Boden unter Dingen werden abgedunkelt, je nachdem wie eingeschlossen sie sind (im Bildraum, aus der Tiefe). Nicht im Original. (--graphics)"
"Longer sun shadows" = "Längere Sonnenschatten"
"On: the sun's shadows reach half as far again as --shadow-distance. Costs a little frame rate. (--graphics)" = "An: Die Sonnenschatten reichen anderthalbmal so weit wie --shadow-distance. Kostet etwas Bildrate. (--graphics)"
"Bloom" = "Bloom"
"On: light brighter than a sunlit white wall (the sun, lamps, windows) glows into its surroundings, on top of the game's own image space. (--graphics)" = "An: Licht heller als eine sonnenbeschienene weiße Wand (die Sonne, Lampen, Fenster) strahlt in seine Umgebung, zusätzlich zum eigenen Bildraum des Spiels. (--graphics)"
"Light glow (HDR)" = "Lichtschein (HDR)"
"On: neon, lamps, glowing beams and fire glow softly into their surroundings, as the original's HDR glow does; how much follows the place's image space (the Strip's neon at night most). Bloom, when on, adds to it. (--graphics-only no-glow turns it off)" = "An: Neon, Lampen, leuchtende Strahlen und Feuer strahlen sanft in ihre Umgebung, wie der HDR-Schein des Originals; wie stark, folgt dem Bildraum des Ortes (am meisten das Neon des Strip nachts). Bloom, wenn an, kommt dazu. (--graphics-only no-glow schaltet ihn ab)"
"Eye adaptation" = "Augenanpassung"
"On: dark views brighten after a moment, as the eye gets used to the dark, by the place's image space. Needs the light glow. (--graphics-only no-eye-adaptation turns it off)" = "An: Dunkle Ansichten hellen sich nach einem Moment auf, wie sich das Auge an die Dunkelheit gewöhnt, nach dem Bildraum des Ortes. Braucht den Lichtschein. (--graphics-only no-eye-adaptation schaltet sie ab)"
"Neon glow" = "Neonschein"
"On: where the place's image space asks for a strong glow (the Strip at night) neon tubes and signs burn with a wide halo, as in the original. Needs the light glow. (--graphics-only no-neon-glow turns it off)" = "An: Wo der Bildraum des Ortes einen starken Schein verlangt (der Strip nachts), brennen Neonröhren und Schilder mit breitem Hof, wie im Original. Braucht den Lichtschein. (--graphics-only no-neon-glow schaltet ihn ab)"
"Sharpening" = "Schärfen"
"On: the final picture is sharpened where it has little contrast (contrast-adaptive sharpening). (--graphics)" = "An: Das fertige Bild wird dort geschärft, wo es wenig Kontrast hat (kontrastadaptives Schärfen). (--graphics)"
"Anisotropic filtering 16x" = "Anisotrope Filterung 16x"
"On: textures seen at a slant stay sharp further (16x instead of 8x). For textures loaded from now on (the cells loaded next). (--graphics)" = "An: Schräg gesehene Texturen bleiben weiter scharf (16x statt 8x). Für Texturen, die ab jetzt geladen werden (die als Nächstes geladenen Zellen). (--graphics)"
"Sun shafts" = "Sonnenstrahlen"
"On: sunlight streams past what stands in front of the sun, stronger the hazier the weather's fog. Not in the original. (--graphics)" = "An: Sonnenlicht strömt an dem vorbei, was vor der Sonne steht, umso stärker, je dunstiger der Nebel des Wetters. Nicht im Original. (--graphics)"
"Screen-space water reflections" = "Bildraum-Wasserspiegelungen"
"On: water the mirrored reflection does not reach (another height, interiors) reflects what is on the screen instead of only the sky. (--graphics)" = "An: Wasser, das die gespiegelte Reflexion nicht erreicht (andere Höhe, Innenräume), spiegelt, was auf dem Bildschirm ist, statt nur den Himmel. (--graphics)"
"Mirrored water reflections" = "Gespiegelte Wasserspiegelungen"
"On: water mirrors the world above it, as in the original; the scene is drawn a second time for it while water is on screen. Off: water reflects the sky, and what is on the screen with screen-space reflections. (--graphics-only no-water-mirror turns it off)" = "An: Wasser spiegelt die Welt darüber, wie im Original; die Szene wird dafür ein zweites Mal gezeichnet, solange Wasser im Bild ist. Aus: Wasser spiegelt den Himmel und, mit Bildraum-Spiegelungen, was auf dem Bildschirm ist. (--graphics-only no-water-mirror schaltet sie ab)"
"Quality preset" = "Qualitätsstufe"
"Sets the rows the original's quality presets cover to the values of the game folder's low.ini, medium.ini, high.ini or VeryHigh.ini: Sun shadows, Shadow filtering, Light glow, Mirrored water reflections and the object, actor, item, shadow and grass distances. Custom: those rows match none of them. A preset whose file is missing is not offered. The enhanced effects, anti-aliasing and FSR keep their own rows." = "Setzt die Zeilen, die die Qualitätsstufen des Originals abdecken, auf die Werte aus low.ini, medium.ini, high.ini oder VeryHigh.ini im Spielordner: Sonnenschatten, Schattenfilterung, Lichtschein, Gespiegelte Wasserspiegelungen und die Sichtweiten für Objekte, Figuren, Gegenstände, Schatten und Gras. Eigene: Diese Zeilen passen zu keiner Stufe. Eine Stufe, deren Datei fehlt, wird nicht angeboten. Die erweiterten Effekte, die Kantenglättung und FSR behalten ihre eigenen Zeilen."
"Enhanced effects" = "Erweiterte Effekte"
"On: every effect of the enhanced look (ambient occlusion, longer sun shadows, bloom, sharpening, anisotropic filtering 16x, sun shafts, screen-space water reflections). Off: none of them, the original's picture. Custom: some on, some off. Each effect keeps its own row and its own saved state; this row only sets them all at once." = "An: alle Effekte des erweiterten Aussehens (Umgebungsverdeckung, längere Sonnenschatten, Bloom, Schärfen, anisotrope Filterung 16x, Sonnenstrahlen, Bildraum-Wasserspiegelungen). Aus: keiner davon, das Bild des Originals. Eigene: einige an, einige aus. Jeder Effekt behält seine eigene Zeile und seinen eigenen gespeicherten Zustand; diese Zeile setzt sie nur alle auf einmal."
"Off (upscaling active)" = "Aus (Hochskalierung aktiv)"
"DLSS (restart)" = "DLSS (Neustart)"
"Needs an upscaler" = "Braucht eine Hochskalierung"
"Not with DLSS" = "Nicht mit DLSS"
"DLSS needs Windows" = "DLSS braucht Windows"
"DLSS needs the Vulkan renderer" = "DLSS braucht die Vulkan-Darstellung"
"DLSS files missing: put them in the dlss folder beside nvforever.exe, then restart" = "DLSS-Dateien fehlen: in den Ordner dlss neben nvforever.exe legen, dann neu starten"
"The dlss folder holds NVIDIA's updater (nvngx_update.exe): remove it, then restart" = "Der Ordner dlss enthält NVIDIAs Updater (nvngx_update.exe): entfernen, dann neu starten"
"A file in the dlss folder is not from the tested NVIDIA release (Streamline 2.14.16)" = "Eine Datei im Ordner dlss stammt nicht aus der getesteten NVIDIA-Version (Streamline 2.14.16)"
"DLSS did not start (the log says why)" = "DLSS ist nicht gestartet (das Protokoll sagt, warum)"
"A graphics card the game may use cannot run DLSS" = "Eine Grafikkarte, die das Spiel nutzen könnte, kann DLSS nicht ausführen"
"Not on this GPU or driver (DLSS needs an NVIDIA RTX card)" = "Nicht auf dieser GPU oder diesem Treiber (DLSS braucht eine NVIDIA-RTX-Karte)"
"DLSS stopped working this session; it is tried again at the next start" = "DLSS hat in dieser Sitzung aufgehört zu arbeiten; beim nächsten Start wird es erneut versucht"
"FSR 3.1 cannot run on this GPU" = "FSR 3.1 läuft auf dieser GPU nicht"
"Frame generation" = "Bilderzeugung"
"Generated frames" = "Erzeugte Bilder"
"Needs an NVIDIA RTX 40 series or newer" = "Braucht eine NVIDIA RTX 40 oder neuer"
"Needs hardware-accelerated GPU scheduling" = "Braucht hardwarebeschleunigte GPU-Planung"
"Needs a newer NVIDIA driver" = "Braucht einen neueren NVIDIA-Treiber"
"The DLSS Frame Generation files are missing" = "Die Dateien für DLSS Frame Generation fehlen"
"Needs vsync off" = "Braucht VSync aus"
"Needs DLSS frame generation" = "Braucht DLSS-Bilderzeugung"
"Frames made between the real ones, so motion looks smoother; what you do reaches the screen a little later. FSR 3.1: one frame between each two real frames; needs FSR 3.1 upscaling (any mode; not with DLSS) and vertical sync or variable refresh, and real frames are held to just under half the refresh rate. DLSS: NVIDIA DLSS Frame Generation, one to three frames for each real frame (Generated frames, below); needs an upscaler (FSR 3.1 or DLSS), Display sync Off, an NVIDIA RTX 40 series or newer graphics card, Windows' hardware-accelerated GPU scheduling and NVIDIA's frame generation files in the dlss folder beside nvforever.exe; frames are generated only while the game's window is in front. Latency reduction turns on with either. The HUD and menus are not generated; menus and loading screens show real frames only. Best from 60 real frames a second. Not in the original. (--frame-generation)" = "Bilder zwischen den echten, damit Bewegung flüssiger wirkt; was du tust, erreicht den Bildschirm etwas später. FSR 3.1: ein Bild zwischen je zwei echten Bildern; braucht FSR-3.1-Hochskalierung (jeder Modus; nicht mit DLSS) und vertikale Synchronisation oder variable Bildwiederholrate, und echte Bilder werden auf knapp unter die halbe Bildwiederholrate gehalten. DLSS: NVIDIA DLSS Frame Generation, ein bis drei Bilder je echtem Bild (Erzeugte Bilder, darunter); braucht eine Hochskalierung (FSR 3.1 oder DLSS), Bildsynchronisation Aus, eine Grafikkarte NVIDIA RTX 40 oder neuer, die hardwarebeschleunigte GPU-Planung von Windows und NVIDIAs Dateien für die Bilderzeugung im Ordner dlss neben nvforever.exe; Bilder werden nur erzeugt, solange das Fenster des Spiels vorne ist. Die Latenzreduzierung schaltet sich mit beiden ein. HUD und Menüs werden nicht erzeugt; Menüs und Ladebildschirme zeigen nur echte Bilder. Am besten ab 60 echten Bildern pro Sekunde. Nicht im Original. (--frame-generation)"
"How many frames DLSS frame generation makes for each real frame: 2x one, 3x two, 4x three. More looks smoother and costs a little more latency and graphics memory; 3x and 4x only where the graphics card offers them (RTX 50 series). Takes effect at once. Only with DLSS frame generation. Not in the original." = "Wie viele Bilder die DLSS-Bilderzeugung je echtem Bild erzeugt: 2x eines, 3x zwei, 4x drei. Mehr wirkt flüssiger und kostet etwas mehr Latenz und Grafikspeicher; 3x und 4x nur, wo die Grafikkarte sie anbietet (RTX 50). Wirkt sofort. Nur mit DLSS-Bilderzeugung. Nicht im Original."
"Controls" = "Steuerung"
"HUD colour" = "HUD-Farbe"
"The colour of the HUD and the menus: Amber (the default) or another; the sliders below set it to any colour." = "Die Farbe von HUD und Menüs: Bernstein (Standard) oder eine andere; die Regler darunter stellen jede Farbe ein."
"Pip-Boy colour" = "Pip-Boy-Farbe"
"The colour of the Pip-Boy's screens (items, stats, data): Amber (the default) or another; the sliders below set it to any colour." = "Die Farbe der Pip-Boy-Bildschirme (Gegenstände, Werte, Daten): Bernstein (Standard) oder eine andere; die Regler darunter stellen jede Farbe ein."
"Accepted." = "Angenommen."
"Opening the terminal..." = "Terminal wird geöffnet..."
"Not accepted" = "Abgelehnt"
"Tries restored." = "Versuche erneuert."
"Dud removed." = "Blindgänger entfernt."
"Error" = "Fehler"
"{n} of {len} right" = "{n} von {len} richtig"
"ON" = "AN"
"OFF" = "AUS"

