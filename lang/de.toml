# [design, #2249] Overlay availability and source scope (perf_overlay/readings.rs, settings.rs).
"Not available" = "Nicht verfügbar"
"game {percent}%" = "Spiel {percent}%"
"Machine and game CPU use, read once a second while shown. Windows uses performance counters; Linux uses /proc. Missing machine readings say Not available. Game use is cores kept busy: 1.0 is one full core." = "CPU-Auslastung des Rechners und des Spiels, einmal pro Sekunde bei sichtbarer Anzeige. Windows nutzt Leistungsindikatoren, Linux /proc. Fehlende Rechnerwerte erscheinen als Nicht verfügbar. Die Spielauslastung zählt belegte Kerne: 1.0 ist ein vollständig belegter Kern."
"GPU use, read once a second while shown. Windows: busiest engine across programs. Linux: NVIDIA NVML, then amdgpu, then DRM client time. DRM reads game use and says game; the other Linux sources read whole-device use. Missing readings say Not available." = "GPU-Auslastung, einmal pro Sekunde bei sichtbarer Anzeige. Windows: am stärksten ausgelastete Engine aller Programme. Linux: NVIDIA NVML, dann amdgpu, dann DRM-Clientzeit. DRM zeigt die Spielauslastung mit Spiel an; die anderen Linux-Quellen messen das ganze Gerät. Fehlende Werte erscheinen als Nicht verfügbar."

# [design, #2242] The upscaling row (perf_overlay/readings.rs, settings.rs).
"model {model}" = "Modell {model}"
"The upscaler that draws now: its name and mode, the size the world is drawn at and the size it is rebuilt to (with FSR 3.1 from its mode, with DLSS the size DLSS chose), and with DLSS the model asked for. Reads Off and the window's size while nothing upscales, also when the upscaler asked for cannot run on this computer. Follows a change within a frame or two, showing the upscaler without sizes until then." = "Die Hochskalierung, die gerade zeichnet: Name und Modus, die Größe, in der die Welt gezeichnet wird, und die Größe, auf die sie hochgerechnet wird (bei FSR 3.1 aus dem Modus, bei DLSS die von DLSS gewählte Größe), und bei DLSS das gewählte Modell. Zeigt Aus und die Fenstergröße, solange nichts hochskaliert, auch wenn die gewählte Hochskalierung auf diesem Computer nicht laufen kann. Folgt einer Änderung innerhalb von ein oder zwei Bildern und zeigt bis dahin die Hochskalierung ohne Größen."
