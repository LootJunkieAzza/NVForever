"How many frames DLSS frame generation makes per real frame: 2x one, 3x two, 4x three (3x and 4x on RTX 50 series). Not in the original." = "Wie viele Bilder die DLSS-Bilderzeugung je echtem Bild erzeugt: 2x eines, 3x zwei, 4x drei (3x und 4x mit RTX 50). Nicht im Original."
