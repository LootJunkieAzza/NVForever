[package]
name = "nvforever"
description = "NVForever: the game. At milestone M3 a free-camera explorer of the world (terrain and objects)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bevy.workspace = true
nvf-assets.workspace = true
fnv-nif.workspace = true
fnv-esm.workspace = true
fnv-world.workspace = true
fnv-dds.workspace = true
fnv-vfs.workspace = true
fnv-install.workspace = true
fnv-save.workspace = true
texpresso.workspace = true
fnv-spt.workspace = true
nvf-play.workspace = true
fnv-actor.workspace = true
fnv-sim.workspace = true
fnv-combat.workspace = true
fnv-collide.workspace = true
fnv-phys.workspace = true
fnv-nav.workspace = true
fnv-ai.workspace = true
fnv-game.workspace = true
fnv-script.workspace = true
fnv-voice.workspace = true
clap.workspace = true
serde_json = "1"
# Only for the window icon type (window_icon.rs); the version Bevy already uses.
winit = { version = "0.30", default-features = false }
# 16-bit floats for the FaceGen offset textures (facegen.rs); the version Bevy already uses.
half = "2"

# The first-start dialogs that ask for the game's folder (setup.rs); MIT.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[build-dependencies]
# The program icon in the Windows executable (build.rs); MIT.
winresource = "0.1"

[features]
default = ["intro-video"]
# The intro film before a new game (nvf-play's `intro-video`: a GPL-3.0-or-later decoder,
# as NVForever is).
intro-video = ["nvf-play/intro-video"]
