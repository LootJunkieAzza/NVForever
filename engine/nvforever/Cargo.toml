[package]
name = "nvforever"
description = "NVForever: the game. At milestone M3 a free-camera explorer of the world (terrain and objects)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bevy.workspace = true
nvf-assets.workspace = true
fnv-nif.workspace = true
fnv-esm.workspace = true
fnv-world.workspace = true
fnv-dds.workspace = true
fnv-vfs.workspace = true
fnv-install.workspace = true
fnv-save.workspace = true
texpresso.workspace = true
fnv-spt.workspace = true
nvf-play.workspace = true
fnv-actor.workspace = true
fnv-sim.workspace = true
fnv-combat.workspace = true
fnv-collide.workspace = true
fnv-phys.workspace = true
fnv-nav.workspace = true
fnv-ai.workspace = true
fnv-game.workspace = true
fnv-script.workspace = true
fnv-voice.workspace = true
clap.workspace = true
serde_json = "1"
# Only for the window icon type (window_icon.rs); the version Bevy already uses.
winit = { version = "0.30", default-features = false }
# 16-bit floats for the FaceGen offset textures (facegen.rs); the version Bevy already uses.
half = "2"
# The window surface's present modes, asked of a surface of our own (frame_pace.rs), and the
# GPU memory budget (memory_budget.rs): VK_EXT_memory_budget through wgpu's Vulkan device
# (`Device::as_hal`); the versions Bevy already uses (MIT/Apache-2.0).
wgpu = { version = "30", default-features = false, features = ["vulkan"] }
ash = { version = "0.38", default-features = false }
# Only with the `tracy` feature: the Tracy client Bevy's trace_tracy uses, the version Bevy
# already pins, made to record only while a viewer is connected (`ondemand`: no data piles
# up in memory) and to listen and announce itself on this machine only (`only-localhost`);
# frame-rate-audit.md §1. MIT/Apache-2.0; the Tracy C++ client in tracy-client-sys is BSD-3-Clause.
tracy-client = { version = "0.19", optional = true, default-features = false, features = ["ondemand", "only-localhost"] }

# The first-start dialogs that ask for the game's folder (setup.rs); MIT.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
# The generated-terrain bake threads' priority (lodgen.rs) and the span profile's processor time
# (profile.rs), and the machine's RAM (memory_budget.rs); a version already in the build;
# MIT/Apache-2.0.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[build-dependencies]
# The program icon in the Windows executable (build.rs); MIT.
winresource = "0.1"

[features]
default = ["intro-video"]
# The intro film before a new game (nvf-play's `intro-video`: a GPL-3.0-or-later decoder,
# as NVForever is).
intro-video = ["nvf-play/intro-video"]
# Bevy's spans for the in-engine span profile (profile.rs, NVF_PLAY_TEST_PROFILE); not for
# release builds.
profile = ["bevy/trace"]
# The same spans sent live to the Tracy profiler (docs/design/frame-rate-audit.md §1: the
# viewer's version must match the tracy-client in Cargo.lock); not for release builds.
tracy = ["profile", "bevy/trace_tracy", "dep:tracy-client"]
# Tracy with every allocation tracked too (slower).
tracy-memory = ["tracy", "bevy/trace_tracy_memory"]
