[package]
name = "nvf-play"
description = "NVForever: Layers 4 and 5 in the game — player controller, activation, container and inventory menus, scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bevy.workspace = true
nvf-assets.workspace = true
fnv-nif.workspace = true
fnv-esm.workspace = true
fnv-world.workspace = true
fnv-sim.workspace = true
fnv-phys.workspace = true
fnv-collide.workspace = true
fnv-script.workspace = true
fnv-game.workspace = true
fnv-save.workspace = true
infinitier_bik_decoder = { workspace = true, optional = true }
fnv-install.workspace = true
fnv-combat.workspace = true
fnv-actor.workspace = true
fnv-voice.workspace = true
fnv-vfs.workspace = true
fnv-font.workspace = true
fnv-dds.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A new hacking game on every visit to a terminal (terminal.rs); the generator
# fnv-game's rules already use.
rand_core = "0.9"
rand_chacha = "0.9"
# Music (MP3) and ambient loops (Ogg Vorbis, WAV) decoded as they play (music.rs,
# ambient.rs), Ogg sound effects decoded whole (sfx.rs). The version Bevy's audio is built
# on: no second copy (docs/design/dependencies.md). `playback` (cpal): the sound output
# that follows the device (audio_out.rs).
rodio = { version = "0.22", default-features = false, features = ["mp3", "vorbis", "wav", "playback"] }
# Save thumbnails (save.rs): PNG encoded and decoded directly, the version Bevy's images
# already build (no second copy).
png = "0.18"

[features]
default = ["intro-video"]
# The intro film before a new game (src/intro.rs); its Bink decoder is GPL-3.0-or-later,
# as NVForever is (owner decision 2026-10-15).
intro-video = ["dep:infinitier_bik_decoder"]
