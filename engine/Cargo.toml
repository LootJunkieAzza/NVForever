# The Bevy side of NVForever: its own workspace so the format crates and their CI never
# compile Bevy (docs/adr/0001-bevy-viewer.md, docs/design/layer3.md §2.2).
[workspace]
resolver = "2"
members = ["nvf-assets", "nvf-play", "nvf-viewer", "nvforever"]
exclude = ["vendor/wgpu-ffx", "vendor/wgpu-ffx/wgpu-ffx", "vendor/wgpu-ffx/wgpu-ffx-shaders-spv"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Pinned exactly: upgrade deliberately, in its own commit, with a full parity-lab run.
# pbr_specular_textures: normal-map alpha as the specular mask (docs/spec-notes/nif.md §6).
# `debug`: errors name the command or system that failed (stray_commands.rs in nvforever).
# raw_vulkan_init: device extensions at creation (anti_lag.rs, #1778).
bevy = { version = "=0.20.1", features = ["pbr_specular_textures", "debug", "raw_vulkan_init"] }
fnv-nif = { path = "../crates/fnv-nif" }
fnv-dds = { path = "../crates/fnv-dds" }
fnv-spt = { path = "../crates/fnv-spt" }
fnv-font = { path = "../crates/fnv-font" }
fnv-vfs = { path = "../crates/fnv-vfs" }
fnv-esm = { path = "../crates/fnv-esm" }
fnv-world = { path = "../crates/fnv-world" }
fnv-sim = { path = "../crates/fnv-sim" }
fnv-script = { path = "../crates/fnv-script" }
fnv-game = { path = "../crates/fnv-game" }
fnv-ui = { path = "../crates/fnv-ui" }
fnv-actor = { path = "../crates/fnv-actor" }
fnv-combat = { path = "../crates/fnv-combat" }
fnv-phys = { path = "../crates/fnv-phys" }
fnv-collide = { path = "../crates/fnv-collide" }
fnv-nav = { path = "../crates/fnv-nav" }
fnv-ai = { path = "../crates/fnv-ai" }
fnv-install = { path = "../crates/fnv-install" }
fnv-util = { path = "../crates/fnv-util" }
fnv-save = { path = "../crates/fnv-save" }
infinitier_bik_decoder = "=0.0.14"
fnv-voice = { path = "../crates/fnv-voice" }
nvf-assets = { path = "nvf-assets" }
nvf-play = { path = "nvf-play" }
clap = { version = "4", features = ["derive", "env"] }
# BC1 encode/decode on the CPU (generated LOD, docs/design/generated-lod.md); MIT.
texpresso = { version = "2.0.2", default-features = false }

# Bevy is slow unoptimised; optimise dependencies even in dev builds.
[profile.release]
# File and line numbers in backtraces, for the crash reports (engine/nvforever/src/crash.rs):
# line tables only, no variable info, so the optimised code is unchanged.
debug = "line-tables-only"

# For iterating and smoke runs (#1956): release with incremental compilation, in its own
# folder (target/release-quick), so it never invalidates target/release. `cargo quick` (../.cargo/
# config.toml) builds the engine with it. Measured 2026-11-12 (16 threads, Windows), a
# one-line edit then rebuilding nvforever: in nvforever 111 -> 10 s, in nvf-play 237 ->
# 20 s, in fnv-game 259 -> 23 s (with rust-lld, which the alias adds on Windows); the
# auto-fly smoke ran at the same frame rate within noise. Codegen differs from release
# (more, smaller codegen units): profile, measure and ship from `--release`.
[profile.release-quick]
inherits = "release"
incremental = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Patched dependencies (engine/vendor/README.md says what was changed and why).
[patch.crates-io]
gpu-allocator = { path = "vendor/gpu-allocator" }
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_render = { path = "vendor/bevy_render" }
wgpu-hal = { path = "vendor/wgpu-hal" }
