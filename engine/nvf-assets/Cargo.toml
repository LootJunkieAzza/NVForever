[package]
name = "nvf-assets"
description = "NVForever Bevy asset plugins: archives, NIF meshes, DDS textures, KF playback"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bevy.workspace = true
fnv-nif.workspace = true
fnv-dds.workspace = true
fnv-pbr.workspace = true
fnv-vfs.workspace = true
fnv-world.workspace = true
# Half floats for the reflection cube's texels (reflection_cube.rs); already in the lock.
half = "2"

[dev-dependencies]
# tests/sample_mask_spirv.rs: the vendored naga's SPIR-V for `@builtin(sample_mask)`
# (engine/vendor/README.md, "naga"; the workspace's [patch] makes this the vendored copy).
naga = { version = "=30.0.1", features = ["wgsl-in", "spv-out"] }
