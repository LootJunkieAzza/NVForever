[package]
name = "nvf-coop"
description = "Co-op prototype (private fork): the UDP link between a host's game and its guests'"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Nothing of Bevy or the game: engine/nvforever/src/coop.rs draws the other players and
# keeps guests on the host's leash.
[dependencies]
# The host's router opens the lobby's port (UPnP IGD; reach.rs); its blocking API. MIT.
igd-next = { version = "0.18.0", default-features = false, features = ["io_sync"] }
# The co-op crate's notes reach the game's log (Bevy's LogPlugin takes `log` records).
log = "0.4"
# The IPv6 socket is bound IPv6-only (transport.rs), so it never takes the IPv4 socket's
# port; std cannot set that before binding. MIT/Apache.
socket2 = "0.6"
# Noise (noise.rs, docs/design/coop-networking.md §4): every co-op packet encrypted and
# authenticated, a key per player in place of the plaintext session token. Apache-2.0/MIT.
snow = "0.10"
# Joining by an online code (online.rs, docs/design/coop-networking.md phase 3): NAT
# traversal (STUN, the checks) and the matchmaking service's clients, both sans-IO, from this
# repository's crates.
nvf-nat = { path = "../../crates/nvf-nat" }
nvf-signal = { path = "../../crates/nvf-signal" }
# The matchmaking service's I/O (signal_io.rs): HTTPS as player reports do it (the system's
# TLS and certificates, nvforever/Cargo.toml), and its lobby WebSocket the same way.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
