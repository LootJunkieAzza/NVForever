[package]
name = "nvf-coop"
description = "Co-op: the game protocol between a host's game and its guests', over a transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Nothing of Bevy or the game: the game side draws the other players, and the transport
# (`seam::Transport`, or another one) carries the packets.
[dependencies]
# The lobby's secret, from the OS random source (`seam::SharedSecret`); already in
# the engine's lock through Bevy. MIT/Apache.
getrandom = "0.3.4"
