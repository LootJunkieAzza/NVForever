# The totals `fnvtool script stubs <Data> <the ten masters> --schema schemas/fnv` must
# print (its "summary"): the smoke scenario script-stubs (tools/smoke/scenarios.toml)
# expects each value below, by its JSON path, to equal the run's.
#
# A branch that implements a stub (or moves one between statuses) changes the numbers
# here, and docs/design/script-stubs.md §1 with them; nowhere else. Two branches that
# both lowered a number conflict here when merged: count again, never keep both lines.
# `cargo test -p fnv-game` checks stubs and by_status against the registry
# (crates/fnv-game/src/functions/stubs.rs) without game data; the calls, condition uses
# and unhandled functions need the masters: the smoke run checks those.

[summary]
stubs = 9
stub_calls = 18
stub_condition_uses = 19
unhandled_used = 1

[summary.by_status]  # every status, 0 when no stub has it
assigned = 0
implementable = 0
needs_system = 9
no_op = 4

