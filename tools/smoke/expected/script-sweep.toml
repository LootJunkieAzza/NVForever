# The totals `fnvtool script sweep <Data> <the ten masters> --schema schemas/fnv` must
# print (its "summary"): the smoke scenario script-sweep (tools/smoke/scenarios.toml)
# expects each value below, by its JSON path, to equal the run's
# (docs/handoff/mq-walkthrough-2026-10-27.md §7).
#
# Every quest stage, dialogue line, terminal and package result script runs once, by
# itself. A branch that fixes a cause lowers the counts here; a rise fails the run (find
# the new cause with --detail before raising anything). Most causes are context the sweep
# cannot give (no calling reference, an empty reference variable, an item not carried);
# docs/handoff/mq-walkthrough-2026-10-27.md §7 says which are not.

