# "summary"): the smoke scenario esm-coverage (tools/smoke/scenarios.toml) expects each
# value below, by its JSON path, to equal the run's (issue #1000).
#
# A branch that adds or changes a schema entry changes these numbers and writes the new
# ones here in the same branch, saying why in its description: more `ok` and fewer
# `unknown` is the schema covering more; any rise of `trailing` or `error` is a layout
# that reads wrong (find why before writing it down). Two branches that both changed a
# number conflict here when merged: run the command again on the merge and write what it
# prints, never keep both lines.

