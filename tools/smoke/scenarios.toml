paths = ["crates/fnv-game/src/combat_group.rs", "crates/fnv-game/src/awareness.rs", "crates/fnv-game/src/provocation.rs", "crates/fnv-ai/src/alert.rs", "engine/nvforever/src/combat_tactics.rs", "engine/nvforever/src/npc_combat.rs", "engine/nvforever/src/detection.rs", "engine/nvforever/src/residents.rs", "engine/nvforever/src/attack_anims.rs"]
