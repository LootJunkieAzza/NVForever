[[scenario]]
name = "barber-menu"
source = "owner todo 6 task 2: ShowBarberMenu opens the character creator as the barber, the hair, its colour and the beard only (docs/spec-notes/character-creator.md §10)"
areas = ["chargen", "menus"]
paths = ["engine/nvf-play/src/creator.rs", "engine/nvf-play/src/creator/**", "crates/fnv-game/src/functions/misc.rs"]
# The console runs a script function only once the scripts run; the smoke runner's
# NVF_PLAY_AIDS_FROM_SCRIPTS holds the world aids until then (PR #453), so ShowBarberMenu
# is at 6.5 s, the latest unbusy start, and the steps after it keep their distance from it.
# --no-messages closes the add-ons' OK-only start-up boxes at once (a Classic Pack box held
# the console step otherwise); the barber menu (1036) is no message box and stays open.
env = { NVF_PLAY_TEST_SCRIPT_MENUS = "off", NVF_PLAY_TEST_CONSOLE = "6.5:ShowBarberMenu;6.8:close", NVF_PLAY_TEST_CREATOR = "9.5:next:Hair style,10:next:Facial hair,10.5:next:Hair colour,11:random,11.5:next:Origin,12:tab:face,13.5:done", NVF_PLAY_TEST_SHOTS = "9:barber_open.png,12.5:barber_changed.png" }
args = ["--cell", "GSDocMitchellHouse", "--play", "--no-voice", "--no-messages"]
run_seconds = 21
order = [[
  "console: > ShowBarberMenu",
  "script: menu 1036 open",
  "creator: open on",
  "creator: as the barber (ShowBarberMenu): the hair, its colour and the beard only",
  "creator: camera on opening: 58 units away, looking … under the eye (the hair)",
  "creator: Hair style",
  "creator: Facial hair",
  "creator: Hair colour",
  "creator: randomised",
  'test aid: creator: no row "Origin"',
  "creator: done (test aid NVF_PLAY_TEST_CREATOR)",
  "creator: closed",
]]
manual = "barber_open.png: the panel titled BARBER with one tab (HAIR) and no brows or sliders, the head framed; barber_changed.png: another hair, colour and beard"

