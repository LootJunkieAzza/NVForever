args = ["--cell", "Goodsprings", "--pos=-43200,72000,7000", "--play", "--hour", "12", "--no-voice"]
run_seconds = 120
expect = [
  { re = 'npc combat: 0x000(F36F|FCEB|FD57|15CE)\S* 0x\S+ fights (FiendCookCookRef|0x000F9CE)', label = "the NCR troopers fight the Fiends" },
  { re = 'npc combat: (FiendCookCookRef|0x000F9CE\S*) 0x\S+ fights 0x000(F36F|FCEB|FD57|15CE)', label = "the Fiends fight the NCR troopers" },
  { re = 'battle: .* killed by ', min = 3, label = "three or more killed" },
  { re = 'battle over after (?P<n>[\d.]+) s', range = [5, 120], label = "battle over: the fight is resolved" },
  { re = 'battle summary: 2 sides, (?P<n>\d+) actors', range = [8, 14], label = "battle summary: 2 sides, about 11 actors" },
