source = "UseWeapon (docs/design/use-weapon.md §5): a script has an actor fire a number of shots at a target from where it stands, always hitting and doing no damage"
note = "Violet (FiendVioletRef 0x000F570B, placed at -46910,64897, hunting rifle) is told at 5 s to fire 3 shots at the player, about 1,400 units east of her, from her own place; nobody perceives the player (NVF_PLAY_TEST_UNSEEN), so no fight starts"
areas = ["combat", "use-weapon"]
paths = ["crates/fnv-game/src/use_weapon.rs", "engine/nvforever/src/use_weapon.rs", "crates/fnv-ai/src/carry.rs", "engine/nvf-play/src/combat.rs"]
env = { NVF_PLAY_TEST_UNSEEN = "1", NVF_PLAY_TEST_SCRIPT_MENUS = "1", NVF_PLAY_TEST_SCRIPT = "5:call:FiendVioletRef:UseWeapon:WeapHuntingRifle:FiendVioletRef:player:3:1:0:1:1" }
args = ["--cell", "Goodsprings", "--pos=-45500,64897,7000", "--play", "--hour", "12", "--no-voice", "--npc-packages", "FiendVioletRef"]
run_seconds = 40
expect = [
  "script: test aid calls UseWeapon on FiendVioletRef",
  "is to use its weapon on the player: from where it stands",
  { re = 'use weapon: FiendVioletRef 0x000F570B uses WeapHuntingRifle on the player \(a script\): 3 shots; always hit, no damage, crouch to reload', label = "Violet uses her hunting rifle on the player: 3 shots, always hit, no damage" },
  "use weapon: FiendVioletRef 0x000F570B has fired its 3 shots at the player",
  "has used its weapon: back to its package",
  { re = 'use weapon summary: 1 actors used a weapon .*?3 shots \(3 always hit, 3 harmless; (?P<n>\d+) harmless hits\)', range = [1, 3], label = "3 shots, always hit and harmless, at least one lands" },
]
