[[scenario]]
name = "incinerator-hurts-player"
source = "owner's playtest list 7 items 29 and 19: an NPC's Incinerator did the player no harm, nor did mines: its damage is in its explosion (NVIncineratorFireBurst, 20 within 212), and blasts never reached the player, who has no hit volume (combat.rs view)"
note = "God mode, the player put 500 units in front of Cook-Cook (FiendCookCookRef 000F5704), who draws his Incinerator (actors.md §9.3) and fires at the player; the flame globs' blasts now catch the player"
areas = ["combat"]
paths = ["engine/nvf-play/src/combat.rs", "crates/fnv-combat/src/projectile.rs"]
env = { NVF_PLAY_TEST_GOD = "1", NVF_PLAY_TEST_SCRIPT_MENUS = "1", NVF_PLAY_TEST_SCRIPT = "5:moveto:player:0x000F5704:0:500:0,6:combat:0x000F5704:player" }
args = ["--cell", "Goodsprings", "--pos=-43200,73000,7000", "--play", "--hour", "12", "--no-voice", "--no-messages"]
run_seconds = 40
expect = [
  { re = 'combat: explosion NVIncineratorFireBurst at', label = "the Incinerator's flame globs burst" },
  { re = 'combat: blast NVIncineratorFireBurst on 0x00000014 at \d+', label = "a burst catches the player" },
]

[[scenario]]
name = "impact-decals-blood"
source = "owner's playtest list 7 item 27: blood decals floated off the bodies at wrong angles and came too often; they now lie on the drawn body where the shot's line meets it, at most 3 an actor, one each 0.3 s (docs/spec-notes/impact-decals.md §4)"
note = "God mode in the Goodsprings general store (the energy-resist-hit setup): aimed at Chet's chest (aimnpc=0.6) the 10mm pistol with no spread shoots him four times from 14.1 s; a frame at 15.8 s shows the blood on him"
areas = ["combat", "render"]
paths = ["engine/nvforever/src/decals.rs"]
env = { NVF_PLAY_TEST_GOD = "1", NVF_PLAY_TEST_SCRIPT_MENUS = "0.05", NVF_PLAY_TEST_NO_SPREAD = "1", NVF_PLAY_TEST_EQUIP = "0000434F", NVF_PLAY_TEST_GIVE = "00004241:20", NVF_PLAY_TEST_CONTROL = "10:weapon,14:aimnpc=0.6,14.1:fire,14.5:aimnpc=0.6,14.6:fire,15:aimnpc=0.6,15.1:fire,15.4:aimnpc=0.6,15.5:fire", NVF_PLAY_TEST_SHOTS = "15.8:decals_blood.png" }
args = ["--cell", "GSGeneralStore", "--play", "--hour", "12", "--no-voice"]
run_seconds = 20
expect = [
  { re = 'decals: \w+ leaves \w+ \(\S+\) on actor [0-9A-F]{8}', label = "a shot leaves blood on Pete" },
  { re = 'decals summary: \d+ placed \((?P<n>\d+) on actors\)', range = [1, 3], label = "no more than three on him" },
]

# ------------------------------------------------------------------ playtest list 7 (W8, frame rate)

[[scenario]]
name = "mantis-egg-spawn"
source = "playtest list 7 item 4 (docs/design/frame-rate-audit.md §1-§2): shooting the Goodsprings schoolhouse's mantis ootheca dropped the frame rate to about one frame a second"
note = "at 10 s DamageObject breaks the ootheca 0x0010AC54 (V22MantisOotheca): its script places 12 nymphs at each of its two destruction stages, all at the egg's centre against the lockers. Each must stand on a free floor spot near it (created_spots.rs), not inside the egg or each other; their footsteps are held to the voice limit (sfx.rs). From about 24 s they reach the player and die at its feet (their script kills a nymph within 50 units of the player); the heap of corpses is set at rest after 3 s (ragdoll.rs). Before: 1% low 1,162 ms, the characters' controller ran out its iterations every step. God mode: the nymphs fight the player"
areas = ["actors", "physics", "audio", "performance"]
paths = ["engine/nvf-play/src/created_spots.rs", "engine/nvf-play/src/sfx.rs", "engine/nvforever/src/residents.rs", "engine/nvf-play/src/player/safe.rs", "engine/nvforever/src/ragdoll.rs"]
env = { NVF_PLAY_TEST_GOD = "1", NVF_PLAY_TEST_SAMPLE = "2", NVF_PLAY_TEST_SCRIPT = "10:call:0x0010AC54:DamageObject:5" }
args = ["--cell", "GSSchoolHouse", "--pos", "700,-900,3340", "--play", "--no-voice", "--no-messages"]
run_seconds = 50
expect = [
  { re = 'NVCrGiantMantisNymph \S+: created at \(1101, -1875, 3339\), stands at \(-?\d+, -?\d+, 33[2-5]\d\)', min = 20, label = "the nymphs stand on the floor round the egg, not in it" },
  { text = "created where no free spot is near", count = 0, label = "every nymph found a spot" },
  { re = 'stress frames: .*1% low (?P<n>[\d.]+) ms', range = [0, 400], label = "no run of second-long frames (was 1,162 ms)" },
  { re = 'at most (?P<n>\d+) one-shots at once', range = [1, 64], label = "the footsteps are held to the voice limit" },
  { re = 'ragdolls: (?P<n>\d+) started', range = [5, 1e9], label = "nymphs die at the player's feet (their script kills them within 50 units)" },
  { re = '(?P<n>\d+) in the world at exit \((?P=n) at rest\)', label = "every corpse of the heap is at rest by the end (ragdoll.rs MAX_AWAKE)" },
]

[[scenario]]
name = "rooms-repconn"
source = "playtest list 7 item 47 (docs/design/frame-rate-audit.md §3; docs/spec-notes/level-design.md §3.1): the REPCONN test site's facility floor draws only the rooms seen through portals"
note = "RocketLabMid has 17 room markers and 31 portals. From the start (room 0008D44A) 11 rooms and the unbounded space are in view and about 1,200 meshes are hidden; pictures with and without the culling were the same (frame-rate-audit.md §3). Unseen, so the ghouls stay where they are"
areas = ["renderer", "performance"]
paths = ["engine/nvforever/src/rooms.rs", "engine/nvforever/src/draw_distance.rs"]
env = { NVF_PLAY_TEST_GOD = "1", NVF_PLAY_TEST_UNSEEN = "1" }
args = ["--cell", "RocketLabMid", "--play", "--no-voice", "--no-messages"]
run_seconds = 12
expect = [
  "rooms: 00081D1F: 17 rooms, 31 portals",
  { re = 'rooms: 00081D1F: camera in room 0008D44A, (?P<n>\d+) of 17 rooms in view', range = [2, 16], label = "some rooms are out of view from the start" },
  { re = 'rooms summary: \d+ frames culled by rooms and portals, at most (?P<n>\d+) meshes hidden', range = [500, 1e9], label = "meshes of the rooms out of view are hidden" },
]

[[scenario]]
name = "compass-sneaking-npc"
source = "owner 2026-10-23: a sneaking NPC does not show on the HUD's compass (docs/spec-notes/hud.md §11, fnv_game::Game::compass_shows)"
note = "as crouched-npc-weapon without the drawn weapons: Ringo is brought 300 units north of the player (heading north, so in the compass's window and within Perception × 300) at 3 s, forced to sneak at 5 s (SetForceSneak 1) and let up at 15 s; while he sneaks the compass leaves him off, after he stands nobody is left off"
areas = ["hud"]
paths = ["engine/nvf-play/src/compass.rs", "crates/fnv-game/src/functions/senses.rs"]
env = { NVF_PLAY_TEST_GOD = "1", NVF_PLAY_TEST_SCRIPT_MENUS = "1", NVF_PLAY_TEST_SCRIPT = "3:moveto:RingoRef:player:0:300:0,5:call:RingoRef:SetForceSneak:1,15:call:RingoRef:SetForceSneak:0" }
args = ["--play", "--cell", "Goodsprings", "--pos=-68375,4800,8700", "--heading", "0", "--hour", "12", "--no-voice"]
run_seconds = 22
expect = [
  { re = 'sneaking: RingoRef \S+ crouches and sneaks', label = "Ringo sneaks (SetForceSneak)" },
]
order = [[
  { re = 'compass: \d+ actors .*, [1-9]\d* sneaking left off', label = "sneaking Ringo left off the compass" },
  { re = 'compass: \d+ actors .*, 0 sneaking left off', label = "standing up, nobody is left off" },
]]
