  { re = 'effect shader: Flames01 on \S+ \(no fill and edge, while the effect lasts\)', label = "Flames01's orange edge on the player while burning" },
  { re = 'effect shader: Flames01 covers (?P<n>\d+) meshes of 0x00000014', range = [1, 1000], label = "Flames01 covers the player's third-person body" },
  { re = 'effect shader: Flames01 puts (?P<n>\d+) add-on models of DEBR 0005F9B7 on \S+ \(meshes\\effects\\actorfirefx\\fireball0[1-4]\.nif first', range = [1, 8], label = "Flames01's fireballs (debrisFlameMesh) on the burning player (effect-shaders.md §8)" },
