  "crates/fnv-game/src/functions/ai_state.rs", "crates/fnv-game/src/functions/senses.rs", "crates/fnv-ai/src/social.rs",
  "engine/nvforever/src/script_look.rs", "engine/nvforever/src/speech_look.rs",
]
env = { NVF_PLAY_TEST_SCRIPT_MENUS = "0.3", NVF_PLAY_TEST_SCRIPT = "6:call:SunnyRef:Look:0x0010588E:1,13:call:SunnyRef:Look:player:1,20:call:SunnyRef:StopLook" }
args = ["--cell", "GSProspectorSaloonInterior", "--play", "--no-voice", "--no-messages"]
run_seconds = 28
# The AI runs Sunny (packages are on with --play): fnv_ai turns her, standing at her
# place, at 145 degrees a second (LOOK_TURN_RATE); the engine leaves her body to it. Cheyenne and the
# player stand in different directions from her (speech-look: Cheyenne -160 degrees off
# her front, the player +50), so each Look turns her.
order = [
  [
    { re = 'script look: SunnyRef looks at ', label = "script look: Sunny looks at Cheyenne" },
    { re = 'ai \[[0-9:]+\] SunnyRef: turns its body to CheyenneREF for a script.s Look', label = "ai: Sunny turns her body to Cheyenne" },
    { re = 'ai \[[0-9:]+\] SunnyRef: faces CheyenneREF for a script.s Look', label = "ai: Sunny faces Cheyenne" },
    { re = 'ai \[[0-9:]+\] SunnyRef: turns its body to the player for a script.s Look', label = "ai: Sunny turns her body to the player" },
    { re = 'ai \[[0-9:]+\] SunnyRef: faces the player for a script.s Look', label = "ai: Sunny faces the player" },
    { re = 'script look: SunnyRef stops looking', label = "script look: StopLook ends it" },
  ],
]
expect = [
  # Cheyenne is 160 degrees off Sunny's front: at the original's 145 degrees a second
  # (RingoRef, AI observer campaign knockdown_look 2026-10-19) the turn takes about 1.1 s.
  { gap = ["SunnyRef: turns its body to CheyenneREF for a script", "SunnyRef: faces CheyenneREF for a script"], range = [0.6, 2.0], label = "the body turns at about 145 degrees a second" },
  { re = 'ai \[[0-9:]+\] SunnyRef: is let go by a script.s Look; the body keeps heading', count = 1 },
  { re = "keeps its body for a script's Look", count = 0 },
  "script look summary: 1 looks started, 1 stopped; 0 body turns, 2 bodies left to the AI, 0 stayed",
]

