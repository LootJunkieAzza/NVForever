# NVForever smoke tests as data (runner: `python tools/smoke run`, see tools/smoke/smoke/cli.py).
#
# Each [[scenario]] is one check that used to be prose in CLAUDE.md. Rules:
# - Carry every expectation over; never loosen one to make a run pass (the parity-lab
#   rules apply in spirit). A check that fails on main stays, marked
#   `known_failing = "why"` on the expectation.
# - "about N" in the prose is N ± 25 % (rounded outwards); "a dozen" is 9–15; counts
#   the prose says vary are not checked beyond "at least one".
# - `paths` are globs over the files a branch changed (`**` any depth); `areas` are
#   names for `--area`.
# - `launch = "<name>"`: scenarios that share one game run (same arguments; test aids
#   in [timed] are joined, others must agree). Only shares checked by running both ways
#   are written here. `offset` moves a member's timed test aids in a shared run.
# - Expectation syntax: tools/smoke/smoke/expect.py. "run finished" and exit code 0 are
#   always expected of a game run.
# - Test-aid times: the runner sets NVF_PLAY_AIDS_FROM_SCRIPTS=1 for every `--play`
#   launch, so the aids that act on the world (console, script steps, keys, moves, looks,
#   controls, activate, talk, wait, hits, the menus' and games' aids, screenshots) wait
#   until the scripts first run and are held back by as long as that start came after
#   6.5 s (engine/nvf-play/src/pause.rs WorldAidClock; `--run-seconds` grows by as much).
#   On an unbusy machine the times mean what they did, and a step need not sit at 14 s or
#   later to be safe from a late start. The main menu, intro, pause menu, settings, go-to
#   and face aids keep the time since the start. `NVF_PLAY_AIDS_FROM_SCRIPTS = "0"` in a
#   scenario's env keeps the old clock for all of them.

# `{masters}` in a tool command: the ten masters ("the masters" of the docs), in load order.
masters = [
  "FalloutNV.esm", "DeadMoney.esm", "HonestHearts.esm", "OldWorldBlues.esm", "LonesomeRoad.esm",
  "GunRunnersArsenal.esm", "ClassicPack.esm", "MercenaryPack.esm", "TribalPack.esm", "CaravanPack.esm",
]

# Test aids that hold no times (safe to keep as they are when a member is offset).
untimed = [
  "NVF_PLAY_TEST_SCRIPT_MENUS", "NVF_PLAY_TEST_GIVE", "NVF_PLAY_TEST_EQUIP", "NVF_PLAY_TEST_NEAR",
  "NVF_PLAY_TEST_MENU", "NVF_PLAY_TEST_BARTER", "NVF_PLAY_TEST_BARTER_DELAY", "NVF_PLAY_TEST_NO_SPREAD",
  "NVF_PLAY_TEST_GOD", "NVF_PLAY_TEST_TALK_HEAD_ONLY", "NVF_PLAY_TEST_UNSEEN",
  "NVF_PLAY_AIDS_FROM_SCRIPTS",
]

# Test aids whose value is a list of timed items (`<seconds>:<what>`), joined with sep.
[timed.NVF_PLAY_TEST_SCRIPT]
sep = ","
[timed.NVF_PLAY_TEST_CONTROL]
sep = ","
[timed.NVF_PLAY_TEST_WHEEL]
sep = ","
[timed.NVF_PLAY_TEST_MOVE]
sep = ","
[timed.NVF_PLAY_TEST_LOOK]
sep = ","
[timed.NVF_PLAY_TEST_GOTO]
sep = ","
[timed.NVF_PLAY_TEST_DROP]
sep = ","
[timed.NVF_PLAY_TEST_ACTIVATE]
sep = ","
[timed.NVF_PLAY_TEST_GRAB]
sep = ","
[timed.NVF_PLAY_TEST_WAIT]
sep = ","
[timed.NVF_PLAY_TEST_RADIO]
sep = ","
[timed.NVF_PLAY_TEST_CHARGEN]
sep = ","
[timed.NVF_PLAY_TEST_VIGOR]
sep = ","
[timed.NVF_PLAY_TEST_LEVELUP]
sep = ","
[timed.NVF_PLAY_TEST_TERMINAL]
sep = ","
[timed.NVF_PLAY_TEST_LOCKPICK]
sep = ","
[timed.NVF_PLAY_TEST_POKER]
[timed.NVF_PLAY_TEST_BLACKJACK]
sep = ","
[timed.NVF_PLAY_TEST_PIPBOY]
sep = ","
[timed.NVF_PLAY_TEST_HIT]
sep = ","
[timed.NVF_PLAY_TEST_PIPBOY_STATS]
sep = ","
[timed.NVF_PLAY_TEST_SETTINGS]
sep = ","
[timed.NVF_PLAY_TEST_SHOTS]
sep = ","
[timed.NVF_PLAY_TEST_FACE]
sep = ","
[timed.NVF_PLAY_TEST_TALK]
sep = ";"
[timed.NVF_PLAY_TEST_KEYS]
sep = ","
[timed.NVF_PLAY_TEST_PAUSE]
sep = ","
shift = "all"
[timed.NVF_PLAY_TEST_AUDIO_REOPEN]
sep = ","


# ------------------------------------------------------------------ checks before every push
# Engine workspace uses the crates/ workspace, so crate changes call for its clippy too.

[[check]]
name = "root cargo test"
paths = ["crates/", "Cargo.toml", "Cargo.lock", "schemas/", "deny.toml"]
cmd = ["cargo", "test", "--workspace", "--release"]

[[check]]
name = "root clippy"
paths = ["crates/", "Cargo.toml", "Cargo.lock", "schemas/", "deny.toml"]
cmd = ["cargo", "clippy", "--workspace", "--all-targets", "--release", "--", "-D", "warnings"]

[[check]]
name = "engine clippy"
paths = ["engine/", "crates/", "Cargo.toml", "schemas/"]
cmd = ["cargo", "clippy", "--release", "--all-targets", "--", "-D", "warnings"]
cwd = "engine"

[[check]]
name = "parity-lab tests"
paths = ["parity-lab/"]
cmd = ["python", "-m", "unittest", "discover", "-s", "parity-lab/tests"]

[[check]]
name = "capture tests"
paths = ["tools/capture/"]
cmd = ["python", "-m", "unittest", "discover", "-s", "tools/capture/tests"]

[[check]]
name = "smoke runner tests"
paths = ["tools/smoke/"]
cmd = ["python", "-m", "unittest", "discover", "-s", "tools/smoke/tests"]

[[check]]
name = "stress runner tests"
paths = ["tools/stress/", "tools/smoke/smoke/runner.py", "tools/smoke/smoke/stacks.py", "tools/smoke/smoke/expect.py"]
cmd = ["python", "-m", "unittest", "discover", "-s", "tools/stress/tests"]

# ------------------------------------------------------------------ renderer, sky, image space

[[scenario]]
name = "auto-fly"
source = "CLAUDE.md: after renderer changes, the moving-camera smoke test (cell streaming and LOD rebuilds)"
areas = ["renderer"]
paths = [
  "engine/nvf-assets/", "engine/nvforever/src/lod*.rs", "engine/nvforever/src/terrain.rs",
  "engine/nvforever/src/world*.rs", "engine/nvforever/src/grass*", "engine/nvforever/src/tree*",
  "engine/nvforever/src/water*", "engine/nvforever/src/imposters.rs", "engine/nvforever/src/reflection.rs",
  "engine/nvforever/src/emittance.rs", "engine/nvforever/src/underwater.rs", "engine/nvforever/src/ripples.rs",
  "engine/nvforever/src/particles.rs", "engine/nvforever/src/fly.rs", "engine/nvforever/src/main.rs",
  "crates/fnv-nif/", "crates/fnv-dds/", "crates/fnv-spt/", "crates/fnv-bsa/", "crates/fnv-vfs/",
  "crates/fnv-world/src/land.rs", "crates/fnv-world/src/grass.rs", "crates/fnv-world/src/imposter.rs",
  "crates/fnv-world/src/index.rs", "crates/fnv-world/src/placed.rs",
]
args = ["--cell", "Goodsprings", "--auto-fly", "4000"]
run_seconds = 40

[[scenario]]
name = "cell-streaming"
source = "docs/design/streaming-hitches.md §2 Cells: cells read ahead on worker threads, spawned over frames, faded in once whole"
note = "A fast flight over the Mojave without --play: once the start square is in, cells load through the read-ahead and the spawning budget (world.rs CellSpawn, ReadAhead); the summary at the exit counts them. The flight outruns the read-ahead now and then, so cells drawn before theirs was done are allowed, a few"
areas = ["renderer"]
paths = [
  "engine/nvf-assets/src/model.rs", "engine/nvf-assets/src/texture.rs", "engine/nvf-assets/src/release.rs",
  "engine/nvforever/src/world.rs", "engine/nvforever/src/terrain.rs", "engine/nvforever/src/fade.rs",
]
args = ["--cell", "Goodsprings", "--auto-fly", "3000"]
run_seconds = 40
expect = [
  { re = 'streaming summary: (\d+) cells loaded', range = [40, 100000], label = "cells streamed in" },
  { re = 'streaming summary: .* spread over (\d+) frames', range = [40, 100000], label = "spawned over frames" },
  { re = 'streaming summary: .*, (\d+) drawn before it was done', range = [0, 10], label = "few cells outran their read-ahead" },
]

[[scenario]]
name = "cell-fade-in"
source = "docs/design/streaming-hitches.md §2 Cells: a cell spawned over frames stays hidden until it is whole, then fades in over --cell-fade (fade.rs)"
note = "Moved two cells east at 8 s: the column of cells two to three cells ahead streams in while the player looks at it"
areas = ["renderer"]
paths = ["engine/nvforever/src/world.rs", "engine/nvforever/src/fade.rs"]
env = { NVF_PLAY_TEST_GOD = "1", NVF_PLAY_TEST_GOTO = "8:-59700:1400:9000", NVF_PLAY_TEST_LOOK = "8.1:90:-2", NVF_PLAY_TEST_SHOTS = "8.2:fade_0.png,8.6:fade_1.png,9:fade_2.png,9.4:fade_3.png,9.8:fade_4.png,10.4:fade_5.png,12:fade_6.png" }
args = ["--cell", "Goodsprings", "--play", "--no-voice", "--no-messages", "--pos=-67900,1400,8500", "--hour", "12"]
run_seconds = 14
expect = [
  { re = 'streaming summary: (\d+) cells loaded', range = [30, 100000], label = "the start square and the cells ahead loaded" },
]
manual = "fade_0..fade_6: the cells ahead are absent or whole (never half their references), then dither in over about a second, the distant LOD under them until they are fully drawn"

[[scenario]]
