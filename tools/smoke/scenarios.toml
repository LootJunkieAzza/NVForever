source = "docs/spec-notes/lockpicking.md §7: Ringo's floor safe in GSGasStation (level 25, half under a mattress) targeted from where NVF_PLAY_TEST_NEAR stands; the help the first time only, leaving with the pin pulled out, a failed Force Lock breaks it for good and the next activation is refused"
areas = ["lockpick"]
paths = ["crates/fnv-game/src/lockpick.rs", "engine/nvf-play/src/lockpick*", "engine/nvf-play/src/lockpick/**", "engine/nvforever/src/lockpick_view.rs", "engine/nvf-play/src/activate.rs", "engine/nvf-play/src/activate/**", "engine/nvf-play/src/player/safe.rs"]
env = { NVF_PLAY_TEST_SCRIPT_MENUS = "0.3", NVF_PLAY_TEST_NEAR = "0010B2D4", NVF_PLAY_TEST_GIVE = "0000000A:2", NVF_PLAY_TEST_ACTIVATE = "12,18.5,23", NVF_PLAY_TEST_LOCKPICK = "1:skill:30,14:help,15:pin:60,15.5:torque:0.6,17:exit,19:force:99" }
# --no-messages added 2026-10-18 (claude/vats-mode): the add-on packs' start-up boxes came up
# around the second activation (18.5 s), which then found no target and was dropped without
# a line, so the Force Lock never came; as lockpick-opens-container, the boxes close at once.
args = ["--cell", "GSGasStation", "--play", "--no-voice", "--no-messages"]
run_seconds = 28
order = [[
  "target 0x0010B2D4 Floor Safe (Locked (Easy)) by Collision",
  "lockpick: open 0x0010B2D4 Floor Safe: Easy lock (Lockpick 30, 2 bobby pins)",
  'lockpick: help message 0x0000017C "Lockpicking" shown (first use)',
  "lockpick: help message closed",
  "lockpick: torque on, pin at 60.0°",
  "lockpick: leaving (the player left)",
  "lockpick: closed (the player left)",
  "lockpick: open 0x0010B2D4 Floor Safe: Easy lock (Lockpick 30, 2 bobby pins)",
  "lockpick: Force Lock (15%, roll 99.0): 0x0010B2D4 broken for good, the pin with it (1 left)",
  "lockpick: leaving (the game is over)",
  "lockpick: closed (the game is over)",
  'lockpick: 0x0010B2D4 Floor Safe refused (Lockpick 30): on screen: "This lock is broken. It can only be opened with a key."',
]]
expect = [
  { text = "lockpick: help message 0x0000017C", count = 1 },
  "ui sounds: lockpick lock broken by forcing: UILockpickingForceFail",
  "lockpick summary: 3 asked, 2 opened (1 refused); 0 picked, 0 forced, 1 broken by forcing; 1 torque tries, 0 pins broken, 0 times out of pins; 1 left before the end",
]

