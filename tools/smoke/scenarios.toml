# 5 hours (600 s) of a 1,440 s effect. Hardcore: 3 hours slept take Sleep Deprivation 235
# to 55 (60 an hour, the owner's table 2026-10-23; it was 0 with the old guess of 100)
# and add 3 x 4.8 Hunger.
expect = [
  { json = "perks.count", equals = 109 },
  { json = "perks.entries_by_entry_point.23", equals = 1 },
  { json = "perks.entries_by_entry_point.25", equals = 2 },
  { json = "perks.entries_by_entry_point.44", equals = 1 },
  { json = "need_stages.Dehydration.#", equals = 5 },
  { json = "use.uses.*.changes.*.duration", equals = 480.0, count = 3, label = "the first Buffout's three effects last 480 s" },
  { json = "use.uses.?item=Buffout.addiction.chance", range = [0.0999, 0.1001], label = "the third Buffout's addiction chance 0.1" },
  { json = "use.wait.values_after.carry_capacity", equals = 220.0 },
  { json = "use.stage_changes.*.spell", equals = "SleepDeprivation200" },
  { json = "use.wait.values_after.Sleep Deprivation", range = [54.9, 55.1] },
  { json = "use.wait.values_after.Hunger", range = [14.43, 14.45] },
]

