  { re = 'effect particles: Flames01 on the player \(textures\\effects\\fxflamesmallsub02\.dds', label = "Flames01's flames drawn on the player" },
  { re = 'hit effects summary: (?P<n>\d+) applied', range = [1, 1000000], label = "hit effects applied" },
  { re = 'hit effects summary: .* (?P<n>\d+) refreshed by later hits', range = [1, 1000000], label = "later hits start the burn's time again" },
]

