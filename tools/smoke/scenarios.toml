  { re = 'npc gun reach summary: held fire (?P<n>\d+) times at a target beyond reach', range = [1, 1000], label = "fire held beyond reach in the summary" },
]
order = [[
  { re = 'npc combat: FiendCookCookRef \S+ holds fire: the player is beyond its weapon.s reach \((?P<n>\d+) units, reach 640\)', range = [641, 5000], label = "he holds fire from afar" },
  { re = 'ai \[[\d:]+\] 000F5704: (runs|walks) at the player', label = "then runs at the player (no flank place while out of reach)" },
  { re = 'npc combat: FiendCookCookRef \S+ has the player in reach \((?P<n>\d+) units, reach 640\)', range = [0, 640], label = "then has the player within his flame's reach" },
  { re = 'npc combat: FiendCookCookRef \S+ opens fire on the player from (?P<n>\d+) units \(reach 640\)', range = [0, 640], label = "then fires, from within his flame's reach" },
  { re = 'attack anims: 000F5704 plays \S*2hhattackspin2?\.kf', label = "with the flamer's attack clip" },
]]

