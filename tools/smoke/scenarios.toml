env = { NVF_PLAY_TEST_SCRIPT_MENUS = "1", NVF_PLAY_TEST_CONSOLE = "8:player.setav health 10;8.3:close", NVF_PLAY_TEST_SCRIPT = "9:combat:0x000F570B:player" }
args = ["--cell", "Goodsprings", "--pos=-45900,64896,7000", "--play", "--hour", "12", "--no-voice", "--no-messages", "--npc-packages", "FiendVioletRef"]
run_seconds = 30
expect = [
  "combat: the player died",
  { re = 'alert: \S*FiendViolet 000F570B Combat → Normal', label = "Violet goes from Combat to Normal once the player is dead" },
  { re = 'alert: \S*FiendViolet 000F570B says CombatToNormal line', label = "she says a CombatToNormal line" },
]
forbid = [
  { re = 'alert: \S*FiendViolet 000F570B Combat → Lost', label = "Violet loses a dead target" },
  { re = 'alert: \S*FiendViolet 000F570B says (CombatToLost|LostIdle|LostToNormal) line', label = "a Lost line about a dead target" },
]

