[[scenario]]
name = "knockdown-player"
source = "playthrough blocker row 1's leftover (docs/outstanding.md): the player knocked down by PushActorAway drops as a ragdoll, the view leaves first person, the controls are held, the get-up idle plays and the view and the controls come back (docs/spec-notes/unconscious.md §5.4)"
note = "in Goodsprings, Easy Pete is brought 300 units north of the player at 14 s; at 16 s the console has him push the player with force 10 and reads the player's GetKnockedState (0 for a pushed actor); the player lies 2.4 s (PLAYER_KNOCKDOWN_DOWN, observed in the original), the camera held where the eye was; gets up with GetUpFaceUp or GetUpFaceDown seen from the third-person camera, and is in first person again"
areas = ["combat", "knockouts", "player", "camera"]
paths = [
  "crates/fnv-game/src/unconscious.rs", "crates/fnv-game/src/awareness.rs", "engine/nvforever/src/player_knockdown.rs", "engine/nvforever/src/player_body.rs",
  "engine/nvforever/src/death_cam.rs", "engine/nvforever/src/ragdoll.rs", "engine/nvforever/src/idles.rs", "engine/nvf-play/src/script.rs",
]
env = { NVF_PLAY_TEST_GOD = "1", NVF_PLAY_TEST_SCRIPT_MENUS = "1", NVF_PLAY_TEST_SCRIPT = "14:moveto:EasyPeteRef:player:0:300:0", NVF_PLAY_TEST_CONSOLE = "16:EasyPeteRef.pushactoraway player 10;16.3:player.getknockedstate;16.6:close" }
args = ["--play", "--cell", "Goodsprings", "--pos=-68375,4800,8700", "--heading", "0", "--hour", "12", "--no-voice", "--no-messages"]
run_seconds = 40
order = [[
  "console: > EasyPeteRef.pushactoraway player 10",
  { re = 'player knockdown: the player falls \(pushed, first person', label = "the player falls" },
  { re = 'player knockdown: the player gets up face (up|down)', label = "the player gets up" },
  { re = 'player knockdown: the player is up', label = "the player is up" },
  "player controls: all enabled",
]]
expect = [
  { re = 'knockout: .*\b(0x)?00000014 knocked down \(pushed\)', label = "the rules knock the player down" },
  { re = 'player knockdown: the player falls \(pushed, first person, the view leaves first person\): ragdoll thrown at \(-?\d+, -?\d+, \d+\) units/s', label = "the body is thrown as a ragdoll and the view leaves first person" },
  "player controls: all held, the player is knocked down",
  { re = 'console: GetKnockedState on player >> 0\.00\b', label = "GetKnockedState reads 0 for the pushed player" },
  { re = 'player knockdown: the player gets up face (up|down) [\d.]+ s after the fall \(GetUpFace(Up|Down)\)', label = "the get-up idle of the side the body lies on" },
  { re = 'player knockdown: laid over the ragdoll: turned -?\d+°, moved (?P<n>\d+) units', range = [0, 200], label = "the clip is laid over where the ragdoll lay", known_failing = "fails on main f7aa1dc1 too (2026-10-23, list 7 W8): no 'laid over the ragdoll' line, the player gets up and is up as before; cause not traced" },
  { re = 'player knockdown: the player is up (?P<n>[\d.]+) s after the fall; the controls and the first-person view are theirs again', range = [3.0, 12.0], label = "up again, back in first person" },
  { re = 'player knockdown: over without getting up', count = 0, label = "the knockdown ends by getting up" },
  { re = 'death camera: the player died', count = 0, label = "the player does not die" },
]

