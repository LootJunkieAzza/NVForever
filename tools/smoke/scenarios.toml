# ---- Detection out of the player's reach (docs/design/detection.md §7) ------------------
# The NCR troopers of "ncr-fiends" are put 600 units north of the player, then at 4 s the
# player goes about 5,700 units south of them (out of the outdoor reach of 5,000; the
# Fiend camp about 8,000 away, still in the loaded 5 × 5 cells). Before 2026-10-17 only
# actors within reach of the player measured each other, and this fight never started.

[[scenario]]
name = "detection-far-fight"
source = "script-function coverage §5 item 1 (PR #370): fights between NPCs out of the player's reach start (IsInCombat), docs/design/detection.md §7"
areas = ["detection", "combat"]
paths = ["engine/nvforever/src/detection.rs", "crates/fnv-game/src/sight.rs"]
env = { NVF_PLAY_TEST_GOD = "1", NVF_PLAY_TEST_SCRIPT_MENUS = "1", NVF_PLAY_TEST_SCRIPT = "3:moveto:0x000F36F5:player:-400:600:0,3:moveto:0x000F36F6:player:-200:650:0,3:moveto:0x0015CE0A:player:0:600:0,3:moveto:0x0015CE08:player:200:650:0,3:moveto:0x000FCEB1:player:400:600:0,3:moveto:0x000FD572:player:600:550:0", NVF_PLAY_TEST_GOTO = "4:-43200:66300:9000" }
args = ["--cell", "Goodsprings", "--pos=-43200,72000,7000", "--play", "--hour", "12", "--no-voice"]
run_seconds = 100
expect = [
  { re = "detection summary, out of the player's reach: (?P<n>\\d+) pairs", range = [1, 10000000], label = "pairs out of the player's reach are measured" },
  { re = "detection summary, out of the player's reach: \\d+ pairs, (?P<n>\\d+) measured detected", range = [1, 10000000], label = "and some detected" },
  { re = 'npc combat: 0x000(F36F|FCEB|FD57|15CE)\S* 0x\S+ fights (FiendCookCookRef|0x000F9CE)', label = "the NCR troopers fight the Fiends, far from the player" },
  { re = 'npc combat: (FiendCookCookRef|0x000F9CE\S*) 0x\S+ fights 0x000(F36F|FCEB|FD57|15CE)', label = "the Fiends fight the NCR troopers" },
]
forbid = [{ re = 'the player died', label = "the player dies" }]

# ---- Combat AI list 2 (docs/design/combat-ai.md §12) ------------------------------------
# Six NCR troopers from near Camp McCarran are put (moveto) 600 units north of the player,
# about 1,900 units south of Cook-Cook's Fiend camp (Cook-Cook and four Fiends); nobody
# perceives the player (NVF_PLAY_TEST_UNSEEN), who watches from there. Three scenarios
# read the one run (launch "ncr-fiends").

[[scenario]]
name = "battle-ncr-fiends"
launch = "ncr-fiends"
source = "owner's list 2 (combat AI, E2): fights between NPCs at scale, a group fight resolving (docs/design/combat-ai.md §12.7)"
