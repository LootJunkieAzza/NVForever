[[scenario]]
name = "vats-mode-melee"
source = "owner's todo 6 follow-up and owner 2026-10-20: melee marks within 5 m, the player teleports beside each mark and swings (docs/design/vats-mode.md §16.2)"
note = "a machete (WeapNVMachete 000CE569: 20 AP a swing) among the Goodsprings dogs, which attack the player (god mode), so by 10 s they are within 5 m. One mark, E: a teleport beside the dog and one swing that lands on it. Written 2026-10-20 by a worker session that does not run the game. 2026-10-23 (list 7 W9): VATS at 16 s, not 10: the add-ons' start-up message boxes opened at 10.4 s and ended the mode before it could end itself ('a menu opened'). 2026-10-23: VATS mode rolls each swing on the mark's hit chance (vats-mode.md §17); this check is about the teleport and the blow landing, so its roll is forced to hit (NVF_PLAY_TEST_VATS_ROLL=hit); vats-mode-hit-chance and vats-mode-miss check the rolls"
areas = ["combat", "vats"]
paths = ["engine/nvf-play/src/vats_mode.rs", "crates/fnv-combat/src/vats.rs", "engine/nvf-play/src/combat.rs"]
env = { NVF_PLAY_TEST_GOD = "1", NVF_PLAY_TEST_SCRIPT_MENUS = "1", NVF_PLAY_TEST_SCRIPT = "3:combat:0x000F573F:player,3:combat:0x0013E5BB:player", NVF_PLAY_TEST_EQUIP = "000CE569", NVF_PLAY_TEST_VATS_ROLL = "hit", NVF_PLAY_TEST_CONTROL = "3:weapon,16.3:aimvats", NVF_PLAY_TEST_KEYS = "16:v,16.32:mouse-left,16.36:e" }
args = ["--cell", "Goodsprings", "--pos=-45600,65000,7000", "--play", "--hour", "12", "--no-voice", "--no-messages", "--npc-packages", "000F573F,0013E5BB"]
run_seconds = 24
order = [[
  { re = 'vats mode: on \(WeapNVMachete, melee, 20 AP a mark', label = "V enters VATS mode with the machete" },
  { re = 'vats mode: marked .* mark 1; 20 AP reserved', label = "one mark within 5 m" },
  "vats mode: firing 1 marked swings",
  { re = 'vats mode: teleported to ', label = "the player is put beside the mark", known_failing = "2026-10-23 (list 7 W9): with VATS at 16 s the dog was already within the swing's reach (123 units across, struck), so no teleport was needed; whether one happens depends on the dog's distance at the click" },
  { re = 'vats mode: swing 1 of 1 at .*, 20 AP spent', label = "one swing" },
  { re = 'combat: vats mode blow on .*: .* struck', label = "the blow lands on the mark" },
  { re = 'vats mode: off \(1 shots fired, 20 AP spent; all shots fired\)', label = "the mode ends after the swing" },
]]

