note = "a .357 with one round (no god mode, so the magazine holds what is carried) among the Goodsprings dogs, left to their packages; the console gives the player 5000 health at 6 s, as the flamer scenarios do (without it the dogs killed the player before V, coordinator run 2026-10-18, and a dead player cannot enter). The player's AP covers three 26 AP shots, so the second mark is refused for the rounds; E fires the one mark. V at 10 s, after the start-up boxes"
areas = ["combat", "vats"]
paths = ["engine/nvf-play/src/vats_mode.rs", "crates/fnv-combat/src/vats.rs"]
env = { NVF_PLAY_TEST_SCRIPT_MENUS = "1", NVF_PLAY_TEST_CONSOLE = "6:player.setav health 5000;6.5:close", NVF_PLAY_TEST_EQUIP = "0008F216", NVF_PLAY_TEST_GIVE = "0008ED02:1", NVF_PLAY_TEST_CONTROL = "3:weapon,4.5:reload,10.3:aimvats,10.36:aimvats", NVF_PLAY_TEST_KEYS = "10:v,10.32:mouse-left,10.38:mouse-left,10.42:e" }
args = ["--cell", "Goodsprings", "--pos=-45600,65000,7000", "--play", "--hour", "12", "--no-voice", "--no-messages", "--npc-packages", "000F573F,0013E5BB"]
run_seconds = 16
order = [[
  { re = 'vats mode: on \(WeapNV357Revolver, 26 AP a shot, 1 rounds loaded', label = "one round loaded" },
  { re = 'vats mode: marked .* mark 1;', label = "the first mark" },
  { re = 'vats mode: mark refused: No more rounds loaded\.', label = "the second mark is refused for the rounds" },
  { re = 'vats mode: off \(1 shots fired, 26 AP spent; all shots fired\)', label = "the one mark is fired" },
]]

