[function.GetPCMiscStat]
status = "match"
system = "player statistics counters"
note = "All 43 New Vegas names have codes (the order of the original General list and saves, misc-stats.md §1) and compile; 26 are counted by the rules and the engine (kills, quests, locks, hacking, aid items, sleep, casino, crafting, repair, barter; misc-stats.md §3), the others only by ModPCMiscStat. People Killed read 1 after a kill in the original [observed]."

[function.RewardXP]
status = "match"
note = "Levelling by experience exists now (experience.rs, levelup.rs); the audit's gap is closed."

