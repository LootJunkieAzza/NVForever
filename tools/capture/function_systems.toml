# The script functions that do not simply match the original, for
# docs/design/script-function-coverage.md (`function_coverage.py`). Every function the
# audit (docs/design/script-function-audit.md §6) does not call "matches" or "fixed here"
# is here; so are those it calls matches whose system is still missing.
#
# status: match | wrong (wrong or a stub while the system behind it exists) |
#         no-system (the system is not built; `system` names it) | open (not settled)
# Evidence tags as CLAUDE.md asks; "probes" are the function probes of 2026-10-17
# (tools/capture/probes/audit2.toml), private outputs in C:\fnv-private\capture\probe.
format = "fnv.function.systems/1"

[groups]
# Main quest: the intro chain (VCG*) and the main line with its faction branches (VMQ*)
# [observed: quest names in FalloutNV.esm].
main = ["^VCG0", "^VMQ"]
# Companions: the follower quests, each companion's dialogue quest and the personal
# quests named after them [observed: names; hypothesis for which quest is whose].
companions = ["Followers", "VNPCFollowers", "VDialogueCraigBoone", "VMS39", "VDialogueRaul", "VDialogueRex", "VMS24",
              "VDialogueCass", "VCassCompanion", "vDialogueLily", "VDialogueVeronica", "VMS49", "vDialogueEDE",
              "VDialogueArcadeGannon", "VMS54", "VFollowerDialogueRose"]

