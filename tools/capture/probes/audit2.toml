# ---------------------------------------------------------------- 1: read-only, gas station

[[batch]]
name = "fp1_queries"
title = "Function probes 1: read-only queries in the gas station (about 1 min, no input)"
start = "nvftest (Goodsprings gas station); nothing is changed."
ours_start = [{ op = "go_to_cell", cell = "GSGasStation" }, { op = "wait_frames", frames = 300 }]
steps = [
  # GetDisposition: base value, what differs between NPCs (stub 0 on ours).
  { ask = "@sunny.GetDisposition player" },
  { ask = "@trudy.GetDisposition player" },
  { ask = "@ringo.GetDisposition player" },
  { ask = "@chet.GetDisposition player" },
  { ask = "@pete.GetDisposition player" },
  { ask = "@doc.GetDisposition player" },
  { ask = "@cobb.GetDisposition player" },
  { ask = "@ringo.GetDisposition @sunny" },
  # GetCurrentAIPackage / Procedure codes: the same NPCs, loaded or not.
  { ask = "@ringo.GetCurrentAIPackage" },
  { ask = "@ringo.GetCurrentAIProcedure" },
  { ask = "@sunny.GetCurrentAIPackage" },
  { ask = "@trudy.GetCurrentAIPackage" },
  { ask = "@chet.GetCurrentAIPackage" },
  { ask = "@pete.GetCurrentAIPackage" },
  { ask = "@doc.GetCurrentAIPackage" },
  { ask = "@cobb.GetCurrentAIPackage" },
  { ask = "@victor.GetCurrentAIPackage" },
  # GetCauseofDeath of a live, loaded actor.
  { ask = "@ringo.GetCauseofDeath" },
  { ask = "@ringo.GetDead" },
  # Ringo at rest: detection, combat, talking, idles.
  { ask = "@ringo.HasLoaded3D" },
  { ask = "@ringo.IsInCombat" },
  { ask = "@ringo.GetDetected player" },
  { ask = "player.GetDetected @ringo" },
  { ask = "player.GetLineOfSight @ringo" },
  { ask = "@ringo.GetLineOfSight player" },
  { ask = "@ringo.IsTalking" },
  { ask = "player.IsTalking" },
  { ask = "@ringo.IsIdlePlaying" },
  { ask = "@ringo.GetSitting" },
  { ask = "@ringo.GetSleeping" },
  { ask = "player.GetSleeping" },
  { ask = "IsPCSleeping" },
  { ask = "@ringo.IsMoving" },
  { ask = "player.IsMoving" },
  { ask = "@ringo.GetIsAlerted" },
  { ask = "@ringo.GetAlarmed" },
  { ask = "@ringo.GetShouldAttack player" },
  { ask = "@ringo.IsTrespassing" },
  { ask = "player.IsTrespassing" },
  { ask = "@ringo.GetKnockedState" },
  { ask = "@ringo.GetUnconscious" },
  { ask = "@ringo.IsInCriticalStage 0" },
  { ask = "@ringo.IsInCriticalStage 1" },
  { ask = "@ringo.GetAnimAction" },
  # Stubs at rest: does the original also give 0 here?
  { ask = "player.GetRadiationLevel" },
  { ask = "player.IsSwimming" },
  { ask = "@ringo.IsSwimming" },
  { ask = "@ringo.IsLimbGone 1" },
  { ask = "@ringo.IsFacingUp" },
  { ask = "@ringo.IsLeftUp" },
  { ask = "@ringo.IsActorTalkingThroughActivator" },
  { ask = "IsPlayerActionActive 9" },
  { ask = "IsPlayerActionActive 1" },
  { ask = "GetVATSMode" },
  { ask = "@ringo.HasBeenEaten" },
  { ask = "player.GetCannibal" },
  { ask = "player.GetSandman" },
  { ask = "@ringo.GetPlantedExplosive" },
  { ask = "@ringo.GetForceHitReaction" },
  { ask = "@ringo.GetUsedItemActivate" },
  { ask = "IsPlayerGrabbedRef @safe" },
  # Menus and the player.
  { ask = "MenuMode" },
  { ask = "MenuMode 1" },
  { ask = "IsPC1stPerson" },
  { ask = "player.GetLevel" },
  { ask = "GetXPForNextLevel" },
  { ask = "GetPlayerTeammateCount" },
  # Locks: a safe, a door, a far door a script compares with 255, a far terminal.
  { ask = "@safe.GetLocked" },
  { ask = "@safe.GetLockLevel" },
  { ask = "@gsdoor.GetLocked" },
  { ask = "@gsdoor.GetLockLevel" },
  { ask = "@hostdoor.GetLocked" },
  { ask = "@hostdoor.GetLockLevel" },
  { ask = "@term.GetLocked", label = "terminal GetLocked (unloaded)" },
  { ask = "@term.GetLockLevel", label = "terminal GetLockLevel (unloaded)" },
  # Map marker and the calendar.
  { ask = "@gsmarker.GetMapMarkerVisible" },
  { ask = "GetDayOfWeek" },
  { game = "GameYear", ours = { op = "get_global", name = "GameYear" }, label = "GameYear" },
  { game = "GameMonth", ours = { op = "get_global", name = "GameMonth" }, label = "GameMonth" },
  { game = "GameDay", ours = { op = "get_global", name = "GameDay" }, label = "GameDay" },
  { game = "GameDaysPassed", ours = { op = "get_global", name = "GameDaysPassed" }, label = "GameDaysPassed", tolerance = 0.5 },
  # GetPCMiscStat: every statistic the wiki lists for New Vegas [documented: GECK wiki
  # GetPCMiscStat]; ours counts only ModPCMiscStat.
  { ask = 'GetPCMiscStat "Barter Amount Traded"' },
  { ask = 'GetPCMiscStat "Blackjack Games Played"' },
  { ask = 'GetPCMiscStat "Books Read"' },
  { ask = 'GetPCMiscStat "Caravan Games Lost"' },
  { ask = 'GetPCMiscStat "Caravan Games Won"' },
  { ask = 'GetPCMiscStat "Challenges Completed"' },
  { ask = 'GetPCMiscStat "Chems Taken"' },
  { ask = 'GetPCMiscStat "Computers Hacked"' },
  { ask = 'GetPCMiscStat "Corpses Eaten"' },
  { ask = 'GetPCMiscStat "Creatures Killed"' },
  { ask = 'GetPCMiscStat "Disintegrations"' },
  { ask = 'GetPCMiscStat "Dismembered Limbs"' },
  { ask = 'GetPCMiscStat "Doctor Bags Used"' },
  { ask = 'GetPCMiscStat "Have Limbs Crippled"' },
  { ask = 'GetPCMiscStat "Health From Food"' },
  { ask = 'GetPCMiscStat "Health From Stimpaks"' },
  { ask = 'GetPCMiscStat "Items Crafted"' },
  { ask = 'GetPCMiscStat "Items Repaired"' },
  { ask = 'GetPCMiscStat "Locations Discovered"' },
  { ask = 'GetPCMiscStat "Locks Picked"' },
  { ask = 'GetPCMiscStat "Mines Disarmed"' },
  { ask = 'GetPCMiscStat "Miss Fortunate Occurrences"' },
  { ask = 'GetPCMiscStat "Mysterious Stranger Visits"' },
  { ask = 'GetPCMiscStat "Pants Exploded"' },
  { ask = 'GetPCMiscStat "Paralyzing Punches"' },
  { ask = 'GetPCMiscStat "People Killed"' },
  { ask = 'GetPCMiscStat "Pockets Picked"' },
  { ask = 'GetPCMiscStat "Quests Completed"' },
  { ask = 'GetPCMiscStat "Rad-X Taken"' },
  { ask = 'GetPCMiscStat "RadAway Taken"' },
  { ask = 'GetPCMiscStat "Robots Disabled"' },
  { ask = 'GetPCMiscStat "Roulette Games Played"' },
  { ask = 'GetPCMiscStat "Sandman Kills"' },
  { ask = 'GetPCMiscStat "Slots Games Played"' },
  { ask = 'GetPCMiscStat "Speech Failures"' },
  { ask = 'GetPCMiscStat "Speech Successes"' },
  { ask = 'GetPCMiscStat "Stimpaks Taken"' },
  { ask = 'GetPCMiscStat "Times Addicted"' },
  { ask = 'GetPCMiscStat "Times Slept"' },
  { ask = 'GetPCMiscStat "Total Things Killed"' },
  { ask = 'GetPCMiscStat "Water Consumed"' },
  { ask = 'GetPCMiscStat "Weapon Modifications"' },
  { ask = 'GetPCMiscStat "Weapons Created"' },
