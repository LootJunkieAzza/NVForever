# Script-function probes, round 2 of the audit (docs/design/script-function-audit.md §4,
# docs/design/script-function-coverage.md). `function_probe.py jobs` turns this file into
# game jobs and our runner's inputs; the plugin runs the jobs one after another in one
# session, in name order, so later batches see what earlier ones did. Everything here is
# FormIDs of the shipped masters (facts of the format, no game data).
format = "fnv.function.probes/1"

[forms]
sunny = "FalloutNV.esm:104E85"        # SunnyRef
trudy = "FalloutNV.esm:104C6D"        # TrudyRef
ringo = "FalloutNV.esm:104C7D"        # RingoRef (in the gas station of nvftest)
