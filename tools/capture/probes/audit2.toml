# ---------------------------------------------------------------- 2: Goodsprings, cell loads

[[batch]]
name = "fp2_goodsprings"
title = "Function probes 2: a cell load, then Goodsprings' people up close (about 2 min, no input)"
start = "after fp1_queries (gas station)."
ours_start = [{ op = "go_to_cell", cell = "GSGasStation" }, { op = "wait_frames", frames = 300 }]
steps = [
  { console = "tgm" },
  { console = "tdetect" },
  # HasLoaded3D after a cell load: how many loops until Chet has his 3D.
  { coc = "GSGeneralStore", cell = "@gsstore", settle = 0 },
  { until = "@chet.HasLoaded3D", max_frames = 1200, label = "frames until Chet HasLoaded3D after coc" },
  { frames = 120 },
  { ask = "@chet.GetCurrentAIPackage", label = "chet GetCurrentAIPackage (loaded)" },
  { ask = "@chet.GetCurrentAIProcedure", label = "chet GetCurrentAIProcedure (loaded)" },
  { ask = "@chet.GetDisposition player", label = "chet GetDisposition (loaded)" },
  { ask = "@chet.GetSitting", label = "chet GetSitting (loaded)" },
  { ask = "@chet.IsIdlePlaying", label = "chet IsIdlePlaying (loaded)" },
  { ask = "@chet.GetDetected player", label = "chet GetDetected player (loaded)" },
  { ask = "player.GetDetected @chet", label = "player GetDetected chet (loaded)" },
  # Outdoors next to each NPC: MoveTo, then until the target has its 3D.
  { do = "player.MoveTo @sunny", settle = 0 },
  { until = "@sunny.HasLoaded3D", max_frames = 1800, label = "frames until Sunny HasLoaded3D after MoveTo" },
  { frames = 120 },
  { ask = "@sunny.GetCurrentAIPackage", label = "sunny GetCurrentAIPackage (near)" },
  { ask = "@sunny.GetCurrentAIProcedure", label = "sunny GetCurrentAIProcedure (near)" },
  { ask = "@sunny.GetDisposition player", label = "sunny GetDisposition (near)" },
  { ask = "@trudy.GetCurrentAIPackage", label = "trudy GetCurrentAIPackage (near sunny)" },
  { ask = "@pete.GetCurrentAIPackage", label = "pete GetCurrentAIPackage (near sunny)" },
  { ask = "@pete.GetCurrentAIProcedure", label = "pete GetCurrentAIProcedure (near sunny)" },
  { ask = "@pete.GetSitting", label = "pete GetSitting (near sunny)" },
  { ask = "@cobb.GetCurrentAIPackage", label = "cobb GetCurrentAIPackage (near sunny)" },
  { ask = "@victor.GetCurrentAIPackage", label = "victor GetCurrentAIPackage (near sunny)" },
  { ask = "@victor.GetCurrentAIProcedure", label = "victor GetCurrentAIProcedure (near sunny)" },
  { ask = "@sunny.IsAnimPlaying Idle", label = "sunny IsAnimPlaying Idle" },
  { ask = "@sunny.IsAnimPlaying Forward", label = "sunny IsAnimPlaying Forward" },
  { ask = "@sunny.IsMoving", label = "sunny IsMoving (near)" },
  { ask = "@sunny.IsTalking", label = "sunny IsTalking (near)" },
  { do = "player.MoveTo @pete", settle = 0 },
  { until = "@pete.HasLoaded3D", max_frames = 1800, label = "frames until Pete HasLoaded3D after MoveTo" },
  { frames = 120 },
  { ask = "@pete.GetCurrentAIPackage", label = "pete GetCurrentAIPackage (near)" },
  { ask = "@pete.GetCurrentAIProcedure", label = "pete GetCurrentAIProcedure (near)" },
  { ask = "@pete.GetSitting", label = "pete GetSitting (near)" },
  { ask = "@pete.GetDisposition player", label = "pete GetDisposition (near)" },
  { ask = "@pete.IsIdlePlaying", label = "pete IsIdlePlaying (near)" },
  { ask = 'GetPCMiscStat "Locations Discovered"', label = "Locations Discovered (Goodsprings)" },
  { ask = "@gsmarker.GetMapMarkerVisible", label = "Goodsprings marker (outdoors)" },
  { console = "tdetect" },
  { console = "tgm" },
]

# ---------------------------------------------------------------- 3: a terminal

[[batch]]
name = "fp3_terminal"
title = "Function probes 3: a terminal's lock (about 1 min, no input)"
start = "after fp2_goodsprings."
ours_start = [{ op = "go_to_cell", cell = "BisonSteve01" }, { op = "wait_frames", frames = 300 }]
steps = [
  { coc = "BisonSteve01", cell = "@bison" },
  { until = "@term.HasLoaded3D", max_frames = 1200, label = "frames until the terminal HasLoaded3D" },
  { ask = "@term.GetLocked", label = "terminal GetLocked (Easy, loaded)" },
  { ask = "@term.GetLockLevel", label = "terminal GetLockLevel (Easy, loaded)" },
  { ask = "@term.GetOpenState", label = "terminal GetOpenState" },
  { do = "@term.Lock 50" },
  { ask = "@term.GetLocked", label = "terminal GetLocked after Lock 50" },
  { ask = "@term.GetLockLevel", label = "terminal GetLockLevel after Lock 50" },
  { do = "@term.Unlock" },
  { ask = "@term.GetLocked", label = "terminal GetLocked after Unlock" },
  { ask = "@term.GetLockLevel", label = "terminal GetLockLevel after Unlock" },
]

# ---------------------------------------------------------------- 4: a bed

[[batch]]
name = "fp4_bed"
title = "Function probes 4: the player activates a bed (about 1 min, no input)"
start = "after fp3_terminal."
ours_start = [{ op = "go_to_cell", cell = "GSHouseInterior03" }, { op = "wait_frames", frames = 300 }]
steps = [
  { coc = "GSHouseInterior03", cell = "@gshouse" },
  { ask = "player.GetSleeping", label = "player GetSleeping before the bed" },
  { do = "@bed.Activate player", settle = 60 },
  { ask = "MenuMode", label = "MenuMode after activating the bed" },
  { ask = "MenuMode 1012", label = "MenuMode 1012 after activating the bed" },
  { ask = "player.GetSleeping", label = "player GetSleeping after activating the bed" },
  { ask = "IsPCSleeping", label = "IsPCSleeping after activating the bed" },
  { ask = "player.GetSitting", label = "player GetSitting after activating the bed" },
  { console = "CloseAllMenus", settle = 30 },
  { ask = "MenuMode", label = "MenuMode after CloseAllMenus" },
  { ask = "player.GetSleeping", label = "player GetSleeping after CloseAllMenus" },
]

# ---------------------------------------------------------------- 5: actions in the gas station

[[batch]]
name = "fp5_actions"
title = "Function probes 5: disposition modifiers and a kill with a cause (about 1 min, no input)"
start = "after fp4_bed; the player goes back to the gas station."
ours_start = [{ op = "go_to_cell", cell = "GSGasStation" }, { op = "wait_frames", frames = 300 }]
steps = [
  { coc = "GSGasStation", cell = "@gsgas" },
  { console = "tgm" },
  { until = "@ringo.HasLoaded3D", max_frames = 1200, label = "frames until Ringo HasLoaded3D after coc" },
  { ask = "@ringo.GetDisposition player", label = "ringo disposition at start" },
  { ask = "player.GetAV Charisma", label = "player Charisma at start" },
  { do = "player.SetAV Charisma 10", settle = 30 },
  { ask = "@ringo.GetDisposition player", label = "ringo disposition with Charisma 10" },
  { do = "player.SetAV Charisma 1", settle = 30 },
  { ask = "@ringo.GetDisposition player", label = "ringo disposition with Charisma 1" },
  { do = "player.SetAV Charisma 5", settle = 30 },
  { ask = "player.GetAV Karma", label = "player Karma at start" },
  { do = "player.SetAV Karma 1000", settle = 30 },
  { ask = "@ringo.GetDisposition player", label = "ringo disposition with Karma 1000" },
  { do = "player.SetAV Karma -1000", settle = 30 },
  { ask = "@ringo.GetDisposition player", label = "ringo disposition with Karma -1000" },
  { do = "player.SetAV Karma 0", settle = 30 },
  { do = "@ringo.SetDisposition player 20" },
  { ask = "@ringo.GetDisposition player", label = "ringo disposition after SetDisposition player 20" },
  # A loaded, non-essential actor killed with a cause; then raised again.
  { ask = "@ringo.IsEssential", label = "ringo IsEssential" },
  { do = "@ringo.KillActor player 0 1", settle = 30 },
  { ask = "@ringo.GetDead", label = "ringo GetDead after KillActor player 0 1" },
  { ask = "@ringo.GetCauseofDeath", label = "ringo GetCauseofDeath after KillActor player 0 1" },
  { ask = "@ringo.IsInCriticalStage 0", label = "ringo IsInCriticalStage 0 dead" },
  { ask = "@ringo.GetKnockedState", label = "ringo GetKnockedState dead" },
  { ask = "@ringo.GetUnconscious", label = "ringo GetUnconscious dead" },
  { ask = "@ringo.IsKiller player", label = "ringo IsKiller player" },
  { ask = 'GetPCMiscStat "People Killed"', label = "People Killed after the kill" },
  { do = "@ringo.ResurrectActor 0", settle = 60 },
  { ask = "@ringo.GetDead", label = "ringo GetDead after ResurrectActor" },
  { ask = "@ringo.GetCauseofDeath", label = "ringo GetCauseofDeath after ResurrectActor" },
  { ask = "@ringo.GetHealthPercentage", label = "ringo GetHealthPercentage after ResurrectActor" },
  { console = "tgm" },
]

# ---------------------------------------------------------------- 6: the calendar

[[batch]]
name = "fp6_calendar"
title = "Function probes 6: weekdays across 29 February 2284 (about 1 min, no input)"
start = "after fp5_actions; the calendar is moved (the save is not written)."
steps = [
  { ask = "GetDayOfWeek", label = "GetDayOfWeek at start" },
  { console = "set GameYear to 2284" },
  { console = "set GameMonth to 1" },
  { console = "set GameDay to 28" },
  { ask = "GetDayOfWeek", label = "GetDayOfWeek after setting 28 Feb 2284", side = "game" },
  { do = "set GameHour to GameHour + 24", side = "game", settle = 30 },
  { game = "GameMonth", label = "GameMonth one day after 28 Feb 2284" },
  { game = "GameDay", label = "GameDay one day after 28 Feb 2284" },
  { ask = "GetDayOfWeek", label = "GetDayOfWeek one day after 28 Feb 2284", side = "game" },
  { do = "set GameHour to GameHour + 24", side = "game", settle = 30 },
  { game = "GameMonth", label = "GameMonth two days after 28 Feb 2284" },
  { game = "GameDay", label = "GameDay two days after 28 Feb 2284" },
  { ask = "GetDayOfWeek", label = "GetDayOfWeek two days after 28 Feb 2284", side = "game" },
  { game = "GameDaysPassed", label = "GameDaysPassed after the calendar moves" },
]


