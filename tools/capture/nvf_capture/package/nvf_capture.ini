; nvf_capture settings. This file is optional.
;
; The capture directory: where the plugin looks for jobs (jobs\*.steps.json) and writes
; results (out\), screenshots (shots\) and its log (nvf_capture.log).
; Default: C:\fnv-private\capture
; To change it, remove the semicolon from the next line and set your own folder.
;dir=D:\somewhere\capture
