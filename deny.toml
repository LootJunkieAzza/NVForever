# cargo-deny policy (docs/design/dependencies.md, "Licence check"), for both workspaces
# (#1998). Run: cargo deny check, and cargo deny --manifest-path engine/Cargo.toml check

[licenses]
# NVForever is GPL-3.0-or-later (owner decision 2026-10-15): dependencies may be
# permissive or GPL-3.0-compatible copyleft.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    # arrayref (via tiny-skia, Bevy's UI).
    "BSD-2-Clause",
    "0BSD",
    # encase and its derives (Bevy's GPU buffers): MIT without the notice requirement.
    "MIT-0",
    # libloading (via ash, the Vulkan loader) and inotify (gilrs on Linux): ISC, a
    # permissive licence equivalent to MIT.
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    # option-ext (via directories): file-level copyleft; fine for an unmodified
    # dependency under either project licence.
    "MPL-2.0",
    # NVForever's own crates, and GPL dependencies (infinitier_bik_decoder for the intro
    # film; owner decision 2026-10-15).
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[advisories]
# RustSec vulnerabilities, unsoundness and yanked crates fail the check.
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained (not a vulnerability), with no successor release. The
    # engine gets it only through winit's Linux window decorations (sctk-adwaita ->
    # ab_glyph), which Bevy 0.20 pins; look again at the next Bevy upgrade
    # (docs/design/dependencies.md).
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, via winit's sctk-adwaita in Bevy 0.20; no upgrade available" },
]

[bans]
multiple-versions = "warn"
# Workspace path dependencies carry no version.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
