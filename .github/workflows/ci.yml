name: ci

# The repo is private, so every runner minute is billed. To keep that small:
# - CI runs only on pushes to main (no pull-request, branch or scheduled runs),
#   plus manual runs (Actions tab > ci > Run workflow).
# - one Linux job runs every check in sequence, so there is a single status check.
# - docs-only changes skip CI.
# - a newer push cancels the run still in progress.
# Windows/macOS are covered by the local checks in CLAUDE.md before each push.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # The Bevy side (viewer and game) is its own workspace
          # (docs/adr/0002-engine-workspace-and-world-rendering.md).
          workspaces: |
            . -> target
            engine -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux system libraries for Bevy
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Licences and advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

      - name: Core tests
        run: cargo test --workspace --release --locked
      - name: Core clippy
        run: cargo clippy --workspace --all-targets --release --locked -- -D warnings

      - name: Lab self-tests
        run: python -m unittest discover -s parity-lab/tests -v
      - name: Capture-tool self-tests
        run: python -m unittest discover -s tools/capture/tests -v

      - name: Engine tests
        run: cargo test --release --locked
        working-directory: engine
      - name: Engine clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
        working-directory: engine
