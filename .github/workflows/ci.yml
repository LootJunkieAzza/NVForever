name: ci

# The repo is private, so every runner minute is billed (Windows 2x, macOS 10x).
# - push runs only on main; branches get CI once, through their pull request.
# - docs-only changes skip CI.
# - macOS runs only on the weekly schedule or a manual run (Actions tab > ci > Run workflow).
# - a newer push to the same branch/PR cancels the run still in progress.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine-tests:
    strategy:
      fail-fast: false
      matrix:
        # macOS only on schedule / manual runs (see the note at the top).
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["ubuntu-latest", "windows-latest", "macos-latest"]'
          || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release --locked
      - run: cargo clippy --workspace --all-targets --release --locked -- -D warnings

  lab-selftest:
    strategy:
      fail-fast: false
      matrix:
        # macOS only on schedule / manual runs (see the note at the top).
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["ubuntu-latest", "windows-latest", "macos-latest"]'
          || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lab self-tests
        run: python -m unittest discover -s parity-lab/tests -v
      - name: Capture-tool self-tests
        run: python -m unittest discover -s tools/capture/tests -v

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  fnvtool-windows:
    needs: engine-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p fnvtool
      - uses: actions/upload-artifact@v4
        with:
          name: fnvtool-windows-x64
          path: target/release/fnvtool.exe

  viewer:
    # The Bevy side (viewer and game) is its own workspace (docs/adr/0002-engine-workspace-and-world-rendering.md).
    strategy:
      fail-fast: false
      matrix:
        # macOS only on schedule / manual runs (see the note at the top).
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["ubuntu-latest", "windows-latest", "macos-latest"]'
          || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Linux system libraries for Bevy
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo test --release --locked
        working-directory: engine
      - run: cargo clippy --release --locked --all-targets -- -D warnings
        working-directory: engine
