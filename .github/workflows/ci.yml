name: ci

# The repo is public, so runner minutes are free. CI runs on every pull request (so
# collaborators' changes are checked before they are merged), on pushes to main and by
# hand (Actions tab > ci > Run workflow).
# - the checks run as parallel Linux jobs (core, engine, tools), each on a runner of its
#   own, and the `ci` job at the end passes only when they all did, so there is still a
#   single status check to require in branch protection. Before the split one job ran
#   everything in turn (about 33 min on main: core 16, engine 16); now the run takes as long as
#   its slowest job (#1956).
# - every pull request reports a `ci` result, so it can be a required check; when a
#   pull request changes only docs (docs/ or *.md) the jobs after `changes` are skipped
#   and the check passes at once. Docs-only pushes to main do not run at all.
# - a newer push to the same branch or pull request cancels the run still in progress.
# Windows/macOS are covered by the local checks in CLAUDE.md before each push.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

# Pull requests from forks get a read-only token; keep pushes the same.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI's release builds: the tests run the same optimised code (debug
  # info does not change codegen) and nothing in CI reads it; it only costs compile, link
  # and cache time (#1956). Local builds keep the profiles' settings (crash reports).
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit; its first parent is the base.
          fetch-depth: 2
      - name: Which files changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only pull request: skipping the build."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: cargo test --workspace --release --locked
      - name: Core clippy
        run: cargo clippy --workspace --all-targets --release --locked -- -D warnings

  engine:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The engine's release target dir is large (it filled the disk with the root's
      # beside it, #1477). Drop preinstalled SDKs we never use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # The Bevy side (viewer and game) is its own workspace
          # (docs/adr/0002-engine-workspace-and-world-rendering.md).
          workspaces: engine -> target
      - name: Linux system libraries for Bevy
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Engine tests
        run: cargo test --release --locked
        working-directory: engine
      - name: Engine clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
        working-directory: engine

  tools:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Licences and advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
      - name: Lab self-tests
        run: python -m unittest discover -s parity-lab/tests -v
      - name: Capture-tool self-tests
        run: python -m unittest discover -s tools/capture/tests -v
      - name: Smoke-runner self-tests
        run: python -m unittest discover -s tools/smoke/tests -v
      - name: Stress-tool self-tests
        run: python -m unittest discover -s tools/stress/tests -v
      - name: Profile-campaign self-tests
        run: python -m unittest discover -s tools/profile/tests -v

  # The one required status check: passes when every job above passed or was skipped
  # (a docs-only pull request), fails when any failed or was cancelled.
  ci:
    needs: [changes, core, engine, tools]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          echo 'changes=${{ needs.changes.result }} core=${{ needs.core.result }} engine=${{ needs.engine.result }} tools=${{ needs.tools.result }}'
          case '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' in
            true) exit 1 ;;
          esac
