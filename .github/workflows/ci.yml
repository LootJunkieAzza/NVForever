name: ci

# The repo is public, so runner minutes are free. CI runs on every pull request (so
# collaborators' changes are checked before they are merged), on pushes to main and by
# hand (Actions tab > ci > Run workflow).
# - the checks run as parallel Linux jobs (core, engine tests, engine clippy, tools), each
#   on a runner of its own, and the `ci` job at the end passes only when they all did, so there is still a
#   single status check to require in branch protection. Before the split one job ran
#   everything in turn (about 33 min on main: core 16, engine 16); now the run takes as
#   long as its slowest job (#1956).
# - every pull request reports a `ci` result, so it can be a required check; when a
#   pull request changes only docs (docs/ or *.md outside tools/) the build and the Rust
#   checks are skipped, but the Python self-tests still run (seconds): tools read some
#   docs (the capture plugin's package ships two spec notes, the function-coverage tool
#   reads the script-function audit) and their tests catch a rename (#2000). A *.md
#   under tools/ is a tool's input (release notes, probe READMEs) and counts as code.
#   Docs-only pushes to main do not run at all (a *.md under tools/ does).
# - a newer push to the same pull request cancels its run still in progress; on main every
#   push's run completes, so a red main can be traced to the merge that caused it (#2000).
# Windows/macOS are covered by the local checks in CLAUDE.md before each push.
on:
  push:
    branches: [main]
    # Not for docs/ and *.md alone, except a *.md under tools/ (a tool's input; later
    # patterns override earlier ones).
    paths: ["**", "!docs/**", "!**/*.md", "tools/**/*.md"]
  pull_request:
  workflow_dispatch:

# Pull requests from forks get a read-only token; keep pushes the same.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI's release builds: the tests run the same optimised code (debug
  # info does not change codegen) and nothing in CI reads it; it only costs compile, link
  # and cache time (#1956). Local builds keep the profiles' settings (crash reports).
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit; its first parent is the base.
          fetch-depth: 2
      - name: Which files changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          # Code: anything but docs/ and *.md, and any *.md under tools/ (a tool's input).
          if echo "$changed" | grep -qvE '^docs/|\.md$' || echo "$changed" | grep -qE '^tools/.*\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only pull request: skipping the build (the Python self-tests still run)."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Core tests
        run: cargo test --workspace --release --locked
      - name: Core clippy
        run: cargo clippy --workspace --all-targets --release --locked -- -D warnings

  engine:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The engine's release target dir is large (it filled the disk with the root's
      # beside it, #1477). Drop preinstalled SDKs we never use, in the background: the
      # deletion took 202 s in the foreground (#1956), and the build only needs the room
      # minutes later. The process keeps running after this step; the runner ends it with
      # the job.
      - name: Free disk space (in the background)
        run: |
          df -h /
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The Bevy side (viewer and game) is its own workspace
          # (docs/adr/0002-engine-workspace-and-world-rendering.md).
          workspaces: engine -> target
      - name: Linux system libraries for Bevy
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Engine tests
        run: cargo test --release --locked
        working-directory: engine
      - name: Disk left
        if: always()
        run: df -h /

  # Clippy on its own runner, beside the engine tests (#1956): it builds no code, only
  # checks, so its target dir is small and it needs no freed disk.
  engine-clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: engine -> target
      - name: Linux system libraries for Bevy
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Engine clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
        working-directory: engine

  # Runs on docs-only pull requests too: the Python suites catch a renamed doc (#2000).
  tools:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Licences and advisories
        if: needs.changes.outputs.code == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses advisories bans sources
      # The engine workspace (the game binary) has its own lock; the same deny.toml (#1998).
      - name: Licences and advisories (engine)
        if: needs.changes.outputs.code == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: engine/Cargo.toml
          command: check licenses advisories bans sources

      - name: Lab self-tests
        run: python -m unittest discover -s parity-lab/tests -v
      - name: Capture-tool self-tests
        run: python -m unittest discover -s tools/capture/tests -v
      - name: Smoke-runner self-tests
        run: python -m unittest discover -s tools/smoke/tests -v
      - name: Stress-tool self-tests
        run: python -m unittest discover -s tools/stress/tests -v
      - name: Profile-campaign self-tests
        run: python -m unittest discover -s tools/profile/tests -v
      - name: Workflow permissions and action pins
        if: needs.changes.outputs.code == 'true'
        run: python -m unittest discover -s tools/release/tests -v

  # The one required status check: passes when every job above passed or was skipped
  # (a docs-only pull request skips core and engine), fails when any failed or was
  # cancelled.
  ci:
    needs: [changes, core, engine, engine-clippy, tools]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          echo 'changes=${{ needs.changes.result }} core=${{ needs.core.result }} engine=${{ needs.engine.result }} engine-clippy=${{ needs.engine-clippy.result }} tools=${{ needs.tools.result }}'
          case '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' in
            true) exit 1 ;;
          esac
